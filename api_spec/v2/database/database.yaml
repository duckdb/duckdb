module: database
# A database handle is a DuckDB instance: a buffer pool, a scheduler, a set
# of GLOBAL settings, and the databases attached to it. Creating the handle,
# attaching a database, and choosing the default database are separate steps:
#
#   database_create(env, &db);
#   database_set_option(db, "access_mode", "READ_ONLY");   // startup option
#   database_attach(db, "path/to/file.db");                // like ATTACH
#   database_set_default(db, "path/to/file.db");           // the default database
#   database_set_option(db, "memory_limit", "4GB");        // SET GLOBAL
#   connection_create(db, &conn);
#
# The instance starts on its first use: the first database_attach or
# connection_create. Options set before that point go into the startup
# configuration, so options that can only be chosen at startup (access_mode,
# enable_external_access, threads, block sizes, ...) are set through the same
# call as the ones that can change at runtime. After startup,
# database_set_option is SQL `SET GLOBAL`.
#
# Nothing is attached until database_attach: only the system catalog and each
# connection's temporary catalog exist. Attaching never picks a default
# database; until database_set_default names one, statements that need a
# default database (an unqualified CREATE TABLE, say) fail, while everything
# else binds against the system and temporary catalogs and against databases
# referred to by name. Each connection binds to the default database in force
# when it is created; database_set_default changes it for connections created
# afterwards. database_detach detaches a database again, and clears the
# default for new connections if it was the default.
functions:
  database_create:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-08-04" ]
    description: |
      Creates a database handle under the environment.

      The handle starts with no database attached and with its instance not
      yet started; set startup options with database_set_option, then attach
      a database with database_attach and pick the default with
      database_set_default, or connect with connection_create. The caller destroys it
      via database_destroy.
    role: constructor
    belongs_to: database
    parameters:
      env:
        type: environment
        description: "The environment."
      out_db:
        type: database
        indirection: 1
        kind: OUT
        description: "Receives the new database handle."
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy."
    return_type: ERROR
  database_destroy:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-08-04" ]
    description: |
      Destroys the database handle.

      Always succeeds. Every attached database is closed with the instance.
      The instance itself stays alive for as long as any connection still
      references it; when the last reference drops, it is destroyed and its
      database files become available to open again. On success the handle
      is set to null. Safe to call on an already-null slot.
    role: destructor
    belongs_to: database
    parameters:
      db:
        type: database
        indirection: 1
        description: "The database handle to destroy."
    return_type: ERROR
  database_attach:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-08-04" ]
    description: |
      Attaches a database to the handle, starting the instance if it has not
      started yet.

      Attaches the database at `path` exactly like `ATTACH 'path'`:
        - `:memory:` or an empty view attaches a fresh in-memory database
          named `memory`.
        - any other path attaches that file, creating it if it does not
          exist, under the name derived from the file's base name.
      Attaching does not make the database the default; call database_set_default
      for that. A path that is already attached on this or any other database
      of the environment returns ERROR_RESOURCE_IN_USE, and a name that is
      already attached (two files with the same base name, or `:memory:`
      twice) fails; use SQL `ATTACH ... AS name` for those. Options that only
      apply at startup must be set before the first attach or connection.
    role: method
    belongs_to: database
    parameters:
      db:
        type: database
        description: "The database handle."
      path:
        type: str
        description: "Path to the database file, or `:memory:` / an empty view for an in-memory database."
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy."
    return_type: ERROR
  database_detach:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-08-04" ]
    description: |
      Detaches the database that was attached from `path`.

      Detaches it like `DETACH`, checkpointing a file database first. Unlike
      SQL, the default database may be detached too; new connections then
      start without a default until database_set_default names another, and
      existing connections bound to it keep it alive until their transaction
      on it ends and fail unqualified DDL afterwards. The path is matched
      against the attached databases as database_attach recorded it, so pass
      the path that was passed to database_attach. Returns ERROR_INPUT_INVALID
      when no database attached from that path exists. Connections that still
      reference the database keep it alive until they release it.
    role: method
    belongs_to: database
    parameters:
      db:
        type: database
        description: "The database handle."
      path:
        type: str
        description: "The path the database was attached from."
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy."
    return_type: ERROR
  database_set_default:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-09-15" ]
    description: |
      Makes the database that was attached from `path` the default database
      for connections created from now on.

      A connection binds to the default database when it is created, so this
      does not retarget existing connections: their default stays what it was
      when they connected, or what they chose with `USE`. The default is where
      unqualified DDL and unqualified table lookups that miss the temporary
      catalog go. It stays the default for new connections until another
      database_set_default call or until it is detached; a connection whose
      default has been detached fails unqualified DDL with a message saying
      so until it selects another with `USE`. Returns ERROR_INPUT_INVALID
      when no database attached from that path exists.
    role: method
    belongs_to: database
    parameters:
      db:
        type: database
        description: "The database handle."
      path:
        type: str
        description: "The path the database was attached from."
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy."
    return_type: ERROR
  database_set_option:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-08-04" ]
    description: |
      Sets a config option on the database (GLOBAL scope).

      Before the instance has started (no database_attach or
      connection_create yet), the option goes into the startup configuration: this is the only
      way to set an option that can only be chosen at startup, such as
      access_mode or enable_external_access. Unknown names are kept for an
      extension to consume at startup; if none does, startup fails with the
      unrecognized names. After startup, this is `SET GLOBAL name = setting`
      and an unknown name is rejected unless an extension that defines it can
      be autoloaded. Returns ERROR_INPUT_INVALID for an option declared
      LOCAL_ONLY, and for a legacy option with no global setter.
    role: setter
    belongs_to: database
    parameters:
      db:
        type: database
        description: "The database handle."
      name:
        type: identifier
        description: "Option name (canonical or alias)."
      setting:
        type: str
        description: "The setting, in the textual form SQL `SET` accepts."
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy."
    return_type: ERROR
  database_get_option:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-08-04" ]
    description: |
      Reads a config option from the database (GLOBAL scope) by name.

      Allocates a fully populated option: canonical name, current GLOBAL
      setting, default setting, description, target scope, and aliases.
      Before startup the current setting is the staged startup value, or the
      default. Aliases resolve transparently — passing an alias returns the
      canonical option, with the alias listed in its alias array. An unknown
      name returns ERROR_INPUT_INVALID; before startup that includes an
      option of an extension that has not loaded yet, even if a setting for
      it has been staged. The caller destroys the returned option.
    role: getter
    belongs_to: database
    parameters:
      db:
        type: database
        description: "The database handle."
      name:
        type: identifier
        description: "Option name (canonical or alias)."
      out_option:
        type: option
        indirection: 1
        kind: OUT
        description: "Receives the populated option handle."
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy."
    return_type: ERROR
  database_get_option_count:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-08-04" ]
    description: |
      Returns the number of config options registered on the database.

      Counts core options plus the extension options registered on this
      database. Aliases are NOT counted separately; each one is reachable
      through its canonical option's alias array.
    role: getter
    belongs_to: database
    parameters:
      db:
        type: database
        description: "The database handle."
      out_count:
        type: idx
        indirection: 1
        kind: OUT
        description: "Receives the option count."
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy."
    return_type: ERROR
  database_get_option_by_index:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-08-04" ]
    description: |
      Reads the config option at the given index from the database.

      Index space: [0, core_count) addresses core options, [core_count, total)
      extension options. The mapping is stable for as long as no extension
      registers new options. An out-of-range index returns ERROR_INPUT_INVALID.
      The caller destroys the returned option.
    role: getter
    belongs_to: database
    parameters:
      db:
        type: database
        description: "The database handle."
      index:
        type: idx
        description: "The option index, in [0, option_count)."
      out_option:
        type: option
        indirection: 1
        kind: OUT
        description: "Receives the populated option handle."
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy."
    return_type: ERROR
  library_version:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-08-04" ]
    description: "Returns the version of the linked DuckDB library."
    role: getter
    parameters:
      out_version:
        type: str
        indirection: 1
        const: false
        kind: OUT
        description: "The version string."
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy."
    return_type: ERROR
