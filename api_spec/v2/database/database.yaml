module: database
functions:
  open:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-08-04" ]
    description: |
      Opens a database under the environment.

      `path` semantics:
        - `nullptr`, ":memory:", or any ":memory:..." path opens a fresh
          in-memory database. In-memory databases are never deduplicated
          across calls.
        - any other path opens that file as a database, and returns
          ERROR_RESOURCE_IN_USE if the file is already open under the same
          environment.

      `options` is an optional array of pre-created config option handles
      applied at construction time. Only the name and setting of each handle
      are read; the remaining fields are ignored. Options may include pre-open
      database settings (e.g. access_mode, memory_limit) and ATTACH-style
      storage options (e.g. BLOCK_SIZE, ENCRYPTION_KEY). Unknown names are
      accepted and kept for a later extension to consume. Pass
      `options=nullptr` and `option_count=0` to open with defaults.

      LOCAL_ONLY options are rejected at this scope, as they are by
      database_option_set.
    role: constructor
    belongs_to: database
    parameters:
      env:
        type: environment
        description: "The environment."
      path:
        type: str
        description: "Path to the database. An empty view (`{NULL, 0}` or zero length) or any ':memory:...' path opens an in-memory database."
      options:
        type: option
        indirection: 1
        description: "Optional array of pre-created config option handles. May be `nullptr` if option_count is 0."
      option_count:
        type: idx
        description: "The number of entries in the options array."
      out_db:
        type: database
        indirection: 1
        kind: OUT
        description: "Receives the new database handle."
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy."
    return_type: ERROR
  close:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-08-04" ]
    description: |
      Closes the database.

      Always succeeds. The underlying database instance stays alive for as long
      as any connection still references it; when the last reference drops, the
      instance is destroyed and its path becomes available to reopen. On
      success the handle is set to null.
    role: destructor
    belongs_to: database
    parameters:
      db:
        type: database
        indirection: 1
        description: "The database to close."
    return_type: ERROR
  database_option_set:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-08-04" ]
    description: |
      Sets a config option on the database (GLOBAL scope).

      Only the name and setting of the option are read; the remaining fields
      are ignored. Equivalent to SQL `SET GLOBAL name = setting`. Returns
      ERROR_INPUT_INVALID for an option declared LOCAL_ONLY, and for a legacy
      option with no global setter. Unknown names are accepted and kept for a
      later extension to consume.
    role: setter
    belongs_to: database
    parameters:
      db:
        type: database
        description: "The database."
      option:
        type: option
        description: "The config option to apply."
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy."
    return_type: ERROR
  database_option_get:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-08-04" ]
    description: |
      Reads a config option from the database (GLOBAL scope) by name.

      Allocates a fully populated option: canonical name, current GLOBAL
      setting, default setting, description, target scope, and aliases. Aliases
      resolve transparently — passing an alias returns the canonical option,
      with the alias listed in its alias array. An unknown name returns
      ERROR_INPUT_INVALID. The caller destroys the returned option.
    role: getter
    belongs_to: database
    parameters:
      db:
        type: database
        description: "The database."
      name:
        type: identifier
        description: "Option name (canonical or alias)."
      out_option:
        type: option
        indirection: 1
        kind: OUT
        description: "Receives the populated option handle."
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy."
    return_type: ERROR
  database_option_get_count:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-08-04" ]
    description: |
      Returns the number of config options registered on the database.

      Counts core options plus the extension options registered on this
      database. Aliases are NOT counted separately; each one is reachable
      through its canonical option's alias array.
    role: getter
    belongs_to: database
    parameters:
      db:
        type: database
        description: "The database."
      out_count:
        type: idx
        indirection: 1
        kind: OUT
        description: "Receives the option count."
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy."
    return_type: ERROR
  database_option_get_by_index:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-08-04" ]
    description: |
      Reads the config option at the given index from the database.

      Index space: [0, core_count) addresses core options, [core_count, total)
      extension options. The mapping is stable for as long as no extension
      registers new options. An out-of-range index returns ERROR_INPUT_INVALID.
      The caller destroys the returned option.
    role: getter
    belongs_to: database
    parameters:
      db:
        type: database
        description: "The database."
      index:
        type: idx
        description: "The option index, in [0, option_count)."
      out_option:
        type: option
        indirection: 1
        kind: OUT
        description: "Receives the populated option handle."
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy."
    return_type: ERROR
  library_version:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-08-04" ]
    description: "Returns the version of the linked DuckDB library."
    role: getter
    parameters:
      out_version:
        type: str
        indirection: 1
        const: false
        kind: OUT
        description: "The version string."
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy."
    return_type: ERROR
