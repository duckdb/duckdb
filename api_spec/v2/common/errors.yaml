module: errors
enums:
  ERROR:
    description: |
      Error codes for API calls.

      Any non-zero code is an error; callers should compare against ERROR_NONE
      rather than against a specific failure code. More codes may be added, and
      the exact values of failure codes may change, in future versions.
    values:
      ERROR_NONE:
        value: 0
        description: "Success."
      ERROR_GENERIC:
        value: 1
        description: "The call failed. The error info handle, when requested, describes the failure."
