module: vcatalog
#
# Implementing a database type of your own: one that `ATTACH` can open, whose catalog and transactions are provided by
# callbacks instead of by DuckDB's storage. A vcatalog is built with the setters below and registered on an instance
# under a name, after which `ATTACH '<path>' (TYPE <name>)` attaches a database of that type.
#
# State lives at three levels, each an opaque pointer bundled with an optional destructor:
#   - The user data, set on the vcatalog and shared by every database attached with it. It lives as long as the
#     instance does.
#   - The catalog state, set by the attach callback for one attached database. It is destroyed when the database is
#     detached, after every transaction state of that database.
#   - The transaction state, set by the begin callback for one transaction on one attached database. It is destroyed
#     once that transaction has been committed or rolled back.
#
# DuckDB begins a transaction on an attached database the first time a transaction touches it, and commits or rolls it
# back together with the rest of the transaction. What a transaction means for the backing store is up to the
# implementation: the callbacks only tell it when to begin, commit and roll back. A transaction writes to at most one
# attached database, so a commit needs no coordination with the other databases the transaction read from.
#
# The transaction state may be used by several threads of one query at once, e.g. by a parallel scan, so the
# implementation must synchronize its own access to it.
#
# The catalog of an attached database is resolved through find and list callbacks, which hand DuckDB entries the
# implementation builds and owns, such as `[[vcatalog_schema]]`. An entry is put together in a builder, such as
# `[[vcatalog_schema_builder]]`, and no longer changes once it is built. The implementation decides how long it keeps
# an entry and whether it shares it between transactions and connections, within two rules:
#   - An entry handed to DuckDB must stay alive until every transaction it was handed out in has ended: binding and
#     execution use it long after the callback returned. Destroying it from the destructor of the transaction state,
#     or of the catalog state, is always late enough.
#   - DuckDB recognizes an entry by its handle. Hand out the same handle for the same entry, at least within a
#     transaction: two handles are two entries to DuckDB, e.g. two scans of one table are then not recognized as
#     scanning the same table.
# An entry may be in use by several connections at once, so the implementation must synchronize its own access to the
# state of an entry it shares.
#
# Tables and views share a namespace: one pair of callbacks finds and lists both. A view is a query in DuckDB's SQL
# dialect, which DuckDB binds in place of the view wherever a statement refers to it, see `[[vcatalog_view]]`.
#
# The rows of a table are read by a table function the table is built with, see
# `[[vcatalog_table_builder_set_scan_function]]`. It runs as it would for a call of the function, with projection and
# filter pushdown, parallelism, statistics and progress, except that the table takes the place of its bind callback.
#
# `CREATE` and `DROP` of schemas, tables and views are passed on to create and drop callbacks, one pair per kind. Every
# create callback receives a `[[vcatalog_entry_create_info]]` with what creating any kind of entry has in common, and
# an info of its own kind; the drop callbacks likewise receive a `[[vcatalog_entry_drop_info]]` and an info of their
# kind. DuckDB resolves `IF NOT EXISTS`, `OR REPLACE` and `IF EXISTS` itself, through the find callbacks, before it
# invokes a create or drop callback: a create callback is invoked only for a name that is free, and a drop callback
# only for an entry that exists. A statement without a callback for it fails as not supported.
#
# Registration is not transactional: a registered vcatalog lives for as long as the instance does.

#-----------------------------------------------------------------------------------------------------------------------
# Handles
#-----------------------------------------------------------------------------------------------------------------------
handles:
  vcatalog:
    description: |
      An owned opaque handle to a vcatalog being built. Created with `[[vcatalog_create]]`, configured with
      `[[vcatalog_set_name]]`, `[[vcatalog_set_attach_callback]]` and the other setters, made available with
      `[[connection_register_vcatalog]]` or `[[extension_register_vcatalog]]`, and destroyed with
      `[[vcatalog_destroy]]`.

  vcatalog_attach_info:
    description: |
      A borrowed opaque handle to a database being attached, received by the attach callback and valid only for the
      duration of that call. It gives access to the name, path and options of the `ATTACH`, and sets the catalog state
      of the database.

  vcatalog_transaction_begin_info:
    description: |
      A borrowed opaque handle to a transaction beginning on an attached database, received by the begin callback and
      valid only for the duration of that call. It tells whether the transaction is read-only, and sets the
      transaction state.

  vcatalog_transaction_commit_info:
    description: |
      A borrowed opaque handle to a transaction committing on an attached database, received by the commit callback
      and valid only for the duration of that call. It gives access to the transaction state.

  vcatalog_transaction_rollback_info:
    description: |
      A borrowed opaque handle to a transaction rolling back on an attached database, received by the rollback
      callback and valid only for the duration of that call. It gives access to the transaction state.

  vcatalog_database:
    description: |
      A borrowed opaque handle to a database attached with a vcatalog, passed to every callback that runs on it, and
      valid for as long as the database stays attached. It gives access to the user data and the catalog state, and is
      what the schemas of the database are built in, with `[[vcatalog_schema_builder_create]]`.

  vcatalog_schema_builder:
    description: |
      An owned opaque handle to a schema being built. Created with `[[vcatalog_schema_builder_create]]`, configured
      with `[[vcatalog_schema_builder_set_state]]`, turned into a schema with `[[vcatalog_schema_builder_build]]`, and
      destroyed with `[[vcatalog_schema_builder_destroy]]`.

  vcatalog_schema:
    description: |
      An owned opaque handle to a schema of a database attached with a vcatalog. Built with
      `[[vcatalog_schema_builder_build]]`, handed to DuckDB by the schema find and list callbacks, and destroyed with
      `[[vcatalog_schema_destroy]]` within the rules of the module notes. It carries a name and the implementation's
      own state, and is immutable.

  vcatalog_schema_find_info:
    description: |
      A borrowed opaque handle to a request to find a schema by name, received by the schema find callback and valid
      only for the duration of that call. It gives access to the transaction state and the name, and reports the schema
      found.

  vcatalog_schema_list_info:
    description: |
      A borrowed opaque handle to the listing of the schemas of a database, received by the schema list callback and
      valid only for the duration of that call. It gives access to the transaction state, and receives the schemas.

  vcatalog_table_builder:
    description: |
      An owned opaque handle to a table being built. Created with `[[vcatalog_table_builder_create]]`, configured with
      `[[vcatalog_table_builder_add_column]]`, `[[vcatalog_table_builder_set_scan_function]]` and the other setters,
      turned into a table with `[[vcatalog_table_builder_build]]`, and destroyed with
      `[[vcatalog_table_builder_destroy]]`.

  vcatalog_table:
    description: |
      An owned opaque handle to a table of a schema of a database attached with a vcatalog. Built with
      `[[vcatalog_table_builder_build]]`, handed to DuckDB by the table find and list callbacks, and destroyed with
      `[[vcatalog_table_destroy]]` within the rules of the module notes. It carries a name, its columns, the
      implementation's own state and the function its rows are read with, and is immutable.

  vcatalog_view_builder:
    description: |
      An owned opaque handle to a view being built. Created with `[[vcatalog_view_builder_create]]` or
      `[[vcatalog_view_builder_create_from_sql]]`, configured with `[[vcatalog_view_builder_set_query]]` and the other
      setters, turned into a view with `[[vcatalog_view_builder_build]]`, and destroyed with
      `[[vcatalog_view_builder_destroy]]`.

  vcatalog_view:
    description: |
      An owned opaque handle to a view of a schema of a database attached with a vcatalog. Built with
      `[[vcatalog_view_builder_build]]`, handed to DuckDB by the table find and list callbacks, and destroyed with
      `[[vcatalog_view_destroy]]` within the rules of the module notes. It carries a name, a query and the
      implementation's own state, and is immutable.

      A statement referring to the view runs its query in its place. DuckDB binds the query every time, resolving
      unqualified names in the database and schema of the view before the search path of the connection, so the
      query can refer to the tables next to the view by their bare names. The columns of the view are those of the
      query: DuckDB determines them when it first binds the view.

      The query must be in DuckDB's SQL dialect. Expose a view DuckDB cannot run itself as a table instead, scanned
      with a function that leaves running the view to the backing store.

  vcatalog_entry_create_info:
    description: |
      A borrowed opaque handle to what creating a schema, a table and a view have in common, received by every create
      callback next to the info of its kind, and valid only for the duration of that call. It gives access to the
      transaction state and the name of the entry to create.

  vcatalog_schema_create_info:
    description: |
      A borrowed opaque handle to a schema to create, received by the schema create callback and valid only for the
      duration of that call. It reports the schema created.

  vcatalog_table_create_info:
    description: |
      A borrowed opaque handle to a table to create, received by the table create callback and valid only for the
      duration of that call. It gives access to the schema, the columns and the constraints of the table, and reports
      the table created.

  vcatalog_view_create_info:
    description: |
      A borrowed opaque handle to a view to create, received by the view create callback and valid only for the
      duration of that call. It gives access to the schema, the query and the column aliases of the view, and reports
      the view created.

  vcatalog_entry_drop_info:
    description: |
      A borrowed opaque handle to what dropping a schema, a table and a view have in common, received by every drop
      callback next to the info of its kind, and valid only for the duration of that call. It gives access to the
      transaction state, and tells whether the drop cascades.

  vcatalog_schema_drop_info:
    description: |
      A borrowed opaque handle to a schema to drop, received by the schema drop callback and valid only for the
      duration of that call. It gives access to the schema.

  vcatalog_table_drop_info:
    description: |
      A borrowed opaque handle to a table to drop, received by the table drop callback and valid only for the duration
      of that call. It gives access to the table.

  vcatalog_view_drop_info:
    description: |
      A borrowed opaque handle to a view to drop, received by the view drop callback and valid only for the duration of
      that call. It gives access to the view.

  vcatalog_table_scan_bind_info:
    description: |
      A borrowed opaque handle to a scan of a table being bound, received by the scan bind callback and valid only for
      the duration of that call. It gives access to the transaction state and the table, and sets the bind data, the
      cardinality and the order guarantee of the scan.

  vcatalog_table_find_info:
    description: |
      A borrowed opaque handle to a request to find a table or view of a schema by name, received by the table find
      callback and valid only for the duration of that call. It gives access to the transaction state, the schema and
      the name, and reports the table or view found.

  vcatalog_table_list_info:
    description: |
      A borrowed opaque handle to the listing of the tables and views of a schema, received by the table list callback
      and valid only for the duration of that call. It gives access to the transaction state and the schema, and
      receives the tables and views.

#-----------------------------------------------------------------------------------------------------------------------
# Callbacks
#-----------------------------------------------------------------------------------------------------------------------
callbacks:
  vcatalog_attach_callback:
    parameters:
      info:
        type: vcatalog_attach_info
        description: Borrowed opaque handle to the `ATTACH`.
      database:
        type: vcatalog_database
        description: Borrowed handle to the database the callback runs on.
      context:
        type: context
        description: Borrowed handle to the context of the connection running the `ATTACH`.
      err:
        type: error_info
        indirection: 1
        description: |
          Borrowed error info handle to use to report errors that occur during the callback. Reporting an error fails
          the `ATTACH`.
    return_type: void

  vcatalog_transaction_begin_callback:
    parameters:
      info:
        type: vcatalog_transaction_begin_info
        description: Borrowed opaque handle to the beginning transaction.
      database:
        type: vcatalog_database
        description: Borrowed handle to the database the callback runs on.
      err:
        type: error_info
        indirection: 1
        description: |
          Borrowed error info handle to use to report errors that occur during the callback. Reporting an error fails
          the statement that touched the database.
    return_type: void

  vcatalog_transaction_commit_callback:
    parameters:
      info:
        type: vcatalog_transaction_commit_info
        description: Borrowed opaque handle to the committing transaction.
      database:
        type: vcatalog_database
        description: Borrowed handle to the database the callback runs on.
      err:
        type: error_info
        indirection: 1
        description: |
          Borrowed error info handle to use to report errors that occur during the callback. Reporting an error fails
          the commit, after which the transaction is rolled back.
    return_type: void

  vcatalog_transaction_rollback_callback:
    parameters:
      info:
        type: vcatalog_transaction_rollback_info
        description: Borrowed opaque handle to the transaction rolling back.
      database:
        type: vcatalog_database
        description: Borrowed handle to the database the callback runs on.
      err:
        type: error_info
        indirection: 1
        description: |
          Borrowed error info handle to use to report errors that occur during the callback. A reported error is
          passed on, but does not stop the transaction from ending.
    return_type: void

  vcatalog_schema_find_callback:
    parameters:
      info:
        type: vcatalog_schema_find_info
        description: Borrowed opaque handle to the request.
      database:
        type: vcatalog_database
        description: Borrowed handle to the database the callback runs on.
      context:
        type: context
        description: Borrowed handle to the context of the connection the schema is found for.
      err:
        type: error_info
        indirection: 1
        description: |
          Borrowed error info handle to use to report errors that occur during the callback. Reporting an error fails
          the statement that needed the schema.
    return_type: void

  vcatalog_schema_list_callback:
    parameters:
      info:
        type: vcatalog_schema_list_info
        description: Borrowed opaque handle to the listing.
      database:
        type: vcatalog_database
        description: Borrowed handle to the database the callback runs on.
      context:
        type: context
        description: Borrowed handle to the context of the connection listing the schemas.
      err:
        type: error_info
        indirection: 1
        description: |
          Borrowed error info handle to use to report errors that occur during the callback. Reporting an error fails
          the statement that listed the schemas.
    return_type: void

  vcatalog_table_find_callback:
    parameters:
      info:
        type: vcatalog_table_find_info
        description: Borrowed opaque handle to the request.
      database:
        type: vcatalog_database
        description: Borrowed handle to the database the callback runs on.
      context:
        type: context
        description: Borrowed handle to the context of the connection the table is found for.
      err:
        type: error_info
        indirection: 1
        description: |
          Borrowed error info handle to use to report errors that occur during the callback. Reporting an error fails
          the statement that needed the table.
    return_type: void

  vcatalog_table_list_callback:
    parameters:
      info:
        type: vcatalog_table_list_info
        description: Borrowed opaque handle to the listing.
      database:
        type: vcatalog_database
        description: Borrowed handle to the database the callback runs on.
      context:
        type: context
        description: Borrowed handle to the context of the connection listing the tables.
      err:
        type: error_info
        indirection: 1
        description: |
          Borrowed error info handle to use to report errors that occur during the callback. Reporting an error fails
          the statement that listed the tables.
    return_type: void

  vcatalog_schema_create_callback:
    parameters:
      info:
        type: vcatalog_entry_create_info
        description: Borrowed opaque handle to what creating any kind of entry has in common.
      schema_info:
        type: vcatalog_schema_create_info
        description: Borrowed opaque handle to the schema to create.
      database:
        type: vcatalog_database
        description: Borrowed handle to the database the callback runs on.
      context:
        type: context
        description: Borrowed handle to the context of the connection creating the schema.
      err:
        type: error_info
        indirection: 1
        description: |
          Borrowed error info handle to use to report errors that occur during the callback. Reporting an error fails
          the statement creating the schema.
    return_type: void

  vcatalog_schema_drop_callback:
    parameters:
      info:
        type: vcatalog_entry_drop_info
        description: Borrowed opaque handle to what dropping any kind of entry has in common.
      schema_info:
        type: vcatalog_schema_drop_info
        description: Borrowed opaque handle to the schema to drop.
      database:
        type: vcatalog_database
        description: Borrowed handle to the database the callback runs on.
      context:
        type: context
        description: Borrowed handle to the context of the connection dropping the schema.
      err:
        type: error_info
        indirection: 1
        description: |
          Borrowed error info handle to use to report errors that occur during the callback. Reporting an error fails
          the statement dropping the schema.
    return_type: void

  vcatalog_table_create_callback:
    parameters:
      info:
        type: vcatalog_entry_create_info
        description: Borrowed opaque handle to what creating any kind of entry has in common.
      table_info:
        type: vcatalog_table_create_info
        description: Borrowed opaque handle to the table to create.
      database:
        type: vcatalog_database
        description: Borrowed handle to the database the callback runs on.
      context:
        type: context
        description: Borrowed handle to the context of the connection creating the table.
      err:
        type: error_info
        indirection: 1
        description: |
          Borrowed error info handle to use to report errors that occur during the callback. Reporting an error fails
          the statement creating the table.
    return_type: void

  vcatalog_table_drop_callback:
    parameters:
      info:
        type: vcatalog_entry_drop_info
        description: Borrowed opaque handle to what dropping any kind of entry has in common.
      table_info:
        type: vcatalog_table_drop_info
        description: Borrowed opaque handle to the table to drop.
      database:
        type: vcatalog_database
        description: Borrowed handle to the database the callback runs on.
      context:
        type: context
        description: Borrowed handle to the context of the connection dropping the table.
      err:
        type: error_info
        indirection: 1
        description: |
          Borrowed error info handle to use to report errors that occur during the callback. Reporting an error fails
          the statement dropping the table.
    return_type: void

  vcatalog_view_create_callback:
    parameters:
      info:
        type: vcatalog_entry_create_info
        description: Borrowed opaque handle to what creating any kind of entry has in common.
      view_info:
        type: vcatalog_view_create_info
        description: Borrowed opaque handle to the view to create.
      database:
        type: vcatalog_database
        description: Borrowed handle to the database the callback runs on.
      context:
        type: context
        description: Borrowed handle to the context of the connection creating the view.
      err:
        type: error_info
        indirection: 1
        description: |
          Borrowed error info handle to use to report errors that occur during the callback. Reporting an error fails
          the statement creating the view.
    return_type: void

  vcatalog_view_drop_callback:
    parameters:
      info:
        type: vcatalog_entry_drop_info
        description: Borrowed opaque handle to what dropping any kind of entry has in common.
      view_info:
        type: vcatalog_view_drop_info
        description: Borrowed opaque handle to the view to drop.
      database:
        type: vcatalog_database
        description: Borrowed handle to the database the callback runs on.
      context:
        type: context
        description: Borrowed handle to the context of the connection dropping the view.
      err:
        type: error_info
        indirection: 1
        description: |
          Borrowed error info handle to use to report errors that occur during the callback. Reporting an error fails
          the statement dropping the view.
    return_type: void

  vcatalog_table_scan_bind_callback:
    parameters:
      info:
        type: vcatalog_table_scan_bind_info
        description: Borrowed opaque handle to the scan being bound.
      database:
        type: vcatalog_database
        description: Borrowed handle to the database the callback runs on.
      context:
        type: context
        description: Borrowed handle to the context of the connection scanning the table.
      err:
        type: error_info
        indirection: 1
        description: |
          Borrowed error info handle to use to report errors that occur during the callback. Reporting an error fails
          the statement that scans the table.
    return_type: void

#-----------------------------------------------------------------------------------------------------------------------
# Functions
#-----------------------------------------------------------------------------------------------------------------------
functions:
  #---------------------------------------------------------------------------------------------------------------------
  # Constructors
  #---------------------------------------------------------------------------------------------------------------------
  vcatalog_create:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-04" ]
    description: |
      Creates a new vcatalog through a factory.

      The vcatalog starts out empty: configure it with the setter functions, then make it available with
      `[[connection_register_vcatalog]]` or `[[extension_register_vcatalog]]`. The caller owns the returned handle and
      must destroy it with `[[vcatalog_destroy]]`, also after registration.

      The vcatalog can only be registered on the instance the factory belongs to.
    role: constructor
    belongs_to: vcatalog
    parameters:
      factory:
        type: factory
        description: The factory to create the vcatalog through.
      vcatalog:
        type: vcatalog
        indirection: 1
        kind: OUT
        description: On success, receives the newly created vcatalog. Owned by the caller.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  vcatalog_destroy:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-04" ]
    description: |
      Destroys the vcatalog, releasing its resources.

      Null-safe: passing a null pointer or null handle is a no-op. The handle is set to null on return to prevent
      double-destruction. Destroying the handle after registration does not affect the registered vcatalog.
    parameters:
      vcatalog:
        type: vcatalog
        description: The vcatalog to destroy.
        indirection: 1
    return_type: ERROR

  #---------------------------------------------------------------------------------------------------------------------
  # Properties
  #---------------------------------------------------------------------------------------------------------------------
  vcatalog_set_name:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-04" ]
    description: |
      Sets the name of the database type, as `ATTACH '<path>' (TYPE <name>)` refers to it.

      Names are matched case-insensitively. A name of at least two characters, all alphanumeric or underscores, can
      also be given as a path prefix: `ATTACH '<name>:<path>'`. The name is borrowed and copied. Calling this again
      replaces the previous name. A name must be set before registration.
    parameters:
      vcatalog:
        type: vcatalog
        description: The vcatalog to set the name of.
      name:
        type: char
        indirection: 1
        const: true
        kind: IN
        description: The name to set. Borrowed and copied.
      name_length:
        type: idx
        description: The length of `name` in bytes. `name` must be valid UTF-8, need not be null-terminated, and may be NULL only when this is 0.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  vcatalog_set_user_data:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-04" ]
    description: |
      Sets arbitrary user data on the vcatalog.

      Associates an opaque pointer with the vcatalog, retrievable in each of its callbacks from the database they run
      on, via `[[vcatalog_database_get_user_data]]`. Every database attached with the vcatalog shares it, so
      the callbacks must synchronize their own access to it. The opaque handle bundles the pointer with an optional
      destructor, invoked when the data is no longer needed: once the vcatalog handle is destroyed and, if it was
      registered, the instance is too.
    parameters:
      vcatalog:
        type: vcatalog
        description: The vcatalog to set the user data of.
      data:
        type: opaque
        indirection: 1
        description: Opaque handle bundling the user data pointer plus an optional destructor.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  vcatalog_set_attach_callback:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-04" ]
    description: |
      Sets the attach callback of the vcatalog, invoked once for every `ATTACH` of a database of its type.

      The callback reads the path and options of the `ATTACH` through the attach info, opens what the database needs,
      and sets the catalog state the other callbacks of the database receive, via
      `[[vcatalog_attach_set_catalog_state]]`. Reporting an error fails the `ATTACH`. So does an option the callback did
      not read, which is reported as unrecognized. An attach callback must be set before registration.
    parameters:
      vcatalog:
        type: vcatalog
        description: The vcatalog to set the attach callback of.
      callback:
        type: vcatalog_attach_callback
        description: The attach callback to set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  vcatalog_set_transaction_begin_callback:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-04" ]
    description: |
      Sets the optional begin callback of the vcatalog, invoked when a transaction first touches a database of its
      type.

      A transaction touches a database the first time it looks up, reads or writes anything in it, or at `BEGIN` for
      every attached database when `immediate_transaction_mode` is set. The callback runs while DuckDB holds the lock
      of the transaction, so it receives no context and must return quickly: set the transaction state via
      `[[vcatalog_transaction_begin_set_transaction_state]]`, and defer work on the backing store, such as beginning
      a transaction of its own, to the first callback that needs it.

      Reporting an error fails the statement that touched the database. Neither the commit nor the rollback callback is
      then invoked for the transaction, and a transaction state set before the error is destroyed.

      Without a begin callback, transactions on the database have no transaction state.
    parameters:
      vcatalog:
        type: vcatalog
        description: The vcatalog to set the begin callback of.
      callback:
        type: vcatalog_transaction_begin_callback
        description: The begin callback to set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  vcatalog_set_transaction_commit_callback:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-04" ]
    description: |
      Sets the optional commit callback of the vcatalog, invoked when a transaction that began on a database of its
      type commits: at `COMMIT`, or at the end of a statement in auto-commit mode.

      The callback receives no context: the connection's transaction has already ended when its databases commit.
      Reporting an error fails the commit. The rollback callback is then invoked for the same transaction, and the
      error is reported to the client. A transaction spanning several attached databases commits them one after the
      other; once one of them fails, the remaining ones are rolled back instead of committed.

      The transaction state is destroyed after the transaction ends, whether it committed or not.
    parameters:
      vcatalog:
        type: vcatalog
        description: The vcatalog to set the commit callback of.
      callback:
        type: vcatalog_transaction_commit_callback
        description: The commit callback to set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  vcatalog_set_transaction_rollback_callback:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-04" ]
    description: |
      Sets the optional rollback callback of the vcatalog, invoked when a transaction that began on a database of its
      type ends without committing.

      That is at `ROLLBACK`; at `COMMIT` of a transaction a failed statement invalidated; at the end of a failed
      statement in auto-commit mode; after the commit of this or another attached database failed; and when the
      connection closes with the transaction still open. A statement that fails inside an explicit transaction only
      invalidates the transaction: the callback is invoked once the transaction ends.

      The callback runs on cleanup paths, so it receives no context, and an error it reports is passed on but does not
      stop the transaction from ending. After a failed commit it is invoked for the same transaction, so it must cope
      with a transaction of the backing store that the failed commit already ended.

      The transaction state is destroyed after the callback returns.
    parameters:
      vcatalog:
        type: vcatalog
        description: The vcatalog to set the rollback callback of.
      callback:
        type: vcatalog_transaction_rollback_callback
        description: The rollback callback to set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  vcatalog_set_schema_find_callback:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-05" ]
    description: |
      Sets the optional schema find callback of the vcatalog, invoked whenever DuckDB resolves a schema name in a
      database of its type: e.g. for `v.main.t`, for `USE v`, or for an unqualified name on the search path.

      The callback resolves the name with `[[vcatalog_schema_find_set_schema]]`, or leaves it unresolved when there
      is no such schema. DuckDB keeps nothing between calls, so the callback runs every time DuckDB resolves the name,
      often several times per statement: keep it fast, e.g. by keeping the schemas in the catalog state. Without a
      find callback, no schema of a database of the type can be resolved by name.
    parameters:
      vcatalog:
        type: vcatalog
        description: The vcatalog to set the schema find callback of.
      callback:
        type: vcatalog_schema_find_callback
        description: The schema find callback to set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  vcatalog_set_schema_list_callback:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-05" ]
    description: |
      Sets the optional schema list callback of the vcatalog, invoked when DuckDB lists the schemas of a database of its
      type, e.g. for `duckdb_schemas()`.

      The callback adds every schema of the database with `[[vcatalog_schema_list_add_schema]]`. Without a list
      callback, a database of the type lists no schemas.
    parameters:
      vcatalog:
        type: vcatalog
        description: The vcatalog to set the schema list callback of.
      callback:
        type: vcatalog_schema_list_callback
        description: The schema list callback to set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  vcatalog_set_table_find_callback:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-10" ]
    description: |
      Sets the optional table find callback of the vcatalog, invoked whenever DuckDB resolves the name of a table or
      view in a schema of a database of its type: e.g. for `SELECT * FROM v.main.t` or
      `pragma_table_info('v.main.t')`.

      The callback resolves the name with `[[vcatalog_table_find_set_table]]` or `[[vcatalog_table_find_set_view]]`,
      or leaves it unresolved when the schema has no such table or view. As for schemas, DuckDB keeps nothing between
      calls, so keep the callback fast. DuckDB finds no other kinds of entries, such as functions or types, in the
      schemas of a vcatalog. Without a table find callback, no table or view of a database of the type can be
      resolved by name.
    parameters:
      vcatalog:
        type: vcatalog
        description: The vcatalog to set the callback of.
      callback:
        type: vcatalog_table_find_callback
        description: The callback to set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  vcatalog_set_table_list_callback:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-10" ]
    description: |
      Sets the optional table list callback of the vcatalog, invoked when DuckDB lists the tables or the views of a
      schema of a database of its type, e.g. for `duckdb_tables()`, `duckdb_views()`, `duckdb_columns()` or
      `SHOW ALL TABLES`.

      The callback adds every table of the schema with `[[vcatalog_table_list_add_table]]` and every view with
      `[[vcatalog_table_list_add_view]]`, whichever of the two DuckDB is listing. Without a table list callback, the
      schemas of a database of the type list no tables and no views.
    parameters:
      vcatalog:
        type: vcatalog
        description: The vcatalog to set the callback of.
      callback:
        type: vcatalog_table_list_callback
        description: The callback to set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  vcatalog_set_schema_create_callback:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-10" ]
    description: |
      Sets the optional schema create callback of the vcatalog, invoked for `CREATE SCHEMA` in a database of its type.

      The callback creates the schema named by `[[vcatalog_entry_create_get_name]]` in the backing store, and reports
      it with `[[vcatalog_schema_create_set_schema]]`. Schemas within schemas are not supported. Without a schema
      create callback, `CREATE SCHEMA` fails as not supported.
    parameters:
      vcatalog:
        type: vcatalog
        description: The vcatalog to set the callback of.
      callback:
        type: vcatalog_schema_create_callback
        description: The callback to set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  vcatalog_set_schema_drop_callback:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-10" ]
    description: |
      Sets the optional schema drop callback of the vcatalog, invoked for `DROP SCHEMA` in a database of its type, and
      for `CREATE OR REPLACE SCHEMA` of an existing schema, before its create callback.

      The callback drops the schema `[[vcatalog_schema_drop_get_schema]]` gives in the backing store. What becomes of
      the tables and views of the schema is up to the vcatalog; `[[vcatalog_entry_drop_is_cascade]]` tells whether the
      statement asked for them to be dropped along. The handle of the schema stays owned by the implementation, which
      must keep it alive as the module notes describe: the transaction dropping it may still be using it. Without a
      schema drop callback, dropping a schema fails as not supported.
    parameters:
      vcatalog:
        type: vcatalog
        description: The vcatalog to set the callback of.
      callback:
        type: vcatalog_schema_drop_callback
        description: The callback to set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  vcatalog_set_table_create_callback:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-10" ]
    description: |
      Sets the optional table create callback of the vcatalog, invoked for `CREATE TABLE` in a schema of a database of
      its type.

      The callback creates the table in the backing store, from the name `[[vcatalog_entry_create_get_name]]` gives and
      the columns and constraints `[[vcatalog_table_create_info]]` gives, and reports it with
      `[[vcatalog_table_create_set_table]]`. Tables with generated columns, and `CREATE TABLE ... AS`, are not
      supported. Without a table create callback, `CREATE TABLE` fails as not supported.
    parameters:
      vcatalog:
        type: vcatalog
        description: The vcatalog to set the callback of.
      callback:
        type: vcatalog_table_create_callback
        description: The callback to set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  vcatalog_set_table_drop_callback:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-10" ]
    description: |
      Sets the optional table drop callback of the vcatalog, invoked for `DROP TABLE` in a schema of a database of its
      type, and for `CREATE OR REPLACE TABLE` of an existing table, before its create callback.

      The callback drops the table `[[vcatalog_table_drop_get_table]]` gives in the backing store. The handle of the
      table stays owned by the implementation, which must keep it alive as the module notes describe: the transaction
      dropping it may still be using it. Without a table drop callback, dropping a table fails as not supported.
    parameters:
      vcatalog:
        type: vcatalog
        description: The vcatalog to set the callback of.
      callback:
        type: vcatalog_table_drop_callback
        description: The callback to set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  vcatalog_set_view_create_callback:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-10" ]
    description: |
      Sets the optional view create callback of the vcatalog, invoked for `CREATE VIEW` in a schema of a database of
      its type.

      The callback creates the view in the backing store, from the name `[[vcatalog_entry_create_get_name]]` gives and
      the query and column aliases `[[vcatalog_view_create_info]]` gives, and reports it with
      `[[vcatalog_view_create_set_view]]`. Without a view create callback, `CREATE VIEW` fails as not supported.
    parameters:
      vcatalog:
        type: vcatalog
        description: The vcatalog to set the callback of.
      callback:
        type: vcatalog_view_create_callback
        description: The callback to set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  vcatalog_set_view_drop_callback:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-10" ]
    description: |
      Sets the optional view drop callback of the vcatalog, invoked for `DROP VIEW` in a schema of a database of its
      type, and for `CREATE OR REPLACE VIEW` of an existing view, before its create callback.

      The callback drops the view `[[vcatalog_view_drop_get_view]]` gives in the backing store. The handle of the view
      stays owned by the implementation, which must keep it alive as the module notes describe: the transaction
      dropping it may still be using it. Without a view drop callback, dropping a view fails as not supported.
    parameters:
      vcatalog:
        type: vcatalog
        description: The vcatalog to set the callback of.
      callback:
        type: vcatalog_view_drop_callback
        description: The callback to set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  #---------------------------------------------------------------------------------------------------------------------
  # Attach Info
  #---------------------------------------------------------------------------------------------------------------------
  vcatalog_attach_get_name:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-04" ]
    description: |
      Retrieves the name the database is attached under: the alias of `ATTACH ... AS <alias>`, or else the name DuckDB
      derived from the path. The name is borrowed and valid only for the duration of the callback.
    parameters:
      info:
        type: vcatalog_attach_info
        description: The attach info handle.
      name:
        type: char
        indirection: 2
        const: true
        kind: OUT_BORROW
        description: Receives a borrowed pointer to the name. Valid only for the duration of the callback.
      name_length:
        type: idx
        indirection: 1
        kind: OUT
        description: Receives the length of `*name` in bytes. `*name` is not guaranteed to be null-terminated.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  vcatalog_attach_get_path:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-04" ]
    description: |
      Retrieves the path the database is attached from, as given to `ATTACH`, with a leading `<name>:` prefix removed.
      What the path means is up to the vcatalog: a file, a connection string, a URL. The path is borrowed and valid
      only for the duration of the callback.
    parameters:
      info:
        type: vcatalog_attach_info
        description: The attach info handle.
      path:
        type: char
        indirection: 2
        const: true
        kind: OUT_BORROW
        description: Receives a borrowed pointer to the path. Valid only for the duration of the callback.
      path_length:
        type: idx
        indirection: 1
        kind: OUT
        description: Receives the length of `*path` in bytes. `*path` is not guaranteed to be null-terminated.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  vcatalog_attach_is_read_only:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-04" ]
    description: |
      Retrieves whether the database is attached read-only: with the `READ_ONLY` option, or because the access mode of
      the instance is read-only.
    parameters:
      info:
        type: vcatalog_attach_info
        description: The attach info handle.
      read_only:
        type: bool
        indirection: 1
        kind: OUT
        description: Receives whether the database is attached read-only.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  vcatalog_attach_get_option:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-04" ]
    description: |
      Retrieves the value of an option given to `ATTACH`, e.g. `ATTACH '<path>' (TYPE <name>, <option> <value>)`.

      Option names are matched case-insensitively. The options DuckDB interprets itself, such as `TYPE` and
      `READ_ONLY`, are not visible here. Retrieving an option marks it as recognized: an option no call retrieves fails
      the `ATTACH` once the attach callback returns. An option that was not given has no value: `present` then
      receives false and `value` is left untouched.
    parameters:
      info:
        type: vcatalog_attach_info
        description: The attach info handle.
      name:
        type: char
        indirection: 1
        const: true
        kind: IN
        description: The name of the option. Borrowed for the duration of the call.
      name_length:
        type: idx
        description: The length of `name` in bytes. `name` must be valid UTF-8, need not be null-terminated, and may be NULL only when this is 0.
      value:
        type: value
        indirection: 1
        kind: OUT
        description: Receives the value of the option, if present. Owned by the caller; destroy via `[[value_destroy]]`.
      present:
        type: bool
        indirection: 1
        kind: OUT
        description: Receives whether the option was given.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  vcatalog_attach_set_catalog_state:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-04" ]
    description: |
      Sets the catalog state of the database being attached.

      The catalog state is retrievable in every callback of the database, from the database handle it receives, via
      `[[vcatalog_database_get_catalog_state]]`. Every connection using the database shares it, so the
      callbacks must synchronize their own access to it. The opaque handle bundles the pointer with an optional
      destructor, invoked when the database is detached, after every transaction state of the database was destroyed,
      or right away if the `ATTACH` fails. Calling this again replaces the previous state, destroying it.
    parameters:
      info:
        type: vcatalog_attach_info
        description: The attach info handle.
      data:
        type: opaque
        indirection: 1
        description: Opaque handle bundling the catalog state pointer plus an optional destructor.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  #---------------------------------------------------------------------------------------------------------------------
  # Transaction Begin Info
  #---------------------------------------------------------------------------------------------------------------------
  vcatalog_transaction_begin_is_read_only:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-04" ]
    description: |
      Retrieves whether the transaction cannot write to the database: because the database is attached read-only, or
      because the transaction was started with `BEGIN TRANSACTION READ ONLY`. A transaction that can write need not.
    parameters:
      info:
        type: vcatalog_transaction_begin_info
        description: The begin info handle.
      read_only:
        type: bool
        indirection: 1
        kind: OUT
        description: Receives whether the transaction is read-only.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  vcatalog_transaction_begin_set_transaction_state:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-04" ]
    description: |
      Sets the transaction state of the beginning transaction.

      The transaction state is retrievable from every later callback of the transaction through their info handles,
      e.g. via `[[vcatalog_transaction_commit_get_transaction_state]]`. The opaque handle bundles the pointer with an
      optional destructor, invoked once the transaction has ended, after the commit or rollback callback returned, or
      right away if the begin callback fails. Calling this again replaces the previous state, destroying it.
    parameters:
      info:
        type: vcatalog_transaction_begin_info
        description: The begin info handle.
      data:
        type: opaque
        indirection: 1
        description: Opaque handle bundling the transaction state pointer plus an optional destructor.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  #---------------------------------------------------------------------------------------------------------------------
  # Transaction Commit Info
  #---------------------------------------------------------------------------------------------------------------------
  vcatalog_transaction_commit_get_transaction_state:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-04" ]
    description: Retrieves the transaction state set via `[[vcatalog_transaction_begin_set_transaction_state]]`.
    parameters:
      info:
        type: vcatalog_transaction_commit_info
        description: The commit info handle.
      data:
        type: void
        indirection: 2
        kind: OUT
        description: Receives the transaction state pointer, or null if none was set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  #---------------------------------------------------------------------------------------------------------------------
  # Transaction Rollback Info
  #---------------------------------------------------------------------------------------------------------------------
  vcatalog_transaction_rollback_get_transaction_state:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-04" ]
    description: Retrieves the transaction state set via `[[vcatalog_transaction_begin_set_transaction_state]]`.
    parameters:
      info:
        type: vcatalog_transaction_rollback_info
        description: The rollback info handle.
      data:
        type: void
        indirection: 2
        kind: OUT
        description: Receives the transaction state pointer, or null if none was set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  #---------------------------------------------------------------------------------------------------------------------
  # Database
  #---------------------------------------------------------------------------------------------------------------------
  vcatalog_database_get_user_data:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-05" ]
    description: Retrieves the user data set via `[[vcatalog_set_user_data]]`.
    parameters:
      database:
        type: vcatalog_database
        description: The database.
      data:
        type: void
        indirection: 2
        kind: OUT
        description: Receives the user data pointer, or null if none was set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  vcatalog_database_get_catalog_state:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-05" ]
    description: |
      Retrieves the catalog state the attach callback set via `[[vcatalog_attach_set_catalog_state]]`. In the attach
      callback itself, this is null until the callback sets one.
    parameters:
      database:
        type: vcatalog_database
        description: The database.
      data:
        type: void
        indirection: 2
        kind: OUT
        description: Receives the catalog state pointer, or null if none was set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  #---------------------------------------------------------------------------------------------------------------------
  # Schema Builder
  #---------------------------------------------------------------------------------------------------------------------
  vcatalog_schema_builder_create:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-10" ]
    description: |
      Creates a builder for a schema of the database.

      The builder starts out with the given name and no state. Configure it with the setter functions, then build the
      schema with `[[vcatalog_schema_builder_build]]`. The caller owns the returned handle and must destroy it with
      `[[vcatalog_schema_builder_destroy]]`, also after building, and before the database is detached.
    role: constructor
    belongs_to: vcatalog_schema_builder
    parameters:
      database:
        type: vcatalog_database
        description: The database to build the schema in.
      name:
        type: char
        indirection: 1
        const: true
        kind: IN
        description: The name of the schema. Borrowed and copied.
      name_length:
        type: idx
        description: The length of `name` in bytes. `name` must be valid UTF-8, need not be null-terminated, and may be NULL only when this is 0.
      builder:
        type: vcatalog_schema_builder
        indirection: 1
        kind: OUT
        description: On success, receives the newly created builder. Owned by the caller.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  vcatalog_schema_builder_destroy:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-10" ]
    description: |
      Destroys the schema builder.

      The schemas it built are not affected, and keep the state they share with it. Null-safe: passing a null pointer
      or null handle is a no-op. The handle is set to null on return to prevent double-destruction.
    parameters:
      builder:
        type: vcatalog_schema_builder
        description: The builder to destroy.
        indirection: 1
    return_type: ERROR

  vcatalog_schema_builder_set_state:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-10" ]
    description: |
      Sets the implementation's own state of the schema being built, retrievable from the schema via
      `[[vcatalog_schema_get_state]]`.

      DuckDB never reads the state itself. The builder shares it with every schema it builds from now on. The opaque
      handle bundles the pointer with an optional destructor, invoked once the builder and every schema sharing the
      state are destroyed. Calling this again replaces the state of the builder; schemas it already built keep theirs.
    parameters:
      builder:
        type: vcatalog_schema_builder
        description: The builder to set the state of.
      data:
        type: opaque
        indirection: 1
        description: Opaque handle bundling the state pointer plus an optional destructor.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  vcatalog_schema_builder_build:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-10" ]
    description: |
      Builds a schema.

      The schema receives the name of the builder and shares its state. Building it does not make it visible: DuckDB
      only sees the schemas the find and list callbacks hand it. The caller owns the returned handle and must destroy
      it with `[[vcatalog_schema_destroy]]`, within the rules of the module notes.

      The builder stays usable, and changing it does not affect the schemas it already built. Every schema it builds
      is an entry of its own to DuckDB.
    role: constructor
    belongs_to: vcatalog_schema
    parameters:
      builder:
        type: vcatalog_schema_builder
        description: The builder to build a schema from.
      schema:
        type: vcatalog_schema
        indirection: 1
        kind: OUT
        description: On success, receives the newly built schema. Owned by the caller.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  #---------------------------------------------------------------------------------------------------------------------
  # Schema
  #---------------------------------------------------------------------------------------------------------------------
  vcatalog_schema_destroy:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-05" ]
    description: |
      Destroys the schema. Its state is destroyed with the last holder sharing it.

      Destroy a schema only once every transaction it was handed out in has ended, and after every entry built in it
      and every builder created for it. Null-safe: passing a null pointer or null handle is a no-op. The handle is set
      to null on return to prevent double-destruction.
    parameters:
      schema:
        type: vcatalog_schema
        description: The schema to destroy.
        indirection: 1
    return_type: ERROR

  vcatalog_schema_get_name:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-05" ]
    description: |
      Retrieves the name of the schema. The name is borrowed and valid for as long as the schema is.
    parameters:
      schema:
        type: vcatalog_schema
        description: The schema.
      name:
        type: char
        indirection: 2
        const: true
        kind: OUT_BORROW
        description: Receives a borrowed pointer to the name. Valid for as long as the schema is.
      name_length:
        type: idx
        indirection: 1
        kind: OUT
        description: Receives the length of `*name` in bytes. `*name` is not guaranteed to be null-terminated.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  vcatalog_schema_get_database:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-05" ]
    description: Retrieves the database the schema was built in.
    parameters:
      schema:
        type: vcatalog_schema
        description: The schema.
      database:
        type: vcatalog_database
        indirection: 1
        kind: OUT
        description: Receives the borrowed database handle.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  vcatalog_schema_get_state:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-05" ]
    description: Retrieves the state the schema shares with its builder, set via `[[vcatalog_schema_builder_set_state]]`.
    parameters:
      schema:
        type: vcatalog_schema
        description: The schema.
      data:
        type: void
        indirection: 2
        kind: OUT
        description: Receives the state pointer, or null if none was set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

