        indirection: 2
        const: true
        kind: OUT_BORROW
        description: Receives a borrowed pointer to the SQL of the query. Valid only for the duration of the callback.
      sql_length:
        type: idx
        indirection: 1
        kind: OUT
        description: Receives the length of `*sql` in bytes. `*sql` is not guaranteed to be null-terminated.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  vcatalog_view_create_get_column_alias_count:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-10" ]
    description: Retrieves the number of column aliases of the view to create, the names of `CREATE VIEW <name> (<alias>, ...)`.
    parameters:
      info:
        type: vcatalog_view_create_info
        description: The view create info handle.
      count:
        type: idx
        indirection: 1
        kind: OUT
        description: Receives the number of column aliases.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  vcatalog_view_create_get_column_alias:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-10" ]
    description: |
      Retrieves the column alias at the given index. Fails if the index is out of bounds. The name is borrowed and
      valid only for the duration of the callback.
    parameters:
      info:
        type: vcatalog_view_create_info
        description: The view create info handle.
      index:
        type: idx
        description: The index of the column alias.
      name:
        type: char
        indirection: 2
        const: true
        kind: OUT_BORROW
        description: Receives a borrowed pointer to the name. Valid only for the duration of the callback.
      name_length:
        type: idx
        indirection: 1
        kind: OUT
        description: Receives the length of `*name` in bytes. `*name` is not guaranteed to be null-terminated.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  vcatalog_view_create_set_view:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-10" ]
    description: |
      Reports the view the callback created.

      The view must have been built in the schema it is created in. It stays owned by the caller, which must keep it
      alive as the module notes describe. A callback that reports neither a view nor an error fails the statement.
    parameters:
      info:
        type: vcatalog_view_create_info
        description: The view create info handle.
      view:
        type: vcatalog_view
        description: The view created. Remains owned by the caller.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

