      the statements its views were created with has them.

      The builder starts out with the name, the column aliases and the query of the statement, and no state. A
      database or schema the statement qualifies the name with is ignored: the view is one of the given schema. The
      statement is parsed with DuckDB's built-in grammar, without the syntax extensions add; fails with
      `ERROR_INPUT_INVALID` when it does not parse, or is not a single `CREATE VIEW` statement. The caller owns the
      returned handle and must destroy it with `[[vcatalog_view_builder_destroy]]`, also after building, and before
      the schema.
    role: constructor
    belongs_to: vcatalog_view_builder
    parameters:
      schema:
        type: vcatalog_schema
        description: The schema to build the view in.
      sql:
        type: char
        indirection: 1
        const: true
        kind: IN
        description: The `CREATE VIEW` statement. Borrowed and copied.
      sql_length:
        type: idx
        description: The length of `sql` in bytes. `sql` must be valid UTF-8, need not be null-terminated, and may be NULL only when this is 0.
      builder:
        type: vcatalog_view_builder
        indirection: 1
        kind: OUT
        description: On success, receives the newly created builder. Owned by the caller.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  vcatalog_view_builder_destroy:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-10" ]
    description: |
      Destroys the view builder.

      The views it built are not affected, and keep the state they share with it. Null-safe: passing a null pointer
      or null handle is a no-op. The handle is set to null on return to prevent double-destruction.
    parameters:
      builder:
        type: vcatalog_view_builder
        description: The builder to destroy.
        indirection: 1
    return_type: ERROR

  vcatalog_view_builder_set_query:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-10" ]
    description: |
      Sets the query of the view being built: what `CREATE VIEW <name> AS <query>` would be given.

      The query is parsed with DuckDB's built-in grammar, without the syntax extensions add; fails with
      `ERROR_INPUT_INVALID` when it does not parse, or is not a single `SELECT` statement. It is not bound here, so a
      name it refers to need not exist yet: a statement using the view fails if it does not exist by then. The query
      is borrowed and copied. Calling this again replaces the previous query.
    parameters:
      builder:
        type: vcatalog_view_builder
        description: The builder to set the query of.
      sql:
        type: char
        indirection: 1
        const: true
        kind: IN
        description: The query. Borrowed and copied.
      sql_length:
        type: idx
        description: The length of `sql` in bytes. `sql` must be valid UTF-8, need not be null-terminated, and may be NULL only when this is 0.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  vcatalog_view_builder_add_column_alias:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-10" ]
    description: |
      Appends a column alias to the view being built: one of the names of `CREATE VIEW <name> (<alias>, ...)`.

      The aliases rename the columns of the query in order. Columns beyond the last alias keep the names the query
      gives them. The name is borrowed and copied.
    parameters:
      builder:
        type: vcatalog_view_builder
        description: The builder to add the alias to.
      name:
        type: char
        indirection: 1
        const: true
        kind: IN
        description: The alias. Borrowed and copied.
      name_length:
        type: idx
        description: The length of `name` in bytes. `name` must be valid UTF-8, need not be null-terminated, and may be NULL only when this is 0.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  vcatalog_view_builder_set_state:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-10" ]
    description: |
      Sets the implementation's own state of the view being built, retrievable from the view via
      `[[vcatalog_view_get_state]]`.

      DuckDB never reads the state itself. The builder shares it with every view it builds from now on. The opaque
      handle bundles the pointer with an optional destructor, invoked once the builder and every view sharing the
      state are destroyed. Calling this again replaces the state of the builder; views it already built keep theirs.
    parameters:
      builder:
        type: vcatalog_view_builder
        description: The builder to set the state of.
      data:
        type: opaque
        indirection: 1
        description: Opaque handle bundling the state pointer plus an optional destructor.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  vcatalog_view_builder_build:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-10" ]
    description: |
      Builds a view.

      The view receives the name, the column aliases and the query of the builder and shares its state. A view needs
      a query: building one without fails. Building a view does not make it visible: DuckDB only sees the views the
      table find and list callbacks hand it. The caller owns the returned handle and must destroy it with
      `[[vcatalog_view_destroy]]`, within the rules of the module notes, and before the schema.

      The builder stays usable, and changing it does not affect the views it already built. Every view it builds is
      an entry of its own to DuckDB.
    role: constructor
    belongs_to: vcatalog_view
    parameters:
      builder:
        type: vcatalog_view_builder
        description: The builder to build a view from.
      view:
        type: vcatalog_view
        indirection: 1
        kind: OUT
        description: On success, receives the newly built view. Owned by the caller.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  #---------------------------------------------------------------------------------------------------------------------
  # View
  #---------------------------------------------------------------------------------------------------------------------
  vcatalog_view_destroy:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-10" ]
    description: |
      Destroys the view. Its state is destroyed with the last holder sharing it.

      Destroy a view only once every transaction it was handed out in has ended. Null-safe: passing a null pointer or
      null handle is a no-op. The handle is set to null on return to prevent double-destruction.
    parameters:
      view:
        type: vcatalog_view
        description: The view to destroy.
        indirection: 1
    return_type: ERROR

  vcatalog_view_get_name:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-10" ]
    description: Retrieves the name of the view. The name is borrowed and valid for as long as the view is.
    parameters:
      view:
        type: vcatalog_view
        description: The view.
      name:
        type: char
        indirection: 2
        const: true
        kind: OUT_BORROW
        description: Receives a borrowed pointer to the name. Valid for as long as the view is.
      name_length:
        type: idx
        indirection: 1
        kind: OUT
        description: Receives the length of `*name` in bytes. `*name` is not guaranteed to be null-terminated.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  vcatalog_view_get_schema:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-10" ]
    description: Retrieves the schema the view was built in.
    parameters:
      view:
        type: vcatalog_view
        description: The view.
      schema:
        type: vcatalog_schema
        indirection: 1
        kind: OUT
        description: Receives the borrowed schema handle.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  vcatalog_view_get_state:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-10" ]
    description: Retrieves the state the view shares with its builder, set via `[[vcatalog_view_builder_set_state]]`.
    parameters:
      view:
        type: vcatalog_view
        description: The view.
      data:
        type: void
        indirection: 2
        kind: OUT
        description: Receives the state pointer, or null if none was set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  #---------------------------------------------------------------------------------------------------------------------
  # Table Scan Bind Info
  #---------------------------------------------------------------------------------------------------------------------
  vcatalog_table_scan_bind_get_transaction_state:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-10" ]
    description: |
      Retrieves the transaction state of the transaction the scan is bound in, as set via
      `[[vcatalog_transaction_begin_set_transaction_state]]`. The scan runs in the same transaction.
    parameters:
      info:
        type: vcatalog_table_scan_bind_info
        description: The scan bind info handle.
      data:
        type: void
        indirection: 2
        kind: OUT
        description: Receives the transaction state pointer, or null if none was set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  vcatalog_table_scan_bind_get_table:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-10" ]
    description: Retrieves the table being scanned.
    parameters:
      info:
        type: vcatalog_table_scan_bind_info
        description: The scan bind info handle.
      table:
        type: vcatalog_table
        indirection: 1
        kind: OUT
        description: Receives the borrowed table handle.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  vcatalog_table_scan_bind_set_bind_data:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-10" ]
    description: |
      Sets the bind data of the scan, retrievable in the callbacks of the scan function, e.g. via
      `[[table_function_init_global_get_bind_data]]`.

      The bind data is read-only once the callback returns, and may be shared by several threads. The opaque handle
      bundles the pointer with an optional destructor, invoked when the bound statement is destroyed, or right away if
      the callback fails. Calling this again replaces the previous bind data, destroying it.
    parameters:
      info:
        type: vcatalog_table_scan_bind_info
        description: The scan bind info handle.
      data:
        type: opaque
        indirection: 1
        description: Opaque handle bundling the bind data pointer plus an optional destructor.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  vcatalog_table_scan_bind_set_cardinality:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-10" ]
    description: |
      Sets the estimated number of rows the scan will produce.

      The estimate is a hint for the optimizer, not a limit: producing a different number of rows is not an error.
      Without it, the optimizer falls back on its own defaults.
    parameters:
      info:
        type: vcatalog_table_scan_bind_info
        description: The scan bind info handle.
      cardinality:
        type: idx
        description: The estimated number of rows.
      is_exact:
        type: bool
        description: Whether the estimate is exact, which also makes it an upper bound on the row count.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  vcatalog_table_scan_bind_set_order_preservation:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-10" ]
    description: |
      Sets the order guarantee of the rows the scan produces, as `[[table_function_bind_set_order_preservation]]`
      does for a call of a table function. Defaults to `ORDER_PRESERVATION_INSERTION_ORDER`. Fails with
      `ERROR_INPUT_INVALID` when order is not one of the enum's declared values.
    parameters:
      info:
        type: vcatalog_table_scan_bind_info
        description: The scan bind info handle.
      order:
        type: ORDER_PRESERVATION
        description: The order guarantee of the produced rows.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  #---------------------------------------------------------------------------------------------------------------------
  # Entry Create Info
  #---------------------------------------------------------------------------------------------------------------------
  vcatalog_entry_create_get_name:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-10" ]
    description: |
      Retrieves the name of the schema, table or view to create, as written in the statement. The name is borrowed
      and valid only for the duration of the callback.
    parameters:
      info:
        type: vcatalog_entry_create_info
        description: The create info handle.
      name:
        type: char
        indirection: 2
        const: true
        kind: OUT_BORROW
        description: Receives a borrowed pointer to the name. Valid only for the duration of the callback.
      name_length:
        type: idx
        indirection: 1
        kind: OUT
        description: Receives the length of `*name` in bytes. `*name` is not guaranteed to be null-terminated.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  vcatalog_entry_create_get_transaction_state:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-10" ]
    description: |
      Retrieves the transaction state of the transaction the create runs in, as set via
      `[[vcatalog_transaction_begin_set_transaction_state]]`.
    parameters:
      info:
        type: vcatalog_entry_create_info
        description: The create info handle.
      data:
        type: void
        indirection: 2
        kind: OUT
        description: Receives the transaction state pointer, or null if none was set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  #---------------------------------------------------------------------------------------------------------------------
  # Schema Create Info
  #---------------------------------------------------------------------------------------------------------------------
  vcatalog_schema_create_set_schema:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-10" ]
    description: |
      Reports the schema the callback created.

      The schema must have been built in the database it is created in. It stays owned by the caller, which must keep
      it alive as the module notes describe. A callback that reports neither a schema nor an error fails the
      statement.
    parameters:
      info:
        type: vcatalog_schema_create_info
        description: The schema create info handle.
      schema:
        type: vcatalog_schema
        description: The schema created. Remains owned by the caller.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  #---------------------------------------------------------------------------------------------------------------------
  # Table Create Info
  #---------------------------------------------------------------------------------------------------------------------
  vcatalog_table_create_get_schema:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-10" ]
    description: Retrieves the schema the table is to be created in.
    parameters:
      info:
        type: vcatalog_table_create_info
        description: The table create info handle.
      schema:
        type: vcatalog_schema
        indirection: 1
        kind: OUT
        description: Receives the borrowed schema handle.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  vcatalog_table_create_get_column_count:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-10" ]
    description: Retrieves the number of columns of the table to create.
    parameters:
      info:
        type: vcatalog_table_create_info
        description: The table create info handle.
      count:
        type: idx
        indirection: 1
        kind: OUT
        description: Receives the number of columns.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  vcatalog_table_create_get_column_name:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-10" ]
    description: |
      Retrieves the name of the column at the given index. Fails if the index is out of bounds. The name is borrowed
      and valid only for the duration of the callback.
    parameters:
      info:
        type: vcatalog_table_create_info
        description: The table create info handle.
      index:
        type: idx
        description: The index of the column.
      name:
        type: char
        indirection: 2
        const: true
        kind: OUT_BORROW
        description: Receives a borrowed pointer to the name. Valid only for the duration of the callback.
      name_length:
        type: idx
        indirection: 1
        kind: OUT
        description: Receives the length of `*name` in bytes. `*name` is not guaranteed to be null-terminated.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  vcatalog_table_create_get_column_type:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-10" ]
    description: |
      Retrieves the type of the column at the given index. Fails if the index is out of bounds. The returned type is
      owned by the caller and must be destroyed via `[[logical_type_destroy]]`.
    parameters:
      info:
        type: vcatalog_table_create_info
        description: The table create info handle.
      index:
        type: idx
        description: The index of the column.
      type:
        type: logical_type
        indirection: 1
        kind: OUT
        description: Receives the column type. Owned by the caller; destroy via `[[logical_type_destroy]]`.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  vcatalog_table_create_is_column_not_null:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-10" ]
    description: |
      Retrieves whether the column at the given index is declared `NOT NULL`. Fails if the index is out of bounds.
    parameters:
      info:
        type: vcatalog_table_create_info
        description: The table create info handle.
      index:
        type: idx
        description: The index of the column.
      not_null:
        type: bool
        indirection: 1
        kind: OUT
        description: Receives whether the column is declared `NOT NULL`.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  vcatalog_table_create_get_column_default:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-10" ]
    description: |
      Retrieves the default of the column at the given index, as the SQL of its expression in DuckDB's dialect. Fails
      if the index is out of bounds. A column without a default has none: `present` then receives false and `sql` is
      left untouched. The SQL is borrowed and valid only for the duration of the callback.
    parameters:
      info:
        type: vcatalog_table_create_info
        description: The table create info handle.
      index:
        type: idx
        description: The index of the column.
      sql:
        type: char
        indirection: 2
        const: true
        kind: OUT_BORROW
        description: Receives a borrowed pointer to the SQL of the default. Valid only for the duration of the callback.
      sql_length:
        type: idx
        indirection: 1
        kind: OUT
        description: Receives the length of `*sql` in bytes. `*sql` is not guaranteed to be null-terminated.
      present:
        type: bool
        indirection: 1
        kind: OUT
        description: Receives whether the column has a default.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  vcatalog_table_create_get_constraint_count:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-10" ]
    description: |
      Retrieves the number of constraints of the table to create, other than the `NOT NULL` of its columns: its
      `PRIMARY KEY`, `UNIQUE`, `CHECK` and `FOREIGN KEY` constraints, whether the statement declares them on a column
      or on the table.
    parameters:
      info:
        type: vcatalog_table_create_info
        description: The table create info handle.
      count:
        type: idx
        indirection: 1
        kind: OUT
        description: Receives the number of constraints.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  vcatalog_table_create_get_constraint:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-10" ]
    description: |
      Retrieves the constraint at the given index as SQL in DuckDB's dialect, in the form of a table constraint, e.g.
      `PRIMARY KEY(id)` or `CHECK((x > 0))`. Fails if the index is out of bounds. The SQL is borrowed and valid only
      for the duration of the callback.
    parameters:
      info:
        type: vcatalog_table_create_info
        description: The table create info handle.
      index:
        type: idx
        description: The index of the constraint.
      sql:
        type: char
        indirection: 2
        const: true
        kind: OUT_BORROW
        description: Receives a borrowed pointer to the SQL of the constraint. Valid only for the duration of the callback.
      sql_length:
        type: idx
        indirection: 1
        kind: OUT
        description: Receives the length of `*sql` in bytes. `*sql` is not guaranteed to be null-terminated.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  vcatalog_table_create_set_table:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-10" ]
    description: |
      Reports the table the callback created.

      The table must have been built in the schema it is created in. It stays owned by the caller, which must keep it
      alive as the module notes describe. A callback that reports neither a table nor an error fails the statement.
    parameters:
      info:
        type: vcatalog_table_create_info
        description: The table create info handle.
      table:
        type: vcatalog_table
        description: The table created. Remains owned by the caller.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

