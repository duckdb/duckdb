    description: |
      Adds a schema to the listing.

      The schema must have been built in the database the listing runs on. It stays owned by the caller, which must
      keep it alive as the module notes describe. DuckDB visits the schemas in the order they were added, once the
      callback has returned; a schema added twice is visited once.
    parameters:
      info:
        type: vcatalog_schema_list_info
        description: The list info handle.
      schema:
        type: vcatalog_schema
        description: The schema to add. Remains owned by the caller.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  #---------------------------------------------------------------------------------------------------------------------
  # Table Builder
  #---------------------------------------------------------------------------------------------------------------------
  vcatalog_table_builder_create:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-10" ]
    description: |
      Creates a builder for a table of the schema.

      The builder starts out with the given name, no columns and no state. Configure it with
      `[[vcatalog_table_builder_add_column]]` and the setter functions, then build the table with
      `[[vcatalog_table_builder_build]]`. The caller owns the returned handle and must destroy it with
      `[[vcatalog_table_builder_destroy]]`, also after building, and before the schema.
    role: constructor
    belongs_to: vcatalog_table_builder
    parameters:
      schema:
        type: vcatalog_schema
        description: The schema to build the table in.
      name:
        type: char
        indirection: 1
        const: true
        kind: IN
        description: The name of the table. Borrowed and copied.
      name_length:
        type: idx
        description: The length of `name` in bytes. `name` must be valid UTF-8, need not be null-terminated, and may be NULL only when this is 0.
      builder:
        type: vcatalog_table_builder
        indirection: 1
        kind: OUT
        description: On success, receives the newly created builder. Owned by the caller.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  vcatalog_table_builder_destroy:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-10" ]
    description: |
      Destroys the table builder.

      The tables it built are not affected, and keep the state they share with it. Null-safe: passing a null pointer
      or null handle is a no-op. The handle is set to null on return to prevent double-destruction.
    parameters:
      builder:
        type: vcatalog_table_builder
        description: The builder to destroy.
        indirection: 1
    return_type: ERROR

  vcatalog_table_builder_add_column:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-10" ]
    description: |
      Appends a column to the table being built.

      Columns are numbered in the order they are added. Their names must be unique within the table, and their types
      fully defined. The name is borrowed and copied.
    parameters:
      builder:
        type: vcatalog_table_builder
        description: The builder to add the column to.
      name:
        type: char
        indirection: 1
        const: true
        kind: IN
        description: The name of the column. Borrowed and copied.
      name_length:
        type: idx
        description: The length of `name` in bytes. `name` must be valid UTF-8, need not be null-terminated, and may be NULL only when this is 0.
      type:
        type: logical_type
        description: The type of the column. Borrowed.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  vcatalog_table_builder_set_state:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-10" ]
    description: |
      Sets the implementation's own state of the table being built, retrievable from the table via
      `[[vcatalog_table_get_state]]`.

      DuckDB never reads the state itself. The builder shares it with every table it builds from now on. The opaque
      handle bundles the pointer with an optional destructor, invoked once the builder and every table sharing the
      state are destroyed. Calling this again replaces the state of the builder; tables it already built keep theirs.
    parameters:
      builder:
        type: vcatalog_table_builder
        description: The builder to set the state of.
      data:
        type: opaque
        indirection: 1
        description: Opaque handle bundling the state pointer plus an optional destructor.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  vcatalog_table_builder_set_scan_function:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-10" ]
    description: |
      Sets the table function the rows of the table being built are read with.

      A statement scanning the table runs the function as it would for a call of it: its init, exec, filter pushdown,
      stats, progress and partition callbacks are invoked as `[[table_function]]` describes, with the columns of the
      table as the declared columns. Its bind callback is not invoked, and need not be set: a scan is bound by the
      callback set via `[[vcatalog_table_builder_set_scan_bind_callback]]` instead, whose bind data the callbacks of
      the function receive. Its "get bind info" callback is not invoked either. A scan produces the columns of the
      table only: the table has no `rowid`.

      The function needs an exec callback and a signature without parameters, and must have been created through a
      factory of the instance the database is attached to. Its name is optional, and shown by `EXPLAIN`. The builder
      copies the function: changing or destroying the handle afterwards does not affect it. Calling this again
      replaces the previous function. A table built without one cannot be read: a statement that scans it fails.
    parameters:
      builder:
        type: vcatalog_table_builder
        description: The builder to set the scan function of.
      function:
        type: table_function
        description: The table function to scan the table with. Remains owned by the caller.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  vcatalog_table_builder_set_scan_bind_callback:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-10" ]
    description: |
      Sets the optional scan bind callback of the table being built, invoked whenever a statement binds a scan of the
      table: once for every reference to the table in the statement.

      The callback stands in for the bind callback of the scan function: it sets the bind data the other callbacks of
      the function receive, via `[[vcatalog_table_scan_bind_set_bind_data]]`, and may hint at the number of rows and
      the order of the scan. Without a scan bind callback, the scan has no bind data.
    parameters:
      builder:
        type: vcatalog_table_builder
        description: The builder to set the scan bind callback of.
      callback:
        type: vcatalog_table_scan_bind_callback
        description: The scan bind callback to set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  vcatalog_table_builder_build:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-10" ]
    description: |
      Builds a table.

      The table receives the name, the columns and the scan of the builder and shares its state. A table needs at
      least one column: building one without fails. Building a table does not make it visible: DuckDB only sees the tables the
      find and list callbacks hand it. The caller owns the returned handle and must destroy it with
      `[[vcatalog_table_destroy]]`, within the rules of the module notes, and before the schema.

      The builder stays usable, and changing it does not affect the tables it already built. Every table it builds is
      an entry of its own to DuckDB.
    role: constructor
    belongs_to: vcatalog_table
    parameters:
      builder:
        type: vcatalog_table_builder
        description: The builder to build a table from.
      table:
        type: vcatalog_table
        indirection: 1
        kind: OUT
        description: On success, receives the newly built table. Owned by the caller.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

