    return_type: ERROR

  vcatalog_schema_find_get_name:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-05" ]
    description: |
      Retrieves the name to resolve, as written in the statement. How it is matched against the schemas of the database
      is up to the vcatalog; DuckDB's own databases match names case-insensitively. The name is borrowed and valid
      only for the duration of the callback.
    parameters:
      info:
        type: vcatalog_schema_find_info
        description: The find info handle.
      name:
        type: char
        indirection: 2
        const: true
        kind: OUT_BORROW
        description: Receives a borrowed pointer to the name. Valid only for the duration of the callback.
      name_length:
        type: idx
        indirection: 1
        kind: OUT
        description: Receives the length of `*name` in bytes. `*name` is not guaranteed to be null-terminated.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  vcatalog_schema_find_set_schema:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-05" ]
    description: |
      Reports the schema the name refers to.

      The schema must have been built in the database the request is for. It stays owned by the caller, which must
      keep it alive as the module notes describe. Calling this again replaces the previous schema. If the callback
      reports none, no schema is found.
    parameters:
      info:
        type: vcatalog_schema_find_info
        description: The find info handle.
      schema:
        type: vcatalog_schema
        description: The schema the name resolves to. Remains owned by the caller.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

