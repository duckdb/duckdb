module: file system
#
# Access to the file system DuckDB itself reads and writes through, so an
# extension or embedder opens files the same way the engine does -- honouring
# whatever is configured, including virtual and remote file systems registered
# by other extensions.
#
# A file system is borrowed from a context or a connection and lives as long as
# that does. Files opened through it are owned by the caller.

#-----------------------------------------------------------------------------------------------------------------------
# Enums
#-----------------------------------------------------------------------------------------------------------------------
enums:
  FILE_FLAG:
    description: |
      How `[[file_system_open]]` opens a file. These are not a bitmask -- pass
      one array element per behaviour you want, e.g. `FILE_FLAG_WRITE` and
      `FILE_FLAG_CREATE` to write to a file and create it when it does not exist.
    values:
      FILE_FLAG_INVALID:
        value: 0
        description: Not a flag. The zero value, so that an uninitialized variable does not name a behaviour; passing it is an error.
      FILE_FLAG_READ:
        value: 1
        description: Open the file with "read" capabilities.
      FILE_FLAG_WRITE:
        value: 2
        description: Open the file with "write" capabilities.
      FILE_FLAG_CREATE:
        value: 3
        description: Create the file if it does not exist, and open it as it is if it does.
      FILE_FLAG_CREATE_NEW:
        value: 4
        description: Create the file if it does not exist, and truncate it to empty if it does. To fail instead of truncating, combine `FILE_FLAG_CREATE` with `FILE_FLAG_EXCLUSIVE_CREATE`.
      FILE_FLAG_APPEND:
        value: 5
        description: Open the file in "append" mode.
      FILE_FLAG_EXCLUSIVE_CREATE:
        value: 6
        description: Fail if the file already exists. A modifier on `FILE_FLAG_CREATE`, and meaningless without it.
      FILE_FLAG_PARALLEL_ACCESS:
        value: 7
        description: |
          The file will be read and written at explicit offsets from several threads at once. Pass it whenever
          `[[file_read_at]]` or `[[file_write_at]]` are used concurrently -- a file system that would otherwise
          assume sequential access, by caching, buffering, or keeping a single cursor, needs to know not to.
      FILE_FLAG_SHARED_LOCK:
        value: 8
        description: |
          Hold a shared lock on the file for as long as it is open: other shared holders may open it too, an
          exclusive holder may not. This is how the engine opens a database read-only. Advisory: a file system
          that can lock does so for the life of the file and releases it on close; one that cannot may still
          open the file. `FILE_FLAG_EXCLUSIVE_LOCK` wins when both are applied.
      FILE_FLAG_EXCLUSIVE_LOCK:
        value: 9
        description: |
          Hold an exclusive lock on the file for as long as it is open: no other holder, shared or exclusive,
          may open it. This is how the engine opens a database for writing, and every file it writes. Advisory,
          like `FILE_FLAG_SHARED_LOCK`; a file system that cannot lock is trusted to be the only writer.

  FILE_TYPE:
    description: |
      What a path refers to, as reported by a stat or list callback.
    values:
      FILE_TYPE_INVALID:
        value: 0
        description: Not a type. The zero value, so that an uninitialized variable does not name one; setting it is an error.
      FILE_TYPE_REGULAR:
        value: 1
        description: A regular file, which can be opened.
      FILE_TYPE_DIRECTORY:
        value: 2
        description: A directory, which can be listed.
      FILE_TYPE_PIPE:
        value: 3
        description: A pipe or other forward-only stream, which exists and can be opened but neither seeked nor listed. The engine asks for this before it writes a file, since it will not truncate a pipe.
      FILE_TYPE_OTHER:
        value: 4
        description: Something else that exists, such as a socket or a device. Neither a file nor a directory, so the engine treats the path as taken but unusable.

#-----------------------------------------------------------------------------------------------------------------------
# Handles
#-----------------------------------------------------------------------------------------------------------------------
handles:
  file_system:
    description: |
      A borrowed opaque handle to a file system. Obtained from
      `[[file_system_get_from_context]]` or `[[file_system_get_from_connection]]`, and used to open files with
      `[[file_system_open]]`. Borrowed: the handle belongs to the context or connection it came from, is valid only
      for as long as that is, and must not be destroyed.

  file:
    description: |
      An owned opaque handle to an open file, produced by `[[file_system_open]]` and destroyed with
      `[[file_destroy]]`. Read, write, seek and sync through the `file_*` functions. Only usable while the file
      system it was opened through is still valid.

  file_metadata:
    description: |
      An opaque handle to everything that travels with one file or directory: its type, and when known its size,
      modification time and version tag, plus any number of named values. It is the one such handle of the file
      system API, used wherever something is said about a file: the result of a stat, an entry of a listing, and
      what accompanies an open, in both directions. Produced owned by `[[file_metadata_create]]`,
      `[[file_system_stat]]` and `[[file_stat]]`, to be destroyed with `[[file_metadata_destroy]]`; handed out
      borrowed to a virtual file system's callbacks and by `[[file_listing_get_entry_metadata]]`, where it must
      not be destroyed. Read with the `file_metadata_get_*` functions, filled in with the `file_metadata_set_*`
      functions. Whether a named value is a fact about the file or a hint for opening it is up to the file system
      that handles the path.

  file_listing:
    description: |
      An opaque handle to the entries of one directory listing or glob expansion. Produced owned by
      `[[file_system_list]]` and `[[file_system_glob]]`, to be destroyed with `[[file_listing_destroy]]`; handed
      out borrowed to a virtual file system's "list" and "glob" callbacks, which fill it with
      `[[file_listing_add_entry]]`, where it must not be destroyed. Entries are read by index.

#-----------------------------------------------------------------------------------------------------------------------
# Functions
#-----------------------------------------------------------------------------------------------------------------------
functions:
  #---------------------------------------------------------------------------------------------------------------------
  # File System
  #---------------------------------------------------------------------------------------------------------------------
  file_system_get_from_context:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-09-02" ]
    description: |
      Borrows the file system of a context.

      Use this from inside a callback, where a context is in hand. The returned handle is borrowed: it is valid only
      for as long as the context is, and must not be destroyed.
    parameters:
      context:
        type: context
        description: The context to take the file system from.
      file_system:
        type: file_system
        indirection: 1
        kind: OUT
        description: Receives the borrowed file system.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  file_system_get_from_connection:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-09-02" ]
    description: |
      Borrows the file system of a connection.

      The connection form of `[[file_system_get_from_context]]`, for callers outside a callback. The returned handle
      is borrowed: it is valid only for as long as the connection is, and must not be destroyed.
    parameters:
      connection:
        type: connection
        description: The connection to take the file system from.
      file_system:
        type: file_system
        indirection: 1
        kind: OUT
        description: Receives the borrowed file system.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  file_system_open:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-09-02" ]
    description: |
      Opens a file.

      Opens the file at the given path through the file system, which routes it the way the engine would -- a path
      handled by a registered virtual or remote file system goes there rather than to local disk. The returned
      handle is owned by the caller and must be destroyed with `[[file_destroy]]`.

      The flags say how the file is opened, one array element per behaviour; see `[[FILE_FLAG]]`. At least one is
      required, since the flags are what say whether the file is being read or written, and passing the same flag
      twice is harmless. `FILE_FLAG_INVALID` names no behaviour and is rejected, as is any value that is not a
      `[[FILE_FLAG]]`.

      The optional metadata accompanies the open. It carries what is already known about the file, such as the
      metadata of the listing entry the path came from, so that the file system need not fetch it again, and any
      named values set with `[[file_metadata_set_value]]` as hints for whichever file system ends up handling the
      path. What a hint means is that file system's business: one it does not recognise is ignored rather than
      rejected. The metadata is borrowed for the call only, and can be reused or destroyed right after.

      Failure to open -- a missing file without `FILE_FLAG_CREATE`, insufficient permissions, an existing file
      under `FILE_FLAG_EXCLUSIVE_CREATE` -- is reported as an error. A missing file is reported as
      `ERROR_IO_FILE_NOT_FOUND`.

      Flag combinations that contradict each other, such as naming neither read nor write or combining
      `FILE_FLAG_CREATE` with `FILE_FLAG_CREATE_NEW`, are a programming error rather than a supported input. An
      assertion build catches them; elsewhere the behaviour is whatever the underlying file system does with them.
    parameters:
      file_system:
        type: file_system
        description: The file system to open the file through.
      file_path:
        type: str
        description: The path of the file to open. Borrowed for the call only.
      flags:
        type: FILE_FLAG
        const: true
        indirection: 1
        description: The flags to open the file with, `flag_count` of them. Borrowed for the call only.
      flag_count:
        type: idx
        description: The number of flags. At least one.
      metadata:
        type: file_metadata
        description: Optional. What is known about the file, and any hints for opening it. Borrowed for the call only.
      file:
        type: file
        indirection: 1
        kind: OUT
        description: On success, receives the open file. Owned by the caller; destroy via `[[file_destroy]]`.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  #---------------------------------------------------------------------------------------------------------------------
  # File
  #---------------------------------------------------------------------------------------------------------------------
  file_read:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-09-02" ]
    description: |
      Reads from the file into a caller-supplied buffer.

      Reads up to `buffer_size` bytes from the file's current position, advancing it by however many were read.
      Fewer bytes than asked for is normal at the end of the file, and zero means there is nothing left; neither is
      an error. The file must have been opened with `FILE_FLAG_READ`.

      Use `[[file_read_at]]` to read at an explicit offset instead, which leaves the position alone and so can run
      on several threads at once.
    parameters:
      file:
        type: file
        description: The file to read from.
      buffer:
        type: void
        indirection: 1
        description: A caller-owned buffer of at least `buffer_size` bytes, receiving what was read.
      buffer_size:
        type: idx
        description: The maximum number of bytes to read.
      bytes_read:
        type: idx
        indirection: 1
        kind: OUT
        description: Receives how many bytes were actually read, which may be fewer than `buffer_size` at the end of the file.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  file_write:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-09-02" ]
    description: |
      Writes a caller-supplied buffer to the file.

      Writes up to `buffer_size` bytes at the file's current position, advancing it by however many were written.
      The file must have been opened with `FILE_FLAG_WRITE` or `FILE_FLAG_APPEND`. Writes may be buffered; use
      `[[file_sync]]` to force them out.

      Use `[[file_write_at]]` to write at an explicit offset instead, which leaves the position alone and so can run
      on several threads at once.
    parameters:
      file:
        type: file
        description: The file to write to.
      buffer:
        type: void
        const: true
        indirection: 1
        description: A caller-owned buffer of at least `buffer_size` bytes, holding what to write.
      buffer_size:
        type: idx
        description: The number of bytes to write.
      bytes_written:
        type: idx
        indirection: 1
        kind: OUT
        description: Receives how many bytes were actually written.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  file_read_at:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-09-02" ]
    description: |
      Reads from a fixed offset, without moving the file's position.

      Reads up to `buffer_size` bytes starting at `location`. Like `[[file_read]]`, fewer bytes than asked for means
      the end of the file was reached, and zero means `location` is at or past it; neither is an error. Short of the
      end of the file the buffer is always filled. The file's read/write position is untouched, which is what makes
      this safe to call from several threads at once -- provided the file was opened with
      `FILE_FLAG_PARALLEL_ACCESS`.

      The file must have been opened with `FILE_FLAG_READ`.
    parameters:
      file:
        type: file
        description: The file to read from.
      buffer:
        type: void
        indirection: 1
        description: A caller-owned buffer of at least `buffer_size` bytes, receiving what was read.
      buffer_size:
        type: idx
        description: The maximum number of bytes to read.
      location:
        type: idx
        description: The absolute byte offset to read from, measured from the start of the file.
      bytes_read:
        type: idx
        indirection: 1
        kind: OUT
        description: Receives how many bytes were actually read, which is fewer than `buffer_size` only at the end of the file.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  file_write_at:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-09-02" ]
    description: |
      Writes at a fixed offset, without moving the file's position.

      Writes up to `buffer_size` bytes starting at `location`, extending the file when the offset is past its end,
      and reports how many were written, like `[[file_write]]`. The file's read/write position is untouched, which is what makes this safe to call from several threads at once --
      provided the file was opened with `FILE_FLAG_PARALLEL_ACCESS`, and that the threads write disjoint ranges.

      The file must have been opened with `FILE_FLAG_WRITE`. Writes may be buffered; use `[[file_sync]]` to force
      them out.
    parameters:
      file:
        type: file
        description: The file to write to.
      buffer:
        type: void
        const: true
        indirection: 1
        description: A caller-owned buffer of at least `buffer_size` bytes, holding what to write.
      buffer_size:
        type: idx
        description: The number of bytes to write.
      location:
        type: idx
        description: The absolute byte offset to write at, measured from the start of the file.
      bytes_written:
        type: idx
        indirection: 1
        kind: OUT
        description: Receives how many bytes were actually written.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  file_tell:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-09-02" ]
    description: Returns the file's current read/write position, as a byte offset from the start of the file.
    parameters:
      file:
        type: file
        description: The file to query.
      position:
        type: idx
        indirection: 1
        kind: OUT
        description: Receives the current position, as a byte offset from the start of the file.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  file_size:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-09-02" ]
    description: Returns the total size of the file in bytes.
    parameters:
      file:
        type: file
        description: The file to query.
      size:
        type: idx
        indirection: 1
        kind: OUT
        description: Receives the total size of the file in bytes.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  file_seek:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-09-02" ]
    description: |
      Moves the file's read/write position.

      Sets the position to an absolute byte offset from the start of the file; subsequent reads and writes start
      there. Seeking past the end is allowed, and reading from there yields nothing.
    parameters:
      file:
        type: file
        description: The file to seek within.
      position:
        type: idx
        description: The absolute byte offset to seek to, measured from the start of the file.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  file_sync:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-09-02" ]
    description: |
      Flushes buffered writes to persistent storage.

      Forces anything still buffered out to storage, which is what makes writes durable across a crash or a
      process exit. Closing or destroying the handle hands buffered writes to the file system but does not make
      them durable.
    parameters:
      file:
        type: file
        description: The file to synchronize.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  file_truncate:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-09-16" ]
    description: |
      Truncates the file to a size no larger than its current one.

      The file must have been opened with `FILE_FLAG_WRITE`. A file system that cannot truncate reports an error.
    parameters:
      file:
        type: file
        description: The file to truncate.
      size:
        type: idx
        description: The size to truncate the file to, in bytes.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  file_abort:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-09-16" ]
    description: |
      Abandons a file being written, without publishing what was written.

      Call it instead of `[[file_close]]` when a write fails part-way. A file system that publishes on close, such
      as an object store completing an upload, abandons the write instead, and the local file system removes a file
      it created under `FILE_FLAG_EXCLUSIVE_CREATE`. A file system with nothing to abandon closes the file as usual,
      and a partial file may be left behind. The handle is closed afterwards: it stays valid and must still be
      destroyed with `[[file_destroy]]`, but it can no longer read, write or seek.

      `[[file_destroy]]` on a file that was neither closed nor aborted closes it, which publishes it. A virtual
      file system that forwards to another file should therefore forward its "abort" callback here.
    parameters:
      file:
        type: file
        description: The file to abort.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  file_close:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-09-02" ]
    description: |
      Closes the file without destroying the handle.

      Releases the operating-system resources behind the file, such as its descriptor. The handle itself stays
      valid and must still be destroyed with `[[file_destroy]]`, but it can no longer read, write or seek.
    parameters:
      file:
        type: file
        description: The file to close.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  #---------------------------------------------------------------------------------------------------------------------
  # File System: paths
  #---------------------------------------------------------------------------------------------------------------------
  file_system_stat:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-09-16" ]
    description: |
      Reports what is known about a path, without opening it.

      Routed to whichever file system handles the path. A path with nothing there is a result rather than an
      error: `exists` is `false` and no metadata is produced. Otherwise the type is always answered: a regular
      file, a directory, a pipe or something else. Size, modification time and version tag are filled in as far as
      the file system knows them by path; each getter reports whether its field is known. The local file system
      answers all of them from one system call, and a virtual file system answers whatever its path-level "stat"
      callback reports.
    parameters:
      file_system:
        type: file_system
        description: The file system to ask.
      path:
        type: str
        description: The path to report on. Borrowed for the call only.
      metadata:
        type: file_metadata
        indirection: 1
        kind: OUT
        description: On success, receives the metadata, or null when the path does not exist. Owned by the caller; destroy via `[[file_metadata_destroy]]`.
      exists:
        type: bool
        indirection: 1
        kind: OUT
        description: Receives whether the path exists.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  file_system_list:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-09-16" ]
    description: |
      Lists the entries of a directory.

      Each entry is the name of a file or subdirectory relative to the directory, with whatever the file
      system already knew about it. A directory the file system knows does not exist is reported as
      `ERROR_IO_FILE_NOT_FOUND`. A file system without directories, such as an object store, cannot tell a missing
      directory from an empty one and yields an empty listing.
    parameters:
      file_system:
        type: file_system
        description: The file system to act through.
      path:
        type: str
        description: The directory to list. Borrowed for the call only.
      listing:
        type: file_listing
        indirection: 1
        kind: OUT
        description: On success, receives the listing. Owned by the caller; destroy via `[[file_listing_destroy]]`.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  file_system_glob:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-09-16" ]
    description: |
      Expands a glob pattern to the files matching it.

      Each entry is the full path of a matching file. A pattern that matches nothing yields an empty listing,
      which is a result rather than an error; a plain path yields itself when it exists.
    parameters:
      file_system:
        type: file_system
        description: The file system to act through.
      pattern:
        type: str
        description: The pattern to expand. Borrowed for the call only.
      listing:
        type: file_listing
        indirection: 1
        kind: OUT
        description: On success, receives the matching files. Owned by the caller; destroy via `[[file_listing_destroy]]`.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  file_system_remove_file:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-09-16" ]
    description: |
      Removes a file. A missing file is reported as `ERROR_IO_FILE_NOT_FOUND`.
    parameters:
      file_system:
        type: file_system
        description: The file system to act through.
      path:
        type: str
        description: The path of the file to remove. Borrowed for the call only.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  file_system_create_directory:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-09-16" ]
    description: |
      Creates a directory, including any missing parents. Neither an existing directory nor a missing parent is an
      error.
    parameters:
      file_system:
        type: file_system
        description: The file system to act through.
      path:
        type: str
        description: The path of the directory to create. Borrowed for the call only.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  file_system_remove_directory:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-09-16" ]
    description: |
      Removes a directory and everything inside it. A directory the file system knows does not exist is reported
      as `ERROR_IO_FILE_NOT_FOUND`. A file system without directories, such as an object store, cannot tell a
      missing directory from an empty one and succeeds.
    parameters:
      file_system:
        type: file_system
        description: The file system to act through.
      path:
        type: str
        description: The path of the directory to remove. Borrowed for the call only.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  file_system_move:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-09-16" ]
    description: |
      Moves a file, replacing any existing target.

      Routed by the source: the target has to be on the same file system as the source, and a move across
      file systems is an error. A missing source is an error, which a virtual file system reports as
      `ERROR_IO_FILE_NOT_FOUND`.
    parameters:
      file_system:
        type: file_system
        description: The file system to act through.
      source:
        type: str
        description: The path of the file to move. Borrowed for the call only.
      target:
        type: str
        description: The path to move it to. Borrowed for the call only.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  #---------------------------------------------------------------------------------------------------------------------
  # File Metadata
  #---------------------------------------------------------------------------------------------------------------------
  file_metadata_create:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-09-16" ]
    description: |
      Creates empty metadata, to accompany an open.

      Nothing is known yet: fill in hints with `[[file_metadata_set_value]]`, or what is already known about the
      file with the other setters, and pass it to `[[file_system_open]]`. The caller owns the returned handle and
      must destroy it with `[[file_metadata_destroy]]`.
    parameters:
      metadata:
        type: file_metadata
        indirection: 1
        kind: OUT
        description: On success, receives the new metadata. Owned by the caller; destroy via `[[file_metadata_destroy]]`.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  file_stat:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-09-16" ]
    description: |
      Reports what is known about an open file: its size, and when the file system knows them, its
      modification time and version tag.
    parameters:
      file:
        type: file
        description: The file to report on.
      metadata:
        type: file_metadata
        indirection: 1
        kind: OUT
        description: On success, receives the metadata. Owned by the caller; destroy via `[[file_metadata_destroy]]`.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  file_metadata_get_type:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-09-16" ]
    description: |
      Reads what the path refers to. A type that was never set reads as a regular file.
    parameters:
      metadata:
        type: file_metadata
        description: The metadata to read.
      type:
        type: FILE_TYPE
        indirection: 1
        kind: OUT
        description: Receives the type.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  file_metadata_get_size:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-09-16" ]
    description: |
      Reads the size of the file in bytes, and whether one is known at all.
    parameters:
      metadata:
        type: file_metadata
        description: The metadata to read.
      size:
        type: idx
        indirection: 1
        kind: OUT
        description: Receives the size, or zero when none is known.
      is_known:
        type: bool
        indirection: 1
        kind: OUT
        description: Receives whether a size is known.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  file_metadata_get_last_modified:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-09-16" ]
    description: |
      Reads when the file was last modified, and whether that is known at all.
    parameters:
      metadata:
        type: file_metadata
        description: The metadata to read.
      last_modified:
        type: i64
        indirection: 1
        kind: OUT
        description: Receives the modification time in microseconds since 1970-01-01 UTC, or zero when none is known.
      is_known:
        type: bool
        indirection: 1
        kind: OUT
        description: Receives whether a modification time is known.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  file_metadata_get_version_tag:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-09-16" ]
    description: |
      Reads the tag that identifies this version of the file's contents, and whether one is known at all. Borrowed; valid as long as the metadata is.
    parameters:
      metadata:
        type: file_metadata
        description: The metadata to read.
      version_tag:
        type: str
        indirection: 1
        kind: OUT
        description: Receives the borrowed tag, or the empty view when none is known.
      is_known:
        type: bool
        indirection: 1
        kind: OUT
        description: Receives whether a version tag is known.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  file_metadata_get_value:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-09-16" ]
    description: |
      Retrieves a named value of the metadata.

      Named values are whatever travels with a file besides its typed fields: what a file system reported about
      it, what a virtual file system attached to a listing entry, and in an "open" callback also the hints the
      caller of `[[file_system_open]]` set. Their meaning is up to the file system that handles the file. Names
      are case-sensitive, except those of the options the engine itself knows, such as `force_full_download`. A
      name with no value is not an error, and null is returned. The typed fields are not
      reachable by name. The returned value is owned by the caller and must be destroyed via `[[value_destroy]]`.
    parameters:
      metadata:
        type: file_metadata
        description: The metadata to read.
      name:
        type: str
        description: The name of the value. Borrowed for the call only.
      value:
        type: value
        indirection: 1
        kind: OUT
        description: Receives the value, or null if there is none under that name. Owned by the caller; destroy via `[[value_destroy]]`.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  file_metadata_set_value:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-09-16" ]
    description: |
      Attaches a named value to the metadata.

      This is how a caller hands a hint to the file system that opens a file, and how a virtual file system carries
      something of its own from a listing to the open of a listed file, such as an object's generation: set on the
      entry's metadata in the "glob" callback, it is there again in the metadata of the "open" callback when the
      engine opens that entry. The name and the value are borrowed and
      copied. Setting the same name again replaces the previous value. Names are case-sensitive and values are kept
      as given, except for the options the engine itself knows, such as `force_full_download`: those are matched
      without regard to case, and their value is cast to the type the engine reads it as, which fails for a value
      that cannot be. The names `type`, `file_size`, `last_modified` and `etag` belong to the typed fields and are
      rejected.
    parameters:
      metadata:
        type: file_metadata
        description: The metadata to set the value on.
      name:
        type: str
        description: The name of the value. Borrowed and copied.
      value:
        type: value
        description: The value. Borrowed and copied.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  file_metadata_copy:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-09-16" ]
    description: |
      Replaces everything the target holds with a copy of what the source holds.

      The type, size, modification time, version tag and every named value are copied, including values the caller
      knows nothing about. This is how a virtual file system that wraps another passes on what that one reported,
      from its "stat", "list" and "glob" callbacks alike.
    parameters:
      target:
        type: file_metadata
        description: The metadata to fill in.
      source:
        type: file_metadata
        description: The metadata to copy. Borrowed.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  file_metadata_set_type:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-09-16" ]
    description: |
      Sets what the path refers to.

      From either "stat" callback of a virtual file system, a path or file whose type is never set is a regular
      file. From the file-level "stat" callback, `FILE_TYPE_PIPE` makes the engine treat the open file as a pipe,
      and anything else as a regular file. On a listing entry it replaces the type the entry was added with.
      `FILE_TYPE_INVALID` is rejected, as is any value that is not a `[[FILE_TYPE]]`.
    parameters:
      metadata:
        type: file_metadata
        description: The metadata to fill in.
      type:
        type: FILE_TYPE
        description: The type to report.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  file_metadata_set_size:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-09-16" ]
    description: |
      Sets the size of the file in bytes. Meaningful for regular files only.
    parameters:
      metadata:
        type: file_metadata
        description: The metadata to fill in.
      size:
        type: idx
        description: The size of the file in bytes.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  file_metadata_set_last_modified:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-09-16" ]
    description: |
      Sets when the file was last modified.

      Optional. Together with the version tag, this is what lets the engine cache a file's contents across
      queries and tell when they went stale; a file that reports neither is never cached.
    parameters:
      metadata:
        type: file_metadata
        description: The metadata to fill in.
      last_modified:
        type: i64
        description: The modification time, in microseconds since 1970-01-01 UTC.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  file_metadata_set_version_tag:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-09-16" ]
    description: |
      Sets the tag that identifies this version of the file's contents, such as an HTTP ETag.

      Optional. A tag that changes whenever the contents do is the most reliable way for the engine to
      validate what it cached from the file. The tag is borrowed and copied.
    parameters:
      metadata:
        type: file_metadata
        description: The metadata to fill in.
      version_tag:
        type: str
        description: The version tag. Borrowed and copied.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  file_metadata_destroy:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-09-16" ]
    description: |
      Destroys metadata the caller owns, releasing its resources.

      Only for metadata produced by `[[file_metadata_create]]`, `[[file_system_stat]]` and `[[file_stat]]`; a borrowed one must not be
      passed here. Null-safe: passing a null pointer or null handle is a no-op. The handle is set to null on
      return to prevent double-destruction.
    parameters:
      metadata:
        type: file_metadata
        description: The metadata to destroy.
        indirection: 1
    return_type: ERROR

  #---------------------------------------------------------------------------------------------------------------------
  # File Listing
  #---------------------------------------------------------------------------------------------------------------------
  file_listing_add_entry:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-09-16" ]
    description: |
      Adds one entry to a listing being filled in by a virtual file system.

      What the path means depends on which callback is filling the listing, and matches what
      `[[file_system_list]]` and `[[file_system_glob]]` hand to their callers. From the "list" callback it is the
      entry's name relative to the directory listed, which the caller joins onto that directory. From the "glob"
      callback it is the full path of a matching file, which the engine opens as given, since the matches of one
      pattern can lie in different directories. The path is borrowed and copied. Entries are reported in the order
      they are added.

      The returned metadata is for filling in what the listing already knows about the entry, such as its size,
      modification time and version tag; the engine hands those back when it opens the entry, so the file
      system need not fetch them again. It is borrowed and valid until the callback returns. Pass null to skip
      it.
    parameters:
      listing:
        type: file_listing
        description: The listing to add to.
      path:
        type: str
        description: The name or path of the entry. Borrowed and copied.
      type:
        type: FILE_TYPE
        description: What the entry is. From the "list" callback, whatever the entry is. From the "glob" callback every entry is a file the engine will open, so `FILE_TYPE_REGULAR`, or `FILE_TYPE_PIPE` for a stream.
      metadata:
        type: file_metadata
        indirection: 1
        kind: OUT
        description: Optional. Receives the borrowed metadata of the new entry, to fill in what is known about it. Valid until the callback returns.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  file_listing_get_entry_count:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-09-16" ]
    description: |
      Returns how many entries the listing has. Valid indices for the entry getters are [0, count).
    parameters:
      listing:
        type: file_listing
        description: The listing to read.
      count:
        type: idx
        indirection: 1
        kind: OUT
        description: Receives the number of entries.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  file_listing_get_entry_path:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-09-16" ]
    description: |
      Retrieves the path of an entry: a name relative to the listed directory for a listing, a full path for a
      glob. Fails if the index is out of bounds. Borrowed; valid as long as the listing is.
    parameters:
      listing:
        type: file_listing
        description: The listing to read.
      index:
        type: idx
        description: The index of the entry.
      path:
        type: str
        indirection: 1
        kind: OUT
        description: Receives the borrowed path.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  file_listing_get_entry_type:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-09-16" ]
    description: |
      Retrieves what an entry is. Fails if the index is out of bounds.
    parameters:
      listing:
        type: file_listing
        description: The listing to read.
      index:
        type: idx
        description: The index of the entry.
      type:
        type: FILE_TYPE
        indirection: 1
        kind: OUT
        description: Receives the type.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  file_listing_get_entry_metadata:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-09-16" ]
    description: |
      Retrieves what the listing knows about an entry. Fails if the index is out of bounds. Borrowed; valid as
      long as the listing is, and must not be destroyed. It can be passed to `[[file_system_open]]` as it is to open
      the entry, and the owner of the listing may first set hints of its own on it with
      `[[file_metadata_set_value]]`.
    parameters:
      listing:
        type: file_listing
        description: The listing to read.
      index:
        type: idx
        description: The index of the entry.
      metadata:
        type: file_metadata
        indirection: 1
        kind: OUT
        description: Receives the borrowed metadata.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  file_listing_destroy:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-09-16" ]
    description: |
      Destroys a listing the caller owns, releasing its resources.

      Only for listings produced by `[[file_system_list]]` and `[[file_system_glob]]`; a borrowed one must not
      be passed here. Null-safe: passing a null pointer or null handle is a no-op. The handle is set to null on
      return to prevent double-destruction.
    parameters:
      listing:
        type: file_listing
        description: The listing to destroy.
        indirection: 1
    return_type: ERROR

  #---------------------------------------------------------------------------------------------------------------------
  # Destroy
  #---------------------------------------------------------------------------------------------------------------------
  file_destroy:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-09-02" ]
    description: |
      Destroys the file, closing it if it is still open.

      Null-safe: passing a null pointer or null handle is a no-op. The handle is set to null on return to prevent
      double-destruction.
    parameters:
      file:
        type: file
        description: The file to destroy.
        indirection: 1
    return_type: ERROR
