module: virtual file system
#
# User-defined file systems: callbacks the engine routes file operations to for the paths they
# claim. The model the callbacks share, positional versus cursor I/O and who owns the cursor, the
# callback groups and their info handles, how absence is reported, lifetimes, delegation and routing,
# is documented on the `vfs` handle, so that it reaches the generated header.

#-----------------------------------------------------------------------------------------------------------------------
# Enums
#-----------------------------------------------------------------------------------------------------------------------
enums:
  FILE_PROPERTY:
    description: |
      A property of an open file, reported by the "open" callback via `[[vfs_open_request_set_property]]`.
      Only properties that cannot be inferred from the callbacks the file system sets are reported this way.
    values:
      FILE_PROPERTY_INVALID:
        value: 0
        description: The zero value, which is not a valid property, so that an uninitialized variable does not accidentally name one. Setting it is an error.
      FILE_PROPERTY_IS_SEEKABLE:
        value: 1
        description: |
          Whether the file's cursor can be moved to an arbitrary position. It defaults to true. Set it to false for
          a file that can only be read forward, such as a stream. The engine then reads it sequentially through the
          cursor and avoids readers that need to seek. Reporting false from a file system that leaves the cursor to
          the engine makes the open fail, since the engine's own cursor is a position in the file.
      FILE_PROPERTY_IS_ON_DISK:
        value: 2
        description: |
          Whether the file is a plain file on local disk, where random reads are cheap. It defaults to false, which
          is the right choice for anything remote or synthesized. The engine then prefers larger sequential reads
          and caches what it reads when the file can be validated.

#-----------------------------------------------------------------------------------------------------------------------
# Handles
#-----------------------------------------------------------------------------------------------------------------------
handles:
  vfs:
    description: |
      An owned opaque handle to a virtual file system being built. Created with
      `[[vfs_create_with_connection]]` or `[[vfs_create_with_extension]]`,
      configured with the setter functions (e.g. `[[vfs_set_name]]`,
      `[[vfs_add_prefix]]`, `[[vfs_set_file_open_callback]]`, etc.), made available with
      `[[vfs_register]]`, and destroyed with `[[vfs_destroy]]`.

      A "virtual file system" is a set of callbacks that DuckDB can invoke when performing different file system 
      operations, instead of its own built-in file system routines. This is useful for implementing file systems that 
      DuckDB does not support natively, such as object stores, encrypted file systems, or other custom storage backends.
      
      In order to determine which file system to use when e.g. attempting to open a file at a specific path, DuckDB will 
      probe each virtual file system in registration order. Each (virtual) file system can then "claim" the path either 
      by prefix (`[[vfs_add_prefix]]`) or by inspecting through a "claim" callback 
      (`[[vfs_set_claim_callback]]`), The last registered virtual file system whose prefix matches the 
      path, or claims the path through the callback will be selected to handle that operation. If no virtual file system 
      matches or claims a path, DuckDB will fall back to its built-in file system instead, which will likely throw an error.
      
      Once a file system is registered, everything in DuckDB that reads or writes files (`read_parquet`, `read_csv`, 
      `COPY TO`, `ATTACH`, ...) can make use of it.

      DuckDB reads and writes files in two ways, either through "positional" or "cursor"-based operations. 
      Positional reads and writes (`read_at`, `write_at`) pass an absolute byte offset with every call, like `pread` and 
      `pwrite`, and never touch the file's cursor. On a file opened with `FILE_FLAG_PARALLEL_ACCESS` they may run from 
      several threads at once. 
      
      Cursor-based reads and writes (`read`, `write`) start at the file's cursor and advance it past the bytes 
      transferred, like a POSIX file descriptor's offset. `seek` moves the cursor and `tell` reports where it is. Cursor 
      operations never run concurrently on the same file.

      The cursor-based callbacks are optional. A file system that sets none of `read`, `write`, `seek` and `tell` only
      needs `read_at` and/or `write_at`, and DuckDB will then emulate a cursor per file itself and serve `read`,
      `write`, `seek` and `tell` through the positional callbacks. However, a file system that sets any of these four is 
      expected to "own" the cursor instead, and must then also provide `tell`, `read` if it has `read_at`, and `write` 
      if it has `write_at`. `seek` is only needed for files that are seekable. A file that cannot seek, such as a 
      stream, can not have an emulated cursor and can therefore only be served by a file system that implements the 
      cursor-based callbacks itself.

      Callbacks come in two groups. File system callbacks (`claim`, `stat`, `list`, `glob`, `remove_file`,
      `create_directory`, `remove_directory`, `move`) operate on a path. File callbacks (`open`, `close`, `abort`,
      `read_at`, `write_at`, `read`, `write`, `seek`, `tell`, `stat`, `sync`, `truncate`) operate on one file: "open"
      produces it from a path, the others act on what it produced. Every callback receives a borrowed request
      handle for the file system operation as its first argument. `claim`, `open` and the path callbacks receive
      the path as a plain argument next to it, `open` the open request after that, and the other file callbacks
      the per-file state. The file system's user data is reachable from the request; a file callback finds what
      it needs in the per-file state the "open" callback attached.

      A missing path is reported differently depending on the kind of operation. File system queries report it through 
      their result, so the file system `stat` leaves the metadata untouched, and `list` and `glob` add no entries. 
      `open` and every mutating operation report it as `ERROR_IO_FILE_NOT_FOUND`.

      Open-file attempts, and other file-system level operations may run concurrently, and `claim` can be called from
      any thread as soon as `register` returns.
      
      The file level operations never run concurrently with `close` or `abort` (or after either of them have been called
      ) on the same file. Similarly, the individual file's "data" destructor will run after either `close` or `abort` 
      have been called.
      
      A file system can delegate to other file systems. The file system operation info handle has a
      `get_file_system` function that returns the engine's file system, which is also reachable through a
      context, and `[[vfs_open_request_get_options]]` turns an open request into options for 
      `[[file_system_open]]`. This is how an overlay (caching, encryption, logging, ...) file system can open the 
      underlying file with exactly the flags and values it was given. An overlay should claim paths of its own, 
      typically its own URI scheme, and map them onto the paths of the file system it wraps, since a path the overlay 
      itself claims would be routed back into itself recursively.

      A virtual file system registration lasts for the life of the database instance, like an extension load, and its 
      name stays taken.

  vfs_info:
    description: |
      A borrowed opaque handle to one file system operation, passed to every callback: to "claim" and the path
      callbacks next to the path, to "open" next to the path and the open request, and to the file callbacks next to
      the per-file state. It provides access to the file system's user data, to the engine's file system for
      delegation, and to the context of the query performing the operation when there is one. Anything a file
      callback needs about its file -- the path, the flags -- the "open" callback stashes in the per-file state.

  vfs_open_request:
    description: |
      A borrowed opaque handle to one open request, passed to the "open" callback after the file system operation
      and the path. The callback can use it to e.g. inspect the flags of the file being opened, read the options the
      caller attached to the open, report properties of the file, and attach the per-file state that the file
      callbacks receive. The context of the query opening it comes from the file system operation next to it.

#-----------------------------------------------------------------------------------------------------------------------
# Callbacks
#-----------------------------------------------------------------------------------------------------------------------
callbacks:
  vfs_claim_callback:
    description: |
      Decides whether a path belongs to this file system.

      This callback is optional, since most file systems claim their paths by prefix with
      `[[vfs_add_prefix]]`. When set, the engine calls it for every path it touches that no prefix
      claimed, from any thread, before any other callback. Reporting `false` lets other file systems, and finally
      the local one, claim the path instead.
    parameters:
      info:
        type: vfs_info
        description: Borrowed opaque handle providing access to the information available to the callback.
      path:
        type: str
        description: The path to decide on. Borrowed for the duration of the callback.
      claim:
        type: bool
        indirection: 1
        kind: OUT
        description: Receives whether this file system handles the path. Starts out `false`.
      err:
        type: error_info
        indirection: 1
        description: Borrowed error info handle to use to report errors that occur during the callback.
    return_type: void

  vfs_file_open_callback:
    description: |
      Opens a file.

      The flags and options of the request are read from `open_info`, and the context of the query opening
      the file from `info`. On success the callback attaches
      per-file state via `[[vfs_open_request_set_file_data]]`, which every per-file callback then receives,
      and reports any property of the file via `[[vfs_open_request_set_property]]`. A file opened with
      `FILE_FLAG_APPEND` starts with its cursor at the end.

      A failed open reports the reason through `err`. State attached before the failure is destroyed. Report a
      missing file as `ERROR_IO_FILE_NOT_FOUND`, which lets the engine give a precise error message, and lets
      callers that asked for it receive a null file instead of an error.
    parameters:
      info:
        type: vfs_info
        description: Borrowed opaque handle to the file system operation. Valid only for the duration of the callback.
      path:
        type: str
        description: The path of the file to open. Borrowed for the duration of the callback.
      open_info:
        type: vfs_open_request
        description: Borrowed opaque handle to the open request. Valid only for the duration of the callback.
      err:
        type: error_info
        indirection: 1
        description: Borrowed error info handle to use to report errors that occur during the callback.
    return_type: void

  vfs_file_close_callback:
    description: |
      Closes a file.

      The engine calls it once when it closes a file, before the file data's destructor. This is the place to
      release operating-system resources and, for a written file, to publish it. An object store would complete its
      upload here, for example. A file opened for writing is always synced before it is closed. A file system whose
      per-file state needs no such step can leave this unset and rely on the destructor alone.

      If a file is destroyed without having been closed, which happens when an error unwinds past a writer, it is
      aborted instead if it was opened for writing and an "abort" callback is set. Otherwise it is closed here, and
      any error reported is dropped, since there is nothing left to raise it to.
    parameters:
      info:
        type: vfs_info
        description: Borrowed opaque handle to the file system operation. Valid only for the duration of the callback.
      file:
        type: void
        indirection: 1
        description: The per-file state the "open" callback attached with `[[vfs_open_request_set_file_data]]`. Never null.
      err:
        type: error_info
        indirection: 1
        description: Borrowed error info handle to use to report errors that occur during the callback.
    return_type: void

  vfs_file_abort_callback:
    description: |
      Abandons a file being written, without publishing what was written.

      The engine calls it instead of a normal close when a write fails part-way, for instance when `COPY` is
      interrupted, when a wrapper around the file fails to initialize, or when an error unwinds past a writer and
      the file is destroyed without being closed. An object store would abandon its upload here. The file data's
      destructor still runs afterwards. Without this callback the engine closes the file as usual, and a partial
      file may be left behind.
    parameters:
      info:
        type: vfs_info
        description: Borrowed opaque handle to the file system operation. Valid only for the duration of the callback.
      file:
        type: void
        indirection: 1
        description: The per-file state the "open" callback attached with `[[vfs_open_request_set_file_data]]`. Never null.
      err:
        type: error_info
        indirection: 1
        description: Borrowed error info handle to use to report errors that occur during the callback.
    return_type: void

  vfs_file_read_at_callback:
    description: |
      Reads at a fixed offset.

      Fills the buffer with up to `buffer_size` bytes starting at `location`, and reports how many were read.
      Reading fewer bytes than asked for is allowed, and the engine calls again for the rest. Zero means the offset
      is at or past the end of the file, which is also how the engine detects the end of a file whose cursor it
      keeps itself. The read never moves the cursor, like `pread`. It may be called from several threads at once on
      a file opened with `FILE_FLAG_PARALLEL_ACCESS`.
    parameters:
      info:
        type: vfs_info
        description: Borrowed opaque handle to the file system operation. Valid only for the duration of the callback.
      file:
        type: void
        indirection: 1
        description: The per-file state the "open" callback attached with `[[vfs_open_request_set_file_data]]`. Never null.
      buffer:
        type: void
        indirection: 1
        description: An engine-owned buffer of `buffer_size` bytes to fill. Valid only for the duration of the callback.
      buffer_size:
        type: idx
        description: The maximum number of bytes to read.
      location:
        type: idx
        description: The absolute byte offset to read from, measured from the start of the file.
      bytes_read:
        type: idx
        indirection: 1
        kind: OUT
        description: Receives how many bytes were read. Starts out zero, which reports the end of the file.
      err:
        type: error_info
        indirection: 1
        description: Borrowed error info handle to use to report errors that occur during the callback.
    return_type: void

  vfs_file_write_at_callback:
    description: |
      Writes at a fixed offset.

      Writes all `buffer_size` bytes starting at `location`, extending the file if the offset is past its end. A
      partial write is an error and must be reported as one. The write never moves the cursor, like `pwrite`, and
      writes at `location` even on a file opened with `FILE_FLAG_APPEND`. It may be called from several threads at
      once on a file opened with `FILE_FLAG_PARALLEL_ACCESS`, always for disjoint ranges.
    parameters:
      info:
        type: vfs_info
        description: Borrowed opaque handle to the file system operation. Valid only for the duration of the callback.
      file:
        type: void
        indirection: 1
        description: The per-file state the "open" callback attached with `[[vfs_open_request_set_file_data]]`. Never null.
      buffer:
        type: void
        const: true
        indirection: 1
        description: An engine-owned buffer of `buffer_size` bytes to write. Valid only for the duration of the callback.
      buffer_size:
        type: idx
        description: The number of bytes to write. All of them, or the call fails.
      location:
        type: idx
        description: The absolute byte offset to write at, measured from the start of the file.
      err:
        type: error_info
        indirection: 1
        description: Borrowed error info handle to use to report errors that occur during the callback.
    return_type: void

  vfs_file_read_callback:
    description: |
      Reads from the cursor.

      Reads up to `buffer_size` bytes from the cursor, advancing it by however many were read. Reading fewer bytes
      than asked for is normal at the end of the file, and zero means there is nothing left. It is never called
      concurrently on the same file, although positional reads may run alongside it on a file opened with
      `FILE_FLAG_PARALLEL_ACCESS`.
    parameters:
      info:
        type: vfs_info
        description: Borrowed opaque handle to the file system operation. Valid only for the duration of the callback.
      file:
        type: void
        indirection: 1
        description: The per-file state the "open" callback attached with `[[vfs_open_request_set_file_data]]`. Never null.
      buffer:
        type: void
        indirection: 1
        description: An engine-owned buffer of `buffer_size` bytes to fill. Valid only for the duration of the callback.
      buffer_size:
        type: idx
        description: The maximum number of bytes to read.
      bytes_read:
        type: idx
        indirection: 1
        kind: OUT
        description: Receives how many bytes were read, which may be fewer than `buffer_size` at the end of the file. Starts out zero.
      err:
        type: error_info
        indirection: 1
        description: Borrowed error info handle to use to report errors that occur during the callback.
    return_type: void

  vfs_file_write_callback:
    description: |
      Writes at the cursor.

      Writes all `buffer_size` bytes at the cursor, advancing it past them. A partial write is an error and must be
      reported as one. It is never called concurrently on the same file.
    parameters:
      info:
        type: vfs_info
        description: Borrowed opaque handle to the file system operation. Valid only for the duration of the callback.
      file:
        type: void
        indirection: 1
        description: The per-file state the "open" callback attached with `[[vfs_open_request_set_file_data]]`. Never null.
      buffer:
        type: void
        const: true
        indirection: 1
        description: An engine-owned buffer of `buffer_size` bytes to write. Valid only for the duration of the callback.
      buffer_size:
        type: idx
        description: The number of bytes to write. All of them, or the call fails.
      err:
        type: error_info
        indirection: 1
        description: Borrowed error info handle to use to report errors that occur during the callback.
    return_type: void

  vfs_file_seek_callback:
    description: |
      Moves the cursor.

      Sets the position the next cursor read or write starts from, as an absolute byte offset. Seeking past the end
      is allowed. It is never called on a file that reported `FILE_PROPERTY_IS_SEEKABLE` as false.
    parameters:
      info:
        type: vfs_info
        description: Borrowed opaque handle to the file system operation. Valid only for the duration of the callback.
      file:
        type: void
        indirection: 1
        description: The per-file state the "open" callback attached with `[[vfs_open_request_set_file_data]]`. Never null.
      position:
        type: idx
        description: The absolute byte offset to move the cursor to, measured from the start of the file.
      err:
        type: error_info
        indirection: 1
        description: Borrowed error info handle to use to report errors that occur during the callback.
    return_type: void

  vfs_file_tell_callback:
    description: Reports the cursor's position, as an absolute byte offset from the start of the file.
    parameters:
      info:
        type: vfs_info
        description: Borrowed opaque handle to the file system operation. Valid only for the duration of the callback.
      file:
        type: void
        indirection: 1
        description: The per-file state the "open" callback attached with `[[vfs_open_request_set_file_data]]`. Never null.
      position:
        type: idx
        indirection: 1
        kind: OUT
        description: Receives the current position, as a byte offset from the start of the file.
      err:
        type: error_info
        indirection: 1
        description: Borrowed error info handle to use to report errors that occur during the callback.
    return_type: void

  vfs_file_stat_callback:
    description: |
      Reports what is known about an open file.

      Fills in `metadata` with the file's size and, when known, its modification time and version tag. The last two
      let the engine cache the file's contents across queries and know when to invalidate them. A file whose size is
      unknown, such as a forward-only stream, leaves the size unset. The engine then finds the end by reading, and
      readers that need the size up front reject the file. Setting the type to `FILE_TYPE_PIPE` tells the engine to
      read the file as a pipe, and any other type means a regular file. The engine calls this whenever it needs the
      size, so it should be cheap. For a file opened for reading, return what was learned at open time.
    parameters:
      info:
        type: vfs_info
        description: Borrowed opaque handle to the file system operation. Valid only for the duration of the callback.
      file:
        type: void
        indirection: 1
        description: The per-file state the "open" callback attached with `[[vfs_open_request_set_file_data]]`. Never null.
      metadata:
        type: file_metadata
        description: Borrowed opaque handle to fill in. Valid only for the duration of the callback.
      err:
        type: error_info
        indirection: 1
        description: Borrowed error info handle to use to report errors that occur during the callback.
    return_type: void

  vfs_file_sync_callback:
    description: |
      Flushes buffered writes to persistent storage.

      The engine calls it when it needs written data to be durable, and before it closes a written file. A file
      system that leaves it unset is assumed to make every write durable immediately.
    parameters:
      info:
        type: vfs_info
        description: Borrowed opaque handle to the file system operation. Valid only for the duration of the callback.
      file:
        type: void
        indirection: 1
        description: The per-file state the "open" callback attached with `[[vfs_open_request_set_file_data]]`. Never null.
      err:
        type: error_info
        indirection: 1
        description: Borrowed error info handle to use to report errors that occur during the callback.
    return_type: void

  vfs_file_truncate_callback:
    description: |
      Truncates an open file to a size no larger than its current one.

      Only database and write-ahead-log files are truncated, so a file system that only serves data files can leave
      this unset.
    parameters:
      info:
        type: vfs_info
        description: Borrowed opaque handle to the file system operation. Valid only for the duration of the callback.
      file:
        type: void
        indirection: 1
        description: The per-file state the "open" callback attached with `[[vfs_open_request_set_file_data]]`. Never null.
      size:
        type: idx
        description: The size to truncate the file to, in bytes.
      err:
        type: error_info
        indirection: 1
        description: Borrowed error info handle to use to report errors that occur during the callback.
    return_type: void

  vfs_stat_callback:
    description: |
      Reports what is known about a path, without opening it.

      Fills in `metadata` with the type of the path and, for a regular file, whatever else is known. Size,
      modification time and version tag are all optional, and what is filled in is what `[[file_system_stat]]`
      reports for the path. Leaving `metadata` untouched means the path does not exist, which is not an error. The
      engine uses this to check whether a file or directory exists before creating or overwriting it, whether it is
      about to write to a pipe, and to learn a file's size without opening it. If this callback is unset, the engine
      opens the file to find out instead.
    parameters:
      info:
        type: vfs_info
        description: Borrowed opaque handle to the file system operation. Valid only for the duration of the callback.
      path:
        type: str
        description: The path to report on. Borrowed for the duration of the callback.
      metadata:
        type: file_metadata
        description: Borrowed opaque handle to fill in. Valid only for the duration of the callback.
      err:
        type: error_info
        indirection: 1
        description: Borrowed error info handle to use to report errors that occur during the callback.
    return_type: void

  vfs_list_callback:
    description: |
      Lists the entries of a directory.

      Adds one entry per file and subdirectory directly inside the path with `[[file_listing_add_entry]]`, by name
      relative to the path, along with whatever metadata is already known about each.
    parameters:
      info:
        type: vfs_info
        description: Borrowed opaque handle to the file system operation. Valid only for the duration of the callback.
      path:
        type: str
        description: The directory to list. Borrowed for the duration of the callback.
      list_info:
        type: file_listing
        description: Borrowed opaque handle to add entries to. Valid only for the duration of the callback.
      err:
        type: error_info
        indirection: 1
        description: Borrowed error info handle to use to report errors that occur during the callback.
    return_type: void

  vfs_glob_callback:
    description: |
      Expands a glob pattern to the files matching it.

      This callback is optional. Without it, a path containing glob characters is an error, and any other path names
      exactly that file. With it, every path the engine reads goes through this callback, whether it contains glob
      characters or not, so a plain path that exists must be added as its own single match. The engine passes
      patterns through as written. The built-in file systems support `*`, `?` and `[...]` within a path component
      and `**` for any number of directories, so a backend that does the same behaves consistently with them. Adds
      the full path of each matching file with `[[file_listing_add_entry]]`. A pattern that matches nothing adds
      nothing, which is not an error.
    parameters:
      info:
        type: vfs_info
        description: Borrowed opaque handle to the file system operation. Valid only for the duration of the callback.
      pattern:
        type: str
        description: The pattern to expand. Borrowed for the duration of the callback.
      list_info:
        type: file_listing
        description: Borrowed opaque handle to add the matching files to. Valid only for the duration of the callback.
      err:
        type: error_info
        indirection: 1
        description: Borrowed error info handle to use to report errors that occur during the callback.
    return_type: void

  vfs_remove_file_callback:
    description: |
      Removes a file.

      The engine calls it when it overwrites or cleans up a file it wrote. Report a missing file as
      `ERROR_IO_FILE_NOT_FOUND`, and the engine then treats it as "nothing to remove" where that is fine, and as an
      error where it is not.
    parameters:
      info:
        type: vfs_info
        description: Borrowed opaque handle to the file system operation. Valid only for the duration of the callback.
      path:
        type: str
        description: The path of the file to remove. Borrowed for the duration of the callback.
      err:
        type: error_info
        indirection: 1
        description: Borrowed error info handle to use to report errors that occur during the callback.
    return_type: void

  vfs_create_directory_callback:
    description: |
      Creates a directory, including any missing parents.

      The engine calls it when it writes partitioned output or exports a database. An existing directory is not an
      error. A backend without directories, such as an object store, can make this a no-op.
    parameters:
      info:
        type: vfs_info
        description: Borrowed opaque handle to the file system operation. Valid only for the duration of the callback.
      path:
        type: str
        description: The path of the directory to create. Borrowed for the duration of the callback.
      err:
        type: error_info
        indirection: 1
        description: Borrowed error info handle to use to report errors that occur during the callback.
    return_type: void

  vfs_remove_directory_callback:
    description: Removes a directory and everything inside it. The engine calls it when it overwrites partitioned output.
    parameters:
      info:
        type: vfs_info
        description: Borrowed opaque handle to the file system operation. Valid only for the duration of the callback.
      path:
        type: str
        description: The path of the directory to remove. Borrowed for the duration of the callback.
      err:
        type: error_info
        indirection: 1
        description: Borrowed error info handle to use to report errors that occur during the callback.
    return_type: void

  vfs_move_callback:
    description: |
      Moves a file, replacing any existing target.

      Both paths belong to this file system, since a move to a path it does not claim is rejected before the
      callback is reached. The engine calls it when it renames a file it wrote under a temporary name into its final
      place, so it should be atomic where the backend allows it.
    parameters:
      info:
        type: vfs_info
        description: Borrowed opaque handle to the file system operation. Valid only for the duration of the callback.
      source:
        type: str
        description: The path of the file to move. Borrowed for the duration of the callback.
      target:
        type: str
        description: The path to move it to. Borrowed for the duration of the callback.
      err:
        type: error_info
        indirection: 1
        description: Borrowed error info handle to use to report errors that occur during the callback.
    return_type: void

#-----------------------------------------------------------------------------------------------------------------------
# Functions
#-----------------------------------------------------------------------------------------------------------------------
functions:
  #---------------------------------------------------------------------------------------------------------------------
  # Constructors
  #---------------------------------------------------------------------------------------------------------------------
  vfs_create_with_connection:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-09-16" ]
    description: |
      Creates a new virtual file system that will be registered on the connection's database.

      The file system starts out empty: configure it with the setter functions (e.g.
      `[[vfs_set_name]]`, `[[vfs_add_prefix]]`,
      `[[vfs_set_file_open_callback]]`, etc.), then make it available with
      `[[vfs_register]]`. The caller owns the returned handle and must destroy it with
      `[[vfs_destroy]]`, also after registration.
    parameters:
      connection:
        type: connection
        description: The connection whose database the file system is created for.
      file_system:
        type: vfs
        indirection: 1
        kind: OUT
        description: On success, receives the newly created virtual file system. Owned by the caller.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  vfs_create_with_extension:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-09-16" ]
    description: |
      Creates a new virtual file system that will be registered on the loading extension's database.

      Use this from an extension load callback, where an extension handle is available. The file system starts out
      empty: configure it with the setter functions (e.g. `[[vfs_set_name]]`,
      `[[vfs_add_prefix]]`, `[[vfs_set_file_open_callback]]`, etc.), then make it
      available with `[[vfs_register]]`. The caller owns the returned handle and must destroy it
      with `[[vfs_destroy]]`, also after registration.
    parameters:
      extension:
        type: extension
        description: The extension whose database the file system is created for.
      file_system:
        type: vfs
        indirection: 1
        kind: OUT
        description: On success, receives the newly created virtual file system. Owned by the caller.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  #---------------------------------------------------------------------------------------------------------------------
  # Properties
  #---------------------------------------------------------------------------------------------------------------------
  vfs_set_name:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-09-16" ]
    description: |
      Sets the name of the virtual file system.

      The name identifies the file system in error messages and in the `disabled_filesystems` setting, and must be
      unique among the file systems registered on a database. The name is borrowed and copied. Calling this again
      replaces the previous name. A name must be set before registration.
    parameters:
      file_system:
        type: vfs
        description: The file system to set the name of.
      name:
        type: str
        description: The name to set. Borrowed and copied.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  vfs_add_prefix:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-09-16" ]
    description: |
      Claims every path starting with a prefix for the virtual file system.

      The prefix is typically a URI scheme such as `s3://`. Prefixes are compared byte for byte and require no call
      into the file system. A path that none of the prefixes match is passed to the "claim" callback, if one is set.
      Any number of prefixes can be added. The prefix is borrowed and copied. Registration requires at least one
      prefix or a "claim" callback.

      When several registered file systems claim a path, the most recently registered one handles it, whether it
      claimed the path by prefix or by callback. A file system the embedder installed explicitly through the C++ API
      takes precedence over all of them.
    parameters:
      file_system:
        type: vfs
        description: The file system to add the prefix to.
      prefix:
        type: str
        description: The prefix to claim. Borrowed and copied.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  vfs_set_user_data:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-09-16" ]
    description: |
      Sets arbitrary user data on the virtual file system.

      Associates an opaque pointer with the file system, retrievable from every callback via
      `[[vfs_info_get_user_data]]` and its siblings. The opaque handle bundles the pointer with an
      optional destructor, invoked once the data is no longer needed, which is when the handle is destroyed if it
      was never registered, and otherwise when the database closes. Callbacks may run from several threads at once,
      so the data must be safe to share between them.
    parameters:
      file_system:
        type: vfs
        description: The file system to set the user data of.
      data:
        type: opaque
        indirection: 1
        description: Opaque handle bundling the user data pointer plus an optional destructor.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  #---------------------------------------------------------------------------------------------------------------------
  # Callbacks: routing and file lifecycle
  #---------------------------------------------------------------------------------------------------------------------
  vfs_set_claim_callback:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-09-16" ]
    description: |
      Sets the optional "claim" callback of the virtual file system.

      The callback decides which paths the file system claims in addition to its prefixes. See
      `[[vfs_claim_callback]]`.
    parameters:
      file_system:
        type: vfs
        description: The file system to set the callback of.
      callback:
        type: vfs_claim_callback
        description: The callback to set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  vfs_set_file_open_callback:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-09-16" ]
    description: |
      Sets the "open" callback of the virtual file system.

      The callback opens a file and attaches its per-file state. See `[[vfs_file_open_callback]]`. It
      must be set before registration.
    parameters:
      file_system:
        type: vfs
        description: The file system to set the callback of.
      callback:
        type: vfs_file_open_callback
        description: The callback to set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  vfs_set_file_close_callback:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-09-16" ]
    description: |
      Sets the optional "close" callback of the virtual file system.

      The callback is called once when the engine closes a file, before the file data's destructor. See
      `[[vfs_file_close_callback]]`.
    parameters:
      file_system:
        type: vfs
        description: The file system to set the callback of.
      callback:
        type: vfs_file_close_callback
        description: The callback to set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  vfs_set_file_abort_callback:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-09-16" ]
    description: |
      Sets the optional "abort" callback of the virtual file system.

      The callback abandons a file whose write failed part-way, without publishing it. See
      `[[vfs_file_abort_callback]]`.
    parameters:
      file_system:
        type: vfs
        description: The file system to set the callback of.
      callback:
        type: vfs_file_abort_callback
        description: The callback to set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  #---------------------------------------------------------------------------------------------------------------------
  # Callbacks: I/O
  #---------------------------------------------------------------------------------------------------------------------
  vfs_set_file_read_at_callback:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-09-16" ]
    description: |
      Sets the "read at" callback of the virtual file system.

      The callback reads at an explicit offset. See `[[vfs_file_read_at_callback]]`. It must be set before
      registration unless the file system is a write-only sink.
    parameters:
      file_system:
        type: vfs
        description: The file system to set the callback of.
      callback:
        type: vfs_file_read_at_callback
        description: The callback to set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  vfs_set_file_write_at_callback:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-09-16" ]
    description: |
      Sets the optional "write at" callback of the virtual file system.

      The callback writes at an explicit offset. See `[[vfs_file_write_at_callback]]`. It is required for files
      opened for writing with `FILE_FLAG_PARALLEL_ACCESS`, which is how database files are written. Data files
      written by `COPY` go through the cursor instead. Without it and without a "write" callback the file system is
      read-only, and opening a file for writing fails.
    parameters:
      file_system:
        type: vfs
        description: The file system to set the callback of.
      callback:
        type: vfs_file_write_at_callback
        description: The callback to set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  vfs_set_file_read_callback:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-09-16" ]
    description: |
      Sets the optional "read" callback of the virtual file system.

      The callback reads from the cursor. See `[[vfs_file_read_callback]]`. Setting it makes the file system the
      owner of the cursor, which then also requires "tell", "write" if it has "write at", and "seek" for any file
      that reports `FILE_PROPERTY_IS_SEEKABLE` as true. Without it, and without any other cursor callback, the
      engine keeps the cursor itself and serves cursor reads through "read at".
    parameters:
      file_system:
        type: vfs
        description: The file system to set the callback of.
      callback:
        type: vfs_file_read_callback
        description: The callback to set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  vfs_set_file_write_callback:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-09-16" ]
    description: |
      Sets the optional "write" callback of the virtual file system.

      The callback writes at the cursor. See `[[vfs_file_write_callback]]`. This is how `COPY` writes data
      files, so a backend that can only append, such as an object store, implements this one. Setting it makes the
      file system the owner of the cursor, which then also requires "tell", and "read" if it has "read at". A
      write-only sink needs neither. Without it, cursor writes are served through "write at" if the engine keeps the
      cursor, and fail if the file system owns it.
    parameters:
      file_system:
        type: vfs
        description: The file system to set the callback of.
      callback:
        type: vfs_file_write_callback
        description: The callback to set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  vfs_set_file_seek_callback:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-09-16" ]
    description: |
      Sets the optional "seek" callback of the virtual file system.

      The callback moves the cursor. See `[[vfs_file_seek_callback]]`. Only a file system that owns the cursor
      needs it, and only for files that report `FILE_PROPERTY_IS_SEEKABLE` as true, since the engine seeks those. If
      the file system owns the cursor and the engine seeks a file without this callback, the seek fails.
    parameters:
      file_system:
        type: vfs
        description: The file system to set the callback of.
      callback:
        type: vfs_file_seek_callback
        description: The callback to set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  vfs_set_file_tell_callback:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-09-16" ]
    description: |
      Sets the optional "tell" callback of the virtual file system.

      The callback reports the cursor's position. See `[[vfs_file_tell_callback]]`. It is required whenever the
      file system owns the cursor, since the engine asks for the position of every file it writes through the
      cursor.
    parameters:
      file_system:
        type: vfs
        description: The file system to set the callback of.
      callback:
        type: vfs_file_tell_callback
        description: The callback to set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  vfs_set_file_stat_callback:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-09-16" ]
    description: |
      Sets the file "stat" callback of the virtual file system.

      The callback reports the size of an open file and, when known, its modification time and version tag. See
      `[[vfs_file_stat_callback]]`. It must be set before registration.
    parameters:
      file_system:
        type: vfs
        description: The file system to set the callback of.
      callback:
        type: vfs_file_stat_callback
        description: The callback to set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  vfs_set_file_sync_callback:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-09-16" ]
    description: |
      Sets the optional "sync" callback of the virtual file system.

      The callback flushes buffered writes. See `[[vfs_file_sync_callback]]`.
    parameters:
      file_system:
        type: vfs
        description: The file system to set the callback of.
      callback:
        type: vfs_file_sync_callback
        description: The callback to set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  vfs_set_file_truncate_callback:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-09-16" ]
    description: |
      Sets the optional "truncate" callback of the virtual file system.

      The callback shrinks an open file. See `[[vfs_file_truncate_callback]]`.
    parameters:
      file_system:
        type: vfs
        description: The file system to set the callback of.
      callback:
        type: vfs_file_truncate_callback
        description: The callback to set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  #---------------------------------------------------------------------------------------------------------------------
  # Callbacks: paths
  #---------------------------------------------------------------------------------------------------------------------
  vfs_set_stat_callback:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-09-16" ]
    description: |
      Sets the optional file system "stat" callback of the virtual file system.

      The callback reports what is known about a path. See `[[vfs_stat_callback]]`. Without it, the
      engine cannot check whether a path exists, which it needs to do before writing, and has to open a file to
      learn its size.
    parameters:
      file_system:
        type: vfs
        description: The file system to set the callback of.
      callback:
        type: vfs_stat_callback
        description: The callback to set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  vfs_set_list_callback:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-09-16" ]
    description: |
      Sets the optional "list" callback of the virtual file system.

      The callback lists a directory. See `[[vfs_list_callback]]`.
    parameters:
      file_system:
        type: vfs
        description: The file system to set the callback of.
      callback:
        type: vfs_list_callback
        description: The callback to set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  vfs_set_glob_callback:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-09-16" ]
    description: |
      Sets the optional "glob" callback of the virtual file system.

      The callback expands a glob pattern. See `[[vfs_glob_callback]]`. Without it, only paths
      without glob characters can be read.
    parameters:
      file_system:
        type: vfs
        description: The file system to set the callback of.
      callback:
        type: vfs_glob_callback
        description: The callback to set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  vfs_set_remove_file_callback:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-09-16" ]
    description: |
      Sets the optional "remove file" callback of the virtual file system.

      The callback removes a file. See `[[vfs_remove_file_callback]]`. It is needed to overwrite
      files.
    parameters:
      file_system:
        type: vfs
        description: The file system to set the callback of.
      callback:
        type: vfs_remove_file_callback
        description: The callback to set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  vfs_set_create_directory_callback:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-09-16" ]
    description: |
      Sets the optional "create directory" callback of the virtual file system.

      The callback creates a directory. See `[[vfs_create_directory_callback]]`. It is needed to
      write partitioned output.
    parameters:
      file_system:
        type: vfs
        description: The file system to set the callback of.
      callback:
        type: vfs_create_directory_callback
        description: The callback to set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  vfs_set_remove_directory_callback:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-09-16" ]
    description: |
      Sets the optional "remove directory" callback of the virtual file system.

      The callback removes a directory tree. See `[[vfs_remove_directory_callback]]`. It is needed
      to overwrite partitioned output.
    parameters:
      file_system:
        type: vfs
        description: The file system to set the callback of.
      callback:
        type: vfs_remove_directory_callback
        description: The callback to set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  vfs_set_move_callback:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-09-16" ]
    description: |
      Sets the optional "move" callback of the virtual file system.

      The callback moves a file. See `[[vfs_move_callback]]`. It is needed by writers that produce a
      file under a temporary name and rename it into place.
    parameters:
      file_system:
        type: vfs
        description: The file system to set the callback of.
      callback:
        type: vfs_move_callback
        description: The callback to set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  #---------------------------------------------------------------------------------------------------------------------
  # Callback Functions: file system
  #---------------------------------------------------------------------------------------------------------------------
  vfs_open_request_get_flags:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-09-17" ]
    description: |
      Lists the flags the file is being opened with.

      The complete list, in `[[FILE_FLAG]]` order, so a file system can walk it and refuse an open carrying a
      flag it does not know rather than silently ignoring it; a flag added in a later version shows up here.
      `FILE_FLAG_READ` and `FILE_FLAG_WRITE` say what the engine will do with the file, `FILE_FLAG_CREATE`,
      `FILE_FLAG_CREATE_NEW`, `FILE_FLAG_EXCLUSIVE_CREATE` and `FILE_FLAG_APPEND` how a written file is to be
      created, `FILE_FLAG_PARALLEL_ACCESS` that the file will be read and written at explicit offsets from several
      threads at once, and `FILE_FLAG_SHARED_LOCK` or `FILE_FLAG_EXCLUSIVE_LOCK` that the engine wants the file
      locked for as long as it is open, which a file system that can lock should honour.
      Borrowed and valid only for the duration of the callback.
    parameters:
      info:
        type: vfs_open_request
        description: The open info handle.
      flags:
        type: FILE_FLAG
        const: true
        indirection: 2
        kind: OUT
        description: Receives the flags, borrowed from the open request. Valid only for the duration of the callback.
      count:
        type: idx
        indirection: 1
        kind: OUT
        description: Receives the number of flags.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  vfs_open_request_get_value:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-09-16" ]
    description: |
      Retrieves a named value attached to the open request.

      These are the values the caller attached with `[[file_open_options_set_value]]`, and their meaning is up to
      this file system. Metadata that a listing of this file system reported about the file is read through
      `[[vfs_open_request_get_metadata]]` instead. Names are case-sensitive. A name with no value is not an
      error, and null is returned. The returned value is owned by the caller and must be destroyed via
      `[[value_destroy]]`.
    parameters:
      info:
        type: vfs_open_request
        description: The open info handle.
      name:
        type: str
        description: The name of the value. Borrowed for the call only.
      value:
        type: value
        indirection: 1
        kind: OUT
        description: Receives the value, or null if none was attached under that name. Owned by the caller; destroy via `[[value_destroy]]`.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  vfs_open_request_get_metadata:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-09-16" ]
    description: |
      Retrieves what a listing of this file system reported about the file being opened.

      When the file was found through the "glob" callback, whatever that callback filled in about the entry (size,
      modification time, version tag) is returned here, so the backend does not need to fetch it again. Read it with
      `[[file_metadata_get_size]]` and its siblings, each of which reports whether its field is known. Borrowed and
      valid only for the duration of the callback, and must not be destroyed.
    parameters:
      info:
        type: vfs_open_request
        description: The open info handle.
      metadata:
        type: file_metadata
        indirection: 1
        kind: OUT
        description: Receives the borrowed metadata info, empty when no listing reported anything.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  vfs_open_request_get_options:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-09-16" ]
    description: |
      Copies the open request into options for `[[file_system_open]]`.

      The flags and every attached value of the request are copied into a fresh set of open options, so an overlay
      can open the underlying file, typically under a rewritten path, exactly as it was asked to open this one. The
      options can be adjusted with the usual setters first. They are owned by the caller and must be destroyed with
      `[[file_open_options_destroy]]`.
    parameters:
      info:
        type: vfs_open_request
        description: The open info handle.
      options:
        type: file_open_options
        indirection: 1
        kind: OUT
        description: Receives the new options. Owned by the caller; destroy via `[[file_open_options_destroy]]`.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  vfs_open_request_set_file_data:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-09-16" ]
    description: |
      Attaches the per-file state of the file being opened.

      The state is passed to every file callback as its `file` argument, and is all a file callback receives about
      the file, so it is required: an "open" callback that returns without attaching it, or attaches a null
      pointer, fails the open. The opaque handle
      bundles the pointer with an optional destructor, invoked after the "close" or "abort" callback once the engine
      is done with the file, or right away if the open fails. Calling this again destroys the previous state and
      replaces it.
    parameters:
      info:
        type: vfs_open_request
        description: The open info handle.
      data:
        type: opaque
        indirection: 1
        description: Opaque handle bundling the per-file state pointer plus an optional destructor.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  vfs_open_request_set_property:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-09-16" ]
    description: |
      Reports a property of the file being opened.

      See `[[FILE_PROPERTY]]` for the properties and their defaults. Properties are reported per open because one
      file system may serve different kinds of files, such as a seekable object next to a forward-only stream.
      `FILE_PROPERTY_INVALID` is rejected, as is any value that is not a `[[FILE_PROPERTY]]`.
    parameters:
      info:
        type: vfs_open_request
        description: The open info handle.
      property:
        type: FILE_PROPERTY
        description: The property to report.
      value:
        type: bool
        description: The value of the property for this file.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  #---------------------------------------------------------------------------------------------------------------------
  # Callback Functions: open file
  #---------------------------------------------------------------------------------------------------------------------
  vfs_info_get_user_data:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-09-16" ]
    description: Retrieves the user data set via `[[vfs_set_user_data]]`.
    parameters:
      info:
        type: vfs_info
        description: The file system info handle.
      data:
        type: void
        indirection: 2
        kind: OUT
        description: Receives the user data pointer, or null if none was set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  vfs_info_get_file_system:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-09-16" ]
    description: |
      Borrows the file system of the database this file system is registered on, to delegate to whichever file
      system claims another path.

      It carries the database's settings and secrets but no query state, so a callback that has a context available
      should prefer `[[file_system_get_from_context]]`, which carries both. A request for a path this file system
      claims routes back into its own callbacks. It is borrowed, valid for as long as the registered file system is,
      and must not be destroyed.
    parameters:
      info:
        type: vfs_info
        description: The file system info handle.
      file_system:
        type: file_system
        indirection: 1
        kind: OUT
        description: Receives the borrowed file system.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  vfs_info_try_get_context:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-09-16" ]
    description: |
      Retrieves the context of the query performing the operation, if there is one.

      The context is how a backend reaches a query's settings and secrets. Operations that happen outside a query
      return null.

      Always null in the file callbacks: the engine does not yet pass a context to individual file operations.
    parameters:
      info:
        type: vfs_info
        description: The file system info handle.
      context:
        type: context
        indirection: 1
        kind: OUT
        description: Receives the borrowed context, or null if the operation happens outside a query or is a file callback.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  #---------------------------------------------------------------------------------------------------------------------
  # Register
  #---------------------------------------------------------------------------------------------------------------------
  vfs_register:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-09-16" ]
    description: |
      Registers the virtual file system, making the paths it claims readable and writable by the engine.

      The file system is registered on the database given at creation, the connection's or the loading extension's.
      Registration requires a name that is not already taken, at least one prefix or a "claim" callback, the "open"
      and file "stat" callbacks, and "read at" unless the file system is a write-only sink with a "write" or "write
      at" callback. A file system that owns the cursor by setting any of "read", "write", "seek" or "tell" must also
      set "tell", "read" if it has "read at", and "write" if it has "write at". Every other callback is optional,
      and its absence is only reported as an error when the engine needs it.

      Registration copies the configuration, so destroying the handle afterwards or calling its setters again does
      not affect the registered file system, and registering the same handle again registers a second, independent
      file system. When several registered file systems claim a path, the most recently registered one handles it.
      Once registered, a file system stays until the database closes.
    parameters:
      file_system:
        type: vfs
        description: The file system to register.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  #---------------------------------------------------------------------------------------------------------------------
  # Destroy
  #---------------------------------------------------------------------------------------------------------------------
  vfs_destroy:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-09-16" ]
    description: |
      Destroys the virtual file system builder, releasing its resources.

      Null-safe: passing a null pointer or null handle is a no-op. The handle is set to null on return to prevent
      double-destruction. Destroying the handle after registration does not affect the registered file system.
    parameters:
      file_system:
        type: vfs
        description: The file system to destroy.
        indirection: 1
    return_type: ERROR
