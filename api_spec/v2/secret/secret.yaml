module: secret
#
# Secrets: named, scoped sets of key/value pairs (credentials, endpoints, tokens) that `CREATE SECRET` stores and DuckDB
# resolves by path. This module lets code of your own define a kind of secret and read the secrets that exist.
#
# Defining a kind of secret takes two pieces. A secret type, built with `[[secret_type_create]]`, gives the kind a name,
# a default provider and the keys whose values must never be displayed. A secret function, built with
# `[[secret_function_create]]`, is one provider of a type: it declares the named parameters `CREATE SECRET` accepts and
# a create callback that turns them into the secret. Both are registered on an instance, after which
# `CREATE SECRET (TYPE <type>, PROVIDER <provider>, ...)` works like it does for the secrets DuckDB ships.
#
# A secret created by the create callback is a key/value secret: its keys are identifiers and its values are values of
# any type, including nested ones. It is stored, persisted, listed and dropped by DuckDB like any other secret, and a
# persisted one is read back as a key/value secret again. Custom secret *storages* are not part of this API.
#
# Reading a secret is done through a context, as the secret manager keeps its state per transaction: look up the best
# secret for a path and a type with `[[context_lookup_secret]]` or a secret by name with `[[context_get_secret_by_name]]`,
# list them with `[[context_list_secrets]]`, and read a value with `[[secret_get_value]]`. A lookup returns a snapshot:
# a secret that is dropped or replaced afterwards does not change the handle already returned.
#
# Combining a secret with a setting, e.g. "the key `region` of the secret, else the option `s3_region`", is up to the
# caller: read the secret with this module and the option with `[[config_get_option_value]]`.
#
# Registration is not transactional: a registered secret type or function is visible to every connection at once, is
# not undone by a rollback, and lives for as long as the instance does.

#-----------------------------------------------------------------------------------------------------------------------
# Enums
#-----------------------------------------------------------------------------------------------------------------------
enums:
  SECRET_PERSIST_TYPE:
    description: Where a secret lives, as the `PERSISTENT` and `TEMPORARY` keywords of `CREATE SECRET` choose it.
    # The values match duckdb::SecretPersistType
    values:
      SECRET_PERSIST_TYPE_DEFAULT:
        value: 0
        description: Leave the choice to DuckDB, which follows the `secret_directory`-related settings and defaults to temporary.
      SECRET_PERSIST_TYPE_TEMPORARY:
        value: 1
        description: Kept in memory for the lifetime of the instance.
      SECRET_PERSIST_TYPE_PERSISTENT:
        value: 2
        description: Written to disk, so that it is available again in later sessions.
      SECRET_PERSIST_TYPE_TRANSACTION:
        value: 3
        description: |
          Kept in memory for the lifetime of the current transaction only. For credentials a catalog hands out with
          a query, which must not outlive it.

  SECRET_ON_CONFLICT:
    description: What creating a secret does when a secret of the same name already exists.
    # The values match the first three duckdb::OnCreateConflict values
    values:
      SECRET_ON_CONFLICT_ERROR:
        value: 0
        description: Fail, as a plain `CREATE SECRET` does.
      SECRET_ON_CONFLICT_IGNORE:
        value: 1
        description: Keep the existing secret and succeed, as `CREATE SECRET IF NOT EXISTS` does.
      SECRET_ON_CONFLICT_REPLACE:
        value: 2
        description: Replace the existing secret, as `CREATE OR REPLACE SECRET` does.

#-----------------------------------------------------------------------------------------------------------------------
# Handles
#-----------------------------------------------------------------------------------------------------------------------
handles:
  secret_type:
    description: |
      An owned opaque handle to a secret type being built. Created with `[[secret_type_create]]`, configured with
      `[[secret_type_set_name]]`, `[[secret_type_set_default_provider]]` and `[[secret_type_add_redacted_key]]`, made
      available with `[[connection_register_secret_type]]` or `[[extension_register_secret_type]]`, and destroyed with
      `[[secret_type_destroy]]`.

  secret_function:
    description: |
      An owned opaque handle to a secret function being built: one provider of a secret type. Created with
      `[[secret_function_create]]`, configured with the setters (e.g. `[[secret_function_set_provider]]`,
      `[[secret_function_add_named_parameter]]`, `[[secret_function_set_create_callback]]`), made available with
      `[[connection_register_secret_function]]` or `[[extension_register_secret_function]]`, and destroyed with
      `[[secret_function_destroy]]`.

  secret_create_input:
    description: |
      A description of a secret to create: its type, provider, name, scope, storage and the options that were given.
      It has two origins. The create callback of a secret function receives a borrowed one, describing the
      `CREATE SECRET` statement being run: valid only for the duration of the callback, read-only. One of your own is
      built with `[[secret_create_input_create]]`, filled in with the setters and handed to `[[context_create_secret]]`;
      the caller owns it and destroys it with `[[secret_create_input_destroy]]`. The getters work on both.

  secret_builder:
    description: |
      A borrowed opaque handle to the secret being built, received by the create callback of a secret function and
      valid only for the duration of that call. Fill it with `[[secret_builder_set_value]]`, mark the sensitive keys
      with `[[secret_builder_add_redacted_key]]` and, if the scope the user gave is not the one wanted, change it with
      `[[secret_builder_clear_scope]]` and `[[secret_builder_add_scope]]`. Its type, provider and name come from the
      create input and cannot be changed.

  secret:
    description: |
      An owned opaque handle to a snapshot of a key/value secret, as returned by `[[context_lookup_secret]]`,
      `[[context_get_secret_by_name]]`, `[[secret_list_get_secret]]` and `[[context_create_secret]]`. Read it with the
      `secret_get_*` getters and destroy it with `[[secret_destroy]]`.

  secret_list:
    description: |
      An owned opaque handle to the secrets visible to a context at the time of `[[context_list_secrets]]`. Read it
      with `[[secret_list_get_count]]` and `[[secret_list_get_secret]]`, and destroy it with `[[secret_list_destroy]]`.

#-----------------------------------------------------------------------------------------------------------------------
# Callbacks
#-----------------------------------------------------------------------------------------------------------------------
callbacks:
  secret_create_callback:
    parameters:
      input:
        type: secret_create_input
        description: |
          Borrowed handle describing the secret to create: its type, provider, name, scope and the options the user
          gave, each already cast to the type its named parameter declares. Also gives access to the user data.
      builder:
        type: secret_builder
        description: |
          Borrowed handle to fill with the secret. It starts out with the scope of the input and no values. When the
          callback returns without an error, the secret is stored; the values it holds must be set by then.
      context:
        type: context
        description: |
          Borrowed handle to the context running `CREATE SECRET`, e.g. to read files or settings the secret is
          derived from.
      err:
        type: error_info
        indirection: 1
        description: |
          Borrowed error info handle to use to report errors that occur during the callback. Reporting an error fails
          the `CREATE SECRET` and creates no secret.
    return_type: void

#-----------------------------------------------------------------------------------------------------------------------
# Functions
#-----------------------------------------------------------------------------------------------------------------------
functions:

  #---------------------------------------------------------------------------------------------------------------------
  # Secret type
  #---------------------------------------------------------------------------------------------------------------------

  secret_type_create:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Creates a new secret type through a factory.

      The type starts out empty: configure it with the setters, then make it available with
      `[[connection_register_secret_type]]` or `[[extension_register_secret_type]]`. The caller owns the returned
      handle and must destroy it with `[[secret_type_destroy]]`, also after registration.

      The type can only be registered on the instance the factory belongs to.
    role: constructor
    belongs_to: secret_type
    parameters:
      factory:
        type: factory
        description: The factory to create the secret type through.
      type:
        type: secret_type
        indirection: 1
        kind: OUT
        description: On success, receives the newly created secret type. Owned by the caller.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  secret_type_set_name:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Sets the name of the secret type, as `CREATE SECRET (TYPE ...)` refers to it and as it is passed to
      `[[context_lookup_secret]]`.

      The name is borrowed and copied. Calling this again replaces the previous name. A name must be set before
      registration.
    role: setter
    belongs_to: secret_type
    parameters:
      type:
        type: secret_type
        description: The secret type to set the name of.
      name:
        type: char
        indirection: 1
        const: true
        kind: IN
        description: The name to set. Borrowed and copied.
      name_length:
        type: idx
        description: The length of `name` in bytes. `name` must be valid UTF-8, need not be null-terminated, and may be NULL only when this is 0.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  secret_type_set_default_provider:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Sets the provider `CREATE SECRET (TYPE <type>)` uses when the statement names none.

      The provider is borrowed and copied. It must be the provider of a secret function registered for the type, by
      the time a secret is created without one. A type without a default provider requires every statement to name its
      provider.
    role: setter
    belongs_to: secret_type
    parameters:
      type:
        type: secret_type
        description: The secret type to set the default provider of.
      provider:
        type: char
        indirection: 1
        const: true
        kind: IN
        description: The provider to set. Borrowed and copied.
      provider_length:
        type: idx
        description: The length of `provider` in bytes. `provider` must be valid UTF-8, need not be null-terminated, and may be NULL only when this is 0.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  secret_type_add_redacted_key:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Adds a key whose value is never displayed in secrets of this type.

      A redacted value is shown as `redacted` by `duckdb_secrets()`, `CREATE SECRET` echoes and logs, and is still
      returned by `[[secret_get_value]]`. The keys are applied to every secret a function of the type builds, in
      addition to the ones the function marks itself with `[[secret_builder_add_redacted_key]]`. Keys are matched
      case-insensitively.
    role: setter
    belongs_to: secret_type
    parameters:
      type:
        type: secret_type
        description: The secret type to add the key to.
      key:
        type: char
        indirection: 1
        const: true
        kind: IN
        description: The key to redact. Borrowed and copied.
      key_length:
        type: idx
        description: The length of `key` in bytes. `key` must be valid UTF-8, need not be null-terminated, and may be NULL only when this is 0.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  connection_register_secret_type:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Registers the secret type on the connection's instance, visible to every connection.

      Registration is not transactional: it takes effect at once, also inside an explicit transaction, and a rollback
      does not undo it. Registration requires a name and fails when a type of the same name already exists. The secret
      type must have been created through a factory of the same instance. The caller still owns the handle after
      registration and must destroy it with `[[secret_type_destroy]]`, which does not affect the registered type.
    role: method
    belongs_to: connection
    parameters:
      conn:
        type: connection
        description: The connection to register on.
      type:
        type: secret_type
        description: The secret type to register.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  extension_register_secret_type:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Registers the secret type on the loading extension's instance, visible to every connection, and attributes it to
      the extension, which `duckdb_secret_types()` reports and which DuckDB loads when a statement names the type.

      Use this from the extension's load callback. Registration is not transactional, requires a name, and fails when
      a type of the same name already exists. The caller still owns the handle after registration and must destroy it
      with `[[secret_type_destroy]]`, which does not affect the registered type.
    role: method
    belongs_to: extension
    parameters:
      extension:
        type: extension
        description: The loading extension.
      type:
        type: secret_type
        description: The secret type to register.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  secret_type_destroy:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Destroys the secret type, releasing its resources.

      Null-safe: passing a null pointer or null handle is a no-op. The handle is set to null on return to prevent
      double-destruction. Destroying the handle after registration does not affect the registered type.
    role: destructor
    belongs_to: secret_type
    parameters:
      type:
        type: secret_type
        indirection: 1
        description: The secret type to destroy.
    return_type: ERROR

  #---------------------------------------------------------------------------------------------------------------------
  # Secret function
  #---------------------------------------------------------------------------------------------------------------------

  secret_function_create:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Creates a new secret function through a factory.

      The function starts out empty: configure it with the setters, then make it available with
      `[[connection_register_secret_function]]` or `[[extension_register_secret_function]]`. The caller owns the
      returned handle and must destroy it with `[[secret_function_destroy]]`, also after registration.

      The function can only be registered on the instance the factory belongs to.
    role: constructor
    belongs_to: secret_function
    parameters:
      factory:
        type: factory
        description: The factory to create the secret function through.
      function:
        type: secret_function
        indirection: 1
        kind: OUT
        description: On success, receives the newly created secret function. Owned by the caller.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  secret_function_set_type:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Sets the secret type the function creates secrets of, by name.

      The name is borrowed and copied. The type must be registered by the time the function is: either earlier or by
      the same extension. A type must be set before registration.
    role: setter
    belongs_to: secret_function
    parameters:
      function:
        type: secret_function
        description: The secret function to set the type of.
      type:
        type: char
        indirection: 1
        const: true
        kind: IN
        description: The name of the secret type. Borrowed and copied.
      type_length:
        type: idx
        description: The length of `type` in bytes. `type` must be valid UTF-8, need not be null-terminated, and may be NULL only when this is 0.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  secret_function_set_provider:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Sets the provider the function implements, as `CREATE SECRET (TYPE ..., PROVIDER <provider>)` names it. Common
      providers are `config`, which builds the secret from the named parameters alone, and `credential_chain`, which
      looks the values up in the environment.

      The provider is borrowed and copied. Calling this again replaces the previous provider. A provider must be set
      before registration.
    role: setter
    belongs_to: secret_function
    parameters:
      function:
        type: secret_function
        description: The secret function to set the provider of.
      provider:
        type: char
        indirection: 1
        const: true
        kind: IN
        description: The provider to set. Borrowed and copied.
      provider_length:
        type: idx
        description: The length of `provider` in bytes. `provider` must be valid UTF-8, need not be null-terminated, and may be NULL only when this is 0.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  secret_function_add_named_parameter:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Declares a named parameter `CREATE SECRET` accepts for this provider, e.g. `region`.

      A value the user gives is cast to the declared type before the create callback sees it, and a parameter the
      function does not declare is rejected. Names are matched case-insensitively. Declaring the same name twice
      replaces the type.
    role: method
    belongs_to: secret_function
    parameters:
      function:
        type: secret_function
        description: The secret function to add the parameter to.
      name:
        type: char
        indirection: 1
        const: true
        kind: IN
        description: The name of the parameter. Borrowed and copied.
      name_length:
        type: idx
        description: The length of `name` in bytes. `name` must be valid UTF-8, need not be null-terminated, and may be NULL only when this is 0.
      type:
        type: logical_type
        description: The type of the parameter. Borrowed and copied.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  secret_function_set_create_callback:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Sets the create callback of the secret function, invoked for every `CREATE SECRET` that resolves to its type and
      provider.

      The callback receives the input and fills a builder with the secret, see `[[secret_create_callback]]`. It runs
      on the thread running the statement, with a transaction active. A create callback must be set before
      registration.
    role: setter
    belongs_to: secret_function
    parameters:
      function:
        type: secret_function
        description: The secret function to set the callback of.
      callback:
        type: secret_create_callback
        description: The create callback to set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  secret_function_set_user_data:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Sets arbitrary user data on the secret function.

      Associates an opaque pointer with the function, retrievable from the create callback via
      `[[secret_create_input_get_user_data]]`. The opaque handle bundles the pointer with an optional destructor,
      invoked when the data is no longer needed: once the secret function handle is destroyed and, if it was
      registered, the instance is too.
    role: setter
    belongs_to: secret_function
    parameters:
      function:
        type: secret_function
        description: The secret function to set the user data of.
      data:
        type: opaque
        indirection: 1
        description: Opaque handle bundling the user data pointer plus an optional destructor.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  connection_register_secret_function:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Registers the secret function on the connection's instance, visible to every connection.

      Registration is not transactional. Registration requires a type, a provider and a create callback, and fails
      when a function for the same type and provider already exists. The secret function must have been created
      through a factory of the same instance. The caller still owns the handle after registration and must destroy it
      with `[[secret_function_destroy]]`, which does not affect the registered function.
    role: method
    belongs_to: connection
    parameters:
      conn:
        type: connection
        description: The connection to register on.
      function:
        type: secret_function
        description: The secret function to register.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  extension_register_secret_function:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Registers the secret function on the loading extension's instance, visible to every connection.

      Use this from the extension's load callback. Registration is not transactional, requires a type, a provider and
      a create callback, and fails when a function for the same type and provider already exists. The caller still
      owns the handle after registration and must destroy it with `[[secret_function_destroy]]`, which does not affect
      the registered function.
    role: method
    belongs_to: extension
    parameters:
      extension:
        type: extension
        description: The loading extension.
      function:
        type: secret_function
        description: The secret function to register.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  secret_function_destroy:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Destroys the secret function, releasing its resources.

      Null-safe: passing a null pointer or null handle is a no-op. The handle is set to null on return to prevent
      double-destruction. Destroying the handle after registration does not affect the registered function.
    role: destructor
    belongs_to: secret_function
    parameters:
      function:
        type: secret_function
        indirection: 1
        description: The secret function to destroy.
    return_type: ERROR

  #---------------------------------------------------------------------------------------------------------------------
  # Create callback
  #---------------------------------------------------------------------------------------------------------------------

  secret_create_input_get_user_data:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Retrieves the user data set via `[[secret_function_set_user_data]]`.

      Only meaningful on the input a create callback receives: an input built with `[[secret_create_input_create]]`
      has none.
    role: getter
    belongs_to: secret_create_input
    parameters:
      input:
        type: secret_create_input
        description: The create input.
      data:
        type: void
        indirection: 2
        kind: OUT
        description: Receives the user data pointer, or null if none was set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  secret_builder_set_value:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Sets the value of a key of the secret.

      The value is borrowed and copied and can be of any type, nested ones included; a NULL value is stored as a NULL.
      Setting a key again replaces its value. Keys are matched case-insensitively and keep the casing given first.
    role: setter
    belongs_to: secret_builder
    parameters:
      builder:
        type: secret_builder
        description: The secret being built.
      key:
        type: char
        indirection: 1
        const: true
        kind: IN
        description: The key to set. Borrowed and copied.
      key_length:
        type: idx
        description: The length of `key` in bytes. `key` must be valid UTF-8, need not be null-terminated, and may be NULL only when this is 0.
      value:
        type: value
        description: The value to store. Borrowed and copied.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  secret_builder_add_redacted_key:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Marks a key as sensitive, so that its value is never displayed, on top of the keys the secret type already
      redacts. The key does not have to hold a value yet.

      For values only some secrets hold, e.g. a key that carries a credential only when the user gave one.
    role: method
    belongs_to: secret_builder
    parameters:
      builder:
        type: secret_builder
        description: The secret being built.
      key:
        type: char
        indirection: 1
        const: true
        kind: IN
        description: The key to redact. Borrowed and copied.
      key_length:
        type: idx
        description: The length of `key` in bytes. `key` must be valid UTF-8, need not be null-terminated, and may be NULL only when this is 0.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  secret_builder_clear_scope:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Removes every scope from the secret, including the ones the user gave. With no scope added afterwards the secret
      applies to every path.
    role: method
    belongs_to: secret_builder
    parameters:
      builder:
        type: secret_builder
        description: The secret being built.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  secret_builder_add_scope:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Adds a scope to the secret: a path prefix, e.g. `s3://bucket/dir`, the secret applies to. A lookup for a path
      picks the secret whose scope is the longest prefix of the path.

      The scope is borrowed and copied. The builder starts with the scopes the user gave. To use a default scope only
      when the user gave none, check `[[secret_create_input_get_scope_count]]` first.
    role: method
    belongs_to: secret_builder
    parameters:
      builder:
        type: secret_builder
        description: The secret being built.
      scope:
        type: char
        indirection: 1
        const: true
        kind: IN
        description: The scope to add. Borrowed and copied.
      scope_length:
        type: idx
        description: The length of `scope` in bytes. `scope` must be valid UTF-8, need not be null-terminated, and may be NULL only when this is 0.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  #---------------------------------------------------------------------------------------------------------------------
  # Create input
  #---------------------------------------------------------------------------------------------------------------------

  secret_create_input_create:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Creates a new, empty create input through a factory, to create a secret with `[[context_create_secret]]`.

      The input starts out with no type, provider, name, scope or options, the default storage,
      `SECRET_PERSIST_TYPE_DEFAULT` and `SECRET_ON_CONFLICT_ERROR`. The caller owns the returned handle and must
      destroy it with `[[secret_create_input_destroy]]`.
    role: constructor
    belongs_to: secret_create_input
    parameters:
      factory:
        type: factory
        description: The factory to create the input through.
      input:
        type: secret_create_input
        indirection: 1
        kind: OUT
        description: On success, receives the newly created input. Owned by the caller.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  secret_create_input_set_type:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Sets the type of the secret to create. The secret type to create. Required.

      The value is borrowed and copied. Fails with `ERROR_API` on the borrowed input of a create callback, which is
      read-only.
    role: setter
    belongs_to: secret_create_input
    parameters:
      input:
        type: secret_create_input
        description: The create input.
      type:
        type: char
        indirection: 1
        const: true
        kind: IN
        description: The type to set. Borrowed and copied.
      type_length:
        type: idx
        description: The length of `type` in bytes. `type` must be valid UTF-8, need not be null-terminated, and may be NULL only when this is 0.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  secret_create_input_set_provider:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Sets the provider of the secret to create. The provider to create the secret with. When unset, the default
      provider of the type is used.

      The value is borrowed and copied. Fails with `ERROR_API` on the borrowed input of a create callback, which is
      read-only.
    role: setter
    belongs_to: secret_create_input
    parameters:
      input:
        type: secret_create_input
        description: The create input.
      provider:
        type: char
        indirection: 1
        const: true
        kind: IN
        description: The provider to set. Borrowed and copied.
      provider_length:
        type: idx
        description: The length of `provider` in bytes. `provider` must be valid UTF-8, need not be null-terminated, and may be NULL only when this is 0.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  secret_create_input_set_name:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Sets the name of the secret to create. The name of the secret. When unset, DuckDB names it.

      The value is borrowed and copied. Fails with `ERROR_API` on the borrowed input of a create callback, which is
      read-only.
    role: setter
    belongs_to: secret_create_input
    parameters:
      input:
        type: secret_create_input
        description: The create input.
      name:
        type: char
        indirection: 1
        const: true
        kind: IN
        description: The name to set. Borrowed and copied.
      name_length:
        type: idx
        description: The length of `name` in bytes. `name` must be valid UTF-8, need not be null-terminated, and may be NULL only when this is 0.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  secret_create_input_set_storage:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Sets the storage the secret goes to, by name, e.g. `memory` or `local_file`. When unset, DuckDB chooses one from
      the persist type.

      The name is borrowed and copied. Fails with `ERROR_API` on the borrowed input of a create callback.
    role: setter
    belongs_to: secret_create_input
    parameters:
      input:
        type: secret_create_input
        description: The create input.
      storage:
        type: char
        indirection: 1
        const: true
        kind: IN
        description: The name of the storage. Borrowed and copied.
      storage_length:
        type: idx
        description: The length of `storage` in bytes. `storage` must be valid UTF-8, need not be null-terminated, and may be NULL only when this is 0.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  secret_create_input_add_scope:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Adds a scope to the secret to create: a path prefix the secret applies to. Without any, the secret type or
      function chooses its default scope.

      The scope is borrowed and copied. Fails with `ERROR_API` on the borrowed input of a create callback.
    role: method
    belongs_to: secret_create_input
    parameters:
      input:
        type: secret_create_input
        description: The create input.
      scope:
        type: char
        indirection: 1
        const: true
        kind: IN
        description: The scope to add. Borrowed and copied.
      scope_length:
        type: idx
        description: The length of `scope` in bytes. `scope` must be valid UTF-8, need not be null-terminated, and may be NULL only when this is 0.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  secret_create_input_set_option:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Sets an option of the secret to create, as the named parameter of `CREATE SECRET` of the same name. Setting an
      option again replaces its value.

      The value is borrowed and copied and cast to the type the secret function declares for the parameter, which
      fails when the cast does. Fails with `ERROR_API` on the borrowed input of a create callback.
    role: method
    belongs_to: secret_create_input
    parameters:
      input:
        type: secret_create_input
        description: The create input.
      name:
        type: char
        indirection: 1
        const: true
        kind: IN
        description: The name of the option. Borrowed and copied.
      name_length:
        type: idx
        description: The length of `name` in bytes. `name` must be valid UTF-8, need not be null-terminated, and may be NULL only when this is 0.
      value:
        type: value
        description: The value of the option. Borrowed and copied.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  secret_create_input_set_persist_type:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Sets where the secret lives. Defaults to `SECRET_PERSIST_TYPE_DEFAULT`.

      Fails with `ERROR_API` on the borrowed input of a create callback.
    role: setter
    belongs_to: secret_create_input
    parameters:
      input:
        type: secret_create_input
        description: The create input.
      persist_type:
        type: SECRET_PERSIST_TYPE
        description: The persist type.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  secret_create_input_set_on_conflict:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Sets what happens when a secret of the same name already exists. Defaults to `SECRET_ON_CONFLICT_ERROR`.

      Fails with `ERROR_API` on the borrowed input of a create callback.
    role: setter
    belongs_to: secret_create_input
    parameters:
      input:
        type: secret_create_input
        description: The create input.
      on_conflict:
        type: SECRET_ON_CONFLICT
        description: The conflict behavior.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  secret_create_input_destroy:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Destroys the create input, releasing its resources.

      Null-safe: passing a null pointer or null handle is a no-op. The handle is set to null on return to prevent
      double-destruction. Must only be called on an input created with `[[secret_create_input_create]]`, never on the
      borrowed one of a create callback.
    role: destructor
    belongs_to: secret_create_input
    parameters:
      input:
        type: secret_create_input
        indirection: 1
        description: The create input to destroy.
    return_type: ERROR

  secret_create_input_get_type:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Borrows the secret type to create. Empty when none was set.
    role: getter
    belongs_to: secret_create_input
    parameters:
      secret_create_input:
        type: secret_create_input
        description: The secret create input.
      out:
        type: char
        indirection: 2
        const: true
        kind: OUT_BORROW
        description: Receives a borrowed pointer to the secret type to create. Valid until the secret create input is destroyed.
      out_length:
        type: idx
        indirection: 1
        kind: OUT
        description: Receives the length of `*out` in bytes. `*out` is not guaranteed to be null-terminated.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  secret_create_input_get_provider:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Borrows the provider, as `CREATE SECRET` named it or the type defaults it. Empty when none was set.
    role: getter
    belongs_to: secret_create_input
    parameters:
      secret_create_input:
        type: secret_create_input
        description: The secret create input.
      out:
        type: char
        indirection: 2
        const: true
        kind: OUT_BORROW
        description: "Receives a borrowed pointer to the provider, as `CREATE SECRET` named it or the type defaults it. Valid until the secret create input is destroyed."
      out_length:
        type: idx
        indirection: 1
        kind: OUT
        description: Receives the length of `*out` in bytes. `*out` is not guaranteed to be null-terminated.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  secret_create_input_get_name:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Borrows the name of the secret. Empty when the secret is unnamed.
    role: getter
    belongs_to: secret_create_input
    parameters:
      secret_create_input:
        type: secret_create_input
        description: The secret create input.
      out:
        type: char
        indirection: 2
        const: true
        kind: OUT_BORROW
        description: Receives a borrowed pointer to the name of the secret. Valid until the secret create input is destroyed.
      out_length:
        type: idx
        indirection: 1
        kind: OUT
        description: Receives the length of `*out` in bytes. `*out` is not guaranteed to be null-terminated.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  secret_create_input_get_storage:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Borrows the name of the storage the secret goes to. Empty when the user chose none.
    role: getter
    belongs_to: secret_create_input
    parameters:
      secret_create_input:
        type: secret_create_input
        description: The secret create input.
      out:
        type: char
        indirection: 2
        const: true
        kind: OUT_BORROW
        description: Receives a borrowed pointer to the name of the storage the secret goes to. Valid until the secret create input is destroyed.
      out_length:
        type: idx
        indirection: 1
        kind: OUT
        description: Receives the length of `*out` in bytes. `*out` is not guaranteed to be null-terminated.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  secret_create_input_get_persist_type:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Retrieves where the secret lives.
    role: getter
    belongs_to: secret_create_input
    parameters:
      input:
        type: secret_create_input
        description: The create input.
      persist_type:
        type: SECRET_PERSIST_TYPE
        indirection: 1
        kind: OUT
        description: Receives the persist type.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  secret_create_input_get_on_conflict:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Retrieves what happens when a secret of the same name already exists.
    role: getter
    belongs_to: secret_create_input
    parameters:
      input:
        type: secret_create_input
        description: The create input.
      on_conflict:
        type: SECRET_ON_CONFLICT
        indirection: 1
