        type: value
        indirection: 1
        kind: OUT
        description: "Receives the value. Owned by the caller; destroy via `[[value_destroy]]`."
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
