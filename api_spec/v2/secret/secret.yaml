      Fails with `ERROR_INPUT_OUT_OF_RANGE` when the index is not below `[[secret_create_input_get_option_count]]`.
    role: getter
    belongs_to: secret_create_input
    parameters:
      input:
        type: secret_create_input
        description: The create input.
      index:
        type: idx
        description: The index of the option.
      name:
