  secret_create_input_get_option:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Retrieves the value of an option the user gave, by name. The returned value is owned by the caller and must be
      destroyed via `[[value_destroy]]`.

      An option that was not given is not an error: `value` receives a null handle then. Names are matched case-
      insensitively.
    role: getter
    belongs_to: secret_create_input
    parameters:
      input:
        type: secret_create_input
        description: The create input.
      name:
        type: char
        indirection: 1
        const: true
        kind: IN
        description: The name of the option.
      name_length:
        type: idx
        description: The length of `name` in bytes. `name` must be valid UTF-8, need not be null-terminated, and may be NULL only when this is 0.
      value:
        type: value
        indirection: 1
        kind: OUT
        description: "Receives the value, or a null handle if the option was not given. Owned by the caller; destroy via `[[value_destroy]]`."
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  #---------------------------------------------------------------------------------------------------------------------
  # Looking up secrets
  #---------------------------------------------------------------------------------------------------------------------

  context_lookup_secret:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Looks up the secret of a type that applies best to a path, the way DuckDB resolves the credentials of a file it
      opens.

      Of the secrets of the type visible to the context, the one whose scope is the longest prefix of the path wins; a
      secret without scope matches every path with the lowest score. When no secret matches, `secret` receives a null
      handle and the call still succeeds. The returned secret is a snapshot owned by the caller, to destroy via
      `[[secret_destroy]]`.

      The lookup sees the secrets of the context's transaction, so also secrets created in it with
      `SECRET_PERSIST_TYPE_TRANSACTION`. Unlike the credential resolution of a file system, it never creates a secret.
    role: method
    belongs_to: context
    parameters:
      ctx:
        type: context
        description: The context to look up in.
      path:
        type: char
        indirection: 1
        const: true
        kind: IN
        description: "The path to find a secret for, e.g. `s3://bucket/key`. Borrowed."
      path_length:
        type: idx
        description: The length of `path` in bytes. `path` must be valid UTF-8, need not be null-terminated, and may be NULL only when this is 0.
      type:
        type: char
        indirection: 1
        const: true
        kind: IN
        description: "The secret type to look for, e.g. `s3`. Borrowed."
      type_length:
        type: idx
        description: The length of `type` in bytes. `type` must be valid UTF-8, need not be null-terminated, and may be NULL only when this is 0.
      secret:
        type: secret
        indirection: 1
        kind: OUT
        description: Receives the best matching secret, or a null handle if none matches. Owned by the caller.
      score:
        type: i64
        indirection: 1
        kind: OUT
        description: "Optional. Receives how well the secret matches: the length of the longest matching scope prefix, higher is better. Undefined when nothing matched. Lets the caller rank the matches of several types."
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  context_get_secret_by_name:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Looks up a secret by its name, across all storages.

      When no secret has the name, `secret` receives a null handle and the call still succeeds. The type is not
      checked: compare it with `[[secret_get_type]]`. The returned secret is a snapshot owned by the caller, to
      destroy via `[[secret_destroy]]`.
    role: method
    belongs_to: context
    parameters:
      ctx:
        type: context
        description: The context to look up in.
      name:
        type: char
        indirection: 1
        const: true
        kind: IN
        description: The name of the secret. Borrowed.
      name_length:
        type: idx
        description: The length of `name` in bytes. `name` must be valid UTF-8, need not be null-terminated, and may be NULL only when this is 0.
      secret:
        type: secret
        indirection: 1
        kind: OUT
        description: Receives the secret, or a null handle if there is none of that name. Owned by the caller.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  context_list_secrets:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Lists the secrets visible to the context, of every type, across all storages.

      The list is a snapshot owned by the caller, to destroy via `[[secret_list_destroy]]`. To find the secrets of one
      type, compare `[[secret_get_type]]` while iterating.
    role: method
    belongs_to: context
    parameters:
      ctx:
        type: context
        description: The context to list in.
      list:
        type: secret_list
        indirection: 1
        kind: OUT
        description: Receives the list. Owned by the caller.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  secret_list_get_count:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Retrieves the number of secrets in the list.
    role: getter
    belongs_to: secret_list
    parameters:
      list:
        type: secret_list
        description: The secret list.
      count:
        type: idx
        indirection: 1
        kind: OUT
        description: Receives the number of secrets.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  secret_list_get_secret:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Retrieves a secret of the list.

      The secret is a copy owned by the caller, to destroy via `[[secret_destroy]]`; it stays valid when the list is
      destroyed. Fails with `ERROR_INPUT_OUT_OF_RANGE` when the index is not below `[[secret_list_get_count]]`.
    role: getter
    belongs_to: secret_list
    parameters:
      list:
        type: secret_list
        description: The secret list.
      index:
        type: idx
        description: The index of the secret.
      secret:
        type: secret
        indirection: 1
        kind: OUT
        description: Receives the secret. Owned by the caller.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  secret_list_destroy:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Destroys the secret list, releasing its resources. Secrets retrieved from it are not affected.

      Null-safe: passing a null pointer or null handle is a no-op. The handle is set to null on return to prevent
      double-destruction.
    role: destructor
    belongs_to: secret_list
    parameters:
      list:
        type: secret_list
        indirection: 1
        description: The secret list to destroy.
    return_type: ERROR

  context_create_secret:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Creates a secret from a create input, as the equivalent `CREATE SECRET` statement would, in the context's
      transaction.

      The secret function for the input's type and provider runs to build the secret, and the secret manager stores it
      according to the persist type and conflict behavior. Use `SECRET_PERSIST_TYPE_TRANSACTION` for credentials that
      must not outlive the transaction. `secret` is optional: when given, it receives a snapshot of the secret that
      now exists, which with `SECRET_ON_CONFLICT_IGNORE` is the existing one. The snapshot is owned by the caller, to
      destroy via `[[secret_destroy]]`.
    role: method
    belongs_to: context
    parameters:
      ctx:
        type: context
        description: The context to create the secret in.
      input:
        type: secret_create_input
        description: The description of the secret.
      secret:
        type: secret
        indirection: 1
        kind: OUT
        description: Optional. Receives the secret. Owned by the caller.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  #---------------------------------------------------------------------------------------------------------------------
  # Reading a secret
  #---------------------------------------------------------------------------------------------------------------------

  secret_get_type:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Borrows the type of the secret.
    role: getter
    belongs_to: secret
    parameters:
      secret:
        type: secret
        description: The secret.
      out:
        type: char
        indirection: 2
        const: true
        kind: OUT_BORROW
        description: Receives a borrowed pointer to the type of the secret. Valid until the secret is destroyed.
      out_length:
        type: idx
        indirection: 1
        kind: OUT
        description: Receives the length of `*out` in bytes. `*out` is not guaranteed to be null-terminated.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  secret_get_provider:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Borrows the provider the secret was created with.
    role: getter
    belongs_to: secret
    parameters:
      secret:
        type: secret
        description: The secret.
      out:
        type: char
        indirection: 2
        const: true
        kind: OUT_BORROW
        description: Receives a borrowed pointer to the provider the secret was created with. Valid until the secret is destroyed.
      out_length:
        type: idx
        indirection: 1
        kind: OUT
        description: Receives the length of `*out` in bytes. `*out` is not guaranteed to be null-terminated.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  secret_get_name:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Borrows the name of the secret.
    role: getter
    belongs_to: secret
    parameters:
      secret:
        type: secret
        description: The secret.
      out:
        type: char
        indirection: 2
        const: true
        kind: OUT_BORROW
        description: Receives a borrowed pointer to the name of the secret. Valid until the secret is destroyed.
      out_length:
        type: idx
        indirection: 1
        kind: OUT
        description: Receives the length of `*out` in bytes. `*out` is not guaranteed to be null-terminated.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  secret_get_storage:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Borrows the name of the storage the secret lives in, e.g. `memory`.
    role: getter
    belongs_to: secret
    parameters:
      secret:
        type: secret
        description: The secret.
      out:
        type: char
        indirection: 2
        const: true
        kind: OUT_BORROW
        description: "Receives a borrowed pointer to the name of the storage the secret lives in, e.g. `memory`. Valid until the secret is destroyed."
      out_length:
        type: idx
        indirection: 1
        kind: OUT
        description: Receives the length of `*out` in bytes. `*out` is not guaranteed to be null-terminated.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  secret_get_persist_type:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Retrieves where the secret lives.
    role: getter
    belongs_to: secret
    parameters:
      secret:
        type: secret
        description: The secret.
      persist_type:
        type: SECRET_PERSIST_TYPE
        indirection: 1
        kind: OUT
        description: "Receives the persist type. Never `SECRET_PERSIST_TYPE_DEFAULT`."
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  secret_get_scope_count:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Retrieves the number of scopes of the secret. A secret without scope applies to every path.
    role: getter
    belongs_to: secret
    parameters:
      secret:
        type: secret
        description: The secret.
      count:
        type: idx
        indirection: 1
        kind: OUT
        description: Receives the number of scopes.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  secret_get_scope:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Borrows a scope of the secret.

      Fails with `ERROR_INPUT_OUT_OF_RANGE` when the index is not below `[[secret_get_scope_count]]`.
    role: getter
    belongs_to: secret
    parameters:
      secret:
        type: secret
        description: The secret.
      index:
        type: idx
        description: The index of the scope.
      scope:
        type: char
        indirection: 2
        const: true
        kind: OUT_BORROW
        description: Receives a borrowed pointer to the scope. Valid until the secret is destroyed.
      scope_length:
        type: idx
        indirection: 1
        kind: OUT
        description: Receives the length of `*scope` in bytes. `*scope` is not guaranteed to be null-terminated.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  secret_get_key_count:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Retrieves the number of keys of the secret.
    role: getter
    belongs_to: secret
    parameters:
      secret:
        type: secret
        description: The secret.
      count:
        type: idx
        indirection: 1
        kind: OUT
        description: Receives the number of keys.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  secret_get_key:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Borrows a key of the secret. The order is unspecified but stable for the secret.

      Fails with `ERROR_INPUT_OUT_OF_RANGE` when the index is not below `[[secret_get_key_count]]`.
    role: getter
    belongs_to: secret
    parameters:
      secret:
        type: secret
        description: The secret.
      index:
        type: idx
        description: The index of the key.
      key:
        type: char
        indirection: 2
        const: true
        kind: OUT_BORROW
        description: Receives a borrowed pointer to the key. Valid until the secret is destroyed.
      key_length:
        type: idx
        indirection: 1
        kind: OUT
        description: Receives the length of `*key` in bytes. `*key` is not guaranteed to be null-terminated.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  secret_get_value:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Retrieves the value of a key of the secret, unredacted. The returned value is owned by the caller and must be
      destroyed via `[[value_destroy]]`.

      A key the secret does not have is not an error: `value` receives a null handle then, which tells it apart from a
      key holding a NULL value. Keys are matched case-insensitively.
    role: getter
    belongs_to: secret
    parameters:
      secret:
        type: secret
        description: The secret.
      key:
        type: char
        indirection: 1
        const: true
        kind: IN
        description: The key to read.
      key_length:
        type: idx
        description: The length of `key` in bytes. `key` must be valid UTF-8, need not be null-terminated, and may be NULL only when this is 0.
      value:
        type: value
        indirection: 1
        kind: OUT
        description: "Receives the value, or a null handle if the secret has no such key. Owned by the caller; destroy via `[[value_destroy]]`."
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  secret_is_key_redacted:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Retrieves whether the value of the key is redacted when the secret is displayed. A key the secret does not have
      is not redacted.

      For code that copies a secret and has to carry the redaction over, see `[[secret_builder_add_redacted_key]]`.
    role: getter
    belongs_to: secret
    parameters:
      secret:
        type: secret
        description: The secret.
      key:
        type: char
        indirection: 1
        const: true
        kind: IN
        description: The key to check.
      key_length:
        type: idx
        description: The length of `key` in bytes. `key` must be valid UTF-8, need not be null-terminated, and may be NULL only when this is 0.
      redacted:
        type: bool
        indirection: 1
        kind: OUT
        description: Receives whether the key is redacted.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  secret_destroy:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Destroys the secret, releasing its resources. Values and views retrieved from it must not be used afterwards,
      except values the caller owns.

      Null-safe: passing a null pointer or null handle is a no-op. The handle is set to null on return to prevent
      double-destruction.
    role: destructor
    belongs_to: secret
    parameters:
      secret:
        type: secret
        indirection: 1
        description: The secret to destroy.
    return_type: ERROR
