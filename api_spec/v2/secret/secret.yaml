module: secret
#
# Secrets: named, scoped sets of key/value pairs (credentials, endpoints, tokens) that `CREATE SECRET` stores and DuckDB
# resolves by path. This module lets code of your own define a kind of secret and read, create and inspect secrets.
#
# There is one data handle, `secret`: a few string properties (type, provider, name, storage, persist type), scopes, and a
# set of keys with values of any type (nested ones included), some of which are marked as redacted. The same handle is
# what a lookup returns, what a create callback receives and fills, and what `[[context_create_secret]]` stores. Where a
# secret is handed to you by DuckDB it can be read-only or partly fixed; each place says so.
#
# Defining a kind of secret is a secret function, built with `[[secret_function_create]]`: one provider of a secret
# type. It declares the named parameters `CREATE SECRET` accepts and a create callback that turns them into the secret.
# Registering the first function of a type defines the type; the function marked `[[secret_function_set_default]]` is the
# provider `CREATE SECRET (TYPE <type>)` uses when no provider is named. A type an extension of DuckDB's defines (e.g.
# `s3` of httpfs) is never defined here: registering a provider for it loads that extension first. After registration
# `CREATE SECRET (TYPE <type>, PROVIDER <provider>, ...)` works like it does for the secrets DuckDB ships.
#
# A secret is a key/value secret. It is stored, persisted and dropped by DuckDB like any other, and a persisted
# one is read back as a key/value secret again. Custom secret *storages* are not part of this API.
#
# Secrets are read and created through a context (`context_*`) or a connection (`connection_*`), as the secret manager
# keeps state per transaction. A lookup returns a copy: a secret that is dropped or replaced afterwards does not change
# the handle already returned, and changing the handle does not change the stored secret.
#
# Combining a secret with a setting, e.g. "the key `region` of the secret, else the option `s3_region`", is up to the
# caller: read the secret with this module and the option with `[[config_get_option_value]]`.
#
# Registration is not transactional: a registered secret function is visible to every connection at once, is not undone
# by a rollback, and lives for as long as the instance does.

#-----------------------------------------------------------------------------------------------------------------------
# Enums
#-----------------------------------------------------------------------------------------------------------------------
enums:
  SECRET_PROPERTY:
    description: |
      A string property of a secret, next to its keys. Set with `[[secret_set_property]]` and read with
      `[[secret_get_property]]`.
    values:
      SECRET_PROPERTY_TYPE:
        value: 0
        description: The secret type, e.g. `s3`.
      SECRET_PROPERTY_PROVIDER:
        value: 1
        description: The provider the secret is created with, e.g. `config`.
      SECRET_PROPERTY_NAME:
        value: 2
        description: |
          The name of the secret. A secret created without one is named `__default_<type>`, as by `CREATE SECRET`;
          only a secret built with `[[secret_create]]` and not named yet reads back empty.
      SECRET_PROPERTY_STORAGE:
        value: 3
        description: The name of the storage the secret lives in, e.g. `memory` or `local_file`. Empty when DuckDB chooses.
      SECRET_PROPERTY_PERSIST_TYPE:
        value: 4
        description: |
          Where the secret lives, as one of `default` (DuckDB chooses, following the secret settings), `temporary` (in
          memory for the lifetime of the instance), `persistent` (written to disk) or `transaction` (in memory for the
          lifetime of the current transaction, for credentials a catalog hands out with a query). Matched
          case-insensitively; read back in lower case.

  SECRET_ON_CONFLICT:
    description: What creating a secret does when a secret of the same name already exists.
    # The values match the first three duckdb::OnCreateConflict values
    values:
      SECRET_ON_CONFLICT_ERROR:
        value: 0
        description: Fail, as a plain `CREATE SECRET` does.
      SECRET_ON_CONFLICT_IGNORE:
        value: 1
        description: Keep the existing secret and succeed, as `CREATE SECRET IF NOT EXISTS` does.
      SECRET_ON_CONFLICT_REPLACE:
        value: 2
        description: Replace the existing secret, as `CREATE OR REPLACE SECRET` does.

#-----------------------------------------------------------------------------------------------------------------------
# Handles
#-----------------------------------------------------------------------------------------------------------------------
handles:
  secret_function:
    description: |
      An owned opaque handle to a secret function being built: one provider of a secret type. Created with
      `[[secret_function_create]]`, configured with the setters (e.g. `[[secret_function_set_provider]]`,
      `[[secret_function_add_named_parameter]]`, `[[secret_function_set_create_callback]]`), made available with
      `[[connection_register_secret_function]]` or `[[extension_register_secret_function]]`, and destroyed with
      `[[secret_function_destroy]]`.

  secret:
    description: |
      A handle to a key/value secret. Owned when built with `[[secret_create]]` or returned by
      `[[context_lookup_secret]]`, `[[context_get_secret_by_name]]`, `[[context_create_secret]]` or their
      `connection_*` equivalents (`[[connection_lookup_secret]]`, `[[connection_get_secret_by_name]]`,
      `[[connection_create_secret]]`): the caller destroys it with `[[secret_destroy]]` and may change it with the setters,
      which never affects a stored secret. Borrowed when received by a create callback, valid only for the duration of
      the call: the `input` is read-only, describing the `CREATE SECRET` statement with its options as keys, and the
      `output` is the secret to fill, with its properties and scope already set from the statement.

#-----------------------------------------------------------------------------------------------------------------------
# Callbacks
#-----------------------------------------------------------------------------------------------------------------------
callbacks:
  secret_create_callback:
    parameters:
      input:
        type: secret
        description: |
          Borrowed, read-only secret describing the `CREATE SECRET` statement: its type, provider, name, storage, persist
          type and scope, and the options the user gave as keys with their values, each already cast to the type its
          named parameter declares.
      output:
        type: secret
        description: |
          Borrowed secret to fill, starting out with the type, provider, name and scope of the input and no keys. Set
          its keys with `[[secret_set_value]]` and mark sensitive ones with `[[secret_add_redacted_key]]`; its scope can be
          changed, its properties (type, provider, name, storage and persist type) cannot. When the callback returns without an error, the secret is stored.
      user_data:
        type: void
        indirection: 1
        description: The user data set via `[[secret_function_set_user_data]]`, or null if none was set.
      context:
        type: context
        description: |
          Borrowed handle to the context running `CREATE SECRET`, e.g. to read files or settings the secret is
          derived from.
      err:
        type: error_info
        indirection: 1
        description: |
          Borrowed error info handle to use to report errors that occur during the callback. Reporting an error fails
          the `CREATE SECRET` and creates no secret.
    return_type: void

#-----------------------------------------------------------------------------------------------------------------------
# Functions
#-----------------------------------------------------------------------------------------------------------------------
functions:

  #---------------------------------------------------------------------------------------------------------------------
  # Secret function
  #---------------------------------------------------------------------------------------------------------------------

  secret_function_create:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Creates a new secret function through a factory.

      The function starts out empty: configure it with the setters, then make it available with
      `[[connection_register_secret_function]]` or `[[extension_register_secret_function]]`. The caller owns the
      returned handle and must destroy it with `[[secret_function_destroy]]`, also after registration.

      The function can only be registered on the instance the factory belongs to.
    role: constructor
    belongs_to: secret_function
    parameters:
      factory:
        type: factory
        description: "The factory to create the secret function through."
      function:
        type: secret_function
        indirection: 1
        kind: OUT
        description: "On success, receives the newly created secret function. Owned by the caller."
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  secret_function_set_type:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Sets the secret type the function creates secrets of, as `CREATE SECRET (TYPE ...)` and
      `[[context_lookup_secret]]` name it.

      The name is borrowed and copied. Matched case-insensitively. A type must be set before registration.
    role: setter
    belongs_to: secret_function
    parameters:
      function:
        type: secret_function
        description: "The secret function to set the type of."
      type:
        type: char
        indirection: 1
        const: true
        kind: IN
        description: "The name of the secret type."
      type_length:
        type: idx
        description: The length of `type` in bytes. `type` must be valid UTF-8, need not be null-terminated, and may be NULL only when this is 0.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  secret_function_set_provider:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Sets the provider the function implements, as `CREATE SECRET (TYPE ..., PROVIDER <provider>)` names it. Common
      providers are `config`, which builds the secret from the named parameters alone, and `credential_chain`, which
      looks the values up in the environment.

      The provider is borrowed and copied. Matched case-insensitively. A provider must be set before registration.
    role: setter
    belongs_to: secret_function
    parameters:
      function:
        type: secret_function
        description: "The secret function to set the provider of."
      provider:
        type: char
        indirection: 1
        const: true
        kind: IN
        description: "The provider to set."
      provider_length:
        type: idx
        description: The length of `provider` in bytes. `provider` must be valid UTF-8, need not be null-terminated, and may be NULL only when this is 0.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  secret_function_set_default:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Sets whether the function is the default provider of its type: the one `CREATE SECRET (TYPE <type>)` uses when
      the statement names no provider. Defaults to false.

      A type without a default provider requires every statement to name its provider. Only the function that defines
      the type, the first one registered for it, can be the default: registering a later function of an existing type
      with this set fails.
    role: setter
    belongs_to: secret_function
    parameters:
      function:
        type: secret_function
        description: "The secret function to configure."
      is_default:
        type: bool
        description: "Whether the function is the default provider of its type."
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  secret_function_add_named_parameter:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Declares a named parameter `CREATE SECRET` accepts for this provider, e.g. `region`.

      A value the user gives is cast to the declared type before the create callback sees it, and a parameter the
      function does not declare is rejected. Names are matched case-insensitively. Declaring the same name twice
      replaces the type.
    role: method
    belongs_to: secret_function
    parameters:
      function:
        type: secret_function
        description: "The secret function to add the parameter to."
      name:
        type: char
        indirection: 1
        const: true
        kind: IN
        description: "The name of the parameter. Borrowed and copied."
      name_length:
        type: idx
        description: The length of `name` in bytes. `name` must be valid UTF-8, need not be null-terminated, and may be NULL only when this is 0.
      type:
        type: logical_type
        description: "The type of the parameter. Borrowed and copied."
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  secret_function_set_create_callback:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Sets the create callback of the secret function, invoked for every `CREATE SECRET` that resolves to its type and
      provider.

      The callback receives the statement as a read-only secret and fills a secret with the result, see
      `[[secret_create_callback]]`. It runs on the thread running the statement, with a transaction active. A create
      callback must be set before registration.
    role: setter
    belongs_to: secret_function
    parameters:
      function:
        type: secret_function
        description: "The secret function to set the callback of."
      callback:
        type: secret_create_callback
        description: "The create callback to set."
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  secret_function_set_user_data:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Sets arbitrary user data on the secret function.

      Associates an opaque pointer with the function, handed to its create callback. The opaque handle bundles the
      pointer with an optional destructor, invoked when the data is no longer needed: once the secret function handle
      is destroyed and, if it was registered, the instance is too.
    role: setter
    belongs_to: secret_function
    parameters:
      function:
        type: secret_function
        description: "The secret function to set the user data of."
      data:
        type: opaque
        indirection: 1
        description: "Opaque handle bundling the user data pointer plus an optional destructor."
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  connection_register_secret_function:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Registers the secret function on the connection's instance, visible to every connection.

      Registration is not transactional: it takes effect at once, also inside an explicit transaction, and a rollback
      does not undo it. Registration requires a type, a provider and a create callback, defines the type if it is new,
      and fails with `ERROR_INPUT_INVALID` when a function for the same type and provider already exists, or when the
      function is the default provider of a type that exists already. A type an extension of DuckDB's defines (e.g.
      `s3` of httpfs) is not defined here: registration loads that extension, autoloading it if enabled, and fails
      with `ERROR_INPUT_INVALID` (or the autoload error) when it cannot. The secret function must have been
      created through a factory of the same instance. The caller still owns the handle after registration and must
      destroy it with `[[secret_function_destroy]]`, which does not affect the registered function.
    role: method
    belongs_to: connection
    parameters:
      conn:
        type: connection
        description: "The connection to register on."
      function:
        type: secret_function
        description: "The secret function to register."
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  extension_register_secret_function:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Registers the secret function on the loading extension's instance, visible to every connection. A type it
      defines is attributed to the extension in `duckdb_secret_types()`; this does not make DuckDB load the extension
      when a statement names the type.

      Use this from the extension's load callback. Otherwise as `[[connection_register_secret_function]]`.
    role: method
    belongs_to: extension
    parameters:
      extension:
        type: extension
        description: "The loading extension."
      function:
        type: secret_function
        description: "The secret function to register."
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  secret_function_destroy:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Destroys the secret function, releasing its resources.

      Null-safe: passing a null pointer or null handle is a no-op. The handle is set to null on return to prevent
      double-destruction. Destroying the handle after registration does not affect the registered function.
    role: destructor
    belongs_to: secret_function
    parameters:
      function:
        type: secret_function
        indirection: 1
        description: "The secret function to destroy."
    return_type: ERROR

  #---------------------------------------------------------------------------------------------------------------------
  # Building a secret
  #---------------------------------------------------------------------------------------------------------------------

  secret_create:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Creates a new, empty secret through a factory, to fill in and hand to `[[context_create_secret]]`.

      The secret starts out with no properties set, no scope and no keys. The caller owns the returned handle and must
      destroy it with `[[secret_destroy]]`.
    role: constructor
    belongs_to: secret
    parameters:
      factory:
        type: factory
        description: "The factory to create the secret through."
      secret:
        type: secret
        indirection: 1
        kind: OUT
        description: "On success, receives the newly created secret. Owned by the caller."
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  secret_set_property:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Sets a string property of the secret, see `SECRET_PROPERTY`. The type is required to create the secret; the
      provider defaults to the default provider of the type, the name to one DuckDB chooses, the storage and persist
      type to what DuckDB chooses.

      The value is borrowed and copied. An invalid persist type fails with `ERROR_INPUT_INVALID`. Fails with
      `ERROR_INPUT_INVALID` on a read-only secret and on the secret a create callback fills, whose properties are fixed
      by the statement.
    role: setter
    belongs_to: secret
    parameters:
      secret:
        type: secret
        description: "The secret."
      property:
        type: SECRET_PROPERTY
        description: "The property to set."
      value:
        type: char
        indirection: 1
        const: true
        kind: IN
        description: "The value to set."
      value_length:
        type: idx
        description: The length of `value` in bytes. `value` must be valid UTF-8, need not be null-terminated, and may be NULL only when this is 0.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  secret_add_scope:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Adds a scope to the secret: a path prefix, e.g. `s3://bucket/dir`, the secret applies to. A lookup for a path
      picks the secret whose scope is the longest prefix of the path. A secret without scope applies to every path.

      The scope is borrowed and copied. Fails with `ERROR_INPUT_INVALID` on a read-only secret.
    role: method
    belongs_to: secret
    parameters:
      secret:
        type: secret
        description: "The secret."
      scope:
        type: char
        indirection: 1
        const: true
        kind: IN
        description: "The scope to add."
      scope_length:
        type: idx
        description: The length of `scope` in bytes. `scope` must be valid UTF-8, need not be null-terminated, and may be NULL only when this is 0.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  secret_clear_scope:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Removes every scope from the secret. In a create callback this includes the ones the user gave; check
      `[[secret_get_scope_count]]` on the output first to supply a default scope only when the user gave none. Fails
      with `ERROR_INPUT_INVALID` on a read-only secret.
    role: method
    belongs_to: secret
    parameters:
      secret:
        type: secret
        description: "The secret."
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  secret_set_value:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Sets the value of a key of the secret.

      The value is borrowed and copied and can be of any type, nested ones included; a NULL value is stored as a NULL.
      Setting a key again replaces its value. Keys are matched case-insensitively and keep the casing given first. For
      the options of a `CREATE SECRET` this is the value the named parameter was given. Fails with
      `ERROR_INPUT_INVALID` on a read-only secret.
    role: method
    belongs_to: secret
    parameters:
      secret:
        type: secret
        description: "The secret."
      key:
        type: char
        indirection: 1
        const: true
        kind: IN
        description: "The key to set."
      key_length:
        type: idx
        description: The length of `key` in bytes. `key` must be valid UTF-8, need not be null-terminated, and may be NULL only when this is 0.
      value:
        type: value
        description: "The value to store. Borrowed and copied."
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  secret_add_redacted_key:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Marks a key as sensitive, so that its value is never displayed: `duckdb_secrets()` and the echo of `CREATE
      SECRET` show it as `redacted`, while `[[secret_get_value]]` still returns it. The key does not have to hold a
      value yet, which suits keys only some secrets hold. Keys are matched case-insensitively. Fails with
      `ERROR_INPUT_INVALID` on a read-only secret.
    role: method
    belongs_to: secret
    parameters:
      secret:
        type: secret
        description: "The secret."
      key:
        type: char
        indirection: 1
        const: true
        kind: IN
        description: "The key to redact."
      key_length:
        type: idx
        description: The length of `key` in bytes. `key` must be valid UTF-8, need not be null-terminated, and may be NULL only when this is 0.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  secret_destroy:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Destroys the secret, releasing its resources. Values and views retrieved from it must not be used afterwards,
      except values the caller owns.

      Null-safe: passing a null pointer or null handle is a no-op. The handle is set to null on return to prevent
      double-destruction. Must only be called on an owned secret, never on the borrowed ones of a create callback.
    role: destructor
    belongs_to: secret
    parameters:
      secret:
        type: secret
        indirection: 1
        description: "The secret to destroy."
    return_type: ERROR

  #---------------------------------------------------------------------------------------------------------------------
  # Reading a secret
  #---------------------------------------------------------------------------------------------------------------------

  secret_get_property:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Borrows a string property of the secret, see `SECRET_PROPERTY`. Empty when the property is not set, except the
      persist type, which then reads back as `default`.
    role: getter
    belongs_to: secret
    parameters:
      secret:
        type: secret
        description: "The secret."
      property:
        type: SECRET_PROPERTY
        description: "The property to read."
      value:
        type: char
        indirection: 2
        const: true
        kind: OUT_BORROW
        description: "Receives a borrowed pointer to the value. Valid until the secret is destroyed or the property is set again."
      value_length:
        type: idx
        indirection: 1
        kind: OUT
        description: Receives the length of `*value` in bytes. `*value` is not guaranteed to be null-terminated.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  secret_get_scope_count:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Retrieves the number of scopes of the secret.
    role: getter
    belongs_to: secret
    parameters:
      secret:
        type: secret
        description: "The secret."
      count:
        type: idx
        indirection: 1
        kind: OUT
        description: "Receives the number of scopes."
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  secret_get_scope:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Borrows a scope of the secret, in the order added.

      Fails with `ERROR_INPUT_OUT_OF_RANGE` when the index is not below `[[secret_get_scope_count]]`.
    role: getter
    belongs_to: secret
    parameters:
      secret:
        type: secret
        description: "The secret."
      index:
        type: idx
        description: "The index of the scope."
      scope:
        type: char
        indirection: 2
        const: true
        kind: OUT_BORROW
        description: "Receives a borrowed pointer to the scope. Valid until the secret is destroyed or its scopes change (`[[secret_add_scope]]`, `[[secret_clear_scope]]`)."
      scope_length:
        type: idx
        indirection: 1
        kind: OUT
        description: Receives the length of `*scope` in bytes. `*scope` is not guaranteed to be null-terminated.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  secret_get_key_count:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Retrieves the number of keys of the secret.
    role: getter
    belongs_to: secret
    parameters:
      secret:
        type: secret
        description: "The secret."
      count:
        type: idx
        indirection: 1
        kind: OUT
        description: "Receives the number of keys."
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  secret_get_key:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Borrows a key of the secret. The order is unspecified but stable for the handle.

      Fails with `ERROR_INPUT_OUT_OF_RANGE` when the index is not below `[[secret_get_key_count]]`.
    role: getter
    belongs_to: secret
    parameters:
      secret:
        type: secret
        description: "The secret."
      index:
        type: idx
        description: "The index of the key."
      key:
        type: char
        indirection: 2
        const: true
        kind: OUT_BORROW
        description: "Receives a borrowed pointer to the key. Valid until the secret is destroyed."
      key_length:
        type: idx
        indirection: 1
        kind: OUT
        description: Receives the length of `*key` in bytes. `*key` is not guaranteed to be null-terminated.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  secret_get_value:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Retrieves the value of a key of the secret, unredacted. The returned value is owned by the caller and must be
      destroyed via `[[value_destroy]]`.

      A key the secret does not have is not an error: `value` receives a null handle then, which tells it apart from a
      key holding a NULL value. Keys are matched case-insensitively.
    role: getter
    belongs_to: secret
    parameters:
      secret:
        type: secret
        description: "The secret."
      key:
        type: char
        indirection: 1
        const: true
        kind: IN
        description: "The key to read."
      key_length:
        type: idx
        description: The length of `key` in bytes. `key` must be valid UTF-8, need not be null-terminated, and may be NULL only when this is 0.
      value:
        type: value
        indirection: 1
        kind: OUT
        description: "Receives the value, or a null handle if the secret has no such key. Owned by the caller; destroy via `[[value_destroy]]`."
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  secret_is_key_redacted:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Retrieves whether the value of the key is redacted when the secret is displayed. A key the secret does not have
      is not redacted.
    role: getter
    belongs_to: secret
    parameters:
      secret:
        type: secret
        description: "The secret."
      key:
        type: char
        indirection: 1
        const: true
        kind: IN
        description: "The key to check."
      key_length:
        type: idx
        description: The length of `key` in bytes. `key` must be valid UTF-8, need not be null-terminated, and may be NULL only when this is 0.
      redacted:
        type: bool
        indirection: 1
        kind: OUT
        description: "Receives whether the key is redacted."
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  #---------------------------------------------------------------------------------------------------------------------
  # Finding and creating secrets
  #---------------------------------------------------------------------------------------------------------------------

  context_lookup_secret:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Looks up the secret of a type that applies best to a path, the way DuckDB resolves the credentials of a file it
      opens.

      Of the secrets of the type visible to the context's transaction, the one whose scope is the longest prefix of
      the path wins; a secret without scope matches every path with the lowest score. When no secret matches, `secret`
      receives a null handle and the call still succeeds. The returned secret is a copy owned by the caller, to
      destroy via `[[secret_destroy]]`.

      The lookup also sees secrets created in the transaction with the `transaction` persist type.
    role: method
    belongs_to: context
    parameters:
      ctx:
        type: context
        description: "The context to look up in."
      path:
        type: char
        indirection: 1
        const: true
        kind: IN
        description: "The path to find a secret for, e.g. `s3://bucket/key`."
      path_length:
        type: idx
        description: The length of `path` in bytes. `path` must be valid UTF-8, need not be null-terminated, and may be NULL only when this is 0.
      type:
        type: char
        indirection: 1
        const: true
        kind: IN
        description: "The secret type to look for, e.g. `s3`."
      type_length:
        type: idx
        description: The length of `type` in bytes. `type` must be valid UTF-8, need not be null-terminated, and may be NULL only when this is 0.
      secret:
        type: secret
        indirection: 1
        kind: OUT
        description: "Receives the best matching secret, or a null handle if none matches. Owned by the caller."
      score:
        type: i64
        indirection: 1
        kind: OUT
        description: "Optional. Receives how well the secret matches: the length of the longest matching scope prefix, higher is better. Undefined when nothing matched. Lets the caller rank the matches of several types."
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  context_get_secret_by_name:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Looks up a secret by its name, across all storages.

      When no secret has the name, `secret` receives a null handle and the call still succeeds. The type is not
      checked: compare `SECRET_PROPERTY_TYPE` read with `[[secret_get_property]]`. The returned secret is a copy owned
      by the caller, to destroy via `[[secret_destroy]]`.

      Fails with `ERROR_CONFIGURATION_INVALID` when more than one storage holds a secret of the name.
    role: method
    belongs_to: context
    parameters:
      ctx:
        type: context
        description: "The context to look up in."
      name:
        type: char
        indirection: 1
        const: true
        kind: IN
        description: "The name of the secret."
      name_length:
        type: idx
        description: The length of `name` in bytes. `name` must be valid UTF-8, need not be null-terminated, and may be NULL only when this is 0.
      secret:
        type: secret
        indirection: 1
        kind: OUT
        description: "Receives the secret, or a null handle if there is none of that name. Owned by the caller."
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  context_create_secret:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Creates a secret, as the equivalent `CREATE SECRET` statement would, in the context's transaction.

      The keys of the given secret are the named parameters of the statement. The secret function for its type and
      provider runs to build the stored secret, and the secret manager stores it according to its persist type and
      storage. Use the `transaction` persist type for credentials that must not outlive the transaction. `created` is
      optional: when given, it receives a copy of the secret that now exists, which with `SECRET_ON_CONFLICT_IGNORE`
      is the existing one. The copy is owned by the caller, to destroy via `[[secret_destroy]]`.

      Redacted keys of the given secret are ignored: the provider decides which keys of the stored secret are redacted.
      A secret read back with storage `transaction` (a transaction secret) is created with the `transaction` persist
      type. Fails with `ERROR_CONFIGURATION_PERMISSION` when `enable_external_access` is off, before the keys are
      checked, as `CREATE SECRET` does.

      To refresh a secret, create a new one through its provider: copy the old secret's properties
      (`[[secret_get_property]]` / `[[secret_set_property]]`, skipping empty ones) and scopes, set the refresh options
      as keys, and create it with `SECRET_ON_CONFLICT_REPLACE`. Do not copy the old secret's keys as is: they are the
      stored values, not the provider's named parameters.
    role: method
    belongs_to: context
    parameters:
      ctx:
        type: context
        description: "The context to create the secret in."
      secret:
        type: secret
        description: "The description of the secret. Borrowed."
      on_conflict:
        type: SECRET_ON_CONFLICT
        description: "What to do when a secret of the same name exists."
      created:
        type: secret
        indirection: 1
        kind: OUT
        description: "Optional. Receives the secret. Owned by the caller."
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  connection_lookup_secret:
    lifecycle:
