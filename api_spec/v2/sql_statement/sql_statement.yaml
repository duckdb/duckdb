  sql_statement_get_type:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-09-11" ]
    description: |
      Returns the statement's type as the parser classified it.

      This is the type before execution rewrites the statement, if it does: a
      PRAGMA reports PRAGMA even where it runs as a SELECT or a CALL, and
      `[[result_get_statement_type]]` on the result reports what it became. A
      statement the parser splits into several reports MULTI; its parts are not
      visible here, and `[[statement_bind]]` rejects it.
    role: getter
    belongs_to: sql_statement
    parameters:
      statement:
        type: sql_statement
        description: The statement.
      out_type:
        type: STATEMENT_TYPE
        indirection: 1
        kind: OUT
        description: Receives the statement type.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: ERROR

  sql_statement_get_text:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-09-11" ]
    description: |
      Borrows the statement's own SQL text.

      The slice of the parsed string that belongs to this statement: a trailing
      terminator and the whitespace after it are included, whitespace and
      comments before the first token are not. The statement holds its own
      copy, so the view stays valid after the SQL string and the iterator are
      gone, until the statement is destroyed.
    role: getter
    belongs_to: sql_statement
    parameters:
      statement:
        type: sql_statement
        description: The statement.
      out_text:
        type: str
        indirection: 1
        kind: OUT_BORROW
        description: Receives a borrowed view of the statement text, valid until the statement is destroyed.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: ERROR

  sql_statement_get_parameter_count:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-09-11" ]
    description: |
      Returns how many distinct parameters the statement declares. Does not
      block.

      Counts the parameters the parser found ($1, ?, $name, ...); repeated uses
      of one parameter count once. The parameter types come from
      `[[statement_bind]]`.
    role: getter
    belongs_to: sql_statement
    parameters:
      statement:
        type: sql_statement
        description: The statement.
      out_count:
        type: idx
        indirection: 1
        kind: OUT
        description: Receives the number of distinct parameters.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: ERROR

  sql_statement_get_parameter_name:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-09-11" ]
    description: |
      Borrows the name of one parameter, in binding order. Does not block.

      Positions match `[[statement_bind]]`'s parameter schema, so position i
      here names field i there. The name is the key
      `[[execute_args_set_statement_params]]` binds by: "1", "2", ... for a
      positional parameter ($1 or ?), the identifier for a named one ($name).
      Positional indices may be gapped ($1 and $3 without $2), in which case
      the names are "1" and "3" at positions 0 and 1. The view is valid until
      the statement is destroyed. An index outside [0, count) is rejected with
      ERROR_INPUT_OUT_OF_RANGE.
    role: getter
    belongs_to: sql_statement
    parameters:
      statement:
        type: sql_statement
        description: The statement.
      index:
        type: idx
        description: Zero-based position in binding order.
      out_name:
        type: identifier
        indirection: 1
        kind: OUT_BORROW
        description: Receives a borrowed view of the parameter name, valid until the statement is destroyed.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: ERROR

  sql_statement_destroy:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-08-04" ]
    description: |
      Destroys a statement handle.

      Null-safe: passing nullptr or a slot already set to nullptr is a no-op.
      Statements are borrowed, never consumed, so every one is destroyed here
      once it is no longer needed. On success the slot is set to nullptr.
    role: destructor
    belongs_to: sql_statement
    parameters:
      statement:
        type: sql_statement
        indirection: 1
        description: The statement to destroy.
    return_type: ERROR

  statement_iterator_destroy:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-08-04" ]
    description: |
      Destroys a statement iterator handle.

      Null-safe: passing nullptr or a slot already set to nullptr is a no-op.
      Statements already yielded are independently owned and stay valid. On
      success the slot is set to nullptr.
    role: destructor
    belongs_to: statement_iterator
    parameters:
      iterator:
        type: statement_iterator
        indirection: 1
        description: The iterator to destroy.
    return_type: ERROR
