module: sql_statement
#
# Turn a SQL string into individual statements. parse_sql parses and nothing
# more: no tables are looked up, no transaction is started, nothing runs. The
# connection supplies the parser's settings and any parser extensions loaded on
# it, so a statement parsed on one connection is meant for that connection.
#
# The iterator hands out one owned statement per statement_iterator_next call.
# A parse error comes back either from parse_sql, which then yields no
# statements at all, or from the statement_iterator_next call that reaches the
# failing statement; check every return code.
#
# Statements are borrowed, not consumed: statement_bind, statement_execute and
# prepared_statement_create all work from a copy, so the same statement can be
# used again — with different parameter values, say — and the caller always
# destroys it with sql_statement_destroy. That is what "borrowed" means
# wherever this API uses the word.
#
# A statement carries what the parser knows: its type, its own text, and the
# names of its parameters, each with its own getter. Anything that needs the
# catalog — result columns, parameter types — comes from statement_bind.

handles:
  sql_statement:
    description: |
      An owned handle to a single parsed SQL statement, produced by
      statement_iterator_next. Binding, preparing and executing it all work
      from a copy, so the caller always destroys it via sql_statement_destroy.
    cleanup_with: sql_statement_destroy
  statement_iterator:
    description: |
      An owned handle to an iterator over the statements of a SQL string,
      produced by parse_sql. Destroy it via statement_iterator_destroy;
      statements it already handed out are owned separately and unaffected.
    cleanup_with: statement_iterator_destroy
enums:
  STATEMENT_TYPE:
    description: |
      SQL statement type of a parsed statement or an executed query.
    values:
      STATEMENT_TYPE_INVALID:
        value: 0
      STATEMENT_TYPE_SELECT:
        value: 1
      STATEMENT_TYPE_INSERT:
        value: 2
      STATEMENT_TYPE_UPDATE:
        value: 3
      STATEMENT_TYPE_CREATE:
        value: 4
      STATEMENT_TYPE_DELETE:
        value: 5
      STATEMENT_TYPE_PREPARE:
        value: 6
      STATEMENT_TYPE_EXECUTE:
        value: 7
      STATEMENT_TYPE_ALTER:
        value: 8
      STATEMENT_TYPE_TRANSACTION:
        value: 9
      STATEMENT_TYPE_COPY:
        value: 10
      STATEMENT_TYPE_ANALYZE:
        value: 11
      STATEMENT_TYPE_VARIABLE_SET:
        value: 12
      STATEMENT_TYPE_CREATE_FUNC:
        value: 13
      STATEMENT_TYPE_EXPLAIN:
        value: 14
      STATEMENT_TYPE_DROP:
        value: 15
      STATEMENT_TYPE_EXPORT:
        value: 16
      STATEMENT_TYPE_PRAGMA:
        value: 17
      STATEMENT_TYPE_VACUUM:
        value: 18
      STATEMENT_TYPE_CALL:
        value: 19
      STATEMENT_TYPE_SET:
        value: 20
      STATEMENT_TYPE_LOAD:
        value: 21
      STATEMENT_TYPE_RELATION:
        value: 22
      STATEMENT_TYPE_EXTENSION:
        value: 23
      STATEMENT_TYPE_LOGICAL_PLAN:
        value: 24
      STATEMENT_TYPE_ATTACH:
        value: 25
      STATEMENT_TYPE_DETACH:
        value: 26
      STATEMENT_TYPE_MULTI:
        value: 27
      STATEMENT_TYPE_COPY_DATABASE:
        value: 28
      STATEMENT_TYPE_UPDATE_EXTENSIONS:
        value: 29
      STATEMENT_TYPE_MERGE_INTO:
        value: 30
      STATEMENT_TYPE_CONNECT:
        value: 31
      STATEMENT_TYPE_DISCONNECT:
        value: 32
      STATEMENT_TYPE_EXTERNAL_RESOURCE:
        value: 33
functions:
  parse_sql:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-08-04" ]
    description: |
      Parses a SQL string into an iterator over its statements. Does not block.

      Parses and nothing more: no tables are looked up, no transaction is
      started, and the connection is otherwise untouched. The SQL string is
      copied, so the caller may free it once this call returns. An input with
      no statements — empty, whitespace, or separators only — yields an
      iterator that is immediately exhausted. A parse error may come back here
      or from statement_iterator_next.
    role: constructor
    belongs_to: statement_iterator
    parameters:
      conn:
        type: connection
        description: The connection supplying the parser configuration.
      sql:
        type: char
        indirection: 1
        const: true
        description: Null-terminated SQL string; may contain any number of statements.
      out_iterator:
        type: statement_iterator
        indirection: 1
        kind: OUT
        description: Receives the new iterator handle.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: ERROR

  statement_iterator_next:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-08-04" ]
    description: |
      Returns the next statement, or NULL when there are none left. Does not
      block.

      *out_statement receives an owned statement, which the caller destroys via
      sql_statement_destroy, or NULL once the iterator is exhausted — and it
      keeps reporting NULL, so calling again is harmless. A parse error comes
      back no later than the call that reaches the failing statement, and
      *out_statement is then set to NULL.
    role: method
    belongs_to: statement_iterator
    parameters:
      iterator:
        type: statement_iterator
        description: The iterator to advance.
      out_statement:
        type: sql_statement
        indirection: 1
        kind: OUT
        description: Receives an owned statement, or NULL when the iterator is exhausted.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: ERROR

  statement_bind:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-08-04" ]
    description: |
      Works out the statement's columns and parameter types without running it.
      Blocks only for as long as that takes.

      out_schema receives the columns the statement would produce. It is never
      empty: a non-SELECT reports a single status column, either a BIGINT
      changed-rows count or a BOOLEAN success. out_parameters, when non-NULL,
      receives the parameter types in binding order. Both are owned; destroy
      them via schema_destroy.

      The statement is borrowed, so it can be bound again and executed later.
      Binding does not start a query and does not disturb a result or stream
      that is already live on the connection. Unknown tables, type errors and
      the like come back here, as they would from statement_execute. A
      statement that expands into several (see the query_result module) cannot
      be bound and is rejected with ERROR_INPUT_INVALID; execute it instead.

      *out_schema and *out_parameters are set to NULL on failure.
    role: method
    belongs_to: sql_statement
    parameters:
      conn:
        type: connection
        description: The connection supplying the catalog, transaction, and parser configuration.
      statement:
        type: sql_statement
        description: The statement to bind. Borrowed; not consumed.
      out_schema:
        type: schema
        indirection: 1
        kind: OUT
        description: Receives the owned output schema (result columns). Destroy via schema_destroy.
      out_parameters:
        type: schema
        indirection: 1
        kind: OUT
        description: Optional. When non-NULL, receives the owned input schema (parameter types, ordered by binding index). Destroy via schema_destroy.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: ERROR

