module: connection

functions:
  connection_create:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-08-04" ]
    description: |
      Opens a connection to an instance.

      Each connection carries its own client context and session-scoped (LOCAL)
      settings. Connections to the same instance share its catalog, buffer
      pool, and transaction manager. A connection may be created before any
      database is attached to the instance; until one is, only the system
      catalog and the connection's temporary catalog are visible. The caller
      destroys it via `[[connection_destroy]]`.
    role: constructor
    belongs_to: connection
    parameters:
      instance:
        type: instance
        description: "The instance to connect to."
      out_conn:
        type: connection
        indirection: 1
        kind: OUT
        description: "Receives the new connection handle."
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`."
    return_type: ERROR
  connection_destroy:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-08-04" ]
    description: |
      Destroys the connection.

      Always succeeds. Releases the connection's reference on the underlying
      database instance, which survives for as long as anything else still
      references it. On success the handle is set to null. Safe to call on an
      already-null slot.
    role: destructor
    belongs_to: connection
    parameters:
      conn:
        type: connection
        indirection: 1
        description: "The connection to destroy."
    return_type: ERROR
  connection_interrupt:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-08-04" ]
    description: |
      Interrupts the query currently executing on the connection.

      The cross-thread (but not cross-connection) cancellation entry point
      for streaming results: safe to call from any thread within the execution
      of a query through a connection, including while another thread steps
      the query's result. A no-op when no query is active. Cancellation surfaces
      on the consuming side as step status CANCELLED (`[[result_step]]`), or as
      ERROR_RUNTIME_INTERRUPT (`[[result_fetch_chunk]]`).
    role: method
    belongs_to: connection
    parameters:
      conn:
        type: connection
        description: "The connection whose active query to interrupt."
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`."
    return_type: ERROR
  connection_progress_get:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-08-04" ]
    description: |
      Captures a snapshot of the active query's execution progress.

      Reads the percentage and row counts from one consistent snapshot
      of the query currently executing on the connection. Safe to call
      from any thread, including while another thread steps the query's
      result.

      Progress is published only when the enable_progress_bar option is
      set; the bridge does not enable tracking itself. Both row counts
      are 0 when no information is available. The percentage is -1 when
      tracking is disabled, no query is active, or no progress has been
      published yet.
    role: getter
    belongs_to: connection
    parameters:
      conn:
        type: connection
        description: "The connection."
      out_percentage:
        type: f64
        indirection: 1
        kind: OUT
        description: "Receives the percentage complete in [0, 100], -1 if tracking is disabled, no query is active, or no progress has been published yet."
      out_rows_processed:
        type: u64
        indirection: 1
        kind: OUT
        description: "Receives the number of rows processed so far."
      out_total_rows_to_process:
        type: u64
        indirection: 1
        kind: OUT
        description: "Receives the total number of rows the query will process."
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`."
    return_type: ERROR
  connection_get_current_catalog:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-19" ]
    description: |
      Reads the name of the connection's current default catalog.

      This is the catalog unqualified DDL goes to and the one `USE` selects; for a
      connection that never chose one it is the instance's default database. The
      name is delivered through `sink` rather than returned, so nothing allocates a
      buffer the caller has to free.
    role: method
    belongs_to: connection
    parameters:
      conn:
        type: connection
        description: "The connection."
      sink:
        type: text_sink
        description: Receives the catalog name in a single call. Borrowed for the duration of that call; see text_sink for the full contract.
      user_data:
        type: void
        indirection: 1
        description: Opaque pointer passed through to sink untouched. May be NULL.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`."
    return_type: ERROR
  connection_get_current_schema:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-19" ]
    description: |
      Reads the name of the connection's current default schema.

      This is the schema unqualified names resolve to first, `main` unless the
      connection chose another. The name is delivered through `sink` rather than
      returned, so nothing allocates a buffer the caller has to free.
    role: method
    belongs_to: connection
    parameters:
      conn:
        type: connection
        description: "The connection."
      sink:
        type: text_sink
        description: Receives the schema name in a single call. Borrowed for the duration of that call; see text_sink for the full contract.
      user_data:
        type: void
        indirection: 1
        description: Opaque pointer passed through to sink untouched. May be NULL.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`."
    return_type: ERROR
  connection_set_current_catalog:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-19" ]
    description: |
      Makes a catalog the connection's current default catalog.

      Like SQL `USE catalog`: the current schema becomes that catalog's default
      schema. Affects this connection only. Fails when no such catalog is attached.
    role: method
    belongs_to: connection
    parameters:
      conn:
        type: connection
        description: "The connection."
      catalog:
        type: char
        indirection: 1
        const: true
        kind: IN
        description: The name of an attached catalog, as a single identifier.
      catalog_length:
        type: idx
        description: The length of `catalog` in bytes. `catalog` need not be null-terminated and may be NULL only when this is 0.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`."
    return_type: ERROR
  connection_set_current_schema:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-19" ]
    description: |
      Makes a schema the connection's current default schema.

      Like SQL `SET schema = name`: the catalog stays as it was. Affects this
      connection only.
    role: method
    belongs_to: connection
    parameters:
      conn:
        type: connection
        description: "The connection."
      schema:
        type: char
        indirection: 1
        const: true
        kind: IN
        description: The schema name, as a single identifier.
      schema_length:
        type: idx
        description: The length of `schema` in bytes. `schema` need not be null-terminated and may be NULL only when this is 0.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`."
    return_type: ERROR
  connection_get_profiling_information:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-19" ]
    description: |
      Renders the profiling output of the connection's last query.

      The output is only populated while profiling is enabled, via the
      `enable_profiling` setting. The format is one of the profiler's format names,
      such as `json`, `text`, `html`, `graphviz` or `mermaid`; an empty format
      selects the default.
    role: method
    belongs_to: connection
    parameters:
      conn:
        type: connection
        description: "The connection."
      format:
        type: char
        indirection: 1
        const: true
        kind: IN
        description: The profiler format name, such as `json`, `text`, `html`, `graphviz` or `mermaid`; empty selects the default.
      format_length:
        type: idx
        description: The length of `format` in bytes. `format` need not be null-terminated and may be NULL only when this is 0.
      sink:
        type: text_sink
        description: Receives the profiling output in a single call. Borrowed for the duration of that call; see text_sink for the full contract.
      user_data:
        type: void
        indirection: 1
        description: Opaque pointer passed through to sink untouched. May be NULL.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`."
    return_type: ERROR
