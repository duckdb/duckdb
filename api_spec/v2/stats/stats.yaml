module: stats
#
# Statistics describe the values an expression or a column can produce. The engine propagates them through a query
# plan and uses them to simplify it, e.g. to fold `x IS NULL` to false when `x` cannot be NULL. A function takes part
# in that propagation through its stats callback (`[[scalar_function_set_stats_callback]]`,
# `[[aggregate_function_set_stats_callback]]`, `[[table_function_set_stats_callback]]`), which reads the statistics of
# its arguments and narrows the statistics of its result.
#
# Every statistic states what can occur, never what does occur: `true` means a kind of value may be present, `false`
# guarantees it is absent. The engine relies on the guarantees, so a statistic that claims less than the data holds
# produces wrong query results.

#-----------------------------------------------------------------------------------------------------------------------
# Handles
#-----------------------------------------------------------------------------------------------------------------------
handles:
  stats:
    description: |
      A borrowed opaque handle to the statistics of an expression or a column. A stats callback receives it for the
      result it describes and for each of its arguments; it is valid only for the duration of that callback.

      The statistics of an argument are read-only, and the setters fail on them. The statistics of the result start
      out unknown, with every kind of value possible, and the callback narrows them through the setters. A callback
      that leaves the result unchanged tells the engine nothing.

  statistics:
    description: |
      An owned opaque handle to the statistics of a column: what is known about the values the column holds without
      reading them - whether it can hold NULLs and non-NULL values, a minimum and a maximum for numeric and string
      columns, the statistics of the children of a LIST / ARRAY / STRUCT column, the shredding of a VARIANT column and
      the extent of a GEOMETRY column. The statistics start out "unknown" (claiming nothing) when created with
      `[[statistics_create]]`, are narrowed with the `statistics_set_*` functions, combined with `[[statistics_merge]]`,
      and destroyed with `[[statistics_destroy]]`. A table function hands them to the engine from its "statistics"
      callback through `[[table_function_statistics_set_result]]`.

#-----------------------------------------------------------------------------------------------------------------------
# Functions
#-----------------------------------------------------------------------------------------------------------------------
functions:
  #---------------------------------------------------------------------------------------------------------------------
  # Validity
  #---------------------------------------------------------------------------------------------------------------------
  stats_can_have_null:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-10-02" ]
    description: |
      Returns whether the values described can include NULL.

      False guarantees that every value is non-NULL.
    parameters:
      stats:
        type: stats
        description: The statistics to read.
      out:
        type: bool
        indirection: 1
        kind: OUT
        description: Receives true if a value can be NULL, false if none can.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  stats_can_have_valid:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-10-02" ]
    description: |
      Returns whether the values described can include a valid, non-NULL value.

      False guarantees that every value is NULL. When both this and `[[stats_can_have_null]]` are false, there are no
      values at all.
    parameters:
      stats:
        type: stats
        description: The statistics to read.
      out:
        type: bool
        indirection: 1
        kind: OUT
        description: Receives true if a value can be non-NULL, false if none can.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  stats_set_can_have_null:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-10-02" ]
    description: |
      Sets whether the values described can include NULL.

      Setting false is a guarantee the engine relies on: a NULL among the values then produces wrong query results.
      Setting true is always safe. Fails with `ERROR_INPUT_INVALID` on read-only statistics, such as those of an
      argument.
    parameters:
      stats:
        type: stats
        description: The statistics to modify.
      value:
        type: bool
        description: True if a value can be NULL, false if none can.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  stats_set_can_have_valid:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-10-02" ]
    description: |
      Sets whether the values described can include a valid, non-NULL value.

      Setting false is a guarantee the engine relies on: a non-NULL value among the values then produces wrong query
      results. Setting true is always safe. Fails with `ERROR_INPUT_INVALID` on read-only statistics, such as those of
      an argument.
    parameters:
      stats:
        type: stats
        description: The statistics to modify.
      value:
        type: bool
        description: True if a value can be non-NULL, false if none can.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  #---------------------------------------------------------------------------------------------------------------------
  # Statistics object
  #---------------------------------------------------------------------------------------------------------------------
  statistics_create:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-10-30" ]
    description: |
      Creates the statistics of a column of the given type through a factory.

      The statistics start out unknown: they claim nothing about the values (NULLs and non-NULL values may occur, no bounds,
      and the statistics of the children of a nested type are unknown too). Narrow them with the `statistics_set_*`
      functions. The caller owns the returned handle and must destroy it with `[[statistics_destroy]]`.
    role: constructor
    belongs_to: statistics
    parameters:
      factory:
        type: factory
        description: The factory to create the statistics through.
      type:
        type: logical_type
        description: The type of the column the statistics describe. Borrowed and copied.
      statistics:
        type: statistics
        indirection: 1
        kind: OUT
        description: On success, receives the newly created statistics. Owned by the caller.
      err:
        type: error_info
        indirection: 1
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`."
    return_type: ERROR

  statistics_create_variant_shredded:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-10-30" ]
    description: |
      Creates the statistics of a VARIANT column that is shredded: its values are stored in a structured ("typed") layout
      next to the generic one, and `shredded_statistics` describe that layout.

      The structured layout is a tree of `STRUCT(typed_value <T>, untyped_value_index UINTEGER)` nodes - one per field of
      an OBJECT, per element of an ARRAY and per primitive leaf - whose type `[[statistics_variant_shredding_type]]` derives
      from the structured type the values are shredded on; `shredded_statistics` must be statistics of that type. Within a
      node, the statistics of `typed_value` describe the values stored in the typed layout and those of
      `untyped_value_index` whether any value fell back to the generic layout: a node whose `untyped_value_index` is known
      to hold no index (its minimum and maximum are 0, and it holds no NULL) is fully shredded, so that a filter on the
      field can be answered from the typed statistics. The resulting VARIANT statistics claim nothing about NULLs; narrow
      them with `[[statistics_set_has_null]]` and `[[statistics_set_has_no_null]]`. The caller owns the returned handle and
      must destroy it with `[[statistics_destroy]]`.
    role: constructor
    belongs_to: statistics
    parameters:
      factory:
        type: factory
        description: The factory to create the statistics through.
      shredded_statistics:
        type: statistics
        description: The statistics of the shredded layout. Borrowed and copied.
      statistics:
        type: statistics
        indirection: 1
        kind: OUT
        description: On success, receives the newly created VARIANT statistics. Owned by the caller.
      err:
        type: error_info
        indirection: 1
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`."
    return_type: ERROR

  statistics_variant_shredding_type:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-10-30" ]
    description: |
      Derives the type of the shredded layout of a VARIANT column from the structured type its values are shredded on:
      every level of the structured type - a STRUCT (an OBJECT), a LIST (an ARRAY) or a primitive type - is wrapped in a
      `STRUCT(typed_value <level>, untyped_value_index UINTEGER)`. Statistics of this type describe the shredded layout for
      `[[statistics_create_variant_shredded]]`.
    parameters:
      factory:
        type: factory
        description: The factory to create the type through.
      structured_type:
        type: logical_type
        description: The structured type the values are shredded on. Borrowed.
      type:
        type: logical_type
        indirection: 1
        kind: OUT
        description: On success, receives the type of the shredded layout. Owned by the caller, destroy via `[[logical_type_destroy]]`.
      err:
        type: error_info
        indirection: 1
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`."
    return_type: ERROR

  statistics_set_has_null:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-10-30" ]
    description: |
      Sets whether the column can hold NULL values. Unknown statistics say it can; claim it cannot only when no value of the
      column is NULL.
    role: method
    belongs_to: statistics
    parameters:
      statistics:
        type: statistics
        description: The statistics to narrow.
      has_null:
        type: bool
        description: Whether NULL values can occur.
      err:
        type: error_info
        indirection: 1
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`."
    return_type: ERROR

  statistics_set_has_no_null:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-10-30" ]
    description: |
      Sets whether the column can hold non-NULL values. Unknown statistics say it can; claim it cannot only when every value
      of the column is NULL.
    role: method
    belongs_to: statistics
    parameters:
      statistics:
        type: statistics
        description: The statistics to narrow.
      has_no_null:
        type: bool
        description: Whether non-NULL values can occur.
      err:
        type: error_info
        indirection: 1
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`."
    return_type: ERROR

  statistics_set_min:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-10-30" ]
    description: |
      Sets the minimum value of a numeric column (an integer, a floating point number, a DECIMAL, a date / time / timestamp,
      an INTERVAL, a UUID or a BOOLEAN): no value of the column is smaller. The value is cast to the column's type; a NULL
      value removes the bound. Fails with `ERROR_INPUT_INVALID` for statistics of a type without a numeric minimum (use
      `[[statistics_set_string_min]]` for VARCHAR and BLOB) or a value that does not cast to the type.
    role: method
    belongs_to: statistics
    parameters:
      statistics:
        type: statistics
        description: The statistics to narrow.
      value:
        type: value
        description: The minimum value. Borrowed and copied.
      err:
        type: error_info
        indirection: 1
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`."
    return_type: ERROR

  statistics_set_max:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-10-30" ]
    description: |
      Sets the maximum value of a numeric column: no value of the column is larger. The value is cast to the column's type;
      a NULL value removes the bound. A FLOAT / DOUBLE column that can hold NaN values, which compare larger than any
      number, must report NaN as its maximum. Fails with `ERROR_INPUT_INVALID` for statistics of a type without a numeric
      maximum or a value that does not cast to the type.
    role: method
    belongs_to: statistics
    parameters:
      statistics:
        type: statistics
        description: The statistics to narrow.
      value:
        type: value
        description: The maximum value. Borrowed and copied.
      err:
        type: error_info
        indirection: 1
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`."
    return_type: ERROR

  statistics_set_string_min:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-10-30" ]
    description: |
      Sets the minimum of a VARCHAR or BLOB column: no value of the column sorts before `value` (in binary order). An exact
      minimum is a value of the column; a truncated one is a prefix of the minimum (as a file format stores it), which may
      then be shorter than the values and need not be valid UTF-8. The bytes are borrowed and copied. Fails with
      `ERROR_INPUT_INVALID` for statistics of another type.
    role: method
    belongs_to: statistics
    parameters:
      statistics:
        type: statistics
        description: The statistics to narrow.
      value:
        type: str
        indirection: 1
        description: The minimum, or a prefix of it. Borrowed and copied.
      is_exact:
        type: bool
        description: Whether `value` is the minimum itself rather than a truncated prefix of it.
      err:
        type: error_info
        indirection: 1
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`."
    return_type: ERROR

  statistics_set_string_max:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-10-30" ]
    description: |
      Sets the maximum of a VARCHAR or BLOB column: no value of the column sorts after `value` (in binary order). An exact
      maximum is a value of the column; a truncated one is a prefix that sorts after every value (as a file format stores
      it), which may then be shorter than the values and need not be valid UTF-8. The bytes are borrowed and copied. Fails
      with `ERROR_INPUT_INVALID` for statistics of another type.
    role: method
    belongs_to: statistics
    parameters:
      statistics:
        type: statistics
        description: The statistics to narrow.
      value:
        type: str
        indirection: 1
        description: The maximum, or a truncated bound of it. Borrowed and copied.
      is_exact:
        type: bool
        description: Whether `value` is the maximum itself rather than a truncated bound.
      err:
        type: error_info
        indirection: 1
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`."
    return_type: ERROR

  statistics_set_constant:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-10-30" ]
    description: |
      Makes the statistics those of a column whose every value is `value`: its minimum and maximum are the value (for a
      VARCHAR / BLOB column its exact bounds, together with its length), and it holds no other value. A NULL value describes
      a column of NULLs. The value is cast to the column's type and is borrowed and copied. Replaces what the statistics
      claimed before. Fails with `ERROR_INPUT_INVALID` when the value does not cast to the type.
    role: method
    belongs_to: statistics
    parameters:
      statistics:
        type: statistics
        description: The statistics to set.
      value:
        type: value
        description: The only value of the column. Borrowed and copied.
      err:
        type: error_info
        indirection: 1
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`."
    return_type: ERROR

  statistics_set_distinct_count:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-10-30" ]
    description: |
      Sets the estimated number of distinct values of the column (0: unknown).
    role: method
    belongs_to: statistics
    parameters:
      statistics:
        type: statistics
        description: The statistics to narrow.
      count:
        type: idx
        description: The estimated number of distinct values.
      err:
        type: error_info
        indirection: 1
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`."
    return_type: ERROR

  statistics_set_child:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-10-30" ]
    description: |
      Sets the statistics of a child of a nested column: the elements of a LIST or ARRAY column (child 0), or the field at
      `child_index` of a STRUCT column (a MAP column is a LIST of `STRUCT(key, value)` entries: its entries are child 0,
      whose children 0 and 1 are the keys and the values). The child statistics must be of the child's type; they are
      borrowed and copied. A null child resets the child's statistics to unknown. Fails with `ERROR_INPUT_INVALID` for
      statistics of a type without children, an index out of range or child statistics of another type.
    role: method
    belongs_to: statistics
    parameters:
      statistics:
        type: statistics
        description: The statistics to narrow.
      child_index:
        type: idx
        description: The index of the child.
      child:
        type: statistics
        description: The statistics of the child, or null for unknown statistics. Borrowed and copied.
      err:
        type: error_info
        indirection: 1
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`."
    return_type: ERROR

  statistics_merge:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-10-30" ]
    description: |
      Merges the statistics of another part of the column into these: afterwards the statistics hold for the values of both
      parts together (the bounds widen, NULLs can occur when they can in either, the children are merged, a VARIANT shredded
      differently in the two parts becomes inconsistently shredded). This is how the statistics of the row groups of a file
      are combined into those of the file. Both must be of the same type; `other` is borrowed and left unchanged.
    role: method
    belongs_to: statistics
    parameters:
      statistics:
        type: statistics
        description: The statistics to widen.
      other:
        type: statistics
        description: The statistics of the other part of the column. Borrowed.
      err:
        type: error_info
        indirection: 1
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`."
    return_type: ERROR

  statistics_set_geometry_extent:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-10-30" ]
    description: |
      Sets the bounding box of a GEOMETRY column: every vertex of every geometry lies within it. The Z and M bounds are only
      set when the geometries have those coordinates (`has_z` / `has_m`); the others are left unknown. Fails with
      `ERROR_INPUT_INVALID` for statistics of another type or a minimum larger than its maximum.
    role: method
    belongs_to: statistics
    parameters:
      statistics:
        type: statistics
        description: The statistics to narrow.
      x_min:
        type: f64
        description: The smallest X coordinate.
      x_max:
        type: f64
        description: The largest X coordinate.
      y_min:
        type: f64
        description: The smallest Y coordinate.
      y_max:
        type: f64
        description: The largest Y coordinate.
      has_z:
        type: bool
        description: Whether the Z bounds are given.
      z_min:
        type: f64
        description: The smallest Z coordinate (when `has_z`).
      z_max:
        type: f64
        description: The largest Z coordinate (when `has_z`).
      has_m:
        type: bool
        description: Whether the M bounds are given.
      m_min:
        type: f64
        description: The smallest M coordinate (when `has_m`).
      m_max:
        type: f64
        description: The largest M coordinate (when `has_m`).
      err:
        type: error_info
        indirection: 1
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`."
    return_type: ERROR

  statistics_set_geometry_types:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-10-30" ]
    description: |
      Sets the geometry types a GEOMETRY column holds, as ISO WKB type codes (e.g. 1 for a Point, 1001 for a Point with a Z
      coordinate, 3002 for a Polygon with an M coordinate): the column holds no geometry of another type. Replaces the types
      set before; an empty list leaves the types unknown. Fails with `ERROR_INPUT_INVALID` for statistics of another type or
      an unknown type code.
    role: method
    belongs_to: statistics
    parameters:
      statistics:
        type: statistics
        description: The statistics to narrow.
      wkb_types:
        type: i32
        indirection: 1
        const: true
        description: The ISO WKB type codes of the geometries the column holds. Borrowed and copied.
      count:
        type: idx
        description: The number of type codes.
      err:
        type: error_info
        indirection: 1
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`."
    return_type: ERROR

  statistics_get_type:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-10-30" ]
    description: |
      Retrieves the type of the column the statistics describe.
    role: method
    belongs_to: statistics
    parameters:
      statistics:
        type: statistics
        description: The statistics.
      type:
        type: logical_type
        indirection: 1
        kind: OUT
        description: Receives the type. Owned by the caller, destroy via `[[logical_type_destroy]]`.
      err:
        type: error_info
        indirection: 1
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`."
    return_type: ERROR

  statistics_destroy:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-10-30" ]
    description: |
      Destroys the statistics, releasing their resources.

      Null-safe: passing a null pointer or null handle is a no-op. The handle is set to null on return to prevent
      double-destruction. Statistics that were reported with `[[table_function_statistics_set_result]]` or set as a child
      were copied, so destroying them afterwards does not affect what was reported.
    role: destructor
    belongs_to: statistics
    parameters:
      statistics:
        type: statistics
        indirection: 1
        description: The statistics to destroy.
    return_type: ERROR
