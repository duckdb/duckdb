module: crypto
#
# Cryptographic primitives backed by the instance's crypto provider, and the ability to supply a provider of your own.
#
# The primitives are what DuckDB itself encrypts and signs with: streaming AES-GCM (with additional authenticated data
# and an authentication tag) and AES-CTR, SHA-256, HMAC-SHA256 and random bytes. They use the provider registered on the
# instance, e.g. by httpfs, and otherwise DuckDB's built-in provider. The built-in provider is read-only-grade: it
# decrypts and hashes, but writing (encrypting, random bytes) requires a provider that DuckDB considers secure, and fails
# otherwise with the same error DuckDB reports for encrypted writes. The `force_mbedtls_unsafe` setting forces the
# built-in provider.
#
# A provider is built with the setters below and registered on an instance once: registration fails when a provider is
# already registered. Registration is not transactional: a registered provider lives for as long as the instance does.
# Callbacks the provider does not set (hashing, HMAC, random bytes) fall back to the built-in provider. The AES callbacks
# are all or nothing.
#
# Callbacks must be safe to run concurrently and on any thread. An error a callback reports fails the operation that
# invoked it.

enums:
  CRYPTO_CIPHER:
    description: The AES mode of operation.
    # The values match duckdb::EncryptionTypes::CipherType
    values:
      CRYPTO_CIPHER_AES_GCM:
        value: 1
        description: AES-GCM. 12-byte IV, optional additional authenticated data, 16-byte authentication tag.
      CRYPTO_CIPHER_AES_CTR:
        value: 2
        description: AES-CTR. 16-byte IV (initial counter block), no authentication tag.

  CRYPTO_MODE:
    description: The direction of an AES stream.
    values:
      CRYPTO_MODE_ENCRYPT:
        value: 0
        description: Encrypt plaintext into ciphertext.
      CRYPTO_MODE_DECRYPT:
        value: 1
        description: Decrypt ciphertext into plaintext.

handles:
  crypto_aes:
    description: |
      An owned opaque handle to a streaming AES cipher. Created with `[[crypto_aes_create]]`, initialized with
      `[[crypto_aes_init]]`, fed with `[[crypto_aes_update]]`, completed with `[[crypto_aes_finalize]]`, and destroyed
      with `[[crypto_aes_destroy]]`. Not safe for concurrent use.

  crypto_provider:
    description: |
      An owned opaque handle to a crypto provider being built. Created with `[[crypto_provider_create]]`, configured
      with the setters, registered with `[[instance_register_crypto_provider]]` or
      `[[extension_register_crypto_provider]]`, and destroyed with `[[crypto_provider_destroy]]`.

callbacks:
  crypto_provider_aes_create_callback:
    parameters:
      user_data:
        type: void
        indirection: 1
        description: "The user data set via `[[crypto_provider_set_user_data]]`, or null if none was set."
      cipher:
        type: CRYPTO_CIPHER
        description: "The AES mode."
      mode:
        type: CRYPTO_MODE
        description: "Whether the stream encrypts or decrypts."
      key:
        type: u8
        indirection: 1
        const: true
        kind: IN
        description: "The key. Borrowed for the duration of the call; copy it if it is needed longer."
      key_length:
        type: idx
        description: "The key length in bytes: 16, 24 or 32."
      stream:
        type: void
        indirection: 2
        kind: OUT
        description: "On success, receives the provider's state for the new stream, passed to the other AES callbacks."
      err:
        type: error_info
        indirection: 1
        description: Borrowed error info handle to report a failure through. A reported error fails the operation that invoked the callback.
    return_type: void

  crypto_provider_aes_init_callback:
    parameters:
      user_data:
        type: void
        indirection: 1
        description: "The user data set via `[[crypto_provider_set_user_data]]`, or null if none was set."
      stream:
        type: void
        indirection: 1
        description: "The stream state created by the create callback."
      iv:
        type: u8
        indirection: 1
        const: true
        kind: IN
        description: "The IV, 12 bytes for GCM and 16 for CTR. Borrowed."
      iv_length:
        type: idx
        description: "The IV length in bytes."
      aad:
        type: u8
        indirection: 1
        const: true
        kind: IN
        description: "Additional authenticated data (GCM only), or null. Borrowed."
      aad_length:
        type: idx
        description: "The AAD length in bytes, 0 if none."
      err:
        type: error_info
        indirection: 1
        description: Borrowed error info handle to report a failure through. A reported error fails the operation that invoked the callback.
    return_type: void

  crypto_provider_aes_update_callback:
    parameters:
      user_data:
        type: void
        indirection: 1
        description: "The user data set via `[[crypto_provider_set_user_data]]`, or null if none was set."
      stream:
        type: void
        indirection: 1
        description: "The stream state created by the create callback."
      in:
        type: u8
        indirection: 1
        const: true
        kind: IN
        description: "The input bytes. Borrowed."
      in_length:
        type: idx
        description: "The number of input bytes."
      out:
        type: u8
        indirection: 1
        kind: OUT
        description: "The output buffer, of at least `in_length` bytes. May equal `in` (in-place)."
      out_capacity:
        type: idx
        description: "The capacity of `out` in bytes."
      out_length:
        type: idx
        indirection: 1
        kind: OUT
        description: "Receives the number of bytes written to `out`."
      err:
        type: error_info
        indirection: 1
        description: Borrowed error info handle to report a failure through. A reported error fails the operation that invoked the callback.
    return_type: void

  crypto_provider_aes_finalize_callback:
    parameters:
      user_data:
        type: void
        indirection: 1
        description: "The user data set via `[[crypto_provider_set_user_data]]`, or null if none was set."
      stream:
        type: void
        indirection: 1
        description: "The stream state created by the create callback."
      tag:
        type: u8
        indirection: 1
        kind: OUT
        description: "GCM only. Encrypting - receives the authentication tag. Decrypting - holds the tag to verify; report an error on mismatch. Null for CTR."
      tag_length:
        type: idx
        description: "The tag length in bytes - 16 for GCM, 0 for CTR."
      err:
        type: error_info
        indirection: 1
        description: Borrowed error info handle to report a failure through. A reported error fails the operation that invoked the callback.
    return_type: void

  crypto_provider_aes_destroy_callback:
    parameters:
      user_data:
        type: void
        indirection: 1
        description: "The user data set via `[[crypto_provider_set_user_data]]`, or null if none was set."
      stream:
        type: void
        indirection: 1
        description: "The stream state to release."
    return_type: void

  crypto_provider_sha256_callback:
    parameters:
      user_data:
        type: void
        indirection: 1
        description: "The user data set via `[[crypto_provider_set_user_data]]`, or null if none was set."
      in:
        type: u8
        indirection: 1
        const: true
        kind: IN
        description: "The input bytes. Borrowed."
      in_length:
        type: idx
        description: "The number of input bytes."
      out:
        type: u8
        indirection: 1
        kind: OUT
        description: "Receives the 32-byte digest."
      err:
        type: error_info
        indirection: 1
        description: Borrowed error info handle to report a failure through. A reported error fails the operation that invoked the callback.
    return_type: void

  crypto_provider_hmac_sha256_callback:
    parameters:
      user_data:
        type: void
        indirection: 1
        description: "The user data set via `[[crypto_provider_set_user_data]]`, or null if none was set."
      key:
        type: u8
        indirection: 1
        const: true
        kind: IN
        description: "The HMAC key. Borrowed."
      key_length:
        type: idx
        description: "The key length in bytes."
      in:
        type: u8
        indirection: 1
        const: true
        kind: IN
        description: "The input bytes. Borrowed."
      in_length:
        type: idx
        description: "The number of input bytes."
      out:
        type: u8
        indirection: 1
        kind: OUT
        description: "Receives the 32-byte MAC."
      err:
        type: error_info
        indirection: 1
        description: Borrowed error info handle to report a failure through. A reported error fails the operation that invoked the callback.
    return_type: void

  crypto_provider_random_callback:
    parameters:
      user_data:
        type: void
        indirection: 1
        description: "The user data set via `[[crypto_provider_set_user_data]]`, or null if none was set."
      out:
        type: u8
        indirection: 1
        kind: OUT
        description: "Receives cryptographically secure random bytes."
      length:
        type: idx
        description: "The number of bytes to produce."
      err:
        type: error_info
        indirection: 1
        description: Borrowed error info handle to report a failure through. A reported error fails the operation that invoked the callback.
    return_type: void

functions:
  crypto_sha256:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Computes the SHA-256 digest of `data` with the instance's crypto provider.
    parameters:
      instance:
        type: instance
        description: "The instance whose provider to use."
      data:
        type: u8
        indirection: 1
        const: true
        kind: IN
        description: "The bytes to hash. May be null if `length` is 0."
      length:
        type: idx
        description: "The number of bytes."
      digest:
        type: u8
        indirection: 1
        kind: OUT
        description: "Receives the 32-byte digest."
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  crypto_hmac_sha256:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Computes the HMAC-SHA256 of `data` under `key` with the instance's crypto provider.
    parameters:
      instance:
        type: instance
        description: "The instance whose provider to use."
      key:
        type: u8
        indirection: 1
        const: true
        kind: IN
        description: "The HMAC key."
      key_length:
        type: idx
        description: "The key length in bytes."
      data:
        type: u8
        indirection: 1
        const: true
        kind: IN
        description: "The bytes to authenticate. May be null if `length` is 0."
      length:
        type: idx
        description: "The number of bytes."
      mac:
        type: u8
        indirection: 1
        kind: OUT
        description: "Receives the 32-byte MAC."
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  crypto_random_bytes:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Fills `data` with cryptographically secure random bytes from the instance's crypto provider, e.g. for IVs.

      Fails when the instance has no provider DuckDB considers secure for writing; see the module notes.
    parameters:
      instance:
        type: instance
        description: "The instance whose provider to use."
      data:
        type: u8
        indirection: 1
        kind: OUT
        description: "Receives the random bytes."
      length:
        type: idx
        description: "The number of bytes to produce."
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  crypto_aes_create:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Creates a streaming AES cipher.

      The key is copied and wiped when the cipher is destroyed. Encrypting requires a provider DuckDB considers secure for writing; decrypting does not. The cipher must be initialized with `[[crypto_aes_init]]` before use.
    role: constructor
    belongs_to: crypto_aes
    parameters:
      instance:
        type: instance
        description: "The instance whose provider to use."
      cipher:
        type: CRYPTO_CIPHER
        description: "The AES mode."
      mode:
        type: CRYPTO_MODE
        description: "Whether to encrypt or decrypt."
      key:
        type: u8
        indirection: 1
        const: true
        kind: IN
        description: "The key. Borrowed and copied."
      key_length:
        type: idx
        description: "The key length in bytes: 16, 24 or 32."
      aes:
        type: crypto_aes
        indirection: 1
        kind: OUT
        description: "On success, receives the new cipher. Owned by the caller."
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  crypto_aes_init:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Starts the stream with an IV and, for GCM, additional authenticated data.

      The IV must be 12 bytes for GCM and 16 bytes for CTR. AAD is only valid for GCM. May be called once per cipher.
    parameters:
      aes:
        type: crypto_aes
        description: "The cipher."
      iv:
        type: u8
        indirection: 1
        const: true
        kind: IN
        description: "The IV. Borrowed."
      iv_length:
        type: idx
        description: "The IV length in bytes."
      aad:
        type: u8
        indirection: 1
        const: true
        kind: IN
        description: "The additional authenticated data, or null. Borrowed."
      aad_length:
        type: idx
        description: "The AAD length in bytes, 0 if none."
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  crypto_aes_update:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Processes the next chunk of the stream.

      `out_capacity` must be at least `in_length`. `in` and `out` may be the same buffer. For decryption with GCM, the plaintext must not be trusted before `[[crypto_aes_finalize]]` succeeds.
    parameters:
      aes:
        type: crypto_aes
        description: "The cipher."
      in:
        type: u8
        indirection: 1
        const: true
        kind: IN
        description: "The input bytes."
      in_length:
        type: idx
        description: "The number of input bytes."
      out:
        type: u8
        indirection: 1
        kind: OUT
        description: "Receives the output bytes."
      out_capacity:
        type: idx
        description: "The capacity of `out` in bytes."
      out_length:
        type: idx
        indirection: 1
        kind: OUT
        description: "Receives the number of bytes written."
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  crypto_aes_finalize:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Completes the stream.

      GCM encryption: writes the 16-byte authentication tag into `tag`. GCM decryption: verifies the 16-byte `tag`, failing with an input error when it does not match. CTR: `tag` must be null and `tag_length` 0.
    parameters:
      aes:
        type: crypto_aes
        description: "The cipher."
      tag:
        type: u8
        indirection: 1
        kind: OUT
        description: "The tag buffer (GCM), or null."
      tag_length:
        type: idx
        description: "The tag length in bytes - 16 for GCM, 0 for CTR."
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  crypto_aes_destroy:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Destroys the cipher, wiping its key. Null-safe; the handle is set to null on return.
    parameters:
      aes:
        type: crypto_aes
        indirection: 1
        description: "The cipher to destroy."
    return_type: ERROR

  crypto_provider_create:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Creates a new, empty crypto provider through a factory.

      The provider can only be registered on the instance the factory belongs to. The caller owns the handle and must destroy it with `[[crypto_provider_destroy]]`, also after registration.
    role: constructor
    belongs_to: crypto_provider
    parameters:
      factory:
        type: factory
        description: "The factory to create the provider through."
      provider:
        type: crypto_provider
        indirection: 1
        kind: OUT
        description: "On success, receives the new provider. Owned by the caller."
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  crypto_provider_set_user_data:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Sets user data handed to every callback of the provider, destroyed with the registered provider (or with the handle if never registered).
    parameters:
      provider:
        type: crypto_provider
        description: "The provider."
      data:
        type: opaque
        indirection: 1
        description: "Opaque handle bundling the user data pointer plus an optional destructor."
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  crypto_provider_set_aes_callbacks:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Sets the streaming AES callbacks. All but `destroy` are required.

      The provider's AES implementation must support GCM and CTR with 16-, 24- and 32-byte keys.
    parameters:
      provider:
        type: crypto_provider
        description: "The provider."
      create:
        type: crypto_provider_aes_create_callback
        description: "Creates a stream."
      init:
        type: crypto_provider_aes_init_callback
        description: "Starts a stream."
      update:
        type: crypto_provider_aes_update_callback
        description: "Processes a chunk."
      finalize:
        type: crypto_provider_aes_finalize_callback
        description: "Completes a stream."
      destroy:
        type: crypto_provider_aes_destroy_callback
        description: "Optional. Releases a stream."
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  crypto_provider_set_sha256_callback:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Sets the SHA-256 callback. Optional: DuckDB's built-in implementation is used when unset.
    parameters:
      provider:
        type: crypto_provider
        description: "The provider."
      callback:
        type: crypto_provider_sha256_callback
        description: "The callback."
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  crypto_provider_set_hmac_sha256_callback:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Sets the HMAC-SHA256 callback. Optional: DuckDB's built-in implementation is used when unset.
    parameters:
      provider:
        type: crypto_provider
        description: "The provider."
      callback:
        type: crypto_provider_hmac_sha256_callback
        description: "The callback."
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  crypto_provider_set_random_callback:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Sets the random bytes callback. Optional: DuckDB's built-in implementation is used when unset.
    parameters:
      provider:
        type: crypto_provider
        description: "The provider."
      callback:
        type: crypto_provider_random_callback
        description: "The callback."
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  instance_register_crypto_provider:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Registers the provider as the instance's crypto provider, used by encrypted databases, Parquet encryption and the primitives above.

      Requires the AES callbacks. Fails when the instance already has a provider (e.g. httpfs is loaded) or when the provider was created through a factory of another instance. The `force_mbedtls_unsafe` setting still overrides it. The caller still owns the handle and must destroy it with `[[crypto_provider_destroy]]`.
    role: method
    belongs_to: instance
    parameters:
      instance:
        type: instance
        description: "The instance to register on."
      provider:
        type: crypto_provider
        description: "The provider to register."
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  extension_register_crypto_provider:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Registers the provider on the loading extension's instance. Use this from the extension's load callback. Follows the rules of `[[instance_register_crypto_provider]]`.
    role: method
    belongs_to: extension
    parameters:
      extension:
        type: extension
        description: "The loading extension."
      provider:
        type: crypto_provider
        description: "The provider to register."
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  crypto_provider_destroy:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Destroys the provider handle. Null-safe; the handle is set to null on return. Does not affect a registered provider.
    parameters:
      provider:
        type: crypto_provider
        indirection: 1
        description: "The provider to destroy."
    return_type: ERROR

