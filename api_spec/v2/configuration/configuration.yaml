module: configuration
#
# Reading and writing config options, and describing them.
#
# Values: *_get_option_value reads the effective value of an option from an
# instance, a connection or a context, and reports the scope it came from;
# *_set_option writes one at a given scope. Values are typed: they carry the
# option's type when read, and are cast to it when written, as SQL `SET` does.
#
# Definitions: an option handle is an owned, read-only descriptor of one
# option as registered on the instance: its canonical name, default value,
# description, the scopes it may be written at, and aliases. It carries no current value, and is
# the same whichever source it is listed from. Descriptors come back from the
# instance_get_option_* and context_get_option_* listing functions and are
# destroyed via option_destroy.
#
# Implementation note: once the instance has started, every write delegates to
# PhysicalSet::SetVariable, so SQL `SET` and the V2 C API share one resolution
# and dispatch path: lock check, core-then-extension lookup with autoload,
# scope target validation, value cast, and generic vs legacy apply. Before
# startup, instance_set_option writes the startup DBConfig instead
# (DBConfig::SetOptionByName), which is how startup-only options reach the
# instance. See src/include/duckdb/execution/operator/helper/physical_set.hpp.
enums:
  SETTING_SCOPE:
    description: |
      The scope of an option's value. Writes take DEFAULT, GLOBAL or SESSION:
      DEFAULT writes to the option's default scope (`[[option_get_default_scope]]`),
      like SQL `SET name = value`; GLOBAL writes through to the instance, visible to all
      connections, like `SET GLOBAL`; SESSION writes to one connection's session
      only, like `SET SESSION`. Reads report GLOBAL or SESSION, as DuckDB
      attributes the value: an option no scope sets reads as GLOBAL, its
      default, and a legacy option read through a connection or context reads
      as SESSION.
    values:
      SETTING_SCOPE_DEFAULT:
        value: 0
        description: "Write only: the option's default scope (`[[option_get_default_scope]]`), not its default value."
      SETTING_SCOPE_GLOBAL:
        description: "The instance's value, visible to all connections."
      SETTING_SCOPE_SESSION:
        description: "A connection's session value."
functions:
  option_destroy:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-08-04" ]
    description: |
      Destroys an option descriptor.

      Frees the handle along with the strings it owns. On success the slot is
      set to null. Safe to call on an already-null slot.
    role: destructor
    belongs_to: option
    parameters:
      option:
        type: option
        indirection: 1
        description: "The option handle to destroy."
    return_type: ERROR

  option_get_name:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-08-04" ]
    description: |
      Borrows the option's canonical name.

      When the option was resolved from an alias, this still reports the
      canonical name; the alias is reachable via `[[option_get_alias]]`.
    role: getter
    belongs_to: option
    parameters:
      option:
        type: option
        description: "The option."
      out_name:
        type: identifier
        indirection: 1
        kind: OUT_BORROW
        description: "Receives a borrowed view of the option name. Valid until the option is destroyed."
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`."
    return_type: ERROR

  option_get_default_value:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-08-04" ]
    description: |
      Returns the option's static default, as a value of the option's type.

      A NULL value for an option whose declaration has no default. The caller
      destroys the returned value.
    role: getter
    belongs_to: option
    parameters:
      option:
        type: option
        description: "The option."
      out_value:
        type: value
        indirection: 1
        kind: OUT
        description: "Receives the default value."
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`."
    return_type: ERROR

  option_get_description:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-08-04" ]
    description: |
      Borrows the option's human-readable description.
    role: getter
    belongs_to: option
    parameters:
      option:
        type: option
        description: "The option."
      out_description:
        type: str
        indirection: 1
        kind: OUT_BORROW
        description: "Receives a borrowed view of the description. Valid until the option is destroyed."
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`."
    return_type: ERROR

  option_supports_scope:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-10-08" ]
    description: |
      Reports whether the option may be written at a scope.

      GLOBAL and SESSION are the scopes to ask about; DEFAULT is supported by
      every option that supports either. A write at an unsupported scope
      returns ERROR_INPUT_INVALID.
    role: getter
    belongs_to: option
    parameters:
      option:
        type: option
        description: "The option."
      scope:
        type: SETTING_SCOPE
        description: "The scope to ask about."
      out_supported:
        type: bool
        indirection: 1
        kind: OUT
        description: "Receives whether a write at the scope is accepted."
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`."
    return_type: ERROR

  option_get_default_scope:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-10-08" ]
    description: |
      Returns the scope a DEFAULT write of the option goes to: GLOBAL or
      SESSION.
    role: getter
    belongs_to: option
    parameters:
      option:
        type: option
        description: "The option."
      out_scope:
        type: SETTING_SCOPE
        indirection: 1
        kind: OUT
        description: "Receives the default scope."
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`."
    return_type: ERROR

  option_get_alias_count:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-08-04" ]
    description: |
      Returns the number of aliases registered for this option.

      Zero for an extension option; extension options carry no aliases.
    role: getter
    belongs_to: option
    parameters:
      option:
        type: option
        description: "The option."
      out_count:
        type: idx
        indirection: 1
        kind: OUT
        description: "Receives the alias count."
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`."
    return_type: ERROR

  option_get_alias:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-08-04" ]
    description: |
      Borrows the alias name at the given index.

      An out-of-range index returns ERROR_INPUT_INVALID.
    role: getter
    belongs_to: option
    parameters:
      option:
        type: option
        description: "The option."
      index:
        type: idx
        description: "The alias index, in [0, alias_count)."
      out_alias:
        type: identifier
        indirection: 1
        kind: OUT_BORROW
        description: "Receives a borrowed view of the alias. Valid until the option is destroyed."
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`."
    return_type: ERROR

  #---------------------------------------------------------------------------------------------------------------------
  # Values
  #---------------------------------------------------------------------------------------------------------------------
  instance_get_option_value:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-10-08" ]
    description: |
      Reads the effective value of an option on the instance.

      Before startup this is the staged startup value, or the default;
      afterwards the GLOBAL value, or the default. Always reports GLOBAL.
      Aliases resolve transparently, and an unknown name returns
      ERROR_INPUT_INVALID.
    role: getter
    belongs_to: instance
    parameters:
      instance:
        type: instance
        description: "The instance handle."
      name:
        type: identifier
        indirection: 1
        const: true
        kind: IN
        description: "Option name (canonical or alias)."
      out_value:
        type: value
        indirection: 1
        kind: OUT
        description: "Receives the value, typed as the option. Owned by the caller."
      out_scope:
        type: SETTING_SCOPE
        indirection: 1
        kind: OUT
        description: "Receives the scope the value came from."
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`."
    return_type: ERROR

  connection_get_option_value:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-10-08" ]
    description: |
      Reads the effective value of an option on a connection.

      The connection's SESSION value if it set one, otherwise the
      GLOBAL value, otherwise the default. Aliases resolve transparently, and
      an unknown name returns ERROR_INPUT_INVALID.
    role: getter
    belongs_to: connection
    parameters:
      connection:
        type: connection
        description: "The connection."
      name:
        type: identifier
        indirection: 1
        const: true
        kind: IN
        description: "Option name (canonical or alias)."
      out_value:
        type: value
        indirection: 1
        kind: OUT
        description: "Receives the value, typed as the option. Owned by the caller."
      out_scope:
        type: SETTING_SCOPE
        indirection: 1
        kind: OUT
        description: "Receives the scope the value came from."
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`."
    return_type: ERROR

  context_get_option_value:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-10-08" ]
    description: |
      Reads the effective value of an option through a context.

      The context's connection cascade, as `[[connection_get_option_value]]`
      reads it: the SESSION value if set, otherwise the GLOBAL value, otherwise
      the default.
    role: getter
    belongs_to: context
    parameters:
      ctx:
        type: context
        description: "The context."
      name:
        type: identifier
        indirection: 1
        const: true
        kind: IN
        description: "Option name (canonical or alias)."
      out_value:
        type: value
        indirection: 1
        kind: OUT
        description: "Receives the value, typed as the option. Owned by the caller."
      out_scope:
        type: SETTING_SCOPE
        indirection: 1
        kind: OUT
        description: "Receives the scope the value came from."
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`."
    return_type: ERROR

  instance_set_option:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-08-04" ]
    description: |
      Writes an option on the instance.

      Before the instance has started (no `[[instance_attach]]` or
      `[[connection_create]]` yet), the option goes into the startup
      configuration: this is the only way to set an option that can only be
      chosen at startup, such as access_mode or enable_external_access.
      Unknown names are kept for an extension to consume at startup; if none
      does, startup fails with the unrecognized names. After startup, this is
      `SET GLOBAL name = value` and an unknown name is rejected unless an
      extension that defines it can be autoloaded.

      An instance has only GLOBAL scope: DEFAULT and GLOBAL write there, and
      SESSION returns ERROR_INPUT_INVALID, as does an option that does not
      support GLOBAL.
    role: setter
    belongs_to: instance
    parameters:
      instance:
        type: instance
        description: "The instance handle."
      name:
        type: identifier
        indirection: 1
        const: true
        kind: IN
        description: "Option name (canonical or alias)."
      value:
        type: value
        description: "The value, cast to the option's type as SQL `SET` does. Borrowed."
      scope:
        type: SETTING_SCOPE
        description: "Target scope: DEFAULT, GLOBAL, or SESSION."
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`."
    return_type: ERROR

  connection_set_option:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-08-04" ]
    description: |
      Writes an option through the connection.

      `scope` chooses the destination, mirroring SQL:
        - DEFAULT writes to the option's default scope, like a bare
          `SET name = value`.
        - GLOBAL writes through to the instance, visible to all connections,
          like `SET GLOBAL`.
        - SESSION writes to this connection's session only, like `SET SESSION`.
      A scope the option does not support (`[[option_supports_scope]]`)
      returns ERROR_INPUT_INVALID. An unknown name is rejected unless an extension that
      defines it can be autoloaded; to stage a setting for an extension
      before startup, use `[[instance_set_option]]`.
    role: setter
    belongs_to: connection
    parameters:
      connection:
        type: connection
        description: "The connection."
      name:
        type: identifier
        indirection: 1
        const: true
        kind: IN
        description: "Option name (canonical or alias)."
      value:
        type: value
        description: "The value, cast to the option's type as SQL `SET` does. Borrowed."
      scope:
        type: SETTING_SCOPE
        description: "Target scope: DEFAULT, GLOBAL, or SESSION."
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`."
    return_type: ERROR

  context_set_option:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-10-08" ]
    description: |
      Writes an option through a context.

      As `[[connection_set_option]]`, for the context's connection.
    role: setter
    belongs_to: context
    parameters:
      ctx:
        type: context
        description: "The context."
      name:
        type: identifier
        indirection: 1
        const: true
        kind: IN
        description: "Option name (canonical or alias)."
      value:
        type: value
        description: "The value, cast to the option's type as SQL `SET` does. Borrowed."
      scope:
        type: SETTING_SCOPE
        description: "Target scope: DEFAULT, GLOBAL, or SESSION."
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`."
    return_type: ERROR

  #---------------------------------------------------------------------------------------------------------------------
  # Definitions
  #---------------------------------------------------------------------------------------------------------------------
  instance_get_option_by_name:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-08-04" ]
    description: |
      Describes a config option registered on the instance, by name.

      Allocates an option descriptor: canonical name, default value,
      description, supported and default scopes, and aliases. Aliases resolve transparently — passing an alias returns the
      canonical option, with the alias listed in its alias array. An unknown
      name returns ERROR_INPUT_INVALID; before startup that includes an
      option of an extension that has not loaded yet, even if a value for
      it has been staged. The caller destroys the returned option.
    role: getter
    belongs_to: instance
    parameters:
      instance:
        type: instance
        description: "The instance handle."
      name:
        type: identifier
        indirection: 1
        const: true
        kind: IN
        description: "Option name (canonical or alias)."
      out_option:
        type: option
        indirection: 1
        kind: OUT
        description: "Receives the option descriptor."
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`."
    return_type: ERROR

  instance_get_option_count:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-08-04" ]
    description: |
      Returns the number of config options registered on the instance.

      Counts core options plus the extension options registered on this
      instance. Aliases are NOT counted separately; each one is reachable
      through its canonical option's alias array.
    role: getter
    belongs_to: instance
    parameters:
      instance:
        type: instance
        description: "The instance handle."
      out_count:
        type: idx
        indirection: 1
        kind: OUT
        description: "Receives the option count."
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`."
    return_type: ERROR

  instance_get_option_by_index:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-08-04" ]
    description: |
      Describes the config option at the given index on the instance.

      Index space: [0, core_count) addresses core options, [core_count, total)
      extension options. The mapping is stable for as long as no extension
      registers new options. An out-of-range index returns ERROR_INPUT_INVALID.
      The caller destroys the returned option.
    role: getter
    belongs_to: instance
    parameters:
      instance:
        type: instance
        description: "The instance handle."
      index:
        type: idx
        description: "The option index, in [0, option_count)."
      out_option:
        type: option
        indirection: 1
        kind: OUT
        description: "Receives the option descriptor."
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`."
    return_type: ERROR

  context_get_option_by_name:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-09-15" ]
    description: |
      Describes a config option through a context, by name.

      The same descriptor `[[instance_get_option_by_name]]` returns for the
      context's instance. Aliases resolve transparently, and an unknown name
      returns ERROR_INPUT_INVALID. The caller destroys the returned option.
    role: getter
    belongs_to: context
    parameters:
      ctx:
        type: context
        description: "The context."
      name:
        type: identifier
        indirection: 1
        const: true
        kind: IN
        description: "Option name (canonical or alias)."
      out_option:
        type: option
        indirection: 1
        kind: OUT
        description: "Receives the option descriptor."
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`."
    return_type: ERROR

  context_get_option_count:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-09-15" ]
    description: |
      Returns the number of config options visible to this context.

      The same count `[[instance_get_option_count]]` reports for the underlying
      instance: core plus extension options, aliases excluded.
    role: getter
    belongs_to: context
    parameters:
      ctx:
        type: context
        description: "The context."
      out_count:
        type: idx
        indirection: 1
        kind: OUT
        description: "Receives the option count."
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`."
    return_type: ERROR

  context_get_option_by_index:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-09-15" ]
    description: |
      Describes the config option at the given index visible to this context.

      Index space: [0, core_count) addresses core options, [core_count, total)
      the extension options visible from this context's instance. An
      out-of-range index returns ERROR_INPUT_INVALID. The caller destroys the
      returned option.
    role: getter
    belongs_to: context
    parameters:
      ctx:
        type: context
        description: "The context."
      index:
        type: idx
        description: "The option index, in [0, option_count)."
      out_option:
        type: option
        indirection: 1
        kind: OUT
        description: "Receives the option descriptor."
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`."
    return_type: ERROR
