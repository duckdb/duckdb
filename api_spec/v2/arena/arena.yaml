module: arena
#
# Bump allocation of caller-written bytes whose lifetime belongs to another
# object. An arena has no value semantics of its own: it hands out raw
# uninitialized bytes, and the object that lends it defines what those bytes
# may back and how long they live.
#
# The only source today is vector_get_arena, whose bytes back the out-of-line
# payload of a string-backed vector. The write sequence is: borrow the arena
# once (that borrow is the single string-ness check), reserve bytes with
# arena_allocate, write them, assemble a duckdb_v2_bytes, and place it via
# vector_get_data_mutable. Values of at most DUCKDB_V2_BYTES_INLINE_LENGTH
# bytes are stored inline and need no allocation. The C++ API wraps the whole
# sequence.
functions:
  # TODO: This should probably take an "alignment" parameter too
  arena_allocate:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-08-04" ]
    description: |
      Reserves byte_len bytes from the arena.

      Raw bump allocation: returns a writable pointer to byte_len uninitialized
      bytes, valid for as long as the arena is. There is no size gating, and
      byte_len may be 0. The caller writes the bytes and assembles whatever the
      lending object expects; for a vector arena that is a duckdb_v2_bytes,
      which records its length in a uint32, so the bytes backing a single value
      must fit that bound. Enforcing it is the caller's responsibility.
    role: method
    belongs_to: arena
    parameters:
      arena:
        type: arena
        description: The arena to allocate from.
      byte_len:
        type: idx
        description: Number of bytes to reserve. May be 0.
      out_ptr:
        type: u8
        indirection: 2
        kind: OUT_BORROW
        description: Receives a writable pointer to byte_len arena-owned bytes.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: ERROR
