module: prepared_statement
#
# Prepare a statement once and execute it many times. A sibling to
# statement_execute rather than a replacement: both run a parsed statement and
# hand back the same kind of result handle, and everything in the query_result
# module applies to it unchanged.
#
# The difference is plan reuse. statement_execute works out how to run the
# statement on every call; prepared_statement_create may do that work once and
# keep it. Whether it did is a property of the statement, not a promise: ask
# prepared_statement_reuses_plan. When the answer is false, executing the
# prepared statement is no faster than statement_execute.
#
# The statement is borrowed, not consumed, the way the sql_statement module
# describes, and the prepared statement handle is borrowed by every execution,
# so one handle serves any number of them. It belongs to the connection it was
# prepared on and keeps that session alive, so it stays usable even after the
# connection is disconnected.
#
# One live result or stream per connection, as in the query_result module: both
# calls here refuse with ERROR_RESOURCE_IN_USE until it is finished or
# destroyed. Open another connection for a second query.
#
# The handle exposes no signature of its own: statement_bind already reports a
# statement's columns and parameter types, and result_get_schema reports a
# result's columns.

#-----------------------------------------------------------------------------------------------------------------------
# Handles
#-----------------------------------------------------------------------------------------------------------------------
handles:
  prepared_statement:
    description: |
      An owned handle to a statement that was prepared once and can be executed repeatedly via
      `[[prepared_statement_execute]]`. Construct it with `[[prepared_statement_create]]` and destroy it with
      `[[prepared_statement_destroy]]`. It keeps its connection's session alive, so it stays usable across
      executions and after the connection is disconnected.
    cleanup_with: prepared_statement_destroy

#-----------------------------------------------------------------------------------------------------------------------
# Functions
#-----------------------------------------------------------------------------------------------------------------------
functions:
  #---------------------------------------------------------------------------------------------------------------------
  # Constructor
  #---------------------------------------------------------------------------------------------------------------------
  prepared_statement_create:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-09-03" ]
    description: |
      Prepares a parsed statement into a handle that can be executed repeatedly. Blocks only for as long as
      preparing takes.

      Unknown tables, type errors and the like come back here, exactly as they would from `[[statement_execute]]`.
      The statement is borrowed, so it can be prepared again or executed directly; the caller destroys it with
      `[[sql_statement_destroy]]`.

      By default this succeeds whether or not the plan will be reused; `[[prepared_statement_reuses_plan]]` says
      which one you got. Set `require_cacheable` to fail with `ERROR_INPUT_INVALID` instead when it would not be,
      so a caller who only wants the handle for the speedup finds out here.

      Refuses with `ERROR_RESOURCE_IN_USE` while the connection has a live result or stream.
      `*out_prepared` is set to NULL on failure.
    role: constructor
    belongs_to: prepared_statement
    parameters:
      conn:
        type: connection
        description: The connection the prepared statement belongs to.
      statement:
        type: sql_statement
        description: The statement to prepare. Borrowed; not consumed. Destroy it with `[[sql_statement_destroy]]`.
      require_cacheable:
        type: bool
        description: |
          When true, fail with `ERROR_INPUT_INVALID` unless the prepared plan will be reused across executions, as
          `[[prepared_statement_reuses_plan]]` would report it.
      out_prepared:
        type: prepared_statement
        indirection: 1
        kind: OUT
        description: On success, receives the new prepared statement. Owned by the caller; destroy via `[[prepared_statement_destroy]]`.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  #---------------------------------------------------------------------------------------------------------------------
  # Execution
  #---------------------------------------------------------------------------------------------------------------------
  prepared_statement_execute:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-09-03" ]
    description: |
      Starts the prepared statement and returns its result handle without waiting for it to finish.
      Non-consuming.

      The handle returned is an ordinary result: everything the query_result module says applies to it. `args`
      carries the parameter values and the eagerness for this one execution and is borrowed; pass NULL for a
      statement without parameters. A set of values that does not match the statement's parameters is rejected with
      `ERROR_INPUT_INVALID`, with one exception: a named parameter left without a value reads the session variable
      of the same name (`SET VARIABLE`) when one exists.

      Execute the same handle again, with the same values or different ones, as often as you like; nothing carries
      over between executions. A change to the tables the statement reads, or a value of a different type than
      before, makes it work out how to run the statement again, which costs time but changes nothing else.

      Refuses with `ERROR_RESOURCE_IN_USE` while the connection has a live result or stream. A failed execution
      leaves the prepared statement usable. `*out_result` is set to NULL on failure.
    role: method
    belongs_to: prepared_statement
    parameters:
      prepared:
        type: prepared_statement
        description: The prepared statement to execute. Borrowed; not consumed.
      args:
        type: execute_args
        description: |
          Optional. The parameter values and eagerness for this execution, built with `[[execute_args_create]]`.
          Borrowed; not consumed. NULL selects no parameters and AUTO eagerness.
      out_result:
        type: result
        indirection: 1
        kind: OUT
        description: On success, receives the new result. Owned by the caller; destroy via `[[result_destroy]]`.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  #---------------------------------------------------------------------------------------------------------------------
  # Introspection
  #---------------------------------------------------------------------------------------------------------------------
  prepared_statement_reuses_plan:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-09-03" ]
    description: |
      Reports whether executions reuse the work done at prepare time. Does not block.

      True when they do, provided the values passed match the parameter types the preparation assumed and nothing
      the statement depends on has changed; false when every execution works the statement out again, making it no
      faster than `[[statement_execute]]`. `SELECT 42` and `SELECT $1::INTEGER + 1` reuse; a statement reading a
      table does not, because a change to that table has to be picked up, and `SELECT $1 + $2` does not, because
      the types are unknown until values arrive.

      Fixed when the statement was prepared, and independent of the values later passed to
      `[[prepared_statement_execute]]`.
    role: getter
    belongs_to: prepared_statement
    parameters:
      prepared:
        type: prepared_statement
        description: The prepared statement to inspect.
      out_reuses:
        type: bool
        indirection: 1
        kind: OUT
        description: Receives true when executions reuse the work done at prepare time, false when each one repeats it.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  #---------------------------------------------------------------------------------------------------------------------
  # Destructor
  #---------------------------------------------------------------------------------------------------------------------
  prepared_statement_destroy:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-09-03" ]
    description: |
      Destroys a prepared statement.

      Null-safe: passing NULL, or a slot already set to NULL, is a no-op. A result made by
      `[[prepared_statement_execute]]` is owned separately and keeps the session alive itself, so the prepared
      statement may be destroyed while results made from it are still live. On success the slot is set to NULL.
    role: destructor
    belongs_to: prepared_statement
    parameters:
      prepared:
        type: prepared_statement
        indirection: 1
        description: The prepared statement to destroy.
    return_type: ERROR
