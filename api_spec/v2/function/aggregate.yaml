    lifecycle:
      - [ "stable", "v2.0.0", "2026-08-28" ]
    description: |
      Retrieves the result vector the finalize callback must write into.

      State i must be finalized into result row offset + i, with the offset from
      `[[aggregate_function_finalize_get_result_offset]]`. Borrowed; valid only for the duration of the
      callback.
    parameters:
      info:
        type: aggregate_function_finalize_info
        description: The finalize info handle.
      vector:
        type: vector
        indirection: 1
        kind: OUT
        description: Receives the borrowed result vector to write into.
      err:
