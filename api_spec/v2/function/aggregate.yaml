  #---------------------------------------------------------------------------------------------------------------------
  # Register
  #---------------------------------------------------------------------------------------------------------------------
  aggregate_function_register:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-08-28" ]
    description: |
      Registers the aggregate function, making it available for use in SQL queries.

      The function is registered on the target given at creation: the connection's database or the loading
      extension. Registration requires a name, the size, init, update, combine and finalize callbacks, and a
      signature with a complete return type; an ANY return type is accepted only together with a bind callback
      that sets the concrete type per call site. The caller still owns the handle after registration and must
      destroy it with `[[aggregate_function_destroy]]`, which does not affect the registered function.
    parameters:
      function:
        type: aggregate_function
        description: The function to register.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  #---------------------------------------------------------------------------------------------------------------------
  # Destroy
  #---------------------------------------------------------------------------------------------------------------------
  aggregate_function_destroy:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-08-28" ]
    description: |
      Destroys the aggregate function, releasing its resources.

      Null-safe: passing a null pointer or null handle is a no-op. The handle is set to null on return to
      prevent double-destruction. Destroying the handle after registration does not affect the registered
      function.
    parameters:
      function:
        type: aggregate_function
        description: The function to destroy.
        indirection: 1
    return_type: ERROR
