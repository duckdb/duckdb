    lifecycle:
      - [ "stable", "v2.0.0", "2026-08-28" ]
    description: |
      Returns the array of aggregate states to finalize, one pointer per
      state. State i must be finalized into result row offset + i.
    parameters:
      info:
        type: aggregate_function_finalize_info
        description: The finalize info handle.
      states:
        type: void
        indirection: 3
        kind: OUT
        description: Receives the array of aggregate state pointers. Borrowed; valid only for the duration of the callback.
