        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  data_source_metrics_set:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-10-27" ]
    description: |
      Reports an operator metric of the scan, by the name DuckDB's profiler uses for it (the names `tracked_metrics`
      accepts).

      The metrics a scan can report are counters:
      - `operator.rows_scanned`: the rows the scan read.
      - `operator.row_groups_scanned`: the row groups the scan read. A row group is the unit a format lets the scan
        skip, e.g. a Parquet row group or an ORC stripe.
      - `operator.total_row_groups_to_scan`: the row groups the scan read or skipped.
      - `operator.bytes_scanned`: the bytes the scan read.

      The engine may collect the metrics of a scan more than once, and adds up what it is told: each value is the
      amount since the metrics were last collected, except `operator.total_row_groups_to_scan`, which is the number
      found so far in all. Fails for a name that is not one of the above.
    parameters:
      info:
        type: data_source_metrics_info
        description: The metrics info handle.
      name:
        type: char
        indirection: 1
        const: true
        kind: IN
        description: The name of the metric. Borrowed.
      name_length:
        type: idx
        description: The length of `name` in bytes. `name` must be valid UTF-8 and need not be null-terminated.
      value:
        type: u64
        description: The value of the metric.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

