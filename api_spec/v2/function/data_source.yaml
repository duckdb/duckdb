module: data_source
#-----------------------------------------------------------------------------------------------------------------------
# Handles
#-----------------------------------------------------------------------------------------------------------------------
handles:
  data_source:
    description: |
      An owned opaque handle to a data source being built. A data source is what scans a source of rows: like a
      physical operator source it sets up the state of the scan, hands out the work to the scanning threads, and
      produces the batches of rows, without knowing how the call that scans it was bound. It is configured with the
      setter functions (e.g. `[[data_source_set_exec_callback]]`), and made the scan of a table function with
      `[[table_function_set_data_source]]`, which any number of table functions can do.

      The callbacks of a data source run when a scan executes, and receive the handles of the scan
      (e.g. `[[table_function_exec_info]]`). The "bind data" they can read is the bind data of the table function call
      that scans the data source, and the user data they can read is the one set with `[[data_source_set_user_data]]`.
      Created with `[[data_source_create]]`, destroyed with `[[data_source_destroy]]`.

#-----------------------------------------------------------------------------------------------------------------------
# Functions
#-----------------------------------------------------------------------------------------------------------------------
functions:
  data_source_create:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-25" ]
    description: |
      Creates a new data source through a factory.

      The data source starts out empty: configure it with the setter functions (e.g.
      `[[data_source_set_exec_callback]]`), then make it the scan of a table function with
      `[[table_function_set_data_source]]`. The caller owns the returned handle and must destroy it with
      `[[data_source_destroy]]`, also after it has been handed to a table function.

      The data source can only be used for table functions of the database the factory belongs to.
    role: constructor
    belongs_to: data_source
    parameters:
      factory:
        type: factory
        description: The factory to create the data source through.
      source:
        type: data_source
        indirection: 1
        kind: OUT
        description: On success, receives the newly created data source. Owned by the caller.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  data_source_set_user_data:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-25" ]
    description: |
      Sets arbitrary user data on the data source.

      Associates an opaque pointer with the data source, retrievable from its callbacks via
      `[[table_function_init_global_get_user_data]]`, `[[table_function_exec_get_user_data]]` and their counterparts on
      the other phases. The opaque handle bundles the pointer with an optional destructor, invoked when the data is no
      longer needed. A data source without user data hands its callbacks the user data of the table function that
      scans it, if that has any.
    parameters:
      source:
        type: data_source
        description: The data source to set the user data of.
      data:
        type: opaque
        indirection: 1
        description: Opaque handle bundling the user data pointer plus an optional destructor.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  data_source_set_init_global_callback:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-25" ]
    description: |
      Sets the optional global init callback of the data source.

      The global init callback is invoked once per scan, at the start of execution. It can set "global state"
      shared by every thread scanning the data source, and declare how many threads may scan it in parallel via
      `[[table_function_init_global_set_max_threads]]`.
    parameters:
      source:
        type: data_source
        description: The data source to set the global init callback of.
      callback:
        type: table_function_init_global_callback
        description: The global init callback to set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  data_source_set_init_local_callback:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-25" ]
    description: |
      Sets the optional local init callback of the data source.

      The local init callback is invoked once per thread that will scan the data source. It can set worker-local
      "local state", retrievable from the exec callback, typically derived from the shared global state.
    parameters:
      source:
        type: data_source
        description: The data source to set the local init callback of.
      callback:
        type: table_function_init_local_callback
        description: The local init callback to set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  data_source_set_exec_callback:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-25" ]
    description: |
      Sets the exec callback of the data source.

      The exec callback implements the scan: it is invoked repeatedly during query execution and writes the next
      batch of rows to the output chunk, until it produces an empty batch to signal the end of the scan. An exec
      callback must be set before the data source is given to a table function.
    parameters:
      source:
        type: data_source
        description: The data source to set the exec callback of.
      callback:
        type: table_function_exec_callback
        description: The exec callback to set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  data_source_set_progress_callback:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-25" ]
    description: |
      Sets the optional progress callback of the data source.

      The progress callback is invoked on demand during execution to report how far the scan has advanced, which
      the engine surfaces as the query's progress. It is invoked concurrently with the exec callback, so it must
      read the global state in a thread-safe way.
    parameters:
      source:
        type: data_source
        description: The data source to set the progress callback of.
      callback:
        type: table_function_progress_callback
        description: The progress callback to set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  data_source_set_metrics_callback:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-25" ]
    description: |
      Sets the optional metrics callback of the data source.

      The metrics callback is invoked when the engine collects the metrics of the scan, e.g. when profiling is
      enabled, and reports them via `[[table_function_metrics_set]]`.
    parameters:
      source:
        type: data_source
        description: The data source to set the metrics callback of.
      callback:
        type: table_function_metrics_callback
        description: The metrics callback to set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  data_source_set_partition_data_callback:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-25" ]
    description: |
      Sets the optional partition data callback of the data source.

      The partition data callback is invoked on the worker thread that just produced a batch of rows, once per batch,
      when a downstream operator needs to know the ordering position of the batch or the values of a set of
      partitioning columns. A table function with a partitioning callback (see
      `[[table_function_set_partitioning_callback]]`) requires its data source to have one.
    parameters:
      source:
        type: data_source
        description: The data source to set the partition data callback of.
      callback:
        type: table_function_partition_data_callback
        description: The partition data callback to set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  data_source_set_claim_batch_callback:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-25" ]
    description: |
      Sets the optional claim batch callback of the data source.

      With a claim batch callback, a scanning thread works through the scan one batch at a time: the callback
      claims the next batch of work (e.g. the next block of a file) for the thread's local state, typically from the
      shared global state, and the exec callback then produces the rows of that batch only, leaving the output chunk
      empty once the batch is exhausted. A batch is claimed before the exec callback first runs on a thread, and
      again whenever the exec callback leaves the output chunk empty; the scan ends for a thread once the claim batch
      callback does not claim a batch.
    parameters:
      source:
        type: data_source
        description: The data source to set the claim batch callback of.
      callback:
        type: table_function_claim_batch_callback
        description: The claim batch callback to set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  table_function_set_data_source:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-25" ]
    description: |
      Makes the scan of the table function the given data source.

      A table function takes care of everything that is decided when a call is planned - it binds the call and
      declares the columns it returns, and pushes projections and filters down - and scans with a data source: the
      callbacks that set up the scan at execution time and produce its rows. A table function has no scan callbacks of
      its own, so a data source must be set before the function is registered. The function keeps a copy of the data
      source as it is when this is called, so the same data source can be given to any number of functions, and
      changing it afterwards does not change them.

      The callbacks of the data source read the bind data the bind callback of the function sets, and the user data of
      the data source or, if it has none, the user data of the function.
    parameters:
      function:
        type: table_function
        description: The function to set the data source of.
      data_source:
        type: data_source
        description: The data source to scan with. Borrowed; it can be destroyed after this call.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  data_source_destroy:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-25" ]
    description: |
      Destroys the data source, releasing its resources.

      Null-safe: passing a null pointer or null handle is a no-op. The handle is set to null on return to
      prevent double-destruction. Destroying the handle after it was given to a table function does not affect that
      table function, which keeps a copy of the data source as it was.
    parameters:
      source:
        type: data_source
        description: The data source to destroy.
        indirection: 1
    return_type: ERROR
