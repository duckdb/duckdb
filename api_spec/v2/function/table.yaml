module: table
#-----------------------------------------------------------------------------------------------------------------------
# Enums
#-----------------------------------------------------------------------------------------------------------------------
enums:
  TABLE_PARTITION_INFO:
    description: |
      Whether a table function's scan is partitioned by a given set of columns, and how. Reported by
      `[[table_function_set_partitioning_callback]]` via `[[table_function_partitioning_set_partition_info]]`.
    values:
      TABLE_PARTITION_INFO_NOT_PARTITIONED:
        value: 0
        description: The scan is not known to be partitioned by the requested columns.
      TABLE_PARTITION_INFO_SINGLE_VALUE_PARTITIONS:
        value: 1
        description: Each partition the scan produces carries exactly one distinct value for the requested columns.
      TABLE_PARTITION_INFO_OVERLAPPING_PARTITIONS:
        value: 2
        description: The partitions the scan produces overlap only at their boundaries.
      TABLE_PARTITION_INFO_DISJOINT_PARTITIONS:
        value: 3
        description: The partitions the scan produces are disjoint ranges.

  TABLE_VIRTUAL_COLUMN:
    description: |
      A column a table function can produce next to the columns it declares in bind. A query asks for it by name,
      but it is not part of the function's result columns. Declared with `[[table_function_add_virtual_column]]`.
      In the column lists of the scan (e.g. `[[data_source_exec_get_column_index]]`), a virtual column is
      identified by 2^63 plus its value in this enum.
    values:
      TABLE_VIRTUAL_COLUMN_FILE_ROW_NUMBER:
        value: 0
        description: |
          `file_row_number`, a BIGINT holding the position of the row within the file it was read from, counting
          from 0. A function that reads a single file produces it when it is wrapped in a multi-file function (see
          `[[multi_file_function_create]]`), which is where the name of the file comes from.

#-----------------------------------------------------------------------------------------------------------------------
# Handles
#-----------------------------------------------------------------------------------------------------------------------
handles:
  table_function:
    description: |
      An owned opaque handle to a custom table function being built. Created with `[[table_function_create]]`,
      configured with the setter functions (e.g. `[[table_function_set_name]]`, `[[table_function_set_data_source]]`,
      etc.) and the signature obtained via `[[table_function_get_signature]]`, made available with
      `[[connection_register_table_function]]` or `[[extension_register_table_function]]`, and destroyed with
      `[[table_function_destroy]]`.

  table_function_bind_info:
    description: |
      A borrowed opaque handle to the result of a table function's "bind" phase. The "bind" callback receives this
      handle next to a `[[function_bind_info]]`, which gives access to the arguments, the user data and the bind
      data. It must use this handle to declare the columns the function returns, and can use it to hint at the
      number of rows the scan will produce.

  table_function_filter_pushdown_info:
    description: |
      A borrowed opaque handle to the arguments supplied to a table function during the "filter pushdown" phase of
      query optimization. The "filter pushdown" callback receives this handle and can use it to inspect the filter
      predicates the query applies to the function's rows, and to accept the ones it will apply itself.

  table_function_stats_info:
    description: |
      A borrowed opaque handle to the arguments supplied to a table function during the "stats" phase of query
      optimization. The engine invokes the callback once per column the query reads, and the callback can use the
      handle to find out which column is asked about and to report what it knows about the column's values (its
      minimum and maximum, whether it holds NULLs, ...) by narrowing the statistics of that column.

  table_function_partitioning_info:
    description: |
      A borrowed opaque handle to the arguments supplied to a table function during the "partitioning" phase
      of query optimization. The engine invokes the callback once per candidate `GROUP BY` column set, before
      execution starts, to decide whether the scan can feed a partitioned aggregate directly instead of hashing.

  table_function_get_bind_info_info:
    description: |
      A borrowed opaque handle to the arguments supplied to a table function when the engine asks it to describe a
      bound call. The "get bind info" callback receives this handle, and can use it to describe the call in more
      detail than its columns: with identifiers of its columns (e.g. field ids), and with options - key-value facts
      about what the call reads.

  table_function_to_string_info:
    description: |
      A borrowed opaque handle to the arguments supplied to a table function when the engine describes a bound call
      of it in a query plan, e.g. for `EXPLAIN`. The "to string" callback receives this handle and can use it to
      report the key-value pairs the plan shows for the scan.

  multi_file_function:
    description: |
      An owned opaque handle to a multi-file table function being built. A multi-file function wraps an already
      registered table function that reads a single file, and adds everything that is needed to read many files at once
      on top of it: globbing, lists of files, hive partitioning, the `filename` column, `union_by_name` and the like.
      Created with `[[multi_file_function_create]]`, configured with the setter functions (e.g.
      `[[multi_file_function_set_name]]`, `[[multi_file_function_set_single_file_function]]`), made available with
      `[[connection_register_multi_file_function]]` or `[[extension_register_multi_file_function]]`, and destroyed with
      `[[multi_file_function_destroy]]`.

#-----------------------------------------------------------------------------------------------------------------------
# Callbacks
#-----------------------------------------------------------------------------------------------------------------------
callbacks:
  table_function_bind_callback:
    parameters:
      info:
        type: function_bind_info
        description: |
          Borrowed opaque handle providing access to the arguments of the call site being bound, the user data and
          the bind data.
      result:
        type: table_function_bind_info
        description: Borrowed opaque handle to declare the result columns and the estimated cardinality of the scan through.
      context:
        type: context
        description: Borrowed handle to the context of the query currently executing the callback.
      err:
        type: error_info
        indirection: 1
        description: Borrowed error info handle to use to report errors that occur during the callback.
    return_type: void

  table_function_filter_pushdown_callback:
    parameters:
      info:
        type: table_function_filter_pushdown_info
        description: Borrowed opaque handle providing access to the information available to the callback.
      context:
        type: context
        description: Borrowed handle to the context of the query currently executing the callback.
      err:
        type: error_info
        indirection: 1
        description: Borrowed error info handle to use to report errors that occur during the callback.
    return_type: void

  table_function_partitioning_callback:
    parameters:
      info:
        type: table_function_partitioning_info
        description: Borrowed opaque handle providing access to the information available to the callback.
      context:
        type: context
        description: Borrowed handle to the context of the query currently executing the callback.
      err:
        type: error_info
        indirection: 1
        description: Borrowed error info handle to use to report errors that occur during the callback.
    return_type: void

  table_function_get_bind_info_callback:
    parameters:
      info:
        type: table_function_get_bind_info_info
        description: Borrowed opaque handle providing access to the information available to the callback.
      context:
        type: context
        description: Borrowed handle to the context of the query the bound call is part of.
      err:
        type: error_info
        indirection: 1
        description: Borrowed error info handle to use to report errors that occur during the callback.
    return_type: void

  table_function_stats_callback:
    parameters:
      info:
        type: table_function_stats_info
        description: Borrowed opaque handle providing access to the information available to the callback.
      context:
        type: context
        description: Borrowed handle to the context of the query currently executing the callback.
      err:
        type: error_info
        indirection: 1
        description: Borrowed error info handle to use to report errors that occur during the callback.
    return_type: void

  table_function_to_string_callback:
    parameters:
      info:
        type: table_function_to_string_info
        description: Borrowed opaque handle providing access to the information available to the callback.
      err:
        type: error_info
        indirection: 1
        description: Borrowed error info handle to use to report errors that occur during the callback.
    return_type: void

#-----------------------------------------------------------------------------------------------------------------------
# Functions
#-----------------------------------------------------------------------------------------------------------------------
functions:
  #---------------------------------------------------------------------------------------------------------------------
  # Constructors
  #---------------------------------------------------------------------------------------------------------------------
  table_function_create:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-09-01" ]
    description: |
      Creates a new table function through a factory.

      The function starts out empty: configure it with the setter functions (e.g. `[[table_function_set_name]]`,
      `[[table_function_set_data_source]]`, etc.) and the signature obtained via `[[table_function_get_signature]]`,
      then make it available with `[[connection_register_table_function]]` or `[[extension_register_table_function]]`.
      The caller owns the returned handle and must destroy it with `[[table_function_destroy]]`, also after
      registration.

      The table function can only be registered on the database the factory belongs to.
    role: constructor
    belongs_to: table_function
    parameters:
      factory:
        type: factory
        description: The factory to create the table function through.
      function:
        type: table_function
        indirection: 1
        kind: OUT
        description: On success, receives the newly created table function. Owned by the caller.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  #---------------------------------------------------------------------------------------------------------------------
  # Properties
  #---------------------------------------------------------------------------------------------------------------------
  table_function_set_name:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-09-01" ]
    description: |
      Sets the name of the table function.

      The name is borrowed and copied. Calling this again replaces the previous name.
      A name must be set before registration.
    parameters:
      function:
        type: table_function
        description: The function to set the name of.
      name:
        type: char
        indirection: 1
        const: true
        kind: IN
        description: The name to set. Borrowed and copied.
      name_length:
        type: idx
        description: The length of `name` in bytes. `name` must be valid UTF-8, need not be null-terminated, and may be NULL only when this is 0.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR


  table_function_get_docs:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-10-09" ]
    description: |
      Returns the documentation of the function so it can be filled in.

      Set a description with `[[function_docs_set_description]]`, and add examples and categories with
      `[[function_docs_add_example]]` and `[[function_docs_add_category]]`. The documentation is modified in place,
      describes this overload only, and is registered with the function. Optional.
    parameters:
      function:
        type: table_function
        kind: IN
        description: The function to get the documentation of.
      docs:
        type: function_docs
        indirection: 1
        kind: OUT
        description: The returned documentation. Borrowed and valid for the lifetime of the function handle.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  table_function_get_signature:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-09-01" ]
    description: |
      Returns the function's signature so it can be configured.

      Add parameters with `[[function_signature_add_parameter]]`. The signature is modified in place. A table
      function declares the columns it returns from its bind callback instead of through a return type, so
      registration rejects a signature whose return type was set with `[[function_signature_set_return_type]]`.
    parameters:
      function:
        type: table_function
        kind: IN
        description: The function to get the signature of.
      sig:
        type: function_signature
        indirection: 1
        kind: OUT
        description: The returned signature. Borrowed and valid for the lifetime of the function handle.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  table_function_set_user_data:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-09-01" ]
    description: |
      Sets arbitrary user data on the table function.

      Associates an opaque pointer with the function, retrievable from the callbacks via
      `[[function_bind_get_user_data]]`, `[[data_source_init_global_get_user_data]]`,
      `[[data_source_exec_get_user_data]]` and their counterparts on the other phases. The opaque handle
      bundles the pointer with an optional destructor, invoked when the data is no longer needed.
    parameters:
      function:
        type: table_function
        description: The function to set the user data of.
      data:
        type: opaque
        indirection: 1
        description: Opaque handle bundling the user data pointer plus an optional destructor.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  table_function_set_bind_callback:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-09-01" ]
    description: |
      Sets the bind callback of the table function.

      The bind callback is invoked during query planning for each call site of the function. It must declare the
      columns the function returns via `[[table_function_bind_add_result_column]]`. Through its
      `[[function_bind_info]]` it can also inspect the constant argument values and set "bind data" that is shared
      with all later callbacks. A bind callback must be set before registration.
    parameters:
      function:
        type: table_function
        description: The function to set the bind callback of.
      callback:
        type: table_function_bind_callback
        description: The bind callback to set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  table_function_set_projection_pushdown:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-09-03" ]
    description: |
      Sets whether the table function supports projection pushdown. Defaults to false.

      With projection pushdown, the engine asks the function for only the columns a query actually uses: the exec
      callback's output chunk holds one vector per requested column rather than one per column declared in bind,
      and the global init, local init and exec callbacks can look up which declared column each vector stands for
      via e.g. `[[data_source_exec_get_column_index]]`. Without it the output chunk always holds every declared
      column, and the engine drops the unused ones itself.
    parameters:
      function:
        type: table_function
        description: The function to configure.
      enable:
        type: bool
        description: Whether the function supports projection pushdown.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  table_function_add_virtual_column:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-10-27" ]
    description: |
      Declares that the table function can produce the given virtual column.

      A virtual column is not one of the columns declared in bind: the query asks for it by name, and the function
      only produces it when it is asked for. It then takes up a vector of the exec callback's output chunk, like any
      other column the scan produces. This requires projection pushdown (see
      `[[table_function_set_projection_pushdown]]`), which is what lets the engine ask for it. The global init, local
      init and exec callbacks recognize the vector by its column index, which is 2^63 plus the value of the
      `[[TABLE_VIRTUAL_COLUMN]]` (see e.g. `[[data_source_exec_get_column_index]]`).
    parameters:
      function:
        type: table_function
        description: The function to configure.
      column:
        type: TABLE_VIRTUAL_COLUMN
        description: The virtual column the function can produce.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  table_function_set_filter_pushdown_callback:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-09-03" ]
    description: |
      Sets the optional filter pushdown callback of the table function.

      The filter pushdown callback is invoked while the query is optimized, after the bind callback and before any
      init callback, with the filter predicates the query applies to the function's rows. Each predicate is a
      bound expression the callback can inspect with the `expression` functions; the callback accepts the
      predicates it will apply itself via `[[table_function_filter_pushdown_accept]]`, typically after
      recording what they select in the bind data. The engine then stops applying the accepted predicates and
      keeps applying the rest above the scan, so accepting a predicate is a promise to filter the rows exactly as
      it would have. The optimizer may invoke the callback more than once for the same query, each time with the
      predicates not yet accepted; it is not invoked when there are none.

      A function that also has projection pushdown (see `[[table_function_set_projection_pushdown]]`) is offered the
      predicates that apply to a single column of it once more when a scan starts, just before the global init
      callback, in the same form, with the column references resolved by `[[table_function_filter_pushdown_get_column_index]]`
      as at optimization time. This is how the callback of a function wrapped in a multi-file function sees the
      predicates, which the optimizer only offers to the wrapper. The engine applies these predicates to the rows the
      function produces itself, so the function may use them to skip what the query can never use but does not have to
      understand them, and accepting one has no effect. The scan keeps the columns the predicates are applied to.
    parameters:
      function:
        type: table_function
        description: The function to set the filter pushdown callback of.
      callback:
        type: table_function_filter_pushdown_callback
        description: The filter pushdown callback to set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  table_function_set_partitioning_callback:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-09-15" ]
    description: |
      Sets the optional "partitioning" callback of the table function.

      The callback tells the query optimizer, for a candidate `GROUP BY` column set, whether every partition the
      scan produces carries exactly one distinct value for those columns; only
      `TABLE_PARTITION_INFO_SINGLE_VALUE_PARTITIONS` unlocks the partitioned aggregate optimization; any other
      result, or leaving this callback unset, keeps the regular hash aggregate. It runs on the planning thread,
      before execution starts, and must be deterministic for a given column set since it may be called on a plan
      the optimizer later discards. Registration fails unless
      `[[data_source_set_partition_data_callback]]` is set too, since the engine asks that callback for the
      partitioning column values once this one claims single-value partitions.
    parameters:
      function:
        type: table_function
        description: The function to set the partitioning callback of.
      callback:
        type: table_function_partitioning_callback
        description: The partitioning callback to set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  table_function_set_stats_callback:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-10-02" ]
    description: |
      Sets the optional stats callback of the table function.

      The stats callback is invoked during query optimization once for each declared column the query reads, when the
      engine wants to know about the column's values without reading them - e.g. to prune a scan whose filter no value
      can satisfy, to answer `min()` / `max()` from the statistics, or to estimate the selectivity of a filter. Through
      its `[[table_function_stats_info]]` the callback narrows the statistics of that column (see
      `[[table_function_stats_get_result_stats]]`): its minimum and maximum, whether it holds NULLs, the statistics of
      the children of a nested column, ... Leaving the statistics unchanged tells the engine nothing about the column.
      The statistics must hold for every row the call produces: a bound that excludes a value the scan then produces
      leads to wrong results. A function without a stats callback gives the engine no statistics for its columns. The
      callback is only asked about whole declared columns, never about virtual columns or about fields extracted from
      a column.
    parameters:
      function:
        type: table_function
        description: The function to set the stats callback of.
      callback:
        type: table_function_stats_callback
        description: The stats callback to set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  #---------------------------------------------------------------------------------------------------------------------
  # Bind Callback Functions
  #---------------------------------------------------------------------------------------------------------------------
  table_function_bind_add_result_column:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-09-01" ]
    description: |
      Declares one of the columns the function returns.

      Call this once per column, in order: the columns declared here are the columns of the table the function
      produces, and the vectors of the output chunk the exec callback fills follow the same order. At least one
      column must be declared. The type must be a fully defined concrete type; ANY is rejected, as a result
      column carries data. The name and type are borrowed and copied.
    parameters:
      info:
        type: table_function_bind_info
        description: The bind info handle.
      name:
        type: char
        indirection: 1
        const: true
        kind: IN
        description: The name of the column. Borrowed and copied.
      name_length:
        type: idx
        description: The length of `name` in bytes. `name` must be valid UTF-8, need not be null-terminated, and may be NULL only when this is 0.
      type:
        type: logical_type
        description: The type of the column. Borrowed and copied.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  table_function_bind_set_cardinality:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-09-01" ]
    description: |
      Sets the estimated number of rows the scan will produce.

      The estimate is a hint for the optimizer, not a limit: producing a different number of rows is not an
      error. Without it, the optimizer falls back on its own defaults.
    parameters:
      info:
        type: table_function_bind_info
        description: The bind info handle.
      cardinality:
        type: idx
        description: The estimated number of rows.
      is_exact:
        type: bool
        description: Whether the estimate is exact, which also makes it an upper bound on the row count.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  table_function_bind_set_order_preservation:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-09-28" ]
    description: |
      Sets the order guarantee of the rows this call of the function produces. Defaults to
      `ORDER_PRESERVATION_INSERTION_ORDER`.

      With `ORDER_PRESERVATION_NO_ORDER`, a scan that reports more than one thread via
      `[[data_source_init_global_set_max_threads]]` runs in parallel into query results, INSERT and COPY without
      a `[[data_source_set_partition_data_callback]]`, and the rows arrive in no particular order. With
      insertion order kept, those consumers need the partition data callback to run in parallel. Fails with
      `ERROR_INPUT_INVALID` when order is not one of the enum's declared values.
    parameters:
      info:
        type: table_function_bind_info
        description: The bind info handle.
      order:
        type: ORDER_PRESERVATION
        description: The order guarantee of the produced rows.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  #---------------------------------------------------------------------------------------------------------------------
  # Filter Pushdown Callback Functions
  #---------------------------------------------------------------------------------------------------------------------
  table_function_filter_pushdown_get_user_data:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-09-03" ]
    description: |
      Retrieves the user data set via `[[table_function_set_user_data]]`, or null if none was set.
    parameters:
      info:
        type: table_function_filter_pushdown_info
        description: The filter pushdown info handle.
      data:
        type: void
        indirection: 2
        kind: OUT
        description: Receives the user data pointer.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  table_function_filter_pushdown_get_bind_data:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-09-03" ]
    description: |
      Retrieves the bind data set via `[[function_bind_set_bind_data]]`, or null if none was set.

      This is the same object the init and exec callbacks later receive, so a predicate the callback accepts can be
      recorded in it for the scan to apply.
    parameters:
      info:
        type: table_function_filter_pushdown_info
        description: The filter pushdown info handle.
      data:
        type: void
        indirection: 2
        kind: OUT
        description: Receives the bind data pointer.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  table_function_filter_pushdown_get_filter_count:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-09-03" ]
    description: |
      Returns the number of filter predicates offered to the function.

      The predicates are combined with `AND`: every row the scan produces must satisfy all of them. Valid indices
      for `[[table_function_filter_pushdown_get_filter]]` and `[[table_function_filter_pushdown_accept]]` are
      `0` up to (but excluding) this count.
    parameters:
      info:
        type: table_function_filter_pushdown_info
        description: The filter pushdown info handle.
      count:
        type: idx
        indirection: 1
        kind: OUT
        description: Receives the number of predicates.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  table_function_filter_pushdown_get_filter:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-09-03" ]
    description: |
      Retrieves the filter predicate at the given index.

      Fails if the index is out of bounds. The predicate is a bound expression evaluating to `BOOLEAN`; inspect it
      with `[[expression_get_type]]` and the other `expression` functions, and resolve the column references it
      contains via `[[table_function_filter_pushdown_get_column_index]]`. Borrowed; valid only for the duration of
      the callback.
    parameters:
      info:
        type: table_function_filter_pushdown_info
        description: The filter pushdown info handle.
      index:
        type: idx
        description: The index of the predicate to retrieve.
      filter:
        type: expression
        indirection: 1
        kind: OUT_BORROW
        description: Receives the borrowed predicate.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  table_function_filter_pushdown_accept:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-09-03" ]
    description: |
      Accepts the filter predicate at the given index: the function will apply it itself.

      The engine stops applying an accepted predicate, so the scan must produce only rows that satisfy it, or the
      query returns rows it should not. Predicates left unaccepted are applied by the engine as usual, so a callback
      that recognizes nothing can simply return. Fails if the index is out of bounds.
    parameters:
      info:
        type: table_function_filter_pushdown_info
        description: The filter pushdown info handle.
      index:
        type: idx
        description: The index of the predicate to accept.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  table_function_filter_pushdown_get_column_count:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-09-03" ]
    description: |
      Returns the number of columns the predicates can refer to.

      A column reference inside a predicate (`[[expression_column_ref_get_index]]`) indexes the columns the query
      reads from the function, not the columns declared in bind. Valid indices for
      `[[table_function_filter_pushdown_get_column_index]]` are `0` up to (but excluding) this count.
    parameters:
      info:
        type: table_function_filter_pushdown_info
        description: The filter pushdown info handle.
      count:
        type: idx
        indirection: 1
        kind: OUT
        description: Receives the number of referable columns.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  table_function_filter_pushdown_get_column_index:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-09-03" ]
    description: |
      Resolves a column reference found in a predicate to the declared column it refers to.

      Takes the index a `EXPRESSION_TYPE_BOUND_COLUMN_REF` node reports and returns the index of the column among
      the ones declared with `[[table_function_bind_add_result_column]]`, in declaration order. Fails if the index
      is out of bounds.
    parameters:
      info:
        type: table_function_filter_pushdown_info
        description: The filter pushdown info handle.
      index:
        type: idx
        description: The column index reported by a column reference node.
      column_index:
        type: idx
        indirection: 1
        kind: OUT
        description: Receives the index of the declared column.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

