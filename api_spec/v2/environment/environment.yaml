module: environment
# The environment is the required root for opening databases. Create one at
# program start; destroy it at program end. Destroying it refuses while any
# database opened through it is still alive — the only handle in V2 with
# refuse-on-destroy semantics, kept as a guard for the program-lifetime root.
functions:

  # Create Environment
  create_environment:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-08-04" ]
    description: "Creates the V2 environment. Call once at program start."
    role: constructor
    belongs_to: environment
    parameters:
      out_env:
        type: environment
        indirection: 1
        kind: OUT
        description: "Receives the new environment handle."
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy."
    return_type: ERROR

  # Destroy Environment
  destroy_environment:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-08-04" ]
    description: |
      Destroys the environment.

      Refuses with ERROR_RESOURCE_IN_USE while any database opened through this
      environment is still alive; close those databases first, then retry. On
      success the handle is set to null.
    role: destructor
    belongs_to: environment
    parameters:
      env:
        type: environment
        indirection: 1
        description: "The environment."
    return_type: ERROR

  # Get Environment database count
  environment_database_count:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-08-04" ]
    description: |
      Returns the number of databases currently open under the environment.

      A diagnostic accessor, for tracking down leaked database handles when
      destroy_environment returns ERROR_RESOURCE_IN_USE. The count is a
      snapshot and may change before the next call.
    role: getter
    belongs_to: environment
    parameters:
      env:
        type: environment
        description: "The environment."
      out_count:
        type: idx
        indirection: 1
        kind: OUT
        description: "Receives the number of currently-open databases."
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy."
    return_type: ERROR
