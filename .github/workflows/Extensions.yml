#
# This workflow is responsible for building all DuckDB extensions
#

name: Extensions (all platforms)
on:
  workflow_call:
    inputs:
      duckdb_version:
        type: string
      duckdb_commit:
        type: string
      extra_exclude_archs:
        type: string
        required: false
        default: ''
      skip_tests:
        type: boolean
      run_all:
        type: boolean
      # disabling this can result in faster builds, but may run out of space on some runners
      run_disk_clean_step:
        type: boolean
        required: false
        default: true
      opt_in_archs:
        type: string
        required: false
        default: ''
      allow_failure_archs:
        type: string
        required: false
        default: ''
      runners:
        type: string
        required: true
      runner_provider:
        type: string
        required: true
      image_version:
        type: string
        required: true
      save_cache:
        type: boolean
        required: false
        default: false
concurrency:
  group: extensions-${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}-${{ inputs.duckdb_version }}
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ secrets.GH_TOKEN }}
  DUCKDB_VERSION: ${{ inputs.duckdb_version }}
  DUCKDB_COMMIT: ${{ inputs.duckdb_commit }}

jobs:
  # Build the extensions from the main extension shards and the Rust-based config
  extensions-build:
    name: Build extensions
    uses: duckdb/extension-ci-tools/.github/workflows/build.yml@main
    with:
      duckdb_version: ${{ inputs.duckdb_commit }}
      image_version: ${{ inputs.image_version }}
      groups: |
        core:
          config: duckdb/.github/config/core.cmake
          extra_toolchains: unixodbc;parser_tools
          opt_in_archs: '${{ inputs.opt_in_archs }}'
          toolchain: main
        cloud:
          config: duckdb/.github/config/cloud.cmake
          extra_toolchains: unixodbc;parser_tools
          opt_in_archs: '${{ inputs.opt_in_archs }}'
          toolchain: main
        search:
          config: duckdb/.github/config/search.cmake
          extra_toolchains: unixodbc;parser_tools
          opt_in_archs: '${{ inputs.opt_in_archs }}'
          toolchain: main
        scanner:
          config: duckdb/.github/config/scanner.cmake
          extra_toolchains: unixodbc;parser_tools
          opt_in_archs: '${{ inputs.opt_in_archs }}'
          toolchain: main
        rust:
          config: duckdb/.github/config/rust_based_extensions.cmake
          default_exclude_archs: wasm_mvp;wasm_eh;wasm_threads;windows_amd64_rtools;windows_amd64_mingw;linux_amd64_musl
          toolchain: rust
      extension_repository: duckdb/extension-template
      extension_ref: main
      ci_tools_repository: duckdb/extension-ci-tools
      ci_tools_version: main
      exclude_archs: ${{ inputs.extra_exclude_archs }}
      allow_failure_archs: ${{ inputs.allow_failure_archs }}
      reduced_ci_mode: ${{ (github.event_name == 'pull_request' || !inputs.run_all) && 'enabled' || 'disabled' }}
      skip_tests: ${{ inputs.skip_tests }}
      save_cache: ${{ inputs.save_cache }}
      runners: ${{ inputs.runners }}

  deploy-repository:
    name: Deploy extensions
    runs-on: ${{ fromJSON(inputs.runners).linux_x64 || 'ubuntu-latest' }}
    container:
      image: ghcr.io/duckdb/duckdb-ci/manylinux_2_28_amd64_main:${{ inputs.image_version }}
    needs:
      - extensions-build
    steps:
      - name: "Checkout"
        uses: duckdb/duckdb-ci/.github/actions/checkout@main
        with:
          runner_provider: ${{ inputs.runner_provider }}
          fetch_depth: 0
          ref: ${{ inputs.duckdb_commit }}

      - uses: ./.github/actions/ccache-action

      - uses: actions/download-artifact@v8
        name: Download all extensions
        with:
          pattern: '*-extensions-*'
          path: /tmp/repository_generation
          # When multiple artifacts are matched:
          # - if true: the downloaded artifacts will be in the same directory
          #   specified by path.
          # - if false: the downloaded artifacts will be extracted into
          #   individual named directories within the specified path.
          #
          # Note: When downloading a single artifact (by name or ID), it will
          # always be extracted directly to the specified path.
          merge-multiple: true

      - name: Print all extensions
        run: |
          tree /tmp/repository_generation

          ls /tmp/repository_generation/*/*/*.duckdb_extension*

      - name: Validate extension signing
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          AWS_ENDPOINT_URL: https://example.com
          AWS_ACCESS_KEY_ID: duckdb-signing-validation
          AWS_SECRET_ACCESS_KEY: duckdb-signing-validation
          DUCKDB_EXTENSION_SIGNING_OUTPUT_DIR: /tmp/repository_signed_validation
        run: |
          set -euo pipefail

          private_key_file=$(mktemp "${TMPDIR:-/tmp}/duckdb-extension-signing-validation.XXXXXX.pem")
          public_key_file=$(mktemp "${TMPDIR:-/tmp}/duckdb-extension-signing-validation.XXXXXX.pub")
          trap 'rm -f "$private_key_file" "$public_key_file"' EXIT

          openssl genrsa -out "$private_key_file" 2048
          openssl rsa -in "$private_key_file" -pubout -out "$public_key_file"
          DUCKDB_EXTENSION_SIGNING_PK="$(cat "$private_key_file")"
          export DUCKDB_EXTENSION_SIGNING_PK

          rm -rf /tmp/repository_signed_validation
          make upload-extensions EXTENSION_REPOSITORY_PATH=/tmp/repository_generation
          make verify-extension-signing \
            SIGNED_EXTENSIONS_DIR=/tmp/repository_signed_validation \
            EXTENSION_SIGNING_PUBLIC_KEY_FILE="$public_key_file"

      - name: Deploy extensions
        shell: bash
        env:
          AWS_ENDPOINT_URL: ${{ secrets.DUCKDB_CORE_EXTENSION_S3_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{secrets.DUCKDB_CORE_EXTENSION_S3_ID}}
          AWS_SECRET_ACCESS_KEY: ${{secrets.DUCKDB_CORE_EXTENSION_S3_SECRET}}
          DUCKDB_DEPLOY_SCRIPT_MODE: for_real
          DUCKDB_EXTENSION_SIGNING_PK: ${{ secrets.DUCKDB_EXTENSION_SIGNING_PK }}
        run: |
          make upload-extensions EXTENSION_REPOSITORY_PATH=/tmp/repository_generation

      - name: Build DuckDB
        if: ${{ !inputs.skip_tests }}
        uses: duckdb/duckdb-ci/build-duckdb@main
        env:
          GEN: ninja
          EXTENSION_CONFIGS: './.github/config/rust_based_extensions.cmake;./.github/config/out_of_tree_extensions.cmake;./.github/config/in_tree_extensions.cmake'
          EXTENSION_TESTS_ONLY: 1
          ENABLE_EXTENSION_AUTOLOADING: 1
          ENABLE_EXTENSION_AUTOINSTALL: 1
          DUCKDB_VERSION: ${{ inputs.duckdb_version }}
          DUCKDB_COMMIT: ${{ inputs.duckdb_commit }}
        with:
          build-type: release
          build: python3 scripts/ci/retry.py -- make release

      - name: Run Tests
        if: ${{ !inputs.skip_tests }}
        env:
          LOCAL_EXTENSION_REPO: /tmp/repository_generation
          DUCKDB_TEST_DESCRIPTION: 'Running with autoloading of extensions. Run unittest --autoloading available to reproduce locally. Add require no_extension_autoloading to skip the test'
        run: make unittest_release SKIP_BUILD=1 T="--test-flags='--autoloading available --skip-compiled'"

      - name: Build other repository
        if: ${{ !inputs.skip_tests }}
        env:
          GENERATE_EXTENSION_ENTRIES: 1
          LOCAL_EXTENSION_REPO: build/release/repository_other
          DUCKDB_VERSION: ${{ inputs.duckdb_version }}
          DUCKDB_COMMIT: ${{ inputs.duckdb_commit }}
        run: |
          python3 scripts/ci/retry.py -- make release

      - name: Copy over local extension repository
        if: ${{ !inputs.skip_tests }}
        run: |
          cp -r /tmp/repository_generation build/release/repository
          tree build/release/repository
          find build/release/repository -type f ! -path "build/release/repository/*/linux_amd64/*" -delete
          tree build/release/repository

      # Disable downloading release because extension_entries.hpp check fails
      # in CI because some extensions are not available.
      - name: Download linux release artifact
        if: ${{ false && !inputs.skip_tests }}
        id: linux_release_artifact
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: linux-release-build
          path: build

      - name: Extract linux release artifact
        if: ${{ steps.linux_release_artifact.outcome == 'success' }}
        run: |
          rm -rf build/release
          tar -xzf build/release-artifact.tar.gz -C build

      - name: Install parser tools
        if: ${{ !inputs.skip_tests }}
        run: python3 scripts/ci/retry.py -- pip3 install --break-system-packages cxxheaderparser==2.0.0 pcpp==1.30 typos==1.45.1

      - name: Check if extension_entries.hpp is up to date
        if: ${{ !inputs.skip_tests }}
        id: check_extension_entries
        env:
          EXTENSION_CONFIGS: '.github/config/in_tree_extensions.cmake;.github/config/out_of_tree_extensions.cmake'
          DUCKDB_VERSION: ${{ inputs.duckdb_version }}
          DUCKDB_COMMIT: ${{ inputs.duckdb_commit }}
        run: |
          make check-extension-entries

      - name: Upload extension entries diff
        if: ${{ always() && steps.check_extension_entries.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: extension-entries-diff
          path: extension_entries.hpp.diff
          if-no-files-found: error
