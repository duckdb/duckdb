name: Main
on:
  workflow_dispatch:
    inputs:
      override_git_describe:
        type: string
      git_ref:
        type: string
      skip_tests:
        type: boolean
        default: false
      run_all:
        type: boolean
        default: true
  push:
    branches-ignore:
      - 'main'
      - 'feature'
      - 'v*.*-*'
      - 'gh-readonly-queue/**'
    paths:
      - '**'
      - '!**.md'
      - '!tools/**'
      - 'tools/shell/**'
      - '!.github/patches/duckdb-wasm/**'
      - '!.github/workflows/**'
      - '.github/workflows/Main.yml'
      - '.github/workflows/Swift.yml'
      - '.github/workflows/Windows.yml'
      - '.github/workflows/Regression.yml'
      - '.github/workflows/Extensions.yml'
      - '.github/workflows/OSX.yml'
  merge_group:
  pull_request:
    types: [opened, reopened, ready_for_review, converted_to_draft, synchronize]
    paths:
      - '**'
      - '!**.md'
      - '!tools/**'
      - 'tools/shell/**'
      - '!.github/patches/duckdb-wasm/**'
      - '!.github/workflows/**'
      - '.github/workflows/Main.yml'
      - '.github/workflows/Swift.yml'
      - '.github/workflows/Windows.yml'
      - '.github/workflows/Regression.yml'
      - '.github/workflows/Extensions.yml'
      - '.github/workflows/OSX.yml'


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ secrets.GH_TOKEN }}
  # Run only specific jobs in CI (separated by whitespace) and skip the rest.
  #
  # Add the CI job's `needs:` list here as well. Otherwise, those are skipped
  # and the dependent job is also skipped.
  #
  # For example, to run only "extensions", use:
  # OVERRIDE_JOBS: linux-relassert linux-release extensions

jobs:
 prepare:
    # We run all other jobs on PRs only if they are not draft PR
    if: |
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      (github.event.action != 'synchronize' || contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association))
    runs-on: ${{ github.repository == 'duckdb/duckdb' && 'namespace-profile-linux-x64' || 'ubuntu-latest' }}
    outputs:
      git_sha: ${{ steps.resolve_git_sha.outputs.git_sha }}
      runner_linux_small: ${{ steps.runners.outputs.runner_linux_small }}
      runner_linux_x64: ${{ steps.runners.outputs.runner_linux_x64 }}
      runner_linux_22_x64: ${{ steps.runners.outputs.runner_linux_22_x64 }}
      runner_linux_arm64: ${{ steps.runners.outputs.runner_linux_arm64 }}
      runner_windows_2022_x64: ${{ steps.runners.outputs.runner_windows_2022_x64 }}
      runner_macos_arm64: ${{ steps.runners.outputs.runner_macos_arm64 }}
      runner_macos_14_arm64: ${{ steps.runners.outputs.runner_macos_14_arm64 }}
      runners: ${{ steps.runners.outputs.runners }}
      images: ${{ steps.config.outputs.images }}
      linux_release_matrix: ${{ steps.selection.outputs.linux_release_matrix }}
      linux_musl_matrix: ${{ steps.selection.outputs.linux_musl_matrix }}
      extensions_changed: ${{ steps.changed.outputs.extensions_any_changed }}
      changed_tests_files: ${{ steps.changed.outputs.tests_all_changed_files }}
      changed_slow_tests_files: ${{ steps.changed.outputs.tests_slow_all_changed_files }}
      run_slow_tests: ${{ steps.config.outputs.run_slow_tests }}
      extensions_extra_exclude_archs: ${{ steps.config.outputs.extra_exclude_archs }}
      enabled_jobs: ${{ steps.selection.outputs.enabled_jobs }}
      save_cache: ${{ steps.selection.outputs.save_cache }}
      runner_provider: ${{ steps.runners.outputs.runner_provider }}
      skip_tests: ${{ steps.config.outputs.skip_tests }}
      effective_git_describe: ${{ steps.version.outputs.effective_git_describe }}
      staged_version: ${{ steps.version.outputs.staged_version }}
      extension_allow_failure_archs: ${{ steps.version.outputs.extension_allow_failure_archs }}
    env:
      GEN: ninja
    steps:
      - name: Detect runners
        id: runners
        uses: duckdb/duckdb-ci/detect-runners@main

      - name: Resolve git sha
        id: resolve_git_sha
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.git_ref }}" ]]; then
            resolved_sha="$(gh api -X GET "/repos/${{ github.repository }}/commits" -f sha="${{ inputs.git_ref }}" -f per_page=1 --jq '.[0].sha')"
          else
            resolved_sha="${{ github.sha }}"
          fi
          echo "git_sha=$resolved_sha" >> "$GITHUB_OUTPUT"
          echo "Using git_sha=$resolved_sha"

      - name: Resolve version override
        id: version
        shell: bash
        run: |
          effective_git_describe="${{ github.event_name == 'workflow_dispatch' && inputs.override_git_describe || '' }}"
          staged_version=""
          extension_allow_failure_archs=
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -z "${{ inputs.git_ref }}" && -z "$effective_git_describe" ]]; then
            effective_git_describe="v2.0.0-alpha${{ github.run_number }}"
            commit="${{ steps.resolve_git_sha.outputs.git_sha }}"
            staged_version="${commit:0:10}/$effective_git_describe"
            extension_allow_failure_archs="windows_amd64_mingw;linux_amd64_musl;linux_arm64_musl"
          fi
          {
            echo "effective_git_describe=$effective_git_describe"
            echo "staged_version=$staged_version"
            echo "extension_allow_failure_archs=$extension_allow_failure_archs"
          } >> "$GITHUB_OUTPUT"
          echo "Using effective_git_describe=$effective_git_describe"
          echo "Using staged_version=$staged_version"
          echo "Using extension_allow_failure_archs=$extension_allow_failure_archs"

      - name: "Checkout"
        uses: duckdb/duckdb-ci/.github/actions/checkout@main
        with:
          runner_provider: ${{ steps.runners.outputs.runner_provider }}
          fetch_depth: 0
          ref: ${{ steps.resolve_git_sha.outputs.git_sha }}

      - name: Detect changes
        id: changed
        uses: tj-actions/changed-files@v47
        with:
          files_yaml: |
            github:
              - .github/**
            osx:
              - '**'
              - '!**.md'
              - '!test/configs/**'
              - '!tools/**'
              - 'tools/shell/**'
              - '!.github/patches/duckdb-wasm/**'
              - '!.github/workflows/**'
              - '.github/workflows/OSX.yml'
            extensions:
              - .github/config/**
              - .github/patches/**
              - extensions/**
            tests:
              - test/**/*.test
            tests_slow:
              - test/**/*.cpp
              - test/**/*.test_slow

      - name: Lint CI
        if: steps.changed.outputs.github_any_changed == 'true'
        timeout-minutes: 10
        uses: duckdb/duckdb-ci/lint-ci@main

      - name: Select CI jobs
        id: selection
        shell: bash
        run: |
          skip_tests="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.skip_tests || 'false' }}"
          python3 scripts/ci/job_stages.py \
            --event "${{ github.event_name }}" \
            --ref_name "${{ github.ref_name }}" \
            --repository "${{ github.repository }}" \
            --skip-tests "$skip_tests" \
            --changed-keys "${{ steps.changed.outputs.changed_keys }}" \
            --runners '${{ steps.runners.outputs.runners }}'

      - name: Configure CI
        id: config
        run: |
          make test_ci

          if [[ "${{ github.event_name }}" != "pull_request" || "${{ steps.changed.outputs.extensions_any_changed }}" == "true" ]]; then
            extra_exclude_archs=
          else
            extra_exclude_archs=windows_amd64\;wasm_eh
          fi

          echo "extra_exclude_archs=$extra_exclude_archs" >> "$GITHUB_OUTPUT"

          if [[ "${{ steps.changed.outputs.tests_slow_any_changed }}" == "true" || "${{ github.ref_name }}" == "main" ]]; then
            run_slow_tests=true
          else
            run_slow_tests=false
          fi
          echo "run_slow_tests=$run_slow_tests" >> "$GITHUB_OUTPUT"
          skip_tests="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.skip_tests || 'false' }}"
          echo "skip_tests=$skip_tests" >> "$GITHUB_OUTPUT"

          image_version="$(<scripts/ci/image_version.txt)"

          images=$(
            jq -nc --arg image_version "$image_version" \
              '{
                manylinux_amd64_main: ("ghcr.io/duckdb/duckdb-ci/manylinux_2_28_amd64_main:" + $image_version),
                manylinux_arm64_main: ("ghcr.io/duckdb/duckdb-ci/manylinux_2_28_aarch64_main:" + $image_version),
                alpine_amd64_main: ("ghcr.io/duckdb/duckdb-ci/alpine_3_22_amd64_main:" + $image_version),
                alpine_arm64_main: ("ghcr.io/duckdb/duckdb-ci/alpine_3_22_aarch64_main:" + $image_version),
                ubuntu_24_04_amd64_lint: ("ghcr.io/duckdb/duckdb-ci/ubuntu_24_04_amd64_lint:" + $image_version)
              }'
          )

          grep -E '^(extra_exclude_archs|runner_)' "$GITHUB_OUTPUT"
          echo "images=$images" >> "$GITHUB_OUTPUT"

      - name: Install tools
        timeout-minutes: 10
        run: python3 scripts/ci/retry.py --timeout 2m -- make -j4 format_tools

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install C API header generation tools
        run: |
          python3 -m pip install -U pip
          python3 -m pip install --group api_spec/pyproject.toml:generate
          python3 -m pip install cxxheaderparser pcpp

      - name: Check format
        run: |
          make format-check-silent enum-integrity-check extension-patch-check -j -Otarget
          echo "::group::Check generated files"
          make generate-files
          git diff --exit-code
          echo "::endgroup::"

 linux-relassert:
    name: Linux Relassert
    # This tests release build while enabling slow verifiers (masked by #ifdef DEBUG) and sanitizers
    if: ${{ contains(fromJson(needs.prepare.outputs.enabled_jobs), 'linux-relassert') }}
    needs: prepare
    runs-on: ${{ needs.prepare.outputs.runner_linux_x64 }}
    container:
      image: ${{ fromJson(needs.prepare.outputs.images).manylinux_amd64_main }}
    env:
      TREAT_WARNINGS_AS_ERRORS: 1
      GEN: ninja
      CRASH_ON_ASSERT: 1
      FORCE_DEBUG: 1
      FORCE_ASSERT: 1
      EXPORT_DYNAMIC_SYMBOLS: 1
      REDUCE_SYMBOLS: 1
      EXTENSION_STATIC_BUILD: 0

    steps:
    - name: "Checkout"
      uses: duckdb/duckdb-ci/.github/actions/checkout@main
      with:
        runner_provider: ${{ needs.prepare.outputs.runner_provider }}
        fetch_depth: 0
        ref: ${{ needs.prepare.outputs.git_sha }}

    - id: describe_step
      run: echo "git_describe=$(git describe --tags --long)" >> "$GITHUB_OUTPUT"

    - uses: ./.github/actions/ccache-action
      with:
        save: ${{ fromJson(needs.prepare.outputs.save_cache) }}

    - name: Write changed tests file
      shell: bash
      run: printf '%s\n' "${{ needs.prepare.outputs.changed_tests_files }}" | tr ' ' '\n' | sed '/^$/d' > "$RUNNER_TEMP/changed_tests.txt"

    - name: Build DuckDB
      uses: duckdb/duckdb-ci/build-duckdb@main
      env:
        CORE_EXTENSIONS: "icu;tpch;tpcds;fts;json;inet;parquet;autocomplete;httpfs"
      with:
        build-type: relassert
        build: python3 scripts/ci/retry.py -- make relassert
        vcpkg-commit: 84bab45d415d22042bd0b9081aea57f362da3f35
        test: make smoke T="--changed-tests=$RUNNER_TEMP/changed_tests.txt"
        bundle: make relassert-artifact
        upload-name: linux-relassert-build
        upload-path: build/relassert-artifact.tar.gz
        save-cache: ${{ fromJson(needs.prepare.outputs.save_cache) }}

    - name: Output version info
      run: ./build/relassert/duckdb -c "PRAGMA version;"

 linux-relassert-tests:
    name: Linux Relassert Tests
    if: ${{ contains(fromJson(needs.prepare.outputs.enabled_jobs), 'linux-relassert-tests') }}
    needs:
      - prepare
      - linux-relassert
    runs-on: ${{ needs.prepare.outputs.runner_linux_x64 }}
    container:
      image: ${{ fromJson(needs.prepare.outputs.images).manylinux_amd64_main }}

    steps:
    - name: "Checkout"
      uses: duckdb/duckdb-ci/.github/actions/checkout@main
      with:
        runner_provider: ${{ needs.prepare.outputs.runner_provider }}
        ref: ${{ needs.prepare.outputs.git_sha }}
    - name: Download relassert build artifact
      uses: actions/download-artifact@v8
      with:
        name: linux-relassert-build
        path: build

    - name: Extract relassert build artifact
      run: |
        rm -rf build/relassert
        tar -xzf build/relassert-artifact.tar.gz -C build
        ls -lh build/relassert/test/unittest

    - name: Set DUCKDB_INSTALL_LIB for ADBC tests
      run: echo "DUCKDB_INSTALL_LIB=$(find "$PWD" -name 'libduck*.so' | head -n 1)" >> "$GITHUB_ENV"

    - name: Test DUCKDB_INSTALL_LIB variable
      run: echo "$DUCKDB_INSTALL_LIB"

    - name: Test
      run: make unittest_relassert

    - name: Test Benchmark SQL
      run: make test_benchmark_sql

 regression:
    if: ${{ contains(fromJson(needs.prepare.outputs.enabled_jobs), 'regression') }}
    uses: ./.github/workflows/Regression.yml
    secrets: inherit
    needs:
      - prepare
      - linux-relassert
      - linux-release
    with:
      git_ref: ${{ needs.prepare.outputs.git_sha }}
      build_current_release: false
      run_slow_tests: ${{ needs.prepare.outputs.run_slow_tests == 'true' }}
      runner_linux_x64: ${{ needs.prepare.outputs.runner_linux_x64 }}
      runner_linux_small: ${{ needs.prepare.outputs.runner_linux_small }}
      runner_provider: ${{ needs.prepare.outputs.runner_provider }}
      save_cache: ${{ fromJson(needs.prepare.outputs.save_cache) }}
      images: ${{ needs.prepare.outputs.images }}

 tidy-check:
    name: Tidy Check
    if: ${{ contains(fromJson(needs.prepare.outputs.enabled_jobs), 'tidy-check') }}
    needs: prepare
    runs-on: ${{ needs.prepare.outputs.runner_linux_x64 }}
    container:
      image: ${{ fromJson(needs.prepare.outputs.images).ubuntu_24_04_amd64_lint }}

    steps:
    - name: "Checkout"
      uses: duckdb/duckdb-ci/.github/actions/checkout@main
      with:
        runner_provider: ${{ needs.prepare.outputs.runner_provider }}
        fetch_depth: 0
        ref: ${{ needs.prepare.outputs.git_sha }}

    - name: Tidy Check (clangd)
      run: |
        mkdir -p ~/.config/clangd
        cat > ~/.config/clangd/config.yaml <<'EOF'
        Diagnostics:
          UnusedIncludes: None
        EOF
        make tidy-check-clangd

    - name: Upload clangd-tidy logs
      if: ${{ failure() }}
      uses: actions/upload-artifact@v7
      with:
        name: clangd-tidy-logs
        path: build/tidy/clangd-tidy-logs
        if-no-files-found: ignore

 extensions:
    if: ${{ contains(fromJson(needs.prepare.outputs.enabled_jobs), 'extensions') }}
    uses: ./.github/workflows/Extensions.yml
    secrets: inherit
    needs:
      - prepare
      - linux-relassert
      - linux-release
    with:
      override_git_describe: ${{ needs.prepare.outputs.effective_git_describe }}
      git_ref: ${{ needs.prepare.outputs.git_sha }}
      extra_exclude_archs: ${{ needs.prepare.outputs.extensions_extra_exclude_archs }}
      skip_tests: ${{ fromJson(needs.prepare.outputs.skip_tests) }}
      run_all: ${{ github.event_name != 'workflow_dispatch' || inputs.run_all }}
      opt_in_archs: ${{ github.event_name == 'workflow_dispatch' && 'windows_arm64;linux_amd64_musl;linux_arm64_musl' || (github.event_name == 'pull_request' && needs.prepare.outputs.extensions_changed == 'true' && 'linux_arm64_musl') || '' }}
      allow_failure_archs: ${{ needs.prepare.outputs.extension_allow_failure_archs }}
      runners: ${{ needs.prepare.outputs.runners }}
      runner_provider: ${{ needs.prepare.outputs.runner_provider }}
      save_cache: ${{ fromJson(needs.prepare.outputs.save_cache) }}

 wasm-eh:
    name: Wasm EH
    if: ${{ contains(fromJson(needs.prepare.outputs.enabled_jobs), 'wasm-eh') }}
    needs:
      - prepare
      - linux-relassert
    runs-on: ${{ needs.prepare.outputs.runner_linux_x64 }}
    container:
      image: ${{ fromJson(needs.prepare.outputs.images).manylinux_amd64_main }}
    env:
      GEN: make

    steps:
    - name: "Checkout"
      uses: duckdb/duckdb-ci/.github/actions/checkout@main
      with:
        runner_provider: ${{ needs.prepare.outputs.runner_provider }}
        ref: ${{ needs.prepare.outputs.git_sha }}

    - uses: emscripten-core/setup-emsdk@v16
      with:
        version: latest

    - uses: ./.github/actions/ccache-action
      with:
        save: ${{ fromJson(needs.prepare.outputs.save_cache) }}

    - name: Build
      run: make wasm_ci

 linux-release:
    name: Linux Release (${{ matrix.config.name }})
    if: ${{ contains(fromJson(needs.prepare.outputs.enabled_jobs), 'linux-release') }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.prepare.outputs.linux_release_matrix) }}
    runs-on: ${{ matrix.config.runner }}
    container:
      image: ${{ fromJson(needs.prepare.outputs.images)[matrix.config.image] }}
    env:
      GEN: ninja
      OVERRIDE_GIT_DESCRIBE: ${{ needs.prepare.outputs.effective_git_describe }}

    steps:
    - name: "Checkout"
      uses: duckdb/duckdb-ci/.github/actions/checkout@main
      with:
        runner_provider: ${{ needs.prepare.outputs.runner_provider }}
        fetch_depth: 0
        ref: ${{ needs.prepare.outputs.git_sha }}

    - uses: ./.github/actions/ccache-action
      if: ${{ matrix.config.use_ccache }}
      with:
        key: ${{ matrix.config.ccache_key }}
        save: ${{ fromJson(needs.prepare.outputs.save_cache) }}

    - name: Write changed tests file
      shell: bash
      run: printf '%s\n' "${{ needs.prepare.outputs.changed_tests_files }}" | tr ' ' '\n' | sed '/^$/d' > "$RUNNER_TEMP/changed_tests.txt"

    - name: Build DuckDB
      uses: duckdb/duckdb-ci/build-duckdb@main
      env:
        EXTENSION_CONFIGS: ${{ format('{0}/.github/config/{1}', github.workspace, matrix.config.extension_config) }}
        ENABLE_EXTENSION_AUTOLOADING: 1
        ENABLE_EXTENSION_AUTOINSTALL: 1
        BUILD_BENCHMARK: 1
        BUILD_JEMALLOC: ${{ matrix.config.build_jemalloc }}
        FORCE_WARN_UNUSED: 1
        LTO: ${{ matrix.config.lto }}
        LTO_JOBS: ${{ matrix.config.lto_jobs }}
        SMOKE_RUNNER: build/release/test/run
        EXTRA_CMAKE_VARIABLES: ${{ matrix.config.extra_cmake_variables }}
      with:
        build: python3 scripts/ci/retry.py -- make release
        test: ${{ !fromJson(needs.prepare.outputs.skip_tests) && matrix.config.run_smoke && 'make smoke T="--changed-tests=$RUNNER_TEMP/changed_tests.txt"' || 'true' }}
        bundle: make release-artifact
        upload-name: ${{ matrix.config.build_artifact }}
        vcpkg-commit: 84bab45d415d22042bd0b9081aea57f362da3f35
        cache-suffix: ${{ matrix.config.vcpkg_cache_suffix }}
        save-cache: ${{ matrix.config.save_vcpkg_cache && fromJson(needs.prepare.outputs.save_cache) }}

    - name: Symbol Checks
      run: make -j4 --output-sync=target symbol-checks

    - name: CLI check
      shell: bash
      run: |
        ./build/release/duckdb -c "PRAGMA platform; PRAGMA version;"
        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          # Fail on non-zero major version.
          ./build/release/duckdb -ascii -noheader -c "SELECT library_version FROM pragma_version() WHERE library_version NOT LIKE 'v0%'" | grep '^v'
        fi

    - name: Verify build flags
      shell: bash
      run: |
        if [[ "${{ matrix.config.arch }}" == "amd64" ]]; then
          grep -Fq -- '-march=x86-64-v3' build/release/compile_commands.json
        else
          grep -Fq -- '-march=armv8-a' build/release/compile_commands.json
        fi
        grep -Fq -- '-mtune=generic' build/release/compile_commands.json
        if [[ "${{ matrix.config.is_compatibility_build }}" == "true" ]]; then
          if grep -Fq -- '-flto' build/release/compile_commands.json; then
            echo "Compatibility build unexpectedly contains LTO flags" >&2
            exit 1
          fi
        else
          grep -Fq -- '-flto=thin' build/release/compile_commands.json
        fi

    - name: GCC static library compatibility
      if: ${{ matrix.config.is_compatibility_build }}
      shell: bash
      run: |
        gcc -std=c11 \
          -Isrc/include \
          examples/embedded-c/main.c \
          build/release/src/libduckdb_static.a \
          build/release/extension/libdummy_static_extension_loader.a \
          -ldl -lpthread -lm -lstdc++ \
          -o build/release/gcc-static-library-smoke
        build/release/gcc-static-library-smoke

    - name: GCC shared library compatibility
      if: ${{ matrix.config.is_canonical_build }}
      shell: bash
      run: |
        gcc -std=c11 \
          -Isrc/include \
          examples/embedded-c/main.c \
          -Lbuild/release/src \
          -Wl,-rpath,"$PWD/build/release/src" \
          -lduckdb \
          -o build/release/gcc-shared-library-smoke
        build/release/gcc-shared-library-smoke

    - name: Deploy
      shell: bash
      env:
        AWS_ENDPOINT_URL: ${{ secrets.S3_DUCKDB_STAGING_ENDPOINT }}
        AWS_ACCESS_KEY_ID: ${{ secrets.S3_DUCKDB_STAGING_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_DUCKDB_STAGING_KEY }}
      run: |
        assets=()
        if [[ "${{ matrix.config.publish_source }}" == "true" ]]; then
          zip -j libduckdb-src.zip src/include/duckdb.h src/include/duckdb_extension.h
          assets+=(libduckdb-src.zip)
        fi
        if [[ "${{ matrix.config.publish_static }}" == "true" ]]; then
          make gather-libs
          zip -r -j static-libs-${{ matrix.config.artifact_suffix }}.zip src/include/duckdb.h build/release/libs/
          assets+=(static-libs-${{ matrix.config.artifact_suffix }}.zip)
        fi
        if [[ "${{ matrix.config.is_canonical_build }}" == "true" ]]; then
          make cli-release-artifact ARTIFACT_SUFFIX=${{ matrix.config.artifact_suffix }} CLI_BINARY=build/release/duckdb
          make shared-libs-release-artifact ARTIFACT_SUFFIX=${{ matrix.config.artifact_suffix }} SHARED_LIBRARIES="build/release/src/libduckdb.so*"
          assets+=(duckdb-cli-${{ matrix.config.artifact_suffix }}.tar.gz duckdb-shared-libs-${{ matrix.config.artifact_suffix }}.tar.gz)
        fi
        ./scripts/upload-assets-to-staging.sh github_release "${assets[@]}"

    - uses: actions/upload-artifact@v7
      if: ${{ matrix.config.is_canonical_build }}
      with:
        path: duckdb-cli-${{ matrix.config.artifact_suffix }}.tar.gz
        archive: false

    - uses: actions/upload-artifact@v7
      if: ${{ matrix.config.is_canonical_build }}
      with:
        path: duckdb-shared-libs-${{ matrix.config.artifact_suffix }}.tar.gz
        archive: false

    - uses: actions/upload-artifact@v7
      if: ${{ matrix.config.publish_static }}
      with:
        name: duckdb-static-libs-${{ matrix.config.artifact_suffix }}
        path: static-libs-${{ matrix.config.artifact_suffix }}.zip

    - name: ARM64 release tests
      if: ${{ matrix.config.run_arm_tests && !fromJson(needs.prepare.outputs.skip_tests) }}
      shell: bash
      run: |
        if [[ "${{ needs.prepare.outputs.run_slow_tests }}" == "true" ]]; then
          make alltest_release_tag
        else
          make test_release_tag
        fi

    - name: ARM64 tools tests
      if: ${{ matrix.config.run_arm_tests && !fromJson(needs.prepare.outputs.skip_tests) }}
      run: python -m pytest tools/shell/tests --shell-binary build/release/duckdb

    - name: ARM64 examples
      if: ${{ matrix.config.run_arm_tests && !fromJson(needs.prepare.outputs.skip_tests) }}
      run: |
        build/release/benchmark/benchmark_runner benchmark/micro/update/update_with_join.benchmark
        build/release/duckdb -c "COPY (SELECT 42) TO '/dev/stdout' (FORMAT PARQUET)" | cat

 codecov:
    name: Code Coverage
    if: ${{ contains(fromJson(needs.prepare.outputs.enabled_jobs), 'codecov') }}
    needs:
      - prepare
      - linux-release
    runs-on: ${{ needs.prepare.outputs.runner_linux_x64 }}
    container:
      image: ${{ fromJson(needs.prepare.outputs.images).manylinux_amd64_main }}
    env:
      GEN: ninja

    steps:
    - name: "Checkout"
      uses: duckdb/duckdb-ci/.github/actions/checkout@main
      with:
        runner_provider: ${{ needs.prepare.outputs.runner_provider }}
        fetch_depth: 0
        ref: ${{ needs.prepare.outputs.git_sha }}

    - uses: ./.github/actions/ccache-action
      with:
        key: codecov
        save: ${{ fromJson(needs.prepare.outputs.save_cache) }}

    - name: Build DuckDB
      uses: duckdb/duckdb-ci/build-duckdb@main
      env:
        EXTENSION_CONFIGS: '${{ github.workspace }}/.github/config/linux_release_extensions.cmake'
      with:
        build-type: codecov
        build: python3 scripts/ci/retry.py -- make codecov
        vcpkg-commit: 84bab45d415d22042bd0b9081aea57f362da3f35
        cache-suffix: codecov
        save-cache: ${{ fromJson(needs.prepare.outputs.save_cache) }}

    - name: Generate coverage report
      run: build/codecov/test/run --coverage-report coverage/linux-release-default-tests

    - name: Upload coverage report
      uses: actions/upload-artifact@v7
      with:
        name: coverage-linux-release-default-tests
        path: coverage/linux-release-default-tests
        if-no-files-found: error

 linux-release-tests:
    name: Linux Release Tests
    if: ${{ contains(fromJson(needs.prepare.outputs.enabled_jobs), 'linux-release-tests') }}
    needs:
      - prepare
      - linux-release
    container:
      image: ${{ fromJson(needs.prepare.outputs.images).manylinux_amd64_main }}
    runs-on: ${{ needs.prepare.outputs.runner_linux_x64 }}

    steps:
    - name: "Checkout"
      uses: duckdb/duckdb-ci/.github/actions/checkout@main
      with:
        runner_provider: ${{ needs.prepare.outputs.runner_provider }}
        fetch_depth: 0
        ref: ${{ needs.prepare.outputs.git_sha }}

    - name: Download linux release artifact
      uses: actions/download-artifact@v8
      with:
        name: linux-release-build
        path: build

    - name: Extract linux release artifact
      run: |
        rm -rf build/release
        tar -xzf build/release-artifact.tar.gz -C build

    - name: Run all release unit tests
      run: make allunit

    - name: Release tests
      shell: bash
      run: |
        if [[ "${{ needs.prepare.outputs.run_slow_tests }}" == "true" ]]; then
          make alltest_release_tag
        else
          make test_release_tag
        fi

    - name: Tools Tests
      run: python -m pytest tools/shell/tests --shell-binary build/release/duckdb

    - name: Examples
      run: |
        build/release/benchmark/benchmark_runner benchmark/micro/update/update_with_join.benchmark
        build/release/duckdb -c "COPY (SELECT 42) TO '/dev/stdout' (FORMAT PARQUET)" | cat

 linux-release-musl:
    name: Linux Release (musl, ${{ matrix.config.name }})
    if: ${{ contains(fromJson(needs.prepare.outputs.enabled_jobs), 'linux-release-musl') }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.prepare.outputs.linux_musl_matrix) }}
    runs-on: ${{ matrix.config.runner }}
    container:
      image: ${{ fromJson(needs.prepare.outputs.images)[matrix.config.image] }}
    env:
      OVERRIDE_GIT_DESCRIBE: ${{ needs.prepare.outputs.effective_git_describe }}

    steps:
    - name: "Checkout"
      uses: duckdb/duckdb-ci/.github/actions/checkout@main
      with:
        runner_provider: ${{ needs.prepare.outputs.runner_provider }}
        ref: ${{ needs.prepare.outputs.git_sha }}
        fetch_depth: 0

    - uses: ./.github/actions/ccache-action
      with:
        save: ${{ fromJson(needs.prepare.outputs.save_cache) }}
        key: linux-cli-${{ matrix.config.cache_suffix }}

    - name: Build
      uses: duckdb/duckdb-ci/build-duckdb@main
      env:
        EXTENSION_CONFIGS: '${{ github.workspace }}/.github/config/bundled_extensions.cmake'
        ENABLE_EXTENSION_AUTOLOADING: 1
        ENABLE_EXTENSION_AUTOINSTALL: 1
        BUILD_BENCHMARK: 1
        FORCE_WARN_UNUSED: 1
      with:
        build: make
        vcpkg-commit: 84bab45d415d22042bd0b9081aea57f362da3f35
        cache-suffix: linux-cli-${{ matrix.config.cache_suffix }}
        save-cache: ${{ fromJson(needs.prepare.outputs.save_cache) }}

    - name: CLI check
      shell: bash
      run: |
        ./build/release/duckdb -c "PRAGMA platform; PRAGMA version;"
        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          # Fail on non-zero major version.
          ./build/release/duckdb -ascii -noheader -c "SELECT library_version FROM pragma_version() WHERE library_version NOT LIKE 'v0%'" | grep '^v'
        fi

    - name: Verify architecture flags
      shell: bash
      run: |
        if [[ "${{ matrix.config.arch }}" == "amd64" ]]; then
          grep -Fq -- '-march=x86-64-v3' build/release/compile_commands.json
        else
          grep -Fq -- '-march=armv8-a' build/release/compile_commands.json
        fi
        grep -Fq -- '-mtune=generic' build/release/compile_commands.json
        if grep -Fq -- '-flto' build/release/compile_commands.json; then
          echo "Compatibility build unexpectedly contains LTO flags" >&2
          exit 1
        fi

    - name: Deploy
      env:
        AWS_ENDPOINT_URL: ${{ secrets.S3_DUCKDB_STAGING_ENDPOINT }}
        AWS_ACCESS_KEY_ID: ${{ secrets.S3_DUCKDB_STAGING_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_DUCKDB_STAGING_KEY }}
      run: |
        make cli-release-artifact ARTIFACT_SUFFIX=${{ matrix.config.artifact_suffix }} CLI_BINARY=build/release/duckdb
        make shared-libs-release-artifact ARTIFACT_SUFFIX=${{ matrix.config.artifact_suffix }} SHARED_LIBRARIES="build/release/src/libduckdb.so*"
        ./scripts/upload-assets-to-staging.sh github_release duckdb-cli-${{ matrix.config.artifact_suffix }}.tar.gz duckdb-shared-libs-${{ matrix.config.artifact_suffix }}.tar.gz

    - uses: actions/upload-artifact@v7
      with:
        path: duckdb-cli-${{ matrix.config.artifact_suffix }}.tar.gz
        archive: false

    - uses: actions/upload-artifact@v7
      with:
        path: duckdb-shared-libs-${{ matrix.config.artifact_suffix }}.tar.gz
        archive: false

    - name: Release tests
      if: ${{ !fromJson(needs.prepare.outputs.skip_tests) }}
      shell: bash
      run: |
        if [[ "${{ needs.prepare.outputs.run_slow_tests }}" == "true" ]]; then
          make alltest_release_tag
        else
          make test_release_tag
        fi

    - name: Tools Tests
      if: ${{ !fromJson(needs.prepare.outputs.skip_tests) }}
      run: python -m pytest tools/shell/tests --shell-binary build/release/duckdb

    - name: Examples
      if: ${{ !fromJson(needs.prepare.outputs.skip_tests) }}
      run: |
        build/release/benchmark/benchmark_runner benchmark/micro/update/update_with_join.benchmark
        build/release/duckdb -c "COPY (SELECT 42) TO '/dev/stdout' (FORMAT PARQUET)" | cat

 staged-extension-install:
    name: Staged Extension Install
    if: ${{ contains(fromJson(needs.prepare.outputs.enabled_jobs), 'staged-extension-install') }}
    needs:
      - prepare
      - extensions
      - linux-release
    runs-on: ${{ needs.prepare.outputs.runner_linux_small }}

    steps:
    - name: "Checkout"
      uses: duckdb/duckdb-ci/.github/actions/checkout@main
      with:
        runner_provider: ${{ needs.prepare.outputs.runner_provider }}
        ref: ${{ needs.prepare.outputs.git_sha }}

    - name: Check staged extension install/load
      timeout-minutes: 10
      run: |
        python3 scripts/ci/check_staged_extensions.py \
          --git-sha "${{ needs.prepare.outputs.git_sha }}" \
          --version "${{ needs.prepare.outputs.effective_git_describe }}" \
          --extensions "httpfs,json,parquet,ducklake,iceberg,icu"

 swift:
    if: ${{ contains(fromJson(needs.prepare.outputs.enabled_jobs), 'swift') }}
    uses: ./.github/workflows/Swift.yml
    secrets: inherit
    needs:
      - prepare
      - linux-relassert
    with:
      git_ref: ${{ needs.prepare.outputs.git_sha }}
      runner_macos_arm64: ${{ needs.prepare.outputs.runner_macos_14_arm64 }}
      runner_provider: ${{ needs.prepare.outputs.runner_provider }}

 windows:
    if: ${{ contains(fromJson(needs.prepare.outputs.enabled_jobs), 'windows') }}
    uses: ./.github/workflows/Windows.yml
    secrets: inherit
    needs:
      - prepare
      - linux-relassert
    with:
      override_git_describe: ${{ needs.prepare.outputs.effective_git_describe }}
      git_ref: ${{ needs.prepare.outputs.git_sha }}
      runners: ${{ needs.prepare.outputs.runners }}
      runner_provider: ${{ needs.prepare.outputs.runner_provider }}
      skip_tests: ${{ fromJson(needs.prepare.outputs.skip_tests) }}
      run_all: ${{ github.event_name != 'workflow_dispatch' || inputs.run_all }}

 osx:
    if: ${{ contains(fromJson(needs.prepare.outputs.enabled_jobs), 'osx') }}
    uses: ./.github/workflows/OSX.yml
    secrets: inherit
    needs: prepare
    with:
      override_git_describe: ${{ needs.prepare.outputs.effective_git_describe }}
      git_ref: ${{ needs.prepare.outputs.git_sha }}
      skip_tests: ${{ fromJson(needs.prepare.outputs.skip_tests) }}
      run_all: ${{ github.event_name != 'workflow_dispatch' || inputs.run_all }}

 no-string-inline:
    name: No String Inline / Destroy Unpinned Blocks
    if: ${{ contains(fromJson(needs.prepare.outputs.enabled_jobs), 'no-string-inline') }}
    runs-on: ${{ needs.prepare.outputs.runner_linux_x64 }}
    container:
      image: ${{ fromJson(needs.prepare.outputs.images).manylinux_amd64_main }}
    needs:
      - prepare
      - linux-relassert
    env:
      LSAN_OPTIONS: suppressions=${{ github.workspace }}/.sanitizer-leak-suppressions.txt
      DUCKDB_TEST_DESCRIPTION: 'Compiled with ALTERNATIVE_VERIFY=1 DISABLE_STRING_INLINE=1 DESTROY_UNPINNED_BLOCKS=1 DISABLE_POINTER_SALT=1. Use require no_alternative_verify to skip.'

    steps:
      - name: "Checkout"
        uses: duckdb/duckdb-ci/.github/actions/checkout@main
        with:
          runner_provider: ${{ needs.prepare.outputs.runner_provider }}
          ref: ${{ needs.prepare.outputs.git_sha }}

      - uses: ./.github/actions/ccache-action
        with:
          save: ${{ fromJson(needs.prepare.outputs.save_cache) }}

      - name: Build
        uses: duckdb/duckdb-ci/build-duckdb@main
        env:
          CRASH_ON_ASSERT: 1
          FORCE_DEBUG: 1
          FORCE_ASSERT: 1
          EXPORT_DYNAMIC_SYMBOLS: 1
          REDUCE_SYMBOLS: 1
          EXTENSION_STATIC_BUILD: 0
          CORE_EXTENSIONS: "icu;tpch;tpcds;fts;json;inet;parquet;autocomplete;httpfs"
          DISABLE_STRING_INLINE: 1
          DESTROY_UNPINNED_BLOCKS: 1
          ALTERNATIVE_VERIFY: 1
          DISABLE_POINTER_SALT: 1
          DISABLE_GCC_FUNCTION_SECTIONS: 1
        with:
          build-type: relassert
          build: python3 scripts/ci/retry.py -- make relassert
          vcpkg-commit: 84bab45d415d22042bd0b9081aea57f362da3f35
          cache-suffix: no_string_inline
          save-cache: ${{ fromJson(needs.prepare.outputs.save_cache) }}

      - name: Test
        if: ${{ !fromJson(needs.prepare.outputs.skip_tests) }}
        run: make unittest_relassert

 no-rtti:
    name: No RTTI
    if: ${{ contains(fromJson(needs.prepare.outputs.enabled_jobs), 'no-rtti') }}
    runs-on: ${{ needs.prepare.outputs.runner_linux_x64 }}
    container:
      image: ${{ fromJson(needs.prepare.outputs.images).manylinux_amd64_main }}
    needs:
      - prepare
      - linux-relassert
    env:
      # Job-level on purpose: the Test step's `make unittest_release` depends on `release`, so a
      # step-scoped flag would silently reconfigure and rebuild WITH rtti and test the wrong binary.
      DISABLE_RTTI: 1
      EXTENSION_CONFIGS: .github/config/in_tree_extensions.cmake
      DUCKDB_TEST_DESCRIPTION: 'Compiled with DISABLE_RTTI=1 (-fno-rtti).'

    steps:
      - name: "Checkout"
        uses: duckdb/duckdb-ci/.github/actions/checkout@main
        with:
          runner_provider: ${{ needs.prepare.outputs.runner_provider }}
          ref: ${{ needs.prepare.outputs.git_sha }}

      - uses: ./.github/actions/ccache-action
        with:
          save: ${{ fromJson(needs.prepare.outputs.save_cache) }}

      - name: Build
        uses: duckdb/duckdb-ci/build-duckdb@main
        with:
          build-type: release
          build: python3 scripts/ci/retry.py -- make release
          vcpkg-commit: 84bab45d415d22042bd0b9081aea57f362da3f35
          cache-suffix: no_rtti
          save-cache: ${{ fromJson(needs.prepare.outputs.save_cache) }}

      # Loadable extensions are the part a plain build cannot check: each one links its own
      # copy of duckdb, so a type identity that is not stable across images only fails here.
      - name: Test
        if: ${{ !fromJson(needs.prepare.outputs.skip_tests) }}
        run: make unittest_release

 vector-sizes:
    name: Vector Sizes
    if: ${{ contains(fromJson(needs.prepare.outputs.enabled_jobs), 'vector-sizes') }}
    runs-on: ${{ needs.prepare.outputs.runner_linux_x64 }}
    container:
      image: ${{ fromJson(needs.prepare.outputs.images).manylinux_amd64_main }}
    needs:
      - prepare
      - linux-relassert
    env:
      # Explicitly use GCC here so we check compiler support in the PR CI run.
      # Other CI job use Clang but GCC should continue to work well.
      CC: gcc
      CXX: g++
      GEN: ninja
      DUCKDB_TEST_DESCRIPTION: 'Compiled with STANDARD_VECTOR_SIZE=2. Use require vector_size 2048 to skip tests.'

    steps:
      - name: "Checkout"
        uses: duckdb/duckdb-ci/.github/actions/checkout@main
        with:
          runner_provider: ${{ needs.prepare.outputs.runner_provider }}
          ref: ${{ needs.prepare.outputs.git_sha }}

      - uses: ./.github/actions/ccache-action
        with:
          save: ${{ fromJson(needs.prepare.outputs.save_cache) }}

      - name: Build
        run: STANDARD_VECTOR_SIZE=2 make reldebug

      - name: Test
        if: ${{ !fromJson(needs.prepare.outputs.skip_tests) }}
        run: make unittest_reldebug

 threadsan:
    name: Thread Sanitizer
    if: ${{ contains(fromJson(needs.prepare.outputs.enabled_jobs), 'threadsan') }}
    needs:
      - prepare
      - linux-relassert
    runs-on: ${{ needs.prepare.outputs.runner_linux_x64 }}
    container:
      image: ${{ fromJson(needs.prepare.outputs.images).manylinux_amd64_main }}
    env:
      TSAN_OPTIONS: suppressions=.sanitizer-thread-suppressions.txt:external_symbolizer_path=/usr/bin/llvm-symbolizer
      DUCKDB_TEST_DESCRIPTION: 'Tests run with thread sanitizer.'

    steps:
    - name: "Checkout"
      uses: duckdb/duckdb-ci/.github/actions/checkout@main
      with:
        runner_provider: ${{ needs.prepare.outputs.runner_provider }}
        ref: ${{ needs.prepare.outputs.git_sha }}

    - uses: ./.github/actions/ccache-action
      with:
        save: ${{ fromJson(needs.prepare.outputs.save_cache) }}

    - name: Build threadsan
      uses: duckdb/duckdb-ci/build-duckdb@main
      env:
        BUILD_JEMALLOC: 1
        THREADSAN: 1
        CORE_EXTENSIONS: "icu;tpch;tpcds;fts;json;inet;parquet;autocomplete;httpfs"
      with:
        build-type: reldebug
        build: python3 scripts/ci/retry.py -- make reldebug
        vcpkg-commit: 84bab45d415d22042bd0b9081aea57f362da3f35
        cache-suffix: threadsan
        save-cache: ${{ fromJson(needs.prepare.outputs.save_cache) }}

    - name: Test
      if: ${{ !fromJson(needs.prepare.outputs.skip_tests) }}
      run: make unittest_threadsan

    - name: Test Extra
      if: ${{ github.ref_name == 'main' && !fromJson(needs.prepare.outputs.skip_tests) }}
      run: make unittest_threadsan_extra

 # TODO: Consider bringing back fts
 # TODO: DEBUG_STACKTRACE: 1 + reldebug ?
 linux-configs:
    name: Linux Config (${{ matrix.group }})
    if: ${{ contains(fromJson(needs.prepare.outputs.enabled_jobs), 'linux-configs') }}
    runs-on: ${{ needs.prepare.outputs.runner_linux_x64 }}
    container:
      image: ${{ fromJson(needs.prepare.outputs.images).manylinux_amd64_main }}
    needs:
      - prepare
      - linux-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: Query Verification
            target: test_configs_query_verification
          - group: Execution
            target: test_configs_execution
          - group: Persistence
            target: test_configs_persistence
          - group: Storage Engine
            target: test_configs_storage_engine

    steps:
    - name: "Checkout"
      uses: duckdb/duckdb-ci/.github/actions/checkout@main
      with:
        runner_provider: ${{ needs.prepare.outputs.runner_provider }}
        ref: ${{ needs.prepare.outputs.git_sha }}

    - name: Download linux release artifact
      uses: actions/download-artifact@v8
      with:
        name: linux-release-build
        path: build

    - name: Extract linux release artifact
      run: |
        rm -rf build/release
        tar -xzf build/release-artifact.tar.gz -C build

    - name: Test Configurations
      if: success() || failure()
      run: |
        make ${{ matrix.target }}

    - name: Test Storage Compatibility
      if: ${{ (success() || failure()) && matrix.group == 'Persistence' }}
      run: |
        make test_storage

    - name: Test Vector Verification
      if: ${{ (success() || failure()) && matrix.group == 'Execution' }}
      run: |
        make test_vector

    - name: Test Synchronous Table Scan
      if: ${{ (success() || failure()) && matrix.group == 'Execution' }}
      run: |
        make test_table_scan

 summary:
    name: Summary
    if: ${{ always() }}
    runs-on: ubuntu-slim
    needs:
      - prepare
      - linux-relassert
      - linux-relassert-tests
      - regression
      - tidy-check
      - extensions
      - wasm-eh
      - linux-release
      - codecov
      - linux-release-tests
      - linux-release-musl
      - staged-extension-install
      - swift
      - windows
      - osx
      - no-string-inline
      - no-rtti
      - vector-sizes
      - threadsan
      - linux-configs
    steps:
      - id: release-status
        name: Compute release status
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          if [[ "${{ needs.extensions.result }}" == "success" && \
                "${{ needs.osx.result }}" == "success" && \
                "${{ needs.windows.result }}" == "success" && \
                "${{ needs.linux-release.result }}" == "success" && \
                "${{ needs.linux-release-musl.result }}" == "success" ]]; then
            echo "success=true" >> "$GITHUB_OUTPUT"
          else
            echo "success=false" >> "$GITHUB_OUTPUT"
          fi

      - id: summary-context
        name: Compute summary dispatch context
        if: ${{ always() }}
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          OVERRIDE_GIT_DESCRIBE: ${{ needs.prepare.outputs.effective_git_describe }}
          STAGED_VERSION: ${{ needs.prepare.outputs.staged_version }}
          RELEASE_STATUS_SUCCESS: ${{ steps.release-status.outputs.success || 'false' }}
        run: |
          is_release_event=false
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            is_release_event=true
          fi

          is_duckdb_repo=false
          if [[ "$REPOSITORY" == "duckdb/duckdb" ]]; then
            is_duckdb_repo=true
          fi

          has_no_override=false
          if [[ "$EVENT_NAME" != "workflow_dispatch" || -z "$OVERRIDE_GIT_DESCRIBE" ]]; then
            has_no_override=true
          fi

          run_release_dispatch=false
          if [[ "$is_release_event" == "true" && "$is_duckdb_repo" == "true" && "$RELEASE_STATUS_SUCCESS" == "true" && -n "$OVERRIDE_GIT_DESCRIBE" ]]; then
            run_release_dispatch=true
          fi

          publish_latest_alpha=false
          if [[ "$is_duckdb_repo" == "true" && "$RELEASE_STATUS_SUCCESS" == "true" && -n "$STAGED_VERSION" ]]; then
            publish_latest_alpha=true
          fi

          echo "summary dispatch context:"
          echo "  event_name=$EVENT_NAME"
          echo "  repository=$REPOSITORY"
          echo "  override_git_describe=$OVERRIDE_GIT_DESCRIBE"
          echo "  release_status_success=$RELEASE_STATUS_SUCCESS"
          echo "  is_release_event=$is_release_event"
          echo "  is_duckdb_repo=$is_duckdb_repo"
          echo "  has_no_override=$has_no_override"
          echo "  run_release_dispatch=$run_release_dispatch"
          echo "  staged_version=$STAGED_VERSION"
          echo "  publish_latest_alpha=$publish_latest_alpha"

          {
            echo "run_release_dispatch=$run_release_dispatch"
            echo "publish_latest_alpha=$publish_latest_alpha"
          } >> "$GITHUB_OUTPUT"

      - name: Run release dispatch
        if: ${{ always() && steps.summary-context.outputs.run_release_dispatch == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          SOURCE_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh workflow run dispatch.yml \
            --repo duckdb/duckdb-workflow-trigger \
            --ref main \
            --field event=core_ready \
            --field duckdb_version="${{ needs.prepare.outputs.effective_git_describe }}" \
            --field duckdb_commit="${{ needs.prepare.outputs.git_sha }}" \
            --field status=success \
            --field source_run_url="$SOURCE_RUN_URL" \
            --field message="DuckDB Main CI release artifacts are ready"

      - name: Check CI status
        shell: bash
        run: |
          NEEDS_JSON='${{ toJSON(needs) }}'

          failed_or_cancelled=$(
            jq -r '
              to_entries[]
              | select(.value.result == "failure" or .value.result == "cancelled")
              | "\(.key): \(.value.result)"
            ' <<<"$NEEDS_JSON"
          )

          if [[ -n "$failed_or_cancelled" ]]; then
            echo "One or more required jobs failed or were cancelled."
            echo "$failed_or_cancelled"
            exit 1
          fi

      - name: Install rclone
        if: ${{ steps.summary-context.outputs.publish_latest_alpha == 'true' }}
        shell: bash
        run: curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 https://rclone.org/install.sh | sudo bash

      - name: Publish latest alpha version
        if: ${{ steps.summary-context.outputs.publish_latest_alpha == 'true' }}
        shell: bash
        env:
          AWS_ENDPOINT_URL: ${{ secrets.S3_DUCKDB_STAGING_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_DUCKDB_STAGING_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_DUCKDB_STAGING_KEY }}
          STAGED_VERSION: ${{ needs.prepare.outputs.staged_version }}
        run: |
          set -euo pipefail

          pointer_file="$(mktemp "${TMPDIR:-/tmp}/latest-alpha-version.XXXXXX")"
          trap 'rm -f "$pointer_file"' EXIT
          printf '%s\n' "$STAGED_VERSION" > "$pointer_file"

          s3_provider="AWS"
          if [[ "$AWS_ENDPOINT_URL" == *"r2.cloudflarestorage.com"* ]]; then
            s3_provider="Cloudflare"
          fi

          rclone copyto \
            --s3-provider "$s3_provider" \
            --s3-endpoint "$AWS_ENDPOINT_URL" \
            --s3-access-key-id "$AWS_ACCESS_KEY_ID" \
            --s3-secret-access-key "$AWS_SECRET_ACCESS_KEY" \
            --s3-no-check-bucket \
            --s3-no-head \
            --header-upload "Content-Type: text/plain" \
            --header-upload "Cache-Control: no-cache" \
            "$pointer_file" \
            ":s3:duckdb-staging/latest_alpha_version.txt"
