name: Forward PR events to pr-tracker

# Thin caller. All forwarding logic lives in the shared composite action
# (duckdb/duckdb-ci/pr-tracker/forward), so changes there reach every tracked repo
# with no per-repo edit. Only the triggers below and the token are per-repo — keep
# the trigger list a generous superset so this file rarely needs to change.

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, converted_to_draft, closed, labeled, unlabeled, review_requested]
  issue_comment:
    types: [created]
  # CI signal: auto-assign a reviewer once CI finishes (pass or fail). check_suite/status
  # do NOT fire for GitHub-Actions CI (Actions-created suites don't trigger workflows),
  # so react to the repo's CI workflow finishing. `workflows:` is THIS repo's CI/gate
  # workflow `name:` (per-repo, literal — no wildcards): duckdb-rs=CI, duckdb-iceberg=
  # "Build & Test against catalogs", community-extensions="Community Extension Build",
  # duckdb=Main.
  workflow_run:
    workflows: ["Main"]
    types: [completed]

permissions:
  contents: read

jobs:
  forward:
    # issue_comment fires for issues too — only forward comments on PRs. For a
    # workflow_run, only forward runs that came from a PR (skip pushes to branches).
    # Other event kinds carry no such payload, so the guard passes them through.
    if: >-
      ${{ (github.event_name != 'issue_comment' || github.event.issue.pull_request != null)
          && (github.event_name != 'workflow_run'
              || contains(fromJSON('["pull_request","pull_request_target"]'), github.event.workflow_run.event)) }}
    runs-on: ubuntu-latest
    steps:
      - uses: duckdb/duckdb-ci/pr-tracker/forward@main
        with:
          token: ${{ secrets.PR_DISPATCH_TOKEN }}
