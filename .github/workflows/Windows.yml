name: Windows
on:
  workflow_call:
    inputs:
      duckdb_version:
        type: string
      duckdb_commit:
        type: string
      skip_tests:
        type: boolean
      run_all:
        type: boolean
      runners:
        type: string
      runner_provider:
        type: string
        required: true
concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}-${{ inputs.duckdb_version }}
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ secrets.GH_TOKEN }}
  DUCKDB_VERSION: ${{ inputs.duckdb_version }}
  DUCKDB_COMMIT: ${{ inputs.duckdb_commit }}
  AZURE_CODESIGN_ENDPOINT: https://eus.codesigning.azure.net/
  AZURE_CODESIGN_ACCOUNT: duckdb-signing-2
  AZURE_CODESIGN_PROFILE: duckdb-certificate-profile

jobs:
 win-release-64:
    # Builds binaries for windows_amd64
    name: Windows (64 Bit)
    runs-on: ${{ fromJSON(inputs.runners).windows_2022_x64 || 'windows-2022' }}
    env:
      GEN: ninja
      CC: clang-cl
      CXX: clang-cl
    steps:
    - name: "Checkout"
      uses: duckdb/duckdb-ci/.github/actions/checkout@main
      with:
        runner_provider: ${{ inputs.runner_provider }}
        fetch_depth: 0
        ref: ${{ inputs.duckdb_commit }}

    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - uses: ./.github/actions/ccache-action
    - name: Set up MSVC environment (x64)
      uses: ./.github/actions/setup-msvc-env

    - name: Build
      shell: bash
      run: |
        clang-cl --version
        python scripts/ci/retry.py -- python scripts/windows_ci.py
        python scripts/ci/retry.py -- make windows_release

    - name: Verify architecture flags
      shell: pwsh
      run: |
        $commands = Get-Content compile_commands.json -Raw
        if (!$commands.Contains('-march=haswell') -or !$commands.Contains('-mtune=generic')) {
          throw 'Windows amd64 Release compile commands are missing the CLI architecture flags'
        }

    - name: Set DUCKDB_INSTALL_LIB for ADBC tests
      shell: pwsh
      run: echo "DUCKDB_INSTALL_LIB=$((Get-ChildItem -Recurse -Filter "duckdb.dll" | Select-Object -First 1).FullName)" >> $env:GITHUB_ENV

    - name: Test DUCKDB_INSTALL_LIB variable
      shell: bash
      run: echo "$DUCKDB_INSTALL_LIB"

    - name: Test
      shell: bash
      if: ${{ !inputs.skip_tests }}
      run: |
        python test/run.py

    - name: Test with VS2019 C++ stdlib
      shell: bash
      if: ${{ !inputs.skip_tests }}
      run: |
        python scripts/ci/retry.py -- curl -L --output ./test/msvcp140.dll https://blobs.duckdb.org/ci/msvcp140.dll
        ls ./test
        python test/run.py
        rm ./test/msvcp140.dll

    - name: Tools Test
      shell: bash
      if: ${{ !inputs.skip_tests }}
      run: |
        python scripts/ci/retry.py -- python -m pip install pytest
        python -m pytest tools/shell/tests --shell-binary duckdb.exe

    - name: Sign files with Azure Trusted Signing (TM)
      if: github.repository == 'duckdb/duckdb' && github.event_name != 'pull_request'
      uses: azure/trusted-signing-action@v0
      with:
        azure-tenant-id:              ${{ secrets.AZURE_CODESIGN_TENANT_ID }}
        azure-client-id:              ${{ secrets.AZURE_CODESIGN_CLIENT_ID }}
        azure-client-secret:          ${{ secrets.AZURE_CODESIGN_CLIENT_SECRET }}
        endpoint:                     ${{ env.AZURE_CODESIGN_ENDPOINT }}
        trusted-signing-account-name: ${{ env.AZURE_CODESIGN_ACCOUNT }}
        certificate-profile-name:     ${{ env.AZURE_CODESIGN_PROFILE }}
        files-folder:                 ${{ github.workspace }}
        files-folder-filter:          exe,dll
        files-folder-recurse:         true
        file-digest:                  SHA256
        timestamp-rfc3161:            http://timestamp.acs.microsoft.com
        timestamp-digest:             SHA256

    - name: CLI check
      shell: bash
      run: |
        ./duckdb.exe -c "PRAGMA platform; PRAGMA version;"
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          # Fail on non-zero major version.
          ./duckdb.exe -ascii -noheader -c "SELECT library_version FROM pragma_version() WHERE library_version NOT LIKE 'v0%'" | grep '^v';
        fi

    - name: Bundle static libraries
      shell: bash
      run: make gather-libs GATHER_LIBS_BUILD_DIR=. GATHER_LIBS_PREFIX= GATHER_LIBS_EXTENSION=lib

    - name: Deploy
      shell: bash
      env:
        AWS_ENDPOINT_URL: ${{ secrets.S3_DUCKDB_STAGING_ENDPOINT }}
        AWS_ACCESS_KEY_ID: ${{ secrets.S3_DUCKDB_STAGING_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_DUCKDB_STAGING_KEY }}
      run: |
        tmp_zip_dir="$(mktemp -d)"
        archive_path="$(pwd)/static-libs-windows-amd64.zip"
        cp \
          src/include/duckdb.h \
          src/include/duckdb_v2.h \
          src/include/duckdb_extension.h \
          src/include/duckdb_extension_v2.h \
          "${tmp_zip_dir}/"
        find libs -type f -exec cp {} "${tmp_zip_dir}/" \;
        (cd "${tmp_zip_dir}" && "/c/Program Files/7-Zip/7z.exe" a -tzip "${archive_path}" ./*)
        rm -rf "${tmp_zip_dir}"
        make cli-release-artifact ARTIFACT_SUFFIX=windows-amd64 CLI_BINARY=duckdb.exe
        make shared-libs-release-artifact ARTIFACT_SUFFIX=windows-amd64 SHARED_LIBRARIES="src/duckdb.dll src/duckdb.lib"
        ./scripts/upload-assets-to-staging.sh github_release duckdb-cli-windows-amd64.tar.gz duckdb-shared-libs-windows-amd64.tar.gz static-libs-windows-amd64.zip

    - uses: actions/upload-artifact@v7
      with:
        path: duckdb-cli-windows-amd64.tar.gz
        archive: false

    - uses: actions/upload-artifact@v7
      with:
        path: duckdb-shared-libs-windows-amd64.tar.gz
        archive: false

    - uses: actions/upload-artifact@v7
      with:
        name: duckdb-static-libs-windows-amd64
        path: static-libs-windows-amd64.zip

 win-release-32:
    name: Windows (32 Bit)
    needs:
      - win-release-64
    if: ${{ github.ref_name == 'main' || github.repository != 'duckdb/duckdb' || inputs.run_all }}
    runs-on: ${{ fromJSON(inputs.runners).windows_2022_x64 || 'windows-2022' }}
    env:
      GEN: ninja

    steps:
    - name: "Checkout"
      uses: duckdb/duckdb-ci/.github/actions/checkout@main
      with:
        runner_provider: ${{ inputs.runner_provider }}
        fetch_depth: 0
        ref: ${{ inputs.duckdb_commit }}

    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - uses: ./.github/actions/ccache-action
    - name: Set up MSVC environment (x86 target)
      uses: ./.github/actions/setup-msvc-env
      with:
        arch: x86
        host_arch: x64

    - name: Build
      shell: bash
      run: |
        python scripts/ci/retry.py -- make windows_release_32

    - name: Test
      shell: bash
      if: ${{ !inputs.skip_tests }}
      run: python test/run.py

    - name: Tools Test
      shell: bash
      if: ${{ !inputs.skip_tests }}
      run: |
        python scripts/ci/retry.py -- python -m pip install pytest
        python -m pytest tools/shell/tests --shell-binary duckdb.exe

 win-release-arm64:
   name: Windows (ARM64)
   needs:
    - win-release-64
   if: ${{ github.ref_name == 'main' || github.repository != 'duckdb/duckdb' || inputs.run_all }}
   runs-on: windows-2025-vs2026
   env:
     GEN: ninja
     CC: clang-cl
     CXX: clang-cl
     EXTRA_CMAKE_VARIABLES: -DBUILD_UNITTESTS=FALSE -DCMAKE_C_COMPILER_TARGET=arm64-pc-windows-msvc -DCMAKE_CXX_COMPILER_TARGET=arm64-pc-windows-msvc

   steps:
     - uses: actions/checkout@v6
       with:
         fetch-depth: 0
         ref: ${{ inputs.duckdb_commit }}

     - uses: actions/setup-python@v6
       with:
         python-version: '3.12'

     - uses: ./.github/actions/ccache-action
     - name: Set up MSVC environment (arm64 target)
       uses: ./.github/actions/setup-msvc-env
       with:
         arch: arm64
         host_arch: x64

     - name: Build
       shell: bash
       run: |
         clang-cl --version
         python scripts/ci/retry.py -- make DUCKDB_PLATFORM=windows_arm64 windows_release

     - name: Verify architecture flags
       shell: pwsh
       run: |
         $commands = Get-Content compile_commands.json -Raw
         if (!$commands.Contains('-march=armv8-a') -or !$commands.Contains('-mtune=generic')) {
           throw 'Windows ARM64 Release compile commands are missing the architecture flags'
         }

     - name: Sign files with Azure Trusted Signing (TM)
       if: github.repository == 'duckdb/duckdb' && github.event_name != 'pull_request'
       uses: azure/trusted-signing-action@v0
       with:
         azure-tenant-id:              ${{ secrets.AZURE_CODESIGN_TENANT_ID }}
         azure-client-id:              ${{ secrets.AZURE_CODESIGN_CLIENT_ID }}
         azure-client-secret:          ${{ secrets.AZURE_CODESIGN_CLIENT_SECRET }}
         endpoint:                     ${{ env.AZURE_CODESIGN_ENDPOINT }}
         trusted-signing-account-name: ${{ env.AZURE_CODESIGN_ACCOUNT }}
         certificate-profile-name:     ${{ env.AZURE_CODESIGN_PROFILE }}
         files-folder:                 ${{ github.workspace }}
         files-folder-filter:          exe,dll
         files-folder-recurse:         true
         file-digest:                  SHA256
         timestamp-rfc3161:            http://timestamp.acs.microsoft.com
         timestamp-digest:             SHA256

     - name: Bundle static libraries
       shell: bash
       run: make gather-libs GATHER_LIBS_BUILD_DIR=. GATHER_LIBS_PREFIX= GATHER_LIBS_EXTENSION=lib

     - name: Deploy
       shell: bash
       env:
         AWS_ENDPOINT_URL: ${{ secrets.S3_DUCKDB_STAGING_ENDPOINT }}
         AWS_ACCESS_KEY_ID: ${{ secrets.S3_DUCKDB_STAGING_ID }}
         AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_DUCKDB_STAGING_KEY }}
       run: |
         tmp_zip_dir="$(mktemp -d)"
         archive_path="$(pwd)/static-libs-windows-arm64.zip"
         cp \
           src/include/duckdb.h \
           src/include/duckdb_v2.h \
           src/include/duckdb_extension.h \
           src/include/duckdb_extension_v2.h \
           "${tmp_zip_dir}/"
         find libs -type f -exec cp {} "${tmp_zip_dir}/" \;
         (cd "${tmp_zip_dir}" && "/c/Program Files/7-Zip/7z.exe" a -tzip "${archive_path}" ./*)
         rm -rf "${tmp_zip_dir}"
         make cli-release-artifact ARTIFACT_SUFFIX=windows-arm64 CLI_BINARY=duckdb.exe
         make shared-libs-release-artifact ARTIFACT_SUFFIX=windows-arm64 SHARED_LIBRARIES="src/duckdb.dll src/duckdb.lib"
         ./scripts/upload-assets-to-staging.sh github_release duckdb-cli-windows-arm64.tar.gz duckdb-shared-libs-windows-arm64.tar.gz static-libs-windows-arm64.zip

     - uses: actions/upload-artifact@v7
       with:
         path: duckdb-cli-windows-arm64.tar.gz
         archive: false

     - uses: actions/upload-artifact@v7
       with:
         path: duckdb-shared-libs-windows-arm64.tar.gz
         archive: false

     - uses: actions/upload-artifact@v7
       with:
         name: duckdb-static-libs-windows-arm64
         path: static-libs-windows-arm64.zip

 mingw:
     name: MinGW (64 Bit)
     needs:
      - win-release-64
     runs-on: ${{ fromJSON(inputs.runners).windows_2022_x64 || 'windows-2022' }}
     env:
       GEN: ninja
       EXTENSION_CONFIGS: '${GITHUB_WORKSPACE}/.github/config/bundled_extensions.cmake'
       ENABLE_EXTENSION_AUTOLOADING: 1
       ENABLE_EXTENSION_AUTOINSTALL: 1
     steps:
       - name: "Checkout"
         uses: duckdb/duckdb-ci/.github/actions/checkout@main
         with:
           runner_provider: ${{ inputs.runner_provider }}
           ref: ${{ inputs.duckdb_commit }}

       - uses: actions/setup-python@v6
         with:
           python-version: '3.12'

       - name: Dependencies
         shell: bash
         run: |
           python scripts/ci/retry.py -- choco install \
             ccache \
             make \
             --no-progress
           python scripts/ci/retry.py -- choco install \
             mingw --version 14.2.0 \
             --no-progress

       - uses: ./.github/actions/ccache-action

       - name: Build Environment
         shell: bash
         run: |
           {
             # bash from Git
             echo 'C:/Program Files/Git/bin'
             # make, ninja and ccache from Chocolatey
             echo 'C:/ProgramData/Chocolatey/bin'
             # g++ from Chocolatey
             echo 'C:/ProgramData/mingw64/mingw64/bin'
           } >> "${GITHUB_PATH}"

       - name: Build Environment Check
         shell: bash
         run: |
           where bash
           bash --version
           where make
           make --version
           where ninja
           ninja --version
           where ccache
           ccache --version
           where g++
           g++ --version
           echo %PATH%

       - name: MinGW Runtime Diagnostics
         shell: bash
         run: |
           set -x
           echo "PWD=$PWD"
           echo "PATH=$PATH"
           where python
           python --version
           echo "Nearby DLLs and EXEs:"
           find build/release -maxdepth 3 \( -name '*.dll' -o -name '*.exe' \) | sort || true
           /c/Windows/System32/cmd.exe /c "where libstdc++-6.dll" || true
           /c/Windows/System32/cmd.exe /c "where libgcc_s_seh-1.dll" || true
           /c/Windows/System32/cmd.exe /c "where libwinpthread-1.dll" || true

       - name: Build
         run: python scripts/ci/retry.py -- make release

       - name: Test
         if: ${{ !inputs.skip_tests }}
         run: python build/release/test/run.py

       - name: Bundle static libraries
         run: make gather-libs

       - name: Deploy static libraries
         shell: bash
         env:
           AWS_ENDPOINT_URL: ${{ secrets.S3_DUCKDB_STAGING_ENDPOINT }}
           AWS_ACCESS_KEY_ID: ${{ secrets.S3_DUCKDB_STAGING_ID }}
           AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_DUCKDB_STAGING_KEY }}
         run: |
           tmp_zip_dir="$(mktemp -d)"
           archive_path="$(pwd)/static-libs-windows-mingw.zip"
           cp \
             src/include/duckdb.h \
             src/include/duckdb_v2.h \
             src/include/duckdb_extension.h \
             src/include/duckdb_extension_v2.h \
             "${tmp_zip_dir}/"
           find build/release/libs -type f -exec cp {} "${tmp_zip_dir}/" \;
           (cd "${tmp_zip_dir}" && "/c/Program Files/7-Zip/7z.exe" a -tzip "${archive_path}" ./*)
           rm -rf "${tmp_zip_dir}"
           ./scripts/upload-assets-to-staging.sh github_release static-libs-windows-mingw.zip

       - uses: actions/upload-artifact@v7
         with:
           name: duckdb-static-libs-windows-mingw
           path: static-libs-windows-mingw.zip
