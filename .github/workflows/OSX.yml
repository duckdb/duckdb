name: OSX
on:
  workflow_call:
    inputs:
      duckdb_version:
        type: string
      duckdb_commit:
        type: string
      runner_macos_arm64:
        type: string
      skip_tests:
        type: boolean
      run_all:
        type: boolean

concurrency:
  group: osx-${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}-${{ inputs.duckdb_version }}
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ secrets.GH_TOKEN }}
  DUCKDB_VERSION: ${{ inputs.duckdb_version }}
  DUCKDB_COMMIT: ${{ inputs.duckdb_commit }}

jobs:
  xcode-debug:
    name: OSX Debug
    runs-on: ${{ inputs.runner_macos_arm64 || 'macos-latest' }}

    env:
      TREAT_WARNINGS_AS_ERRORS: 1
      FORCE_DEBUG: 1
      FORCE_ASSERT: 1
      GEN: ninja

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        ref: ${{ inputs.duckdb_commit }}

    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - uses: ./.github/actions/ccache-action

    - name: Install ninja
      run: python3 scripts/ci/retry.py -- brew install ninja

    - uses: ./.github/actions/cleanup_runner

    - name: Build
      run: python3 scripts/ci/retry.py -- make

    - name: Set DUCKDB_INSTALL_LIB for ADBC tests
      shell: bash
      run: echo "DUCKDB_INSTALL_LIB=$(find "$PWD" -name 'libduck*.dylib' | head -n 1)" >> "$GITHUB_ENV"

    - name: Test DUCKDB_INSTALL_LIB variable
      run: echo "$DUCKDB_INSTALL_LIB"

    - name: Test
      if: ${{ !inputs.skip_tests }}
      run: make unittest_release

  xcode-release:
    # Builds binaries for osx_arm64 and osx_amd64
    name: OSX Release
    runs-on: ${{ inputs.runner_macos_arm64 || 'macos-latest' }}
    env:
      EXTENSION_CONFIGS: '${GITHUB_WORKSPACE}/.github/config/bundled_extensions.cmake'
      ENABLE_EXTENSION_AUTOLOADING: 1
      ENABLE_EXTENSION_AUTOINSTALL: 1
      OSX_BUILD_UNIVERSAL: 1
      GEN: ninja

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.duckdb_commit }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Ninja
        run: python3 scripts/ci/retry.py -- brew install ninja

      - uses: ./.github/actions/ccache-action

      - name: Install pytest
        run: |
          python3 scripts/ci/retry.py -- python -m pip install --break-system-packages pytest

      - name: Build
        run: python3 scripts/ci/retry.py -- make

      - name: Bundle static libraries
        run: make gather-libs

      - name: CLI check
        run: |
          ./build/release/duckdb -c "PRAGMA platform; PRAGMA version;"
          if [ "${{ github.ref_name }}" == "main" ]; then
            # Fail on non-zero major version.
            ./build/release/duckdb -ascii -noheader -c "SELECT library_version FROM pragma_version() WHERE library_version NOT LIKE 'v0%'" | grep '^v';
          fi

      - name: Verify architecture flags
        run: grep -Fq -- '-Xarch_arm64 -mcpu=apple-m1' build/release/compile_commands.json

        #     from https://docs.github.com/en/actions/deployment/deploying-xcode-applications/installing-an-apple-certificate-on-macos-runners-for-xcode-development
      - name: Sign Binaries
        if: github.repository == 'duckdb/duckdb' && github.event_name != 'pull_request'
        shell: bash
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.OSX_CODESIGN_BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.OSX_CODESIGN_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.OSX_CODESIGN_KEYCHAIN_PASSWORD }}
          TEAM_ID : ${{ secrets.OSX_NOTARIZE_TEAM_ID }}
          APPLE_ID: ${{ secrets.OSX_NOTARIZE_APPLE_ID }}
          PASSWORD: ${{ secrets.OSX_NOTARIZE_PASSWORD }}
        run: |
          if [[ "$GITHUB_REPOSITORY" = "duckdb/duckdb" ]] ; then
            . scripts/osx_import_codesign_certificate.sh
            
            echo -e '<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n<plist version="1.0">\n<dict>\n  <key>com.apple.security.cs.disable-library-validation</key>\n  <true/>\n</dict>\n</plist>' > entitlements.plist
            codesign --options runtime --entitlements entitlements.plist --all-architectures --force --sign "Developer ID Application: Stichting DuckDB Foundation" build/release/duckdb
            codesign --options runtime --entitlements entitlements.plist --all-architectures --force --sign "Developer ID Application: Stichting DuckDB Foundation" build/release/src/libduckdb*.dylib
          
            zip -j notarize.zip build/release/duckdb build/release/src/libduckdb.dylib 
            XCRUN_RESPONSE=$(xcrun notarytool submit --progress --apple-id "$APPLE_ID" --password "$PASSWORD" --team-id "$TEAM_ID" --wait -f json notarize.zip)
            export XCRUN_RESPONSE
            rm notarize.zip
            if [[ $(./build/release/duckdb -csv -noheader -c "SELECT (getenv('XCRUN_RESPONSE')::JSON)->>'status'") != "Accepted" ]] ; then 
              echo "Notarization failed!"
              echo "$XCRUN_RESPONSE"
              exit 1
            fi
          fi

      - name: Deploy
        shell: bash
        env:
          AWS_ENDPOINT_URL: ${{ secrets.S3_DUCKDB_STAGING_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_DUCKDB_STAGING_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_DUCKDB_STAGING_KEY }}
        run: |
          mkdir -p build/release_arm64/libs build/release_amd64/libs
          lipo -extract arm64 -output build/release_arm64/duckdb build/release/duckdb
          lipo -extract x86_64 -output build/release_amd64/duckdb build/release/duckdb

          for library in build/release/libs/*.a; do
            library_name="$(basename "$library")"
            lipo -extract arm64 -output "build/release_arm64/libs/$library_name" "$library"
            lipo "build/release_arm64/libs/$library_name" -verify_arch arm64
            lipo -extract x86_64 -output "build/release_amd64/libs/$library_name" "$library"
            lipo "build/release_amd64/libs/$library_name" -verify_arch x86_64
          done

          make cli-release-artifact ARTIFACT_SUFFIX=osx-universal CLI_BINARY=build/release/duckdb
          make cli-release-artifact ARTIFACT_SUFFIX=osx-arm64 CLI_BINARY=build/release_arm64/duckdb
          make cli-release-artifact ARTIFACT_SUFFIX=osx-amd64 CLI_BINARY=build/release_amd64/duckdb
          make shared-libs-release-artifact ARTIFACT_SUFFIX=osx-universal SHARED_LIBRARIES="build/release/src/libduckdb*.dylib"
          zip -r -j static-libs-osx-arm64.zip \
            src/include/duckdb.h \
            src/include/duckdb_v2.h \
            src/include/duckdb_extension.h \
            src/include/duckdb_extension_v2.h \
            build/release_arm64/libs/
          zip -r -j static-libs-osx-amd64.zip \
            src/include/duckdb.h \
            src/include/duckdb_v2.h \
            src/include/duckdb_extension.h \
            src/include/duckdb_extension_v2.h \
            build/release_amd64/libs/

          ./scripts/upload-assets-to-staging.sh github_release duckdb-cli-osx-universal.tar.gz duckdb-cli-osx-arm64.tar.gz duckdb-cli-osx-amd64.tar.gz duckdb-shared-libs-osx-universal.tar.gz static-libs-osx-arm64.zip static-libs-osx-amd64.zip

      - uses: actions/upload-artifact@v7
        with:
          path: duckdb-cli-osx-universal.tar.gz
          archive: false

      - uses: actions/upload-artifact@v7
        with:
          path: duckdb-cli-osx-arm64.tar.gz
          archive: false

      - uses: actions/upload-artifact@v7
        with:
          path: duckdb-cli-osx-amd64.tar.gz
          archive: false

      - uses: actions/upload-artifact@v7
        with:
          path: duckdb-shared-libs-osx-universal.tar.gz
          archive: false

      - uses: actions/upload-artifact@v7
        with:
          name: duckdb-static-libs-osx-arm64
          path: static-libs-osx-arm64.zip

      - uses: actions/upload-artifact@v7
        with:
          name: duckdb-static-libs-osx-amd64
          path: static-libs-osx-amd64.zip

      - name: Unit Test
        shell: bash
        if: ${{ !inputs.skip_tests }}
        run: make allunit

      - name: Tools Tests
        shell: bash
        if: ${{ !inputs.skip_tests }}
        run: |
          python -m pytest tools/shell/tests --shell-binary build/release/duckdb

      - name: Unittest Stdin Tests
        shell: bash
        if: ${{ !inputs.skip_tests }}
        run: |
          python -m pytest tools/sqllogic/tests --unittest-binary build/release/test/unittest

      - name: Examples
        shell: bash
        if: ${{ !inputs.skip_tests }}
        run: |
          (cd examples/embedded-c; make)
          (cd examples/embedded-c++; make)
