# Trampoline transformer metadata.
#
# Rules not listed here are treated as generated by default. This file only
# describes rules that need explicit trampoline handling.

# These finalizers return their expression child unchanged when all optional siblings are absent.
forward_single_child:
  - LambdaArrowExpression
  - LogicalOrExpression
  - LogicalAndExpression
  - ColDefOrExpr
  - ColDefAndExpr
  - LogicalNotExpression
  - IsExpression
  - IsDistinctFromExpression
  - ComparisonExpression
  - BetweenInLikeExpression
  - OtherOperatorExpression
  - InfixOtherOperatorExpression
  - BitwiseExpression
  - AdditiveExpression
  - MultiplicativeExpression
  - ExponentiationExpression
  - CollateExpression
  - AtTimeZoneExpression
  - BaseExpression

rules:
  Program:
    mode: excluded

  TopLevelStatement:
    mode: excluded

  Statement:
    mode: excluded

  PivotStatement:
    mode: manual
    init: InitializePivotStatementTrampoline
    finalize: FinalizePivotStatementTrampoline

  UnpivotStatement:
    mode: manual
    init: InitializeUnpivotStatementTrampoline
    finalize: FinalizeUnpivotStatementTrampoline

  Expression:
    mode: forward

  ParensExpression:
    mode: forward

  InsertByNameOrder:
    mode: forward

  InsertByPositionOrder:
    mode: forward

  UpdateMatchSetClause:
    mode: forward

  LiteralExpression:
    mode: manual
    init: InitializeLiteralExpressionTrampoline
    finalize: FinalizeLiteralExpressionTrampoline

  PrefixExpression:
    mode: manual
    init: InitializePrefixExpressionTrampoline
    finalize: FinalizePrefixExpressionTrampoline

  OverClause:
    mode: manual
    init: InitializeOverClauseTrampoline
    finalize: FinalizeOverClauseTrampoline

  SelectStatementInternal:
    mode: manual
    init: InitializeSelectStatementInternalTrampoline
    finalize: FinalizeSelectStatementInternalTrampoline

  SimpleSelect:
    mode: manual
    init: InitializeSimpleSelectTrampoline
    finalize: FinalizeSimpleSelectTrampoline

  TableRef:
    mode: manual
    init: InitializeTableRefTrampoline
    finalize: FinalizeTableRefTrampoline

  WithClause:
    mode: manual
    init: InitializeWithClauseTrampoline
    finalize: FinalizeWithClauseTrampoline

  WindowDefinition:
    mode: manual
    init: InitializeWindowDefinitionTrampoline
    finalize: FinalizeWindowDefinitionTrampoline
